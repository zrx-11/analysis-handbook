<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分析 I</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>分析 I</h1>
    <div class="sub">从皮亚诺公理到函数列：实数分析的骨架</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "analysis-i", "title": "分析 I", "subtitle": "从皮亚诺公理到函数列：实数分析的骨架", "book": {"title": "分析 I（Analysis I）", "author": "Herbert Amann / Joachim Escher", "source": ["分析 I (Herbert Amann  Joachim Escher) (z-library.sk, 1lib.sk, z-lib.sk).pdf"]}, "audience": "零基础（会不等式与代数变形即可）", "goal": "系统掌握实数分析的基础：序完备、极限、连续、微分、函数列", "learningPath": [{"step": "01", "title": "数系与序完备性", "chapterIds": ["ch01"], "checkpoint": "ch01 自测三题全对"}, {"step": "02", "title": "极限与完备性", "chapterIds": ["ch02"], "checkpoint": "ch02 自测三题"}, {"step": "03", "title": "连续与紧致", "chapterIds": ["ch03"], "checkpoint": "ch03 自测三题"}, {"step": "04", "title": "微分与泰勒", "chapterIds": ["ch04"], "checkpoint": "ch04 自测三题"}, {"step": "05", "title": "函数列与解析", "chapterIds": ["ch05"], "checkpoint": "ch05 自测三题"}], "chapters": [{"id": "ch01", "title": "第 1 章：基础", "file": "chapters/ch01-foundations.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：收敛性", "file": "chapters/ch02-convergence.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：连续函数", "file": "chapters/ch03-continuity.md", "difficulty": 2}, {"id": "ch04", "title": "第 4 章：一元微分学", "file": "chapters/ch04-differentiation.md", "difficulty": 2}, {"id": "ch05", "title": "第 5 章：函数序列", "file": "chapters/ch05-function-sequences.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "上确界与序完备性", "file": "concepts/supremum-completeness.md", "chapterIds": ["ch01", "ch02"]}, {"id": "c02", "title": "可数与不可数", "file": "concepts/countability.md", "chapterIds": ["ch01"]}, {"id": "c03", "title": "柯西列与完备性", "file": "concepts/cauchy-completeness.md", "chapterIds": ["ch02", "ch03"]}, {"id": "c04", "title": "紧致性", "file": "concepts/compactness.md", "chapterIds": ["ch03", "ch04"]}, {"id": "c05", "title": "一致收敛", "file": "concepts/uniform-convergence.md", "chapterIds": ["ch05"]}], "glossary": [{"term": "陈述", "def": "能判断真假的句子，有且只有一个真值。", "chapterId": "ch01"}, {"term": "上界", "def": "对集合 A 中每个元素 a 都满足 a ≤ s 的元素 s。", "chapterId": "ch01"}, {"term": "上确界", "def": "最小的上界，记 sup A；不必属于 A。", "chapterId": "ch01"}, {"term": "序完备", "def": "每个非空上有界子集都有上确界。", "chapterId": "ch01"}, {"term": "可数", "def": "存在到 ℕ 的双射（有限集也算）。", "chapterId": "ch01"}, {"term": "群", "def": "集合配运算，满足结合律、有单位元、每元有逆元。", "chapterId": "ch01"}, {"term": "域", "def": "交换环，每个非零元有乘法逆元。", "chapterId": "ch01"}, {"term": "同态", "def": "保持运算结构的映射。", "chapterId": "ch01"}, {"term": "度量", "def": "满足正定性、对称性、三角不等式的距离函数。", "chapterId": "ch02"}, {"term": "赋范空间", "def": "向量空间配范数，由 d(x,y)=‖x−y‖ 得到度量。", "chapterId": "ch02"}, {"term": "柯西列", "def": "任意 ε > 0，足够靠后的任意两项距离小于 ε。", "chapterId": "ch02"}, {"term": "完备", "def": "每个柯西列都收敛到空间内的点。", "chapterId": "ch02"}, {"term": "绝对收敛", "def": "各项范数构成的级数收敛。", "chapterId": "ch02"}, {"term": "条件收敛", "def": "级数收敛但绝对值级数发散。", "chapterId": "ch02"}, {"term": "收敛半径", "def": "幂级数绝对收敛的圆盘半径，1/R = limsup|aₙ|^(1/n)。", "chapterId": "ch02"}, {"term": "连续", "def": "每点处：对任意 ε 存在 δ，输入距离小于 δ 时输出误差小于 ε。", "chapterId": "ch03"}, {"term": "开集", "def": "任一点都含有一个完全属于它的开球的集合。", "chapterId": "ch03"}, {"term": "紧致", "def": "每个开覆盖都有有限子覆盖（度量空间等价于序列紧致）。", "chapterId": "ch03"}, {"term": "连通", "def": "不能表示为两个不交非空开集之并。", "chapterId": "ch03"}, {"term": "一致连续", "def": "对任意 ε 存在统一的 δ，对所有点同时有效。", "chapterId": "ch03"}, {"term": "导数", "def": "差商 (f(x)−f(a))/(x−a) 当 x→a 的极限。", "chapterId": "ch04"}, {"term": "可微", "def": "在一点可用仿射函数逼近，误差比一阶更快趋零。", "chapterId": "ch04"}, {"term": "中值定理", "def": "存在内点 ξ 使 f(b)−f(a)=f′(ξ)(b−a)。", "chapterId": "ch04"}, {"term": "泰勒公式", "def": "用各阶导数在展开点构造多项式逼近，余项可写成皮亚诺或拉格朗日形式。", "chapterId": "ch04"}, {"term": "压缩映射", "def": "满足 d(Tx,Ty) ≤ Ld(x,y)（L<1）的映射，有唯一不动点。", "chapterId": "ch04"}, {"term": "逐点收敛", "def": "每个固定 x 处函数值收敛，N 可依赖 x。", "chapterId": "ch05"}, {"term": "一致收敛", "def": "sup 误差趋于 0，N 只依赖 ε。", "chapterId": "ch05"}, {"term": "解析函数", "def": "局部可展开成收敛幂级数的函数。", "chapterId": "ch05"}, {"term": "M-判别法", "def": "用收敛的正项级数统一控制各项 sup 范数，从而得到一致收敛。", "chapterId": "ch05"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "下列哪个集合在 ℚ 中没有上确界？", "options": ["{x ∈ ℚ : x < 1}", "{x ∈ ℚ : x² < 2 且 x > 0}", "{x ∈ ℚ : 0 ≤ x ≤ 1}", "{x ∈ ℚ : x² < 4 且 x > 0}"], "answer": 1, "explain": "前三个的上确界分别是 1、1、2，都在 ℚ 中。第二个集合的上确界是 √2，不在 ℚ 中；书中用 ξ = (2c+2)/(c+2) 证明任何有理上界都能被改进。"}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "皮亚诺公理中，哪一条保证数学归纳法可用？", "options": ["0 ∈ ℕ", "后继是单射", "归纳公理（第 5 条）", "0 不是任何数的后继"], "answer": 2, "explain": "前四条只刻画后继链，第 5 条排除“链外还有多余元素”的模型，归纳才能覆盖整个 ℕ。"}, {"id": "q03", "chapterId": "ch01", "type": "single", "question": "关于集合的可数性，下列判断正确的是？", "options": ["ℚ 不可数", "ℝ 可数", "ℤ 与 ℚ 都可数", "有限集不可数"], "answer": 2, "explain": "ℤ 可按 0,1,−1,2,−2,… 排队；ℚ 可按 |p|+q 分层排队。ℝ 由康托对角线不可数，有限集按定义可数。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "数列 xₙ = (−1)ⁿ 的收敛情况是？", "options": ["收敛到 1", "收敛到 −1", "不收敛", "收敛到 0"], "answer": 2, "explain": "取 ε₀ = 1，任何 N 之后都能找到奇偶两项，距离为 2，不满足柯西条件，因此不收敛。"}, {"id": "q05", "chapterId": "ch02", "type": "single", "question": "下列空间中，哪一个在通常度量下不完备？", "options": ["ℝ", "ℂ", "ℚ", "ℝ²"], "answer": 2, "explain": "√2 的截断小数是 ℚ 中的柯西列，但极限不在 ℚ 中。ℝ、ℂ、ℝ² 都完备。"}, {"id": "q06", "chapterId": "ch02", "type": "single", "question": "关于级数，正确的说法是？", "options": ["通项趋于 0 则级数收敛", "在巴拿赫空间中绝对收敛必定收敛", "条件收敛的级数重排后仍收敛到同一值", "收敛级数必定绝对收敛"], "answer": 1, "explain": "A 错，调和级数通项趋于 0 却发散；C 错，重排可改变和甚至发散；D 错，交错调和级数收敛但绝对值级数发散。"}, {"id": "q07", "chapterId": "ch03", "type": "single", "question": "f(x) = 1/x 在 (0, 1) 上的一致连续性如何？", "options": ["一致连续", "连续但非一致连续", "不连续", "只在 (1/2,1) 上一致连续"], "answer": 1, "explain": "取 xₙ = 1/n，yₙ = 1/(n+1)，两点距离趋于 0，函数值之差恒为 1，不存在统一 δ。定义域不紧致，正是一致连续失效的典型场景。"}, {"id": "q08", "chapterId": "ch03", "type": "single", "question": "下列哪个条件能保证连续函数 f : X → ℝ 取到最小值？", "options": ["X 是开区间", "X 紧致", "f 有界", "X 连通"], "answer": 1, "explain": "紧集上连续函数取到最大最小值。开区间、连通都不够（f(x)=x 在 (0,1) 无最小值）；仅有界也不够。"}, {"id": "q09", "chapterId": "ch03", "type": "single", "question": "介值定理成立的必要条件不包括？", "options": ["定义域连通", "函数连续", "值域是一维有序的", "函数可微"], "answer": 3, "explain": "介值定理只用连续性，不要求可微。去掉连通、去掉连续、或换成复值，结论都会失效。"}, {"id": "q10", "chapterId": "ch04", "type": "single", "question": "f(x) = |x| 在 x = 0 处？", "options": ["可微且导数为 0", "连续但不可微", "不连续", "可微但导数不存在"], "answer": 1, "explain": "左右差商分别为 1 和 −1，极限不存在，所以不可微；但函数本身连续。"}, {"id": "q11", "chapterId": "ch04", "type": "single", "question": "设 f 在 [0, 2] 上可微，f(0) = 0，f(2) = 4，则一定能推出？", "options": ["存在 ξ 使 f′(ξ) = 2", "f′ 处处等于 2", "f 单调递增", "f″ 存在"], "answer": 0, "explain": "拉格朗日中值定理给出 f(2) − f(0) = f′(ξ)(2 − 0)，即 f′(ξ) = 2。其余三项都不保证。"}, {"id": "q12", "chapterId": "ch04", "type": "single", "question": "用牛顿法求 f(x) = x² − 2 的正根，初值 x₀ = 1，迭代式是？", "options": ["xₙ₊₁ = (xₙ + 2/xₙ)/2", "xₙ₊₁ = xₙ − xₙ²", "xₙ₊₁ = 2/xₙ", "xₙ₊₁ = xₙ + 1"], "answer": 0, "explain": "x − f/f′ = x − (x² − 2)/(2x) = (x + 2/x)/2，这是求平方根的标准迭代，误差平方级下降。"}, {"id": "q13", "chapterId": "ch05", "type": "single", "question": "fₙ(x) = xⁿ 在下列哪个区间上一致收敛到 0？", "options": ["[0,1]", "[0,1)", "[0, 0.9]", "(−1,1]"], "answer": 2, "explain": "在 [0,1] 上极限函数在 1 处跳到 1，不一致；[0,0.9] 上 sup|fₙ| ≤ 0.9ⁿ → 0，一致收敛。"}, {"id": "q14", "chapterId": "ch05", "type": "single", "question": "若 fₙ 一致收敛到 f，且每个 fₙ 连续，则？", "options": ["f 一定可微", "f 一定连续", "fₙ′ 一定一致收敛", "f 一定有界"], "answer": 1, "explain": "一致收敛传递连续性。可微、导数收敛都不保证；f 在有界区间上才有界，题干没说 X 有界。"}, {"id": "q15", "chapterId": "ch05", "type": "single", "question": "关于解析函数，正确的说法是？", "options": ["解析与 C∞ 等价", "解析函数在收敛圆内可逐项求导", "解析函数的泰勒级数处处收敛到自身", "解析函数一定是有理函数"], "answer": 1, "explain": "A 错，e^(−1/x²) 是 C∞ 但不解析；C 错，只在收敛圆内；D 错，exp、sin 都是超越函数。"}, {"id": "ai-x1", "chapterId": "__all__", "type": "single", "question": "设 fₙ(x) = xⁿ 在 [0,1] 上。下列说法正确的是？", "options": ["一致收敛且极限连续", "逐点收敛但极限不连续，说明逐点收敛不足以保证连续性传递", "不逐点收敛", "一致收敛但极限不连续"], "answer": 1, "explain": "每点收敛到 0（x<1）或 1（x=1），极限在 1 处跳跃。每条 fₙ 连续，极限不连续，正好说明连续性传递需要一致收敛。"}, {"id": "ai-x2", "chapterId": "__all__", "type": "blank", "question": "计算 sup{1 − 1/n : n ∈ ℕ, n ≥ 1}，填数值。", "options": [], "answer": "1", "explain": "集合单调递增趋近 1，且每项都小于 1，所以 1 是最小上界；它不在集合内，说明上确界不必是集合的元素。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "序完备性说的是什么？", "back": "每个非空、上有界的子集都有上确界。ℝ 满足，ℚ 不满足。", "tags": ["完备性", "实数"]}, {"id": "f02", "chapterId": "ch01", "front": "皮亚诺第 5 条公理的作用？", "back": "把“从 0 起逐個到达”变成公理，保证归纳法覆盖整个 ℕ。", "tags": ["自然数", "归纳"]}, {"id": "f03", "chapterId": "ch01", "front": "ℚ 中 {x : x² < 2, x > 0} 有上确界吗？", "back": "没有。它的上确界是 √2，不在 ℚ 中。", "tags": ["完备性", "反例"]}, {"id": "f04", "chapterId": "ch01", "front": "可数与稠密的区别？", "back": "可数=存在到 ℕ 的双射；稠密=任意两数之间还有数。ℚ 既稠密又可数。", "tags": ["可数"]}, {"id": "f05", "chapterId": "ch01", "front": "数系扩张的统一手法？", "back": "造一个更大的集合，再按等价关系取商（如整数用差相同，分数用交叉相乘相等）。", "tags": ["构造"]}, {"id": "f06", "chapterId": "ch02", "front": "ε-N 定义中三个容易忽略的点？", "back": "ε 任意；N 依赖 ε；只要求从 N 以后成立。", "tags": ["极限", "定义"]}, {"id": "f07", "chapterId": "ch02", "front": "柯西列与收敛列的关系？", "back": "收敛 ⇒ 柯西；柯西 ⇒ 收敛只在完备空间成立。", "tags": ["完备性"]}, {"id": "f08", "chapterId": "ch02", "front": "单调有界定理为什么好用？", "back": "不需要猜极限，只要验证“递增 + 有上界”，收敛性与极限存在性一起得到。", "tags": ["极限"]}, {"id": "f09", "chapterId": "ch02", "front": "绝对收敛与条件收敛的差别？", "back": "绝对收敛=绝对值级数收敛，可任意重排；条件收敛重排会改变和。", "tags": ["级数"]}, {"id": "f10", "chapterId": "ch02", "front": "幂级数的收敛集合形状？", "back": "以展开点为心的圆盘；半径由 1/R = limsup |aₙ|^(1/n) 给出。", "tags": ["幂级数"]}, {"id": "f11", "chapterId": "ch03", "front": "连续性的开集刻画？", "back": "f 连续 ⇔ 每个开集的原像是开集。", "tags": ["连续", "拓扑"]}, {"id": "f12", "chapterId": "ch03", "front": "紧致性的两条等价说法（度量空间）？", "back": "开覆盖有有限子覆盖；每个序列有收敛子列。", "tags": ["紧致"]}, {"id": "f13", "chapterId": "ch03", "front": "为什么紧集上连续函数一致连续？", "back": "若没有统一 δ，可取 xₙ、yₙ 距离趋 0 而函数值差 ≥ ε，紧性抽出共同极限点，与连续性矛盾。", "tags": ["紧致", "一致连续"]}, {"id": "f14", "chapterId": "ch03", "front": "介值定理对复值函数成立吗？", "back": "不成立。值域必须是一维有序的；复值可以绕圈避开中间值。", "tags": ["介值"]}, {"id": "f15", "chapterId": "ch03", "front": "exp 怎么定义？", "back": "exp(z) = Σ zⁿ/n!，绝对收敛；由柯西乘积得加法定理。", "tags": ["指数函数"]}, {"id": "f16", "chapterId": "ch04", "front": "可微的线性逼近说法？", "back": "存在仿射 g 使 f(a)=g(a) 且 ‖f(x)−g(x)‖/|x−a| → 0。", "tags": ["微分"]}, {"id": "f17", "chapterId": "ch04", "front": "罗尔定理的证明关键？", "back": "紧区间上连续函数取到极值；内部极值处导数为 0；端点极值则函数为常数。", "tags": ["中值定理"]}, {"id": "f18", "chapterId": "ch04", "front": "泰勒两种余项各适合什么？", "back": "皮亚诺余项适合求极限；拉格朗日余项给出具体误差界。", "tags": ["泰勒"]}, {"id": "f19", "chapterId": "ch04", "front": "牛顿法何时退化？", "back": "f′ 接近 0、根为重根、初值不在吸引域时；收敛从二次退化为线性或发散。", "tags": ["迭代"]}, {"id": "f20", "chapterId": "ch04", "front": "f′(a)=0 一定是极值吗？", "back": "不一定。x³ 在 0 处导数为 0 但不是极值。", "tags": ["极值"]}, {"id": "f21", "chapterId": "ch05", "front": "逐点与一致收敛的唯一差别？", "back": "N 是否依赖 x。一致收敛的 N 只依赖 ε。", "tags": ["一致收敛"]}, {"id": "f22", "chapterId": "ch05", "front": "一致收敛能传递微分吗？", "back": "不能，除非导数列也一致收敛，且原列在某点收敛。", "tags": ["一致收敛", "微分"]}, {"id": "f23", "chapterId": "ch05", "front": "M-判别法说什么？", "back": "若 ‖fₙ‖∞ ≤ Mₙ 且 ΣMₙ 收敛，则 Σfₙ 一致且绝对收敛。", "tags": ["级数", "一致收敛"]}, {"id": "f24", "chapterId": "ch05", "front": "解析与 C∞ 的区别？", "back": "解析要求局部等于幂级数；C∞ 只要求无穷次可微。e^(−1/x²) 是 C∞ 但不解析。", "tags": ["解析"]}, {"id": "f25", "chapterId": "ch05", "front": "魏尔斯特拉斯逼近定理？", "back": "紧区间上连续函数可用多项式一致逼近（Bernstein 多项式给出构造）。", "tags": ["逼近"]}], "companion": "analysis-i学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：8 小时 ｜ <strong>前置<\/strong>：无（只要求会用不等式、会做代数变形）\n<\/ul>\n<blockquote>原书开篇把整章的任务说得很直接：从自然数的皮亚诺公理出发，依次构造整数、有理数、实数，最后是复数；每一步都在解一类&quot;自然出现&quot;的方程。作者还特意声明，这一章可以跳过某些长证明，但&quot;基础&quot;必须认真过一遍。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出皮亚诺五条公理，并解释为什么数学归纳法不是&quot;经验规律&quot;而是公理的第 5 条。\n<\/li><li>\n用&quot;非空上有界子集必有上确界&quot;这条性质说明 ℚ 缺了什么、ℝ 补上了什么。\n<\/li><li>\n判断一个集合是可数还是不可数，并给出双射或对角线论证。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>实数之所以是实数，不是因为它&quot;含有无理数&quot;，而是因为它<strong>序完备<\/strong>：任何非空上有界子集都有上确界。分析学后面所有极限、连续、紧致、积分的存在性，最终都靠这条性质兜底。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么先学逻辑和集合<\/h3>\n<p>分析学的每个定理都要写成&quot;若 A 则 B&quot;的形式。要做到不靠直觉，先得把话说清楚。<\/p>\n<ul><li>\n<strong>陈述<\/strong>：能判断真假的句子。&quot;正在下雨&quot;是陈述；&quot;这句话是假的&quot;不是，因为它无论真假都自相矛盾。\n<\/li><li>\n<strong>量词<\/strong>：∀（对所有）、∃（存在）。这两个符号的否定最容易写错：¬(∀x: E(x)) 等于 ∃x: ¬E(x)，而不是 ∀x: ¬E(x)。&quot;本书每位读者都戴眼镜&quot;的否定是&quot;至少有一位不戴&quot;，不是&quot;没有一位戴&quot;。\n<\/li><li>\n<strong>集合<\/strong>：{x ∈ X ; E(x)} 表示 X 中满足性质 E 的那些元素。这里没有&quot;所有集合的集合&quot;这种危险对象，本书只在已知集合上做子集运算。\n<\/li><li>\n<strong>函数<\/strong>：f : X → Y 是一个规则，给 X 中每个元素指定 Y 中唯一元素。它不等于&quot;公式&quot;，也不要求&quot;能算出来&quot;。\n<\/ul>\n<p><strong>类比<\/strong>：逻辑记号像合同条款。合同里&quot;乙方应在 30 日内……&quot;和&quot;乙方不得晚于 30 日……&quot;是一回事，但&quot;并非所有条款都适用&quot;和&quot;所有条款都不适用&quot;差得很远。写数学证明就是把合同条款逐条对齐。 <strong>类比的边界<\/strong>：合同有歧义可以打官司，数学陈述只有真/假两值，中间没有&quot;部分成立&quot;。<\/p>\n<h3>概念 2：自然数不是&quot;数出来的&quot;，是公理规定的<\/h3>\n<p>皮亚诺的做法是：不定义&quot;自然数是什么&quot;，只规定它满足什么。<\/p>\n<ol><li>\n0 ∈ ℕ。\n<\/li><li>\n每个 n ∈ ℕ 有唯一的后继 ν(n) ∈ ℕ。\n<\/li><li>\nν(n) ≠ 0（0 不是任何数的后继）。\n<\/li><li>\nν 是单射：ν(m) = ν(n) 推出 m = n。\n<\/li><li>\n<strong>归纳公理<\/strong>：若 S ⊆ ℕ 满足 0 ∈ S 且 n ∈ S ⇒ ν(n) ∈ S，则 S = ℕ。\n<\/ol>\n<p>第 5 条是关键。它把&quot;从 0 开始，一个接一个，能到达每个自然数&quot;这件事变成了公理。没有它，你可以构造出&quot;0,1,2,… 再加上一个无穷远点&quot;的怪模型，归纳法就失效。<\/p>\n<p>有了这五条，加法、乘法、序关系都要<strong>定义<\/strong>出来，再<strong>证明<\/strong>交换律、结合律、分配律。书中用递归定义 m + 0 := m、m + ν(n) := ν(m + n)，然后对 n 作归纳证明 m + n = n + m。这不是&quot;显然&quot;，是一步步证出来的。<\/p>\n<p><strong>类比<\/strong>：国际象棋的规则不描述棋子的物理形状，只规定它怎么走。自然数公理就是&quot;数的走法&quot;。 <strong>边界<\/strong>：棋规可以任意改，自然数公理不行——改了就不再是算术，归纳法、递归定义都会崩。<\/p>\n<h3>概念 3：数系扩张的每一步，都在补一类解不出来的方程<\/h3>\n<table><thead><tr><th>从<\/th><th>到<\/th><th>要解出的方程<\/th><th>手法<\/th><\/tr><\/thead><tbody><tr><td>ℕ<\/td><td>ℤ<\/td><td>x + a = b<\/td><td>用有序对 (m, n) 表示 m − n，按&quot;差相同&quot;划等价类<\/td><\/tr><tr><td>ℤ<\/td><td>ℚ<\/td><td>a x = b（a ≠ 0）<\/td><td>用有序对 (p, q) 表示 p/q，按&quot;交叉相乘相等&quot;划等价类<\/td><\/tr><tr><td>ℚ<\/td><td>ℝ<\/td><td>x² = 2<\/td><td>补上序完备性（戴德金分割的第三条性质）<\/td><\/tr><tr><td>ℝ<\/td><td>ℂ<\/td><td>x² + 1 = 0<\/td><td>用有序对 (a, b) 表示 a + i b，规定 i² = −1<\/td><\/tr><\/tbody><\/table>\n<p>注意手法是统一的：<strong>先造一个更大的集合，再按某个等价关系把元素粘起来<\/strong>。整数不是&quot;负号和自然数拼起来&quot;这么随意，它是一个商结构：两个有序对 (m, n) 与 (m′, n′) 被视为同一个整数，当且仅当 m + n′ = m′ + n。<\/p>\n<p><strong>类比<\/strong>：分数 1/2 和 2/4 是同一个数，不是两个数。有理数的构造就是把&quot;写法不同但值相同&quot;的表达式装进同一个袋子。 <strong>边界<\/strong>：这套商构造在 ℚ→ℝ 时失灵——两个有理数列可能&quot;应该收敛到同一个实数&quot;，但极限本身还没造出来。所以 ℝ 的构造要么用分割（只谈集合的上界），要么用柯西列的完备化（先有度量再取商），不能照抄分数那套。<\/p>\n<h3>概念 4：序完备性——ℝ 与 ℚ 的真正分界<\/h3>\n<p><strong>上界<\/strong>：若对每个 a ∈ A 都有 a ≤ s，则 s 是 A 的上界。<strong>上确界<\/strong> sup A 是&quot;最小的上界&quot;。<\/p>\n<p>序完备性：每个非空、上有界的子集都有上确界。<\/p>\n<p>ℚ 不满足。取 A := {x ∈ ℚ ; x &gt; 0 且 x² &lt; 2}。A 非空（1 ∈ A），上有界（2 是上界）。假设 c ∈ ℚ 是上确界。书中给出一个显式的改进：令 ξ := (2c + 2)/(c + 2)，则 ξ &gt; 0 且<\/p>\n<p>ξ − c = −(c² − 2)/(c + 2)。<\/p>\n<p>若 c² &lt; 2，则 ξ &gt; c，ξ 仍是 A 的上界，与 c 最小矛盾；若 c² &gt; 2，则 ξ &lt; c 且 ξ 仍是上界，c 不是最小上界。若 c² = 2，则 c 不是有理数（√2 无理）。三种情况都矛盾，所以 sup A 在 ℚ 中不存在。<\/p>\n<p>ℝ 里这个上确界就是 √2。整个实数分析就是在这个&quot;缺口被填上&quot;的世界里做。<\/p>\n<p><strong>类比<\/strong>：ℚ 像一把刻度无限细的尺子，但某些长度没有刻度；ℝ 把每个&quot;该有刻度&quot;的位置都补上了。 <strong>边界<\/strong>：完备性只保证上确界存在，不保证能算出来。√2 存在，但你写不出它的有限小数。<\/p>\n<h3>概念 5：可数性——无穷也分大小<\/h3>\n<p>集合 X <strong>可数<\/strong>，如果存在双射 X → ℕ（有限集也算可数）。否则不可数。<\/p>\n<ul><li>\nℤ 可数：排成 0, 1, −1, 2, −2, …\n<\/li><li>\nℚ 可数：把 p/q 按 |p| + q 分组排列，去掉重复。这反直觉但有双射。\n<\/li><li>\nℝ 不可数：康托对角线。假设 ℝ 可数，把 [0,1] 里的数写成小数并排成表，构造一个数，其第 n 位与表中第 n 个数的第 n 位不同，这个数不在表里，矛盾。\n<\/ul>\n<p><strong>类比<\/strong>：可数不是&quot;能数完&quot;，是&quot;能排队领号，每个元素恰好拿到一个号&quot;。ℚ 元素稠密，但可以领号；ℝ 连领号都做不到。<\/p>\n<h3>概念 6：群、环、域——给运算立法<\/h3>\n<ul><li>\n<strong>群<\/strong>：一个集合配一个运算，满足结合律、有单位元、每元有逆元。整数对加法成群，非零有理数对乘法成群。\n<\/li><li>\n<strong>环<\/strong>：加法成群，乘法满足结合律与分配律。ℤ、多项式环 K[X] 都是环。\n<\/li><li>\n<strong>域<\/strong>：交换环，且每个非零元有乘法逆元。ℚ、ℝ、ℂ 是域。\n<\/li><li>\n<strong>同态<\/strong>：保持运算的映射。群同态保乘法，环同态保加法和乘法。\n<\/ul>\n<p>这些概念在后面反复出现：连续函数空间、算子代数、函数域。它们不是&quot;抽象废话&quot;，而是让你一次证明、到处使用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  P[皮亚诺五条公理] --&gt; N[自然数 ℕ]\n  N --&gt; Z[整数 ℤ]\n  Z --&gt; Q[有理数 ℚ]\n  Q --&gt; R[实数 ℝ]\n  R --&gt; C[复数 ℂ]\n  N --&gt; S[归纳法与递归定义]\n  Q --&gt; L[缺陷 上确界可能不存在]\n  R --&gt; K[序完备 每个非空上有界集有上确界]\n  K --&gt; A[极限 连续 紧致 积分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：竖线是数系扩张的顺序，每一步都在补方程的解。右边两条分支说明：归纳法来自 ℕ 的公理；分析学的全部存在性定理来自 ℝ 的序完备性，而不是来自&quot;数很密&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把数系想成工具箱。ℕ 只有锤子（加法），ℤ 加了螺丝刀（减法），ℚ 加了扳手（除法），ℝ 加了水平仪（极限），ℂ 加了能旋转的接头（开方）。工具越往后越强，但每一件都必须由前一件造出来，不能凭空出现。 <strong>失效边界<\/strong>：工具箱类比暗示&quot;工具越多越好&quot;，实际上每扩一步都丢掉一些性质：ℂ 不再是序域，你没法说 1 和 i 谁大。<\/p>\n<p><strong>实例（可验证）<\/strong>：证明 √2 ∉ ℚ。设 √2 = p/q，p、q 互素。则 p² = 2q²，所以 p² 偶，p 偶，p = 2k。代回得 4k² = 2q²，即 q² = 2k²，q 也偶。这与 p、q 互素矛盾。 这个证明只用&quot;整数分解为 2 的幂&quot;这一件事，不涉及极限，说明 ℚ 的缺口是纯代数层面就能看到的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;实数 = 有理数 + 无理数&quot;就够了<\/strong> — 实际上关键在序完备性。你完全可以在 ℚ 里加入所有代数数，得到的域仍然不完备：{x : x² &lt; 2} 仍然没有上确界。\n<\/li><li>\n<strong>别以为&quot;可数&quot;就是&quot;能一个一个数出来&quot;<\/strong> — 实际上可数只要求存在双射到 ℕ。ℚ 稠密到任意两个数之间还有数，却仍然可数；ℝ 连这种排队都做不到。\n<\/li><li>\n<strong>别以为归纳法能证明&quot;所有 n 都成立&quot;是显然的<\/strong> — 实际上归纳法是皮亚诺第 5 条公理。去掉它，存在满足前四条却让归纳法失效的模型。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列哪个集合在 ℚ 中没有上确界？　A. {x ∈ ℚ : x &lt; 1}　B. {x ∈ ℚ : x² &lt; 2, x &gt; 0}　C. {x ∈ ℚ : 0 ≤ x ≤ 1}　D. {x ∈ ℚ : x² &lt; 4, x &gt; 0}\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：A 的上确界是 1，C 是 1，D 是 2，都在 ℚ 中。B 的上确界是 √2，不在 ℚ 中；书中用 ξ = (2c+2)/(c+2) 的构造证明任何有理上界都能被改进。<\/p>\n<\/ol>\n<ol><li>\n关于皮亚诺公理，哪条保证了数学归纳法可用？　A. 0 ∈ ℕ　B. 后继是单射　C. 归纳公理（第 5 条）　D. 0 不是后继\n<p><strong>答案<\/strong>：C。<strong>解析<\/strong>：前四条刻画&quot;后继链&quot;，只有第 5 条排除&quot;链外还有多余元素&quot;的模型，归纳才能覆盖整个 ℕ。<\/p>\n<\/ol>\n<ol><li>\n下列判断正确的是？　A. ℚ 不可数　B. ℝ 可数　C. ℤ 与 ℚ 都可数　D. 有限集不可数\n<p><strong>答案<\/strong>：C。<strong>解析<\/strong>：ℤ 可按 0,1,−1,2,−2,… 排队；ℚ 可按 |p|+q 分组排队。ℝ 由康托对角线不可数；有限集按定义可数。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n序完备性：非空上有界必有上确界。ℚ 缺它，ℝ 有它。\n<\/li><li>\n数系扩张的统一手法：造大集合 + 按等价关系取商。\n<\/li><li>\n可数 = 存在到 ℕ 的双射；稠密不等于不可数。\n<\/ul>", "kind": "chapter", "title": "第 1 章：基础"}, "ch02": {"html": "<h1>第 2 章：收敛性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：9 小时 ｜ <strong>前置<\/strong>：第 1 章（上确界、域、可数性）\n<\/ul>\n<blockquote>原书在引入数列时给了一个很朴素的说法：我们只能对序列做有限次求值，永远无法&quot;到达无穷&quot;，所以必须发展一些方法，使我们能证明关于&quot;无穷附近&quot;无穷多个函数值的命题。这一章就是这些方法的集合。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 ε-N 语言证明一个数列的极限，并能否定&quot;收敛&quot;。\n<\/li><li>\n区分度量空间、赋范空间与巴拿赫空间，说明为什么需要完备性。\n<\/li><li>\n用单调有界定理、波尔查诺–魏尔斯特拉斯定理判断收敛，用比值/根值判别法判断级数收敛。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>收敛的意思是&quot;从某一项起，所有项都落在任意小的误差带里&quot;。把&quot;某一项&quot;的 N 与 ε 挂钩，是全部计算和证明的起点；而完备性保证&quot;看起来该收敛的柯西列&quot;真的收敛，这是 ℝ 区别于 ℚ 的度量版本。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要度量<\/h3>\n<p>要谈&quot;接近&quot;，先得有距离。集合 X 上的度量 d : X × X → ℝ 满足三条：<\/p>\n<ul><li>\nd(x, y) = 0 当且仅当 x = y；\n<\/li><li>\nd(x, y) = d(y, x)；\n<\/li><li>\nd(x, y) ≤ d(x, z) + d(z, y)（三角不等式）。\n<\/ul>\n<p>第三条是全部估计技巧的来源：想证明 x 和 y 近，可以绕道 z，分别估计两段。ℚ、ℝ、ℂ 用 d(x, y) = |x − y|；ℝⁿ 可以用欧氏距离，也可以用 |x₁| + … + |xₙ| 或 max|xᵢ|。<\/p>\n<p><strong>类比<\/strong>：度量是城市之间的距离表。三角不等式就是&quot;直达不会比绕城更远&quot;。<strong>边界<\/strong>：有些空间（比如只有&quot;开集&quot;没有距离的拓扑空间）根本给不出距离表，那时收敛要用邻域重新定义。<\/p>\n<h3>概念 2：ε-N 定义，以及它的否定<\/h3>\n<p>数列 (xₙ) 收敛到 a：对每个 ε &gt; 0，存在 N ∈ ℕ，使得 n ≥ N 时 |xₙ − a| &lt; ε。<\/p>\n<p>三个细节决定成败：<\/p>\n<ul><li>\nε 是任意的，不是&quot;某个很小的数&quot;。证明时必须让 ε 保持字母身份，不能代入 0.001 就算完。\n<\/li><li>\nN 可以依赖 ε，通常写成 N(ε)。允许 N 很大，只要有限。\n<\/li><li>\n只要求&quot;从 N 以后&quot;，前面有限多项怎么乱都无所谓。极限是尾部行为。\n<\/ul>\n<p>否定形式（证明不收敛时用）：存在某个 ε₀ &gt; 0，使得对每个 N，都能找到 n ≥ N 满足 |xₙ − a| ≥ ε₀。也就是说，存在一条固定的误差带，数列无穷多次跑出带外。<\/p>\n<p><strong>类比<\/strong>：验收标准。&quot;合格&quot;意味着无论你把误差标准定得多严，工厂从某一天起都能达标；&quot;不合格&quot;意味着存在一个标准，工厂无论怎么生产都会反复超差。<\/p>\n<h3>概念 3：赋范空间与等价范数<\/h3>\n<p>赋范空间是向量空间配一个范数 ‖·‖，由 d(x, y) := ‖x − y‖ 得到度量。范数要满足正定性、齐次性、三角不等式。<\/p>\n<p>在 ℝⁿ 上，‖x‖₁ = Σ|xᵢ|、‖x‖₂ = (Σxᵢ²)½、‖x‖∞ = max|xᵢ| 给出同一个收敛概念：它们互相被常数控制，单位球互相包含（B∞ ⊆ B₂ ⊆ √m B∞ 一类的不等式）。所以&quot;在哪个范数下收敛&quot;在有限维不是问题。无限维就不同了，这一点第 7 章讲连续线性映射时会再遇到。<\/p>\n<h3>概念 4：单调有界必收敛<\/h3>\n<p>ℝ 中递增且有上界的数列收敛，极限等于其上确界。<\/p>\n<p>证明只用一条：上确界是最小上界。设 s = sup{xₙ}。给定 ε &gt; 0，s − ε 不是上界，所以存在 N 使 x_N &gt; s − ε。由递增，n ≥ N 时 s − ε &lt; xₙ ≤ s，即 |xₙ − s| &lt; ε。<\/p>\n<p>这条定理的威力在于：你不需要猜到极限是多少，只要证明&quot;递增 + 有上界&quot;，收敛性和极限的存在性一起拿到。e = lim(1 + 1/n)ⁿ 就是这样定义的：先证 (1 + 1/n)ⁿ 递增有界，再把这个上确界命名为 e。<\/p>\n<p><strong>类比<\/strong>：往一个固定容量的瓶子里注水，水位只升不降，那它一定停在某个高度。<strong>边界<\/strong>：瓶子必须有盖（有上界）；没有上界时水位趋于无穷，不收敛。<\/p>\n<h3>概念 5：柯西列与完备性<\/h3>\n<p>柯西列：对每个 ε &gt; 0，存在 N，使得 m, n ≥ N 时 |xₘ − xₙ| &lt; ε。它只谈&quot;项与项之间越来越近&quot;，不谈极限是谁。<\/p>\n<ul><li>\n收敛 ⇒ 柯西列。因为尾巴都在 a 附近，两项之间距离 ≤ 2ε。\n<\/li><li>\n柯西列 ⇒ 有界，但不一定收敛。在 ℚ 里，取 √2 的截断小数序列，它是柯西列，极限不在 ℚ 中。\n<\/ul>\n<p>空间<strong>完备<\/strong>：每个柯西列都收敛。ℝ、ℂ、ℝⁿ、巴拿赫空间都完备。<\/p>\n<p>实数系的一个漂亮事实：ℝ 可以看作&quot;有理柯西列全体，按&#x27;差趋于 0&#x27;取商&quot;，序由逐项比较的上极限定义。这解释了为什么&quot;补上极限&quot;和&quot;补上上确界&quot;是同一件事的两种说法。<\/p>\n<p><strong>类比<\/strong>：柯西列是一群人说&quot;我们互相越来越靠近&quot;，但没人说清要靠近谁；完备性保证这群人确实有个落脚点。<\/p>\n<h3>概念 6：级数与绝对收敛<\/h3>\n<p>级数 Σxₖ 的收敛定义为部分和序列 sₙ = x₀ + … + xₙ 收敛。<\/p>\n<ul><li>\n必要条件：xₙ → 0。但它不是充分条件，调和级数 Σ1/n 的通项趋于 0 却发散。\n<\/li><li>\n正项级数：部分和单调递增，所以&quot;收敛 ⇔ 部分和有界&quot;。\n<\/li><li>\n比较、比值、根值判别法都来自和几何级数比较。\n<\/li><li>\n<strong>绝对收敛<\/strong>：Σ‖xₖ‖ 收敛。在巴拿赫空间里，绝对收敛 ⇒ 收敛（用柯西准则 + 三角不等式）。反过来不成立：交错调和级数收敛但绝对值级数发散。\n<\/li><li>\n<strong>条件收敛的级数重排会变<\/strong>。1 − 1/2 + 1/3 − … 可以重排成收敛到任意指定值，甚至发散。有限次加法有交换律，无限次没有。\n<\/ul>\n<p><strong>类比<\/strong>：绝对收敛是&quot;行李总重量有限&quot;，条件收敛是&quot;正负行李互相抵消，总重量其实无穷&quot;。重排就是把正负行李换顺序，抵消关系一变，结果就变。<\/p>\n<h3>概念 7：幂级数与收敛半径<\/h3>\n<p>Σ aₙ (z − z₀)ⁿ 的收敛集合一定是一个以 z₀ 为心的圆盘（可能含边界点）。半径由 Cauchy–Hadamard 公式给出：1/R = limsup |aₙ|¹/ⁿ。圆内绝对收敛，圆外发散，圆上逐点判定。<\/p>\n<p>这条结论是第 5 章解析函数和第 6 章傅里叶级数的技术底座。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[度量空间] --&gt; B[赋范空间]\n  B --&gt; C[巴拿赫空间 完备]\n  C --&gt; D[收敛数列]\n  C --&gt; E[柯西列 必收敛]\n  A --&gt; F[柯西列 未必收敛]\n  D --&gt; G[级数]\n  G --&gt; H[绝对收敛]\n  G --&gt; I[条件收敛 重排会变]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：从左往右是&quot;结构越加越多&quot;。关键对比是 C 与 A：同一个柯西列，在完备空间里有极限，在一般度量空间里可能没有。级数的两条分支说明&quot;绝对&quot;与&quot;条件&quot;的差别不在收敛与否，而在能不能随便换顺序。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：ε-N 像快递时效承诺。&quot;3 天内送达&quot;必须对每一单都成立；&quot;大部分 3 天到&quot;不是承诺。N(ε) 是&quot;从第几单开始达标&quot;，它当然可以随标准变严而变大。 <strong>失效边界<\/strong>：快递有个物理上限，N 可能大到超出任何实际意义；数学只要求 N 存在且有限，不要求能算出来。<\/p>\n<p><strong>实例（可验证）<\/strong>：证明 lim (1 + 1/n)ⁿ 存在。 先证递增：用二项式展开比较相邻两项，第 k 项系数从 C(n,k)/nᵏ 变为 C(n+1,k)/(n+1)ᵏ，逐项变大。再证有界：展开后每项 ≤ 1/k! ≤ 1/2ᵏ⁻¹，求和 ≤ 3。于是由单调有界定理收敛，极限记为 e ≈ 2.71828。 这个例子里没有&quot;猜极限&quot;，只有&quot;单调 + 有界&quot;两个可验证条件，这正是该定理的用法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;有界数列必收敛&quot;<\/strong> — 实际上 0,1,0,1,… 有界但不收敛。有界 + 单调才够，或者有界 + 存在唯一聚点才够（波尔查诺–魏尔斯特拉斯只给聚点，不给唯一性）。\n<\/li><li>\n<strong>别以为&quot;柯西列就是收敛列&quot;<\/strong> — 实际上这只在完备空间成立。ℚ 中 √2 的截断小数是柯西列，却没有有理极限。\n<\/li><li>\n<strong>别以为&quot;通项趋于 0 就收敛&quot;<\/strong> — 实际上调和级数 Σ1/n 的通项趋于 0，部分和却无界。判别级数要看部分和，不要只看通项。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n数列 xₙ = (−1)ⁿ 的收敛情况是？　A. 收敛到 1　B. 收敛到 −1　C. 不收敛　D. 收敛到 0\n<p><strong>答案<\/strong>：C。<strong>解析<\/strong>：取 ε₀ = 1，任何 N 之后都能找到奇偶两项，它们的距离是 2，不满足柯西条件，因此不收敛。<\/p>\n<\/ol>\n<ol><li>\n下列空间哪一个不完备？　A. ℝ　B. ℂ　C. ℚ（通常度量）　D. ℝ²\n<p><strong>答案<\/strong>：C。<strong>解析<\/strong>：取 √2 的截断小数，它是 ℚ 中的柯西列但极限不在 ℚ 中。ℝ、ℂ、ℝ² 都完备。<\/p>\n<\/ol>\n<ol><li>\n关于级数，正确的说法是？　A. 通项趋于 0 则级数收敛　B. 绝对收敛必定收敛（在巴拿赫空间）　C. 条件收敛的级数重排后仍收敛到同一值　D. 收敛级数必定绝对收敛\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：A 错，调和级数；C 错，重排可改变和甚至发散；D 错，交错调和级数收敛但绝对值级数发散。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nε-N 的三个要点：ε 任意、N 依赖 ε、只管尾部。\n<\/li><li>\n单调有界定理不需要猜极限；它把存在性变成两个可检查的条件。\n<\/li><li>\n完备性 = 柯西列必收敛；ℝ 的完备性与序完备性是同一件事的两种面孔。\n<\/ul>", "kind": "chapter", "title": "第 2 章：收敛性"}, "ch03": {"html": "<h1>第 3 章：连续函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：8 小时 ｜ <strong>前置<\/strong>：第 2 章（度量、收敛、完备性）\n<\/ul>\n<blockquote>原书对连续性的定位很克制：它衡量的是&quot;像集中的微小变化如何由定义域中的微小变化引起&quot;。为了说清&quot;微小&quot;，先得给集合加上结构——度量空间是最自然的候选。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 ε-δ 和&quot;开集的原像是开集&quot;两种语言判断连续，并证明二者等价。\n<\/li><li>\n用紧致性证明连续函数取到最大值、最小值，并给出一致连续的结论。\n<\/li><li>\n用连通性证明介值定理，说明为什么定义域必须连通。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>连续是把&quot;足够小的输入扰动&quot;翻译成&quot;任意小的输出误差&quot;的能力；紧致性把这个逐点成立的局部性质升级成全局性质（一致连续、取到极值），连通性则保证值域不出现跳跃。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：ε-δ 定义<\/h3>\n<p>f : X → Y 在 x₀ 处连续：对每个 ε &gt; 0，存在 δ = δ(x₀, ε) &gt; 0，使得 d_X(x, x₀) &lt; δ 时 d_Y(f(x), f(x₀)) &lt; ε。<\/p>\n<p>和数列的 ε-N 比，多了一个麻烦：δ 一般依赖 x₀。这正是&quot;逐点连续&quot;与&quot;一致连续&quot;的分水岭。证明 √x 在 x₀ = 0 连续时要取 δ = ε²，在其他点取 min{ε√x₀, x₀}，δ 的表达式随点变，这不是偷懒，是必须的。<\/p>\n<p><strong>类比<\/strong>：调收音机。每个频段的灵敏度不同，想收到清晰信号，不同频段要拧不同的幅度。连续就是&quot;每个频段都能调到足够清晰&quot;，但允许每个频段的拧法不同。<\/p>\n<h3>概念 2：开集语言（拓扑）<\/h3>\n<p>在度量空间中，开球 B(a, r) 是开集；开集是若干开球的并。三条基本事实：<\/p>\n<ul><li>\n任意并的开集是开集；\n<\/li><li>\n有限交的开集是开集；\n<\/li><li>\n∅ 与全空间是开集。\n<\/ul>\n<p>定理：f 连续 ⇔ 每个开集 V ⊆ Y 的原像 f⁻¹(V) 是 X 中的开集。<\/p>\n<p>为什么等价？若 f 在每点连续，取 x ∈ f⁻¹(V)，V 开所以含一个球 B(f(x), ε)，连续性给出 B(x, δ) 落在原像里，于是原像是开集。反过来，给定 ε，取 V = B(f(x₀), ε)，它的原像是开集且含 x₀，于是含某个球 B(x₀, δ)，这就是 ε-δ。<\/p>\n<p>开集语言的好处：它不依赖距离，可以搬到一般拓扑空间。第 9 章的 σ-代数、第 11 章的流形都用这套&quot;用原像搬运结构&quot;的思路。<\/p>\n<h3>概念 3：紧致性<\/h3>\n<p>度量空间 X 紧致：每个开覆盖都有有限子覆盖。等价的序列说法：每个序列都有收敛子列（在度量空间里二者等价）。<\/p>\n<p>最常用的例子：[a, b] 紧致（Heine–Borel），ℝ 不紧致，开区间 (0,1) 不紧致。ℓ∞ 的闭单位球不紧致——这是无限维与有限维的重要差别。<\/p>\n<p>紧致性的三条常用推论：<\/p>\n<ol><li>\n紧集上的连续函数<strong>有界<\/strong>且<strong>取到最大最小值<\/strong>。证明用序列紧致：取逼近上确界的点列，抽出收敛子列，连续性把极限传到函数值。\n<\/li><li>\n紧集上的连续函数<strong>一致连续<\/strong>。给定 ε，每点有 δ(x)；若没有统一的 δ，就能找到 xₙ、yₙ 使 |xₙ − yₙ| &lt; 1/n 而 |f(xₙ) − f(yₙ)| ≥ ε；紧性抽出收敛子列，两点极限相同，连续性给矛盾。\n<\/li><li>\n紧集在连续映射下的像紧致。\n<\/ol>\n<p><strong>类比<\/strong>：紧致像一个&quot;不会漏气的盒子&quot;：无论你用多少个小盖子去盖它，总能挑出有限个就盖住。开区间会漏气——靠近端点的地方，有限的盖子盖不住。<\/p>\n<h3>概念 4：连通性与介值定理<\/h3>\n<p>X 连通：不能拆成两个不交非空开集之并。ℝ 中连通的集合恰好是区间。<\/p>\n<p>介值定理：f : [a, b] → ℝ 连续，则 f 取到 f(a) 与 f(b) 之间的一切值。<\/p>\n<p>证明思路：设 y 在两端值之间，令 A = {x : f(x) ≤ y}，取 c = sup A。由连续性，f(c) 既不能小于 y（否则 c 附近还有点在 A 中，c 不是上确界），也不能大于 y（否则 c 左边附近都不在 A 中，c 不是最小上界），只能等于 y。<\/p>\n<p>注意两点：定义域必须是连通的区间；值域必须是 ℝ 这种有序、有介值概念的空间。对复值函数或向量值函数，介值定理不成立（可以绕圈）。<\/p>\n<p><strong>类比<\/strong>：爬山。起点 100 米、终点 800 米，只要路线连续，你一定在某个时刻踩过 500 米。绕圈的山路（复平面）就不保证——高度不再是单值的。<\/p>\n<h3>概念 5：指数函数怎么&quot;定义&quot;出来<\/h3>\n<p>初等数学里 e^x 是&quot;乘方&quot;，但 x 是无理数时没法用&quot;乘 x 次&quot;定义。分析学的做法是从级数出发：<\/p>\n<p>exp(z) := Σ zⁿ/n!。<\/p>\n<p>这个级数在整个 ℂ 上绝对收敛（比值判别），所以定义良好。由级数的绝对收敛可以做柯西乘积，得到加法定理 exp(z + w) = exp(z)exp(w)，进而推出 exp 连续、可微、exp′ = exp。e := exp(1)，e^x 就是 exp(x)。<\/p>\n<p>这条路线把&quot;指数&quot;从直观变成定理：不是假设它存在，而是造出来再证明它有该有的性质。第 4 章用它做例子，第 6 章用它做 Fourier 级数的核。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[ε-δ 逐点连续] --&gt; B[开集原像为开集]\n  B --&gt; C[一般拓扑空间]\n  A --&gt; D[一致连续]\n  D --&gt; E[紧致性]\n  E --&gt; F[取到最大最小值]\n  E --&gt; G[连续函数的像紧致]\n  A --&gt; H[连通定义域]\n  H --&gt; I[介值定理]\n  A --&gt; J[级数定义 exp]\n  J --&gt; K[加法定理 可微 exp&#x27;=exp]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：连续的定义有两条等价道路（左：ε-δ，右：开集），往下分三条支线：紧致给出&quot;整体&quot;结论，连通给出&quot;介值&quot;，级数给出具体函数的构造。三条支线的共同点都是&quot;用连续把局部信息传成全局结论&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：连续像电梯。按钮按 3 楼，电梯必须经过 2 楼（介值）；电梯行程有限、一定停在某层（紧致 + 极值）；但按钮的灵敏度在不同楼层可能不同（逐点 δ 依赖 x₀）。 <strong>失效边界<\/strong>：电梯是离散楼层，数学的连续是实数级别；而且电梯可能故障（不连续），这时介值、极值全都不保证。<\/p>\n<p><strong>实例（可验证）<\/strong>：f(x) = x² 在 ℝ 上连续但非一致连续。 连续：|x² − x₀²| = |x + x₀||x − x₀|，取 δ = min{1, ε/(2|x₀| + 1)} 即可。 非一致：取 xₙ = n，yₙ = n + 1/n。|xₙ − yₙ| = 1/n → 0，但 |xₙ² − yₙ²| = 2 + 1/n² ≥ 2。所以不存在对全 ℝ 统一的 δ。 这个反例说明&quot;逐点连续 + 定义域不紧致&quot;确实会失去一致连续。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;连续就是不间断、能一笔画出来&quot;<\/strong> — 实际上连续允许函数无限振荡（x sin(1/x) 在 0 处补定义为 0 后连续），也允许处处不可微（Weierstrass 函数）。&quot;一笔画&quot;是直觉，不是定义。\n<\/li><li>\n<strong>别以为&quot;连续就有最大值&quot;<\/strong> — 实际上 f(x) = x 在 (0,1) 上连续，却没有最大值。必须定义域紧致。\n<\/li><li>\n<strong>别以为&quot;介值定理对向量值函数也成立&quot;<\/strong> — 实际上 f(t) = (cos t, sin t) 从 (1,0) 到 (−1,0)，中途不经过原点，值域是圆周不是区间。介值需要一维有序值域。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nf(x) = 1/x 在 (0, 1) 上的一致连续性如何？　A. 一致连续　B. 连续但非一致连续　C. 不连续　D. 只在 (1/2,1) 上一致连续\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：取 xₙ = 1/n，yₙ = 1/(n+1)，两点距离趋于 0，函数值之差恒为 1，不存在统一 δ。定义域不紧致，正是一致连续失效的典型场景。<\/p>\n<\/ol>\n<ol><li>\n下列条件中，能保证连续函数 f : X → ℝ 取到最小值的是？　A. X 是开区间　B. X 紧致　C. f 有界　D. X 连通\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：紧集上连续函数取到最大最小值。开区间、连通都不够（f(x)=x 在 (0,1) 无最小值）；仅有界也不够。<\/p>\n<\/ol>\n<ol><li>\n介值定理成立的必要条件不包括？　A. 定义域连通　B. 函数连续　C. 值域是一维有序的　D. 函数可微\n<p><strong>答案<\/strong>：D。<strong>解析<\/strong>：介值定理只用连续性，不要求可微。A、B、C 都是必需的：去掉连通（定义域分裂）、去掉连续（跳跃）、或换成复值，结论都会失效。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n连续两条等价语言：ε-δ 与开集原像；后者是拓扑推广的入口。\n<\/li><li>\n紧致 = 开覆盖有有限子覆盖 = 序列有收敛子列，能把&quot;逐点&quot;升级为&quot;整体&quot;。\n<\/li><li>\n一致连续失败的标准反例：定义域不紧致 + 两点靠近而函数值拉开。\n<\/ul>", "kind": "chapter", "title": "第 3 章：连续函数"}, "ch04": {"html": "<h1>第 4 章：一元微分学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：8 小时 ｜ <strong>前置<\/strong>：第 2 章（极限）、第 3 章（连续）\n<\/ul>\n<blockquote>原书一开头就把动机摆明：发展微分学，是希望用线性近似描述函数的局部行为。由此引出切线问题，再引出极值、密切圆这些相关问题。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;差商极限&quot;和&quot;存在仿射逼近使误差比 |x − a| 更快趋零&quot;两种说法定义可微，并证明等价。\n<\/li><li>\n用罗尔、拉格朗日、柯西中值定理证明单调性、极值、洛必达法则与不等式。\n<\/li><li>\n写出带皮亚诺余项与拉格朗日余项的泰勒公式，并估计余项。\n<\/li><li>\n说明牛顿迭代为什么二次收敛，以及它的失败条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>可微就是&quot;在一点附近，函数可以被一条直线替代，误差是比一阶更小的量&quot;。微分学的全部结论——中值定理、泰勒公式、极值判别——都是把这句话在不同尺度上展开。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：导数与线性逼近<\/h3>\n<p>f 在 a 处可微，如果差商 (f(x) − f(a))/(x − a) 当 x → a 时有极限，记为 f′(a)。<\/p>\n<p>等价刻画：存在 m ∈ E 与在 a 处连续、且 r(a) = 0 的函数 r，使得<\/p>\n<p>f(x) = f(a) + m(x − a) + r(x)(x − a)。<\/p>\n<p>这里 m = f′(a)，r(x)(x − a) 就是&quot;比一阶更小的误差&quot;。换成一句更直观的话：f 在 a 处可以被仿射函数 g(x) = f(a) + f′(a)(x − a) 逼近，且<\/p>\n<p>‖f(x) − g(x)‖ / |x − a| → 0。<\/p>\n<p>由此立刻得到：可微 ⇒ 连续。因为误差项 r(x)(x − a) → 0。反过来不成立：|x| 在 0 处连续但差商左右极限不同。<\/p>\n<p><strong>类比<\/strong>：导数是你踩油门那一刻的速度表读数。它只描述&quot;此刻&quot;，不描述&quot;这一秒走了多远&quot;。<strong>边界<\/strong>：速度表总有读数，函数却可能在某点没有导数（尖角、振荡），这时&quot;瞬时速度&quot;不存在。<\/p>\n<h3>概念 2：求导法则都来自线性化<\/h3>\n<ul><li>\n和、数乘：线性化可以直接相加。\n<\/li><li>\n乘积法则 (fg)′ = f′g + fg′：把 f(a+h)g(a+h) 展开，主项之外剩下 f′g + fg′。\n<\/li><li>\n链式法则 (f∘g)′(a) = f′(g(a)) g′(a)：复合两个线性逼近，误差是二阶小量。\n<\/li><li>\n反函数求导：(f⁻¹)′(y) = 1/f′(x)，只要 f′(x) ≠ 0。几何上是切线斜率的倒数。\n<\/ul>\n<p>这些法则不是&quot;公式表&quot;，是同一条&quot;误差比一阶小&quot;的思想在运算下的封闭性。<\/p>\n<h3>概念 3：中值定理家族<\/h3>\n<p><strong>罗尔定理<\/strong>：f 在 [a, b] 连续、在 (a, b) 可微、f(a) = f(b)，则存在 ξ 使 f′(ξ) = 0。 证明：连续函数在紧区间上取到最大最小值。若极值在内部，导数必为 0；若两端就是极值，则函数常数，处处导数为 0。<\/p>\n<p><strong>拉格朗日中值定理<\/strong>：存在 ξ 使 f(b) − f(a) = f′(ξ)(b − a)。把罗尔定理用在 f(x) − f(a) − k(x − a) 上，k 取割线斜率。<\/p>\n<p><strong>柯西中值定理<\/strong>：f、g 都满足条件时，<\/p>\n<p>(f(b) − f(a)) g′(ξ) = (g(b) − g(a)) f′(ξ)。<\/p>\n<p>它是洛必达法则的引擎：把&quot;两个函数之比的极限&quot;转化成&quot;导数之比在中间点的值&quot;。<\/p>\n<p>三个推论最常用：<\/p>\n<ol><li>\nf′ ≡ 0 ⇒ f 常数。\n<\/li><li>\nf′ &gt; 0 ⇒ f 严格递增。\n<\/li><li>\n|f′| ≤ M ⇒ |f(b) − f(a)| ≤ M|b − a|（利普希茨）。\n<\/ol>\n<p><strong>类比<\/strong>：中值定理说&quot;平均速度必然在某一瞬间被达到&quot;。开车 2 小时走 160 公里，平均 80，那么必有某一刻速度表指 80。<strong>边界<\/strong>：只保证存在某一刻，不保证你能知道是哪一刻；而且要求路程连续、可导，急刹车（不可导）时结论可能失效。<\/p>\n<h3>概念 4：泰勒公式<\/h3>\n<p>若 f 在 a 处 n 次可微，则<\/p>\n<p>f(x) = f(a) + f′(a)(x − a) + f″(a)(x − a)²/2! + … + f⁽ⁿ⁾(a)(x − a)ⁿ/n! + Rₙ(x)。<\/p>\n<p>两种余项：<\/p>\n<ul><li>\n<strong>皮亚诺余项<\/strong>：Rₙ(x) = o(|x − a|ⁿ)。只保证&quot;高阶小&quot;，适合求极限。\n<\/li><li>\n<strong>拉格朗日余项<\/strong>：Rₙ(x) = f⁽ⁿ⁺¹⁾(ξ)(x − a)ⁿ⁺¹/(n + 1)!，ξ 在 a 与 x 之间。能给出具体误差界，适合估计。\n<\/ul>\n<p>用法示例：e^x = 1 + x + x²/2 + … + xⁿ/n! + e^ξ xⁿ⁺¹/(n+1)!。在 |x| ≤ 1 时误差 ≤ 3/(n+1)!，取 n = 10 就能保证小数点后 6 位。<\/p>\n<p><strong>类比<\/strong>：泰勒多项式是&quot;用多项式模仿函数&quot;的逐步加码版：常数项对齐函数值，一次项对齐斜率，二次项对齐弯曲程度，每加一项就多对齐一阶导数。<strong>边界<\/strong>：模仿只在展开点附近有效；离得远，误差可能爆炸（比如 1/(1−x) 在 |x| &gt; 1 时级数发散）。<\/p>\n<h3>概念 5：极值判别与洛必达<\/h3>\n<ul><li>\n一阶必要：内部极值点且可微 ⇒ f′ = 0。反之不成立（x³ 在 0 处）。\n<\/li><li>\n二阶充分：f′(a) = 0 且 f″(a) &gt; 0 ⇒ 严格局部极小；f″(a) &lt; 0 ⇒ 极大；f″(a) = 0 时失效，要更高阶或直接看单调性。\n<\/li><li>\n洛必达：0/0 或 ∞/∞ 型，若 f′/g′ 有极限，则 f/g 同极限。条件是邻域内 g′ ≠ 0，且别在&quot;导数之比不存在&quot;时硬套。\n<\/ul>\n<h3>概念 6：迭代法与牛顿法<\/h3>\n<p>求方程 f(x) = 0 的根，可以写成不动点问题 x = T(x)，迭代 xₙ₊₁ = T(xₙ)。<\/p>\n<p><strong>压缩映射原理<\/strong>：若 T 是完备度量空间上的压缩（d(Tx, Ty) ≤ L d(x, y)，L &lt; 1），则 T 有唯一不动点，且从任意点迭代都收敛，误差按 Lⁿ 衰减。<\/p>\n<p><strong>牛顿法<\/strong>：T(x) = x − f(x)/f′(x)。在单根附近，若 f 二阶连续可微且 f′ ≠ 0，则误差满足 eₙ₊₁ ≈ C eₙ²，即有效位数每步翻倍（二次收敛）。代价是每步要算导数，且初值必须落在吸引域内；f′ 接近 0 或根为重根时会退化。<\/p>\n<p><strong>类比<\/strong>：牛顿法像用切线当滑梯，一次滑到切线与 x 轴的交点。滑梯越陡（导数越大）滑得越准，接近水平时（导数趋 0）会滑飞。<strong>边界<\/strong>：函数有多个根时，不同初值可能滑向不同根；初值选错会发散。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[差商极限] --&gt; B[可微]\n  B --&gt; C[仿射逼近 误差比一阶小]\n  B --&gt; D[可微必连续]\n  C --&gt; E[求导法则]\n  E --&gt; F[中值定理]\n  F --&gt; G[单调性 极值 不等式]\n  F --&gt; H[洛必达]\n  B --&gt; I[泰勒公式]\n  I --&gt; J[皮亚诺余项 求极限]\n  I --&gt; K[拉格朗日余项 估误差]\n  I --&gt; L[迭代法 牛顿法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：所有箭头都从&quot;可微 = 线性逼近&quot;出发。中值定理是&quot;一次近似&quot;的全局版本，泰勒是&quot;高阶近似&quot;的局部版本，牛顿法是&quot;用一阶近似反过来求根&quot;。三条支线用的都是同一句话。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把函数想成地形，导数就是坡度。中值定理说&quot;起点和终点高度差等于某处坡度乘以水平距离&quot;；泰勒公式说&quot;用当地坡度、弯曲度、弯曲的变化率来预测附近高度&quot;；牛顿法说&quot;沿着当前坡度直走，走到高度为零的地方，再重新测坡度&quot;。 <strong>失效边界<\/strong>：地形有悬崖（不连续）或尖石（不可导）时，坡度不存在；雾天（高阶导数巨大）时，预测会偏得很远。<\/p>\n<p><strong>实例（可验证）<\/strong>：证明对任意 x &gt; 0，log x ≤ x − 1。 令 f(x) = x − 1 − log x。f(1) = 0，f′(x) = 1 − 1/x。x &lt; 1 时 f′ &lt; 0，f 递减；x &gt; 1 时 f′ &gt; 0，f 递增。所以 1 是全局最小点，f(x) ≥ f(1) = 0。 这个证明只用了&quot;导数符号决定单调性&quot;，属于中值定理的直接推论。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;导数为 0 就是极值点&quot;<\/strong> — 实际上 x³ 在 0 处导数为 0，却不是极值。必要条件和充分条件要分清。\n<\/li><li>\n<strong>别以为&quot;函数连续就差不多可微&quot;<\/strong> — 实际上连续函数可以处处不可微（Weierstrass 函数），也可以在某点有尖角（|x| 在 0）。可微是比连续强得多的要求。\n<\/li><li>\n<strong>别以为&quot;泰勒多项式就是函数本身&quot;<\/strong> — 实际上它只是局部近似，余项不为 0；在收敛半径外，级数甚至不收敛到函数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nf(x) = |x| 在 x = 0 处？　A. 可微且导数为 0　B. 连续但不可微　C. 不连续　D. 可微但导数不存在\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：左右差商分别为 1 和 −1，极限不存在，所以不可微；但函数本身连续。<\/p>\n<\/ol>\n<ol><li>\n设 f 在 [0, 2] 上可微，f(0) = 0，f(2) = 4，则一定能推出？　A. 存在 ξ 使 f′(ξ) = 2　B. f′ 处处等于 2　C. f 单调递增　D. f″ 存在\n<p><strong>答案<\/strong>：A。<strong>解析<\/strong>：拉格朗日中值定理给出 f(2) − f(0) = f′(ξ)(2 − 0)，即 f′(ξ) = 2。其余三项都不保证。<\/p>\n<\/ol>\n<ol><li>\n用牛顿法求 f(x) = x² − 2 的正根，初值 x₀ = 1，迭代式为？　A. xₙ₊₁ = (xₙ + 2/xₙ)/2　B. xₙ₊₁ = xₙ − xₙ²　C. xₙ₊₁ = 2/xₙ　D. xₙ₊₁ = xₙ + 1\n<p><strong>答案<\/strong>：A。<strong>解析<\/strong>：x − f/f′ = x − (x² − 2)/(2x) = (x + 2/x)/2，这是求平方根的标准迭代，误差平方级下降。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n可微的两种说法：差商极限、仿射逼近且误差比一阶小。\n<\/li><li>\n中值定理把局部导数信息变成全局结论；泰勒是它的高阶版。\n<\/li><li>\n牛顿法 = 用切线求根，二次收敛但依赖初值和 f′ ≠ 0。\n<\/ul>", "kind": "chapter", "title": "第 4 章：一元微分学"}, "ch05": {"html": "<h1>第 5 章：函数序列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：10 小时 ｜ <strong>前置<\/strong>：第 2 章（收敛）、第 3 章（连续）、第 4 章（导数）\n<\/ul>\n<blockquote>原书把这一章称为&quot;所有更深入分析研究的基础&quot;，并在第 1 节就把逐点收敛与一致收敛的差别点破：一致收敛时，N 只依赖 ε，不依赖 x。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个函数列是逐点收敛还是一致收敛，并用 sup 范数重写一致收敛。\n<\/li><li>\n用魏尔斯特拉斯 M-判别法证明函数项级数一致收敛。\n<\/li><li>\n说明一致收敛能传递连续性、积分，但传递微分需要更强的条件。\n<\/li><li>\n解释解析函数为什么可以局部展开成幂级数，以及魏尔斯特拉斯逼近定理说了什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>逐点收敛只管每个点各自达标，一致收敛要求所有点共用同一个 N。只有后者才能让&quot;极限&quot;与&quot;连续、积分、求导&quot;交换次序。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：逐点收敛与一致收敛<\/h3>\n<p>设 fₙ : X → E。<\/p>\n<ul><li>\n<strong>逐点收敛<\/strong>：对每个 x 和每个 ε &gt; 0，存在 N = N(x, ε)，使 n ≥ N 时 ‖fₙ(x) − f(x)‖ &lt; ε。\n<\/li><li>\n<strong>一致收敛<\/strong>：对每个 ε &gt; 0，存在 N = N(ε)，使 n ≥ N 时，<strong>对所有 x ∈ X<\/strong> 都有 ‖fₙ(x) − f(x)‖ &lt; ε。\n<\/ul>\n<p>差别只在 N 是否依赖 x，但后果很大。看两个例子：<\/p>\n<ol><li>\nfₙ(x) = xⁿ 在 [0,1] 上逐点收敛到 f(x) = 0（x &lt; 1 时）和 f(1) = 1。极限函数不连续，而每个 fₙ 都连续。所以逐点收敛不能传递连续性。\n<\/li><li>\n同一列在 [0, a]（a &lt; 1）上一致收敛到 0：‖fₙ‖ ≤ aⁿ → 0。区间换成闭区间、离开 1，一致收敛就回来了。\n<\/ol>\n<p><strong>类比<\/strong>：逐点收敛是每个学生各自及格，标准可以因人而异；一致收敛是全班的及格线统一，而且从某一堂课起全班同时达标。<strong>边界<\/strong>：一致收敛比逐点强，但不是&quot;更强就更好&quot;——有些函数列只有逐点收敛，仍然有分析价值（比如傅里叶级数在间断点附近）。<\/p>\n<h3>概念 2：用 sup 范数重写<\/h3>\n<p>对有界函数，定义 ‖f‖∞ := sup{‖f(x)‖ : x ∈ X}。则<\/p>\n<p>fₙ 一致收敛到 f ⇔ ‖fₙ − f‖∞ → 0。<\/p>\n<p>这把一致收敛变成了一个普通数列的收敛问题，所有判别法都能用。代价是：只有有界函数才有有限的 sup 范数，处理无界函数时要先局部化（在紧集上讨论）。<\/p>\n<h3>概念 3：一致收敛能传递什么<\/h3>\n<p>设 fₙ 一致收敛到 f。<\/p>\n<ul><li>\n<strong>连续性<\/strong>：每个 fₙ 连续 ⇒ f 连续。证明用&quot;三段估计&quot;：‖f(x) − f(x₀)‖ ≤ ‖f(x) − fₙ(x)‖ + ‖fₙ(x) − fₙ(x₀)‖ + ‖fₙ(x₀) − f(x₀)‖。第一、三段由一致收敛统一控制，中间段由 fₙ 的连续性控制。这里&quot;统一&quot;是关键，逐点收敛时第一、三段各自依赖 x，拼不起来。\n<\/li><li>\n<strong>积分<\/strong>：在紧区间上，∫fₙ → ∫f。估计是 ‖∫fₙ − ∫f‖ ≤ (b − a)‖fₙ − f‖∞。\n<\/li><li>\n<strong>微分<\/strong>：光有一致收敛不够。fₙ(x) = sin(nx)/n 一致收敛到 0，但 fₙ′ = cos(nx) 不收敛。正确条件是：fₙ 在某点收敛，且 fₙ′ 一致收敛，则 f 可微且 f′ = lim fₙ′。\n<\/ul>\n<p><strong>类比<\/strong>：一致收敛像&quot;整批货物同时到港&quot;，所以可以把整批直接转给下一道工序；逐点收敛像&quot;零散到货&quot;，每件到的时间不同，没法整批处理。<\/p>\n<h3>概念 4：M-判别法与函数项级数<\/h3>\n<p>若 ‖fₙ‖∞ ≤ Mₙ 且 ΣMₙ 收敛，则 Σfₙ 一致收敛（且绝对收敛）。<\/p>\n<p>这是最常用的判别法，因为它把函数项级数化归成正项级数。例：Σ xⁿ/n² 在 [−1,1] 上一致收敛，因为 |xⁿ/n²| ≤ 1/n²，而 Σ1/n² 收敛。<\/p>\n<p>注意：M-判别法给的是充分条件，不是必要。Σ(−1)ⁿ xⁿ/n 在 [0,1] 上一致收敛（用交错级数的余项估计），但 M-判别法失效。<\/p>\n<h3>概念 5：解析函数<\/h3>\n<p>f 在 a 处<strong>解析<\/strong>：存在 r &gt; 0，使得在 |z − a| &lt; r 内<\/p>\n<p>f(z) = Σ cₙ (z − a)ⁿ，cₙ = f⁽ⁿ⁾(a)/n!。<\/p>\n<p>关键事实：<\/p>\n<ul><li>\n幂级数在收敛圆内可以逐项求导、逐项积分，且收敛半径不变。这正是一致收敛在紧子集上的应用（在 |z − a| ≤ ρ &lt; r 上一致收敛）。\n<\/li><li>\n解析 ⇒ 无穷次可微，但反过来不成立：C∞ 函数不一定解析（经典的 e^(−1/x²) 在 0 处所有导数都是 0，幂级数恒为 0，不收敛到函数本身）。\n<\/li><li>\n解析函数由它在一点的所有导数决定，这是它&quot;刚性&quot;的一面：知道一点的全部局部信息，就知道整个连通区域。\n<\/ul>\n<p><strong>类比<\/strong>：解析函数像全息底片，一小块包含整个物体的信息；C∞ 函数像高清照片，局部再清晰也不能推出远处。<strong>边界<\/strong>：全息只在收敛圆内成立，圆外要另找展开点（解析延拓）。<\/p>\n<h3>概念 6：多项式逼近<\/h3>\n<p><strong>魏尔斯特拉斯逼近定理<\/strong>：紧区间上的连续函数可以用多项式一致逼近。<\/p>\n<p>证明思路（Bernstein 多项式）：Bₙ(f)(x) = Σ f(k/n) C(n,k) xᵏ(1−x)ⁿ⁻ᵏ。它是&quot;以二项分布权重对 f 的取值做平均&quot;，均值是 x，方差 ≤ 1/(4n)，所以 n 大时平均集中在 x 附近，收敛到 f(x)。用 f 的一致连续性把&quot;集中在 x 附近&quot;翻译成&quot;值接近 f(x)&quot;。<\/p>\n<p>这条定理说明：多项式在 C[a,b] 中稠密。它不构造实用算法（Bernstein 收敛慢），但保证了存在性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[函数列 f_n] --&gt; B[逐点收敛 N 依赖 x]\n  A --&gt; C[一致收敛 N 只依赖 ε]\n  C --&gt; D[sup 范数趋于 0]\n  C --&gt; E[连续性传递]\n  C --&gt; F[积分传递]\n  C --&gt; G[微分 需 f_n&#x27; 一致收敛]\n  C --&gt; H[M-判别法]\n  H --&gt; I[函数项级数]\n  I --&gt; J[幂级数 收敛圆内逐项运算]\n  J --&gt; K[解析函数]\n  C --&gt; L[魏尔斯特拉斯逼近]\n  L --&gt; M[多项式在 C 中稠密]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：中间那条&quot;一致收敛&quot;是主干。左边逐点收敛只通向&quot;每点各自收敛&quot;，右边四条才是它带来的可用结论。注意微分那条有个附加条件，这是最容易踩的坑。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把函数列想成一群演员排练同一段戏。逐点收敛是&quot;每个观众席看到的表演都越来越好&quot;，但不同座位看到的时间点不同；一致收敛是&quot;整场演出同时到位&quot;，导演才能整体切换场景。 <strong>失效边界<\/strong>：一致收敛要求所有 x 同步，现实里&quot;同步&quot;很难；数学上很多有用的逼近（如傅里叶级数在间断点）只有逐点收敛，靠额外技巧（分段一致、狄利克雷核）补救。<\/p>\n<p><strong>实例（可验证）<\/strong>：证明 fₙ(x) = nx/(1 + n²x²) 在 [0,1] 上逐点收敛到 0，但不一致收敛。 逐点：固定 x &gt; 0，fₙ(x) ≈ 1/(nx) → 0；x = 0 时为 0。 非一致：取 xₙ = 1/n，则 fₙ(xₙ) = 1/2，始终不小于 1/2。所以不存在统一的 N。 这个例子的极限函数连续（恒为 0），但收敛仍不一致，说明&quot;极限连续&quot;不能反推一致收敛。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;每个 fₙ 连续 + 逐点收敛 ⇒ 极限连续&quot;<\/strong> — 实际上 xⁿ 在 [0,1] 就是反例。必须一致收敛。\n<\/li><li>\n<strong>别以为&quot;一致收敛 ⇒ 可以逐项求导&quot;<\/strong> — 实际上 sin(nx)/n 一致收敛到 0，导数却剧烈振荡。求导要额外要求导数列一致收敛。\n<\/li><li>\n<strong>别以为&quot;无穷次可微就是解析&quot;<\/strong> — 实际上 e^(−1/x²) 在 0 处 C∞，但泰勒级数恒为 0，不等于函数本身。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nfₙ(x) = xⁿ 在下列哪个区间上一致收敛到 0？　A. [0,1]　B. [0,1)　C. [0, 0.9]　D. (−1,1]\n<p><strong>答案<\/strong>：C。<strong>解析<\/strong>：在 [0,1] 上极限函数在 1 处跳到 1，不一致；[0,0.9] 上 ‖fₙ‖ ≤ 0.9ⁿ → 0，一致收敛。[0,1) 上取 xₙ → 1 可使 fₙ(xₙ) 不趋于 0。<\/p>\n<\/ol>\n<ol><li>\n若 fₙ 一致收敛到 f，且每个 fₙ 连续，则？　A. f 一定可微　B. f 一定连续　C. fₙ′ 一定一致收敛　D. f 一定有界\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：一致收敛传递连续性。可微、导数收敛都不保证；f 在有界区间上才有界，题干没说 X 有界。<\/p>\n<\/ol>\n<ol><li>\n关于解析函数，正确的说法是？　A. 解析与 C∞ 等价　B. 解析函数在收敛圆内可逐项求导　C. 解析函数的泰勒级数处处收敛到自身　D. 解析函数一定是有理函数\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：A 错（e^(−1/x²)）；C 错，只在收敛圆内；D 错，exp、sin 都是超越函数。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逐点与一致的唯一差别：N 是否依赖 x；一切后果由此而来。\n<\/li><li>\n一致收敛传递连续与积分；传递微分要导数列一致收敛。\n<\/li><li>\n解析 = 局部幂级数展开；C∞ 不够。\n<\/ul>", "kind": "chapter", "title": "第 5 章：函数序列"}, "c01": {"html": "<h1>上确界与序完备性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 1 章（§10）、第 2 章（§4、§6）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>上确界是最小的上界；序完备性是说每个非空、上有界的子集都有上确界。ℝ 满足，ℚ 不满足。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是实数分析的总开关。单调有界定理、区间套、波尔查诺–魏尔斯特拉斯、连续函数取极值、积分的存在性，最后都归到&quot;某个集合有上确界&quot;。ℚ 里这些结论会逐条失效。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  S[非空上有界集合 A] --&gt; U[上界集合 U]\n  U --&gt; M[最小上界 sup A]\n  M --&gt; T[单调有界定理]\n  M --&gt; B[波尔查诺-魏尔斯特拉斯]\n  M --&gt; C[紧区间连续函数取极值]\n  M --&gt; I[积分存在性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>设 A ⊆ ℝ 非空。s 是上界：对所有 a ∈ A，a ≤ s。sup A 是上界中最小的那个。<\/p>\n<p>ℝ 的构造性刻画：它是唯一（在同构意义下）的序完备有序域。ℚ 的失败例子是 A = {x ∈ ℚ : x &gt; 0, x² &lt; 2}。若 c ∈ ℚ 是上确界，令 ξ = (2c + 2)/(c + 2)，则 ξ − c = −(c² − 2)/(c + 2)。c² &lt; 2 时 ξ 更大且仍是上界；c² &gt; 2 时 ξ 更小且仍是上界；c² = 2 时 c 不是有理数。三种情况都推翻&quot;最小上界&quot;。<\/p>\n<p>这个构造同时说明：上确界不必属于集合，也不必是有理数。A 没有最大元，上确界 √2 在集合外。<\/p>\n<p><strong>类比<\/strong>：一群人比身高，上确界是&quot;最矮的那个够用的天花板&quot;——比所有人都高，但再低一点就有人顶破。<strong>边界<\/strong>：人群必须有上界，否则没有天花板；空集也没有上确界（约定为 −∞）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为上确界一定在集合里——(0,1) 的上确界 1 不在集合内。\n<\/li><li>\n别以为&quot;任意接近&quot;就等于&quot;等于&quot;——A 中元素可以任意接近 √2，但没有一个等于 √2。\n<\/li><li>\n别以为有理数稠密就完备——稠密只说明任意两个数之间有数，不保证缺口被填上。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章 §10<\/td><td>构造 ℝ<\/td><td>序完备性公理，ℚ 不完备<\/td><\/tr><tr><td>第 2 章 §4<\/td><td>单调数列<\/td><td>递增有上界则收敛到上确界<\/td><\/tr><tr><td>第 2 章 §6<\/td><td>完备性<\/td><td>与柯西完备等价<\/td><\/tr><tr><td>第 3 章 §3<\/td><td>紧致性<\/td><td>闭区间紧致，连续函数取极值<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：全序集、域\n<\/li><li>\n后续：柯西列与完备性、紧致性\n<\/ul>", "kind": "concept", "title": "上确界与序完备性"}, "c02": {"html": "<h1>可数与不可数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 1 章（§6）、第 2 章（§9）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可数就是能和自然数建立一一对应；不可数就是做不到。ℚ 可数，ℝ 不可数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它区分了两种&quot;无穷&quot;，也决定了&quot;能不能把对象排队处理&quot;。级数求和、算法枚举、测度论里&quot;可数并&quot;的封闭性，都建立在可数性上。ℝ 不可数正是勒贝格测度必须引入&quot;可数覆盖&quot;而不是&quot;有限覆盖&quot;的原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  F[有限集] --&gt; C[可数集]\n  N[ℕ ℤ ℚ] --&gt; C\n  C --&gt; D[可数并仍可数]\n  U[ℝ ℂ ℝⁿ 区间] --&gt; V[不可数]\n  V --&gt; W[康托对角线]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>可数：存在双射 X → ℕ。<\/p>\n<ul><li>\nℤ：0, 1, −1, 2, −2, …，每个整数拿到唯一编号。\n<\/li><li>\nℚ：把 p/q 按 |p| + q 分层，逐层列出，重复的跳过。任意给定 p/q，它必落在有限层内，所以能编到号。\n<\/li><li>\n可数个可数集的并可数：用对角线法把二维编号压成一维。\n<\/li><li>\nℝ 不可数：假设 [0,1] 可数，列出小数展开 a₁, a₂, …，构造 b，使 b 的第 n 位与 aₙ 的第 n 位不同（并避开 9 与 0 的重复表示问题）。b 在 [0,1] 中却不在表中，矛盾。\n<\/ul>\n<p><strong>类比<\/strong>：可数是旅馆房间号，每个客人一个号；不可数是&quot;客人比房间号还多，无论怎么编号总有客人没号&quot;。<strong>边界<\/strong>：无限旅馆（希尔伯特旅馆）说明可数集可以和真子集等势，所以&quot;房间满了还能再住人&quot;，这与有限直觉相反。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;稠密就不可数&quot;——ℚ 稠密但可数。\n<\/li><li>\n别以为&quot;可数&quot;意味着能数完——它只要求存在双射，不要求给出数完的时刻。\n<\/li><li>\n别以为&quot;不可数&quot;就是&quot;比可数多一点点&quot;——ℝ 的基数严格大于 ℕ，且不可数与可数之间没有中间基数（连续统假设的领域，超出本书）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章 §6<\/td><td>集合的势<\/td><td>ℚ 可数，ℝ 不可数<\/td><\/tr><tr><td>第 2 章 §9<\/td><td>幂级数<\/td><td>收敛半径，圆内可数多个点逐点判定<\/td><\/tr><tr><td>第 9 章 §1<\/td><td>σ-代数<\/td><td>可数并封闭<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：集合、双射\n<\/li><li>\n后续：σ-代数、勒贝格测度\n<\/ul>", "kind": "concept", "title": "可数与不可数"}, "c03": {"html": "<h1>柯西列与完备性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 2 章（§1、§6）、第 3 章（§3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>柯西列是&quot;项与项之间越来越近&quot;的数列；完备性是&quot;每个柯西列都真的收敛到空间里的某个点&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;收敛&quot;从&quot;知道极限是谁&quot;变成&quot;只看数列自己&quot;。在证明存在性（不动点、积分、微分方程解）时，通常拿不到极限的显式表达式，只能拿到柯西估计。完备空间保证这一步不落空。ℝ、ℂ、Banach 空间都靠它工作。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[收敛列] --&gt; B[柯西列]\n  B --&gt; C[有界]\n  C --&gt; D[有收敛子列?]\n  D --&gt;|紧致空间| E[收敛]\n  B --&gt; F[完备空间]\n  F --&gt; E\n  G[ℚ 中 √2 的截断] --&gt; B\n  G --&gt; H[极限不在 ℚ]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>柯西：对每个 ε &gt; 0，存在 N，使 m, n ≥ N 时 ‖xₘ − xₙ‖ &lt; ε。<\/p>\n<ul><li>\n收敛 ⇒ 柯西：两项都在 a 的 ε 邻域内，距离 ≤ 2ε。\n<\/li><li>\n柯西 ⇒ 有界：取 ε = 1，N 之后所有项落在球 B(x_N, 1) 内，前面有限项取最大距离。\n<\/li><li>\n柯西 ⇏ 收敛（一般度量空间）。ℚ 中取 √2 的十进截断 1, 1.4, 1.41, 1.414, …，它是柯西列，极限不在 ℚ。\n<\/ul>\n<p>完备：柯西列必收敛。ℝ 完备，这是序完备性的度量版本。证明用波尔查诺–魏尔斯特拉斯：柯西列有界，故有收敛子列，柯西性质把整个序列拖到同一极限。<\/p>\n<p>完备化的思想：把&quot;所有柯西列&quot;按&quot;差趋于 0&quot;等价分类，得到的商空间就是原空间的完备化。ℚ 的完备化是 ℝ；连续函数空间按 sup 范数完备化得到有界函数空间的一部分。<\/p>\n<p><strong>类比<\/strong>：柯西列是一群人互相越走越近，但没说在哪儿集合；完备性是保证&quot;他们一定有个共同的目的地&quot;。<strong>边界<\/strong>：目的地必须在空间内。ℚ 的人可以越走越近，最终&quot;站在 √2 上&quot;，但 √2 不在 ℚ 的地图上。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为柯西列一定收敛——只在完备空间成立。\n<\/li><li>\n别以为&quot;有界 + 柯西&quot;就够——有界是必要条件，柯西比有界强，但仍需完备性才能落地。\n<\/li><li>\n别以为完备性只跟度量有关——同一个集合换度量可以改变完备性，比如 (0,1) 用通常度量不完备，但它与 ℝ 等距同构的度量下完备。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章 §1<\/td><td>度量空间<\/td><td>收敛定义、柯西定义<\/td><\/tr><tr><td>第 2 章 §6<\/td><td>完备性<\/td><td>柯西列收敛，ℝ 完备<\/td><\/tr><tr><td>第 3 章 §3<\/td><td>紧致<\/td><td>紧致度量空间完备<\/td><\/tr><tr><td>第 7 章 §1<\/td><td>算子空间<\/td><td>L(E,F) 在 F 完备时完备<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：度量空间、上确界\n<\/li><li>\n后续：巴拿赫空间、压缩映射、Lp 完备性\n<\/ul>", "kind": "concept", "title": "柯西列与完备性"}, "c04": {"html": "<h1>紧致性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 3 章（§3）、第 4 章（§2）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>紧致是&quot;每个开覆盖都有有限子覆盖&quot;；在度量空间里等价于&quot;每个序列都有收敛子列&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把逐点的局部性质升级成整体性质：连续函数在紧集上取到极值、一致连续、像紧致。中值定理、极值定理、积分存在性都依赖它。无限维空间里紧集变得稀少（ℓ∞ 的闭单位球不紧），这也是泛函分析要另起炉灶的原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  K[紧致 X] --&gt; A[开覆盖有有限子覆盖]\n  K --&gt; B[序列有收敛子列]\n  A --&gt; C[连续函数有界且取极值]\n  B --&gt; C\n  K --&gt; D[连续函数一致连续]\n  K --&gt; E[连续像紧致]\n  F[闭区间 a b] --&gt; K\n  G[ℝ 开区间] --&gt; H[不紧]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>开覆盖：一族开集，其并包含 X。紧致：从中总能挑出有限个仍然覆盖 X。<\/p>\n<p>− 闭区间 [a, b] 紧致（Heine–Borel）：有界 + 闭。 − ℝ 不紧：开覆盖 {(n − 1, n + 1) : n ∈ ℤ} 没有有限子覆盖。 − (0,1) 不紧：{(1/n, 1) : n ≥ 2} 覆盖它，但有限个盖不住靠近 0 的部分。 − ℓ∞ 的闭单位球不紧：单位向量 eₙ 两两距离为 1，没有收敛子列。<\/p>\n<p>关键推论：连续 f : X → ℝ 在紧 X 上取到最小值。取 xₙ 使 f(xₙ) → inf f，序列紧致给出子列 x_{nₖ} → x，连续性给出 f(x) = inf f。没有紧致性，inf 可能取不到（f(x) = x 在 (0,1)）。<\/p>\n<p><strong>类比<\/strong>：紧致像一个&quot;任何漏洞都能用有限块补丁补上&quot;的容器。开区间在端点处需要无限多补丁，所以不紧。<strong>边界<\/strong>：紧致是拓扑性质，不是&quot;有界闭&quot;的同义词；在一般度量空间里，有界闭不一定紧。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;有界闭 = 紧&quot;——这只在 ℝⁿ 成立（Heine–Borel），无限维空间不成立。\n<\/li><li>\n别以为&quot;紧集的子集紧&quot;——紧集的闭子集紧，开子集不一定。\n<\/li><li>\n别以为紧致只关于覆盖——序列紧致与开覆盖紧致在度量空间等价，在一般拓扑空间不等价。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章 §3<\/td><td>紧致性<\/td><td>连续函数取极值、一致连续<\/td><\/tr><tr><td>第 4 章 §2<\/td><td>中值定理<\/td><td>闭区间上连续函数取极值<\/td><\/tr><tr><td>第 6 章 §3<\/td><td>积分<\/td><td>紧区间上阶梯函数逼近<\/td><\/tr><tr><td>第 10 章 §9<\/td><td>傅里叶变换<\/td><td>紧支集、速降函数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：开集、连续\n<\/li><li>\n后续：一致连续、积分、流形的紧性\n<\/ul>", "kind": "concept", "title": "紧致性"}, "c05": {"html": "<h1>一致收敛<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 5 章（§1–§4）、第 6 章（§7）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>函数列 fₙ 一致收敛到 f，是指误差 sup|fₙ(x) − f(x)| 整体趋于 0，而不是每个点各自趋于 0。<\/p>\n<h2>为什么重要<\/h2>\n<p>它决定&quot;极限能不能穿过运算符号&quot;。连续、积分、求导、求和都是极限过程，只有一致收敛才能让两个极限交换次序。幂级数的逐项求导、傅里叶级数的收敛性、微分方程解的存在性，都靠这条。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  U[一致收敛] --&gt; S[sup 范数趋于 0]\n  S --&gt; C[连续性传递]\n  S --&gt; I[积分传递]\n  S --&gt; D[求导需 f_n&#x27; 一致收敛]\n  S --&gt; M[M-判别法]\n  M --&gt; P[幂级数]\n  P --&gt; A[解析函数]\n  U --&gt; W[魏尔斯特拉斯逼近]\n  X[逐点收敛] --&gt; Y[极限可能不连续]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>逐点：∀x ∀ε ∃N(x, ε)。一致：∀ε ∃N(ε) ∀x。量词顺序不同，强弱就不同。<\/p>\n<p>判别技巧：<\/p>\n<ol><li>\n求 sup 误差：计算 ‖fₙ − f‖∞，若趋于 0 则一致。\n<\/li><li>\nM-判别法：‖fₙ‖∞ ≤ Mₙ，ΣMₙ 收敛 ⇒ Σfₙ 一致收敛。\n<\/li><li>\n分段 + 单调（狄利克雷/阿贝尔判别）处理交错型级数。\n<\/ol>\n<p>三个经典反例：<\/p>\n<ul><li>\nxⁿ 在 [0,1]：逐点收敛到不连续函数，非一致。\n<\/li><li>\nnx/(1 + n²x²)：逐点收敛到 0，但 xₙ = 1/n 处取值 1/2，非一致。\n<\/li><li>\nsin(nx)/n：一致收敛到 0，导数 cos(nx) 不收敛。\n<\/ul>\n<p><strong>类比<\/strong>：一致收敛是&quot;整支部队同时到达指定位置&quot;，逐点收敛是&quot;每个士兵各自到达&quot;。只有整支部队同时到位，才能整体转入下一场战斗。<strong>边界<\/strong>：战场若无限大（定义域无界），&quot;同时&quot;很难实现；实践中常退而求其次，在紧子集上一致（局部一致）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为逐点收敛 + 连续函数列就能保住连续性——xⁿ 是标准反例。\n<\/li><li>\n别以为一致收敛就能逐项求导——还需要导数列一致收敛。\n<\/li><li>\n别以为 M-判别法是必要条件——它只是充分条件，Σ(−1)ⁿxⁿ/n 在 [0,1] 一致收敛但不满足 M-判别。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章 §1<\/td><td>定义<\/td><td>逐点与一致的差别<\/td><\/tr><tr><td>第 5 章 §2<\/td><td>传递性<\/td><td>连续、积分、微分<\/td><\/tr><tr><td>第 5 章 §3<\/td><td>解析函数<\/td><td>幂级数逐项求导<\/td><\/tr><tr><td>第 5 章 §4<\/td><td>逼近<\/td><td>魏尔斯特拉斯定理<\/td><\/tr><tr><td>第 6 章 §7<\/td><td>傅里叶级数<\/td><td>部分和的一致收敛<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：数列收敛、连续、紧致\n<\/li><li>\n后续：解析函数、傅里叶级数、Lp 收敛\n<\/ul>", "kind": "concept", "title": "一致收敛"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数系与序完备性<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：基础<\/a><br>检查点：ch01 自测三题全对<\/li><li class='path-step' id='path-02'><strong>步骤 02：极限与完备性<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：收敛性<\/a><br>检查点：ch02 自测三题<\/li><li class='path-step' id='path-03'><strong>步骤 03：连续与紧致<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：连续函数<\/a><br>检查点：ch03 自测三题<\/li><li class='path-step' id='path-04'><strong>步骤 04：微分与泰勒<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：一元微分学<\/a><br>检查点：ch04 自测三题<\/li><li class='path-step' id='path-05'><strong>步骤 05：函数列与解析<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：函数序列<\/a><br>检查点：ch05 自测三题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='ai-x1' data-type='single'><p class='quiz-q'><b>Q16.<\/b> 设 fₙ(x) = xⁿ 在 [0,1] 上。下列说法正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ai-x1' value='0'> 一致收敛且极限连续<\/label><label class='quiz-opt'><input type='radio' name='ai-x1' value='1'> 逐点收敛但极限不连续，说明逐点收敛不足以保证连续性传递<\/label><label class='quiz-opt'><input type='radio' name='ai-x1' value='2'> 不逐点收敛<\/label><label class='quiz-opt'><input type='radio' name='ai-x1' value='3'> 一致收敛但极限不连续<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ai-x2' data-type='blank'><p class='quiz-q'><b>Q17.<\/b> 计算 sup{1 − 1/n : n ∈ ℕ, n ≥ 1}，填数值。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：基础<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪个集合在 ℚ 中没有上确界？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> {x ∈ ℚ : x &lt; 1}<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> {x ∈ ℚ : x² &lt; 2 且 x &gt; 0}<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> {x ∈ ℚ : 0 ≤ x ≤ 1}<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> {x ∈ ℚ : x² &lt; 4 且 x &gt; 0}<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 皮亚诺公理中，哪一条保证数学归纳法可用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 0 ∈ ℕ<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 后继是单射<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 归纳公理（第 5 条）<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 0 不是任何数的后继<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 关于集合的可数性，下列判断正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> ℚ 不可数<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> ℝ 可数<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> ℤ 与 ℚ 都可数<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 有限集不可数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：收敛性<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数列 xₙ = (−1)ⁿ 的收敛情况是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 收敛到 1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 收敛到 −1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 不收敛<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 收敛到 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 下列空间中，哪一个在通常度量下不完备？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> ℝ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> ℂ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> ℚ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> ℝ²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 关于级数，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 通项趋于 0 则级数收敛<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 在巴拿赫空间中绝对收敛必定收敛<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 条件收敛的级数重排后仍收敛到同一值<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 收敛级数必定绝对收敛<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：连续函数<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> f(x) = 1/x 在 (0, 1) 上的一致连续性如何？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一致连续<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 连续但非一致连续<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 不连续<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 只在 (1/2,1) 上一致连续<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 下列哪个条件能保证连续函数 f : X → ℝ 取到最小值？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> X 是开区间<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> X 紧致<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> f 有界<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> X 连通<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 介值定理成立的必要条件不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 定义域连通<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 函数连续<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 值域是一维有序的<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 函数可微<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：一元微分学<\/h1><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> f(x) = |x| 在 x = 0 处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 可微且导数为 0<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 连续但不可微<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 不连续<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 可微但导数不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 设 f 在 [0, 2] 上可微，f(0) = 0，f(2) = 4，则一定能推出？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 存在 ξ 使 f′(ξ) = 2<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> f′ 处处等于 2<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> f 单调递增<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> f″ 存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 用牛顿法求 f(x) = x² − 2 的正根，初值 x₀ = 1，迭代式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> xₙ₊₁ = (xₙ + 2/xₙ)/2<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> xₙ₊₁ = xₙ − xₙ²<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> xₙ₊₁ = 2/xₙ<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> xₙ₊₁ = xₙ + 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：函数序列<\/h1><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> fₙ(x) = xⁿ 在下列哪个区间上一致收敛到 0？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> [0,1]<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> [0,1)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> [0, 0.9]<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> (−1,1]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 若 fₙ 一致收敛到 f，且每个 fₙ 连续，则？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> f 一定可微<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> f 一定连续<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> fₙ′ 一定一致收敛<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> f 一定有界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 关于解析函数，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 解析与 C∞ 等价<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 解析函数在收敛圆内可逐项求导<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 解析函数的泰勒级数处处收敛到自身<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 解析函数一定是有理函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='陈述'>陈述 — 能判断真假的句子，有且只有一个真值。 <span class=glossary-ref>（第 1 章：基础）<\/span><\/li><li data-term='上界'>上界 — 对集合 A 中每个元素 a 都满足 a ≤ s 的元素 s。 <span class=glossary-ref>（第 1 章：基础）<\/span><\/li><li data-term='上确界'>上确界 — 最小的上界，记 sup A；不必属于 A。 <span class=glossary-ref>（第 1 章：基础）<\/span><\/li><li data-term='序完备'>序完备 — 每个非空上有界子集都有上确界。 <span class=glossary-ref>（第 1 章：基础）<\/span><\/li><li data-term='可数'>可数 — 存在到 ℕ 的双射（有限集也算）。 <span class=glossary-ref>（第 1 章：基础）<\/span><\/li><li data-term='群'>群 — 集合配运算，满足结合律、有单位元、每元有逆元。 <span class=glossary-ref>（第 1 章：基础）<\/span><\/li><li data-term='域'>域 — 交换环，每个非零元有乘法逆元。 <span class=glossary-ref>（第 1 章：基础）<\/span><\/li><li data-term='同态'>同态 — 保持运算结构的映射。 <span class=glossary-ref>（第 1 章：基础）<\/span><\/li><li data-term='度量'>度量 — 满足正定性、对称性、三角不等式的距离函数。 <span class=glossary-ref>（第 2 章：收敛性）<\/span><\/li><li data-term='赋范空间'>赋范空间 — 向量空间配范数，由 d(x,y)=‖x−y‖ 得到度量。 <span class=glossary-ref>（第 2 章：收敛性）<\/span><\/li><li data-term='柯西列'>柯西列 — 任意 ε &gt; 0，足够靠后的任意两项距离小于 ε。 <span class=glossary-ref>（第 2 章：收敛性）<\/span><\/li><li data-term='完备'>完备 — 每个柯西列都收敛到空间内的点。 <span class=glossary-ref>（第 2 章：收敛性）<\/span><\/li><li data-term='绝对收敛'>绝对收敛 — 各项范数构成的级数收敛。 <span class=glossary-ref>（第 2 章：收敛性）<\/span><\/li><li data-term='条件收敛'>条件收敛 — 级数收敛但绝对值级数发散。 <span class=glossary-ref>（第 2 章：收敛性）<\/span><\/li><li data-term='收敛半径'>收敛半径 — 幂级数绝对收敛的圆盘半径，1/R = limsup|aₙ|^(1/n)。 <span class=glossary-ref>（第 2 章：收敛性）<\/span><\/li><li data-term='连续'>连续 — 每点处：对任意 ε 存在 δ，输入距离小于 δ 时输出误差小于 ε。 <span class=glossary-ref>（第 3 章：连续函数）<\/span><\/li><li data-term='开集'>开集 — 任一点都含有一个完全属于它的开球的集合。 <span class=glossary-ref>（第 3 章：连续函数）<\/span><\/li><li data-term='紧致'>紧致 — 每个开覆盖都有有限子覆盖（度量空间等价于序列紧致）。 <span class=glossary-ref>（第 3 章：连续函数）<\/span><\/li><li data-term='连通'>连通 — 不能表示为两个不交非空开集之并。 <span class=glossary-ref>（第 3 章：连续函数）<\/span><\/li><li data-term='一致连续'>一致连续 — 对任意 ε 存在统一的 δ，对所有点同时有效。 <span class=glossary-ref>（第 3 章：连续函数）<\/span><\/li><li data-term='导数'>导数 — 差商 (f(x)−f(a))/(x−a) 当 x→a 的极限。 <span class=glossary-ref>（第 4 章：一元微分学）<\/span><\/li><li data-term='可微'>可微 — 在一点可用仿射函数逼近，误差比一阶更快趋零。 <span class=glossary-ref>（第 4 章：一元微分学）<\/span><\/li><li data-term='中值定理'>中值定理 — 存在内点 ξ 使 f(b)−f(a)=f′(ξ)(b−a)。 <span class=glossary-ref>（第 4 章：一元微分学）<\/span><\/li><li data-term='泰勒公式'>泰勒公式 — 用各阶导数在展开点构造多项式逼近，余项可写成皮亚诺或拉格朗日形式。 <span class=glossary-ref>（第 4 章：一元微分学）<\/span><\/li><li data-term='压缩映射'>压缩映射 — 满足 d(Tx,Ty) ≤ Ld(x,y)（L&lt;1）的映射，有唯一不动点。 <span class=glossary-ref>（第 4 章：一元微分学）<\/span><\/li><li data-term='逐点收敛'>逐点收敛 — 每个固定 x 处函数值收敛，N 可依赖 x。 <span class=glossary-ref>（第 5 章：函数序列）<\/span><\/li><li data-term='一致收敛'>一致收敛 — sup 误差趋于 0，N 只依赖 ε。 <span class=glossary-ref>（第 5 章：函数序列）<\/span><\/li><li data-term='解析函数'>解析函数 — 局部可展开成收敛幂级数的函数。 <span class=glossary-ref>（第 5 章：函数序列）<\/span><\/li><li data-term='m-判别法'>M-判别法 — 用收敛的正项级数统一控制各项 sup 范数，从而得到一致收敛。 <span class=glossary-ref>（第 5 章：函数序列）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库：《分析 I》<\/h1>\n<h2>框架：三段估计<\/h2>\n<p>证明极限传递性质时，标准的拆法是<\/p>\n<p>‖A − B‖ ≤ ‖A − C‖ + ‖C − D‖ + ‖D − B‖。<\/p>\n<p>中间项用被逼近对象的性质（连续性、可微性），两端用一致收敛或小参数控制。本章的连续性传递、积分传递都走这个结构。用的时候先问：中间项靠什么控制？两端靠什么统一？<\/p>\n<h2>框架：先造对象，再证性质<\/h2>\n<p>指数函数不是&quot;已知存在&quot;，而是用级数定义出来，再用绝对收敛证明加法定理，最后推出可微与 exp′ = exp。遇到&quot;这个东西到底存不存在&quot;的问题，先找一个可构造的候选（级数、上确界、极限），再逐条验证定义。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要证&quot;存在某个点使 f′ = 0&quot;：先看能不能用紧致性取极值，再用内部极值导数为零。\n<\/li><li>\n要证&quot;数列收敛&quot;：优先试单调 + 有界；不行再找柯西估计；再不行才猜极限。\n<\/li><li>\n要证&quot;函数列极限连续&quot;：先确认一致收敛；只有逐点收敛时，改用等度连续或分段讨论。\n<\/li><li>\n要证&quot;集合不可数&quot;：用对角线构造反例，不要试图逐个列举。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用具体 ε 代替任意 ε<\/strong>。证明里代 0.001 只说明&quot;误差小于 0.001 时成立&quot;，不说明任意 ε。\n<\/li><li>\n<strong>把&quot;任意接近&quot;当成&quot;等于&quot;<\/strong>。上确界可以不属于集合，极限可以不被取到。\n<\/li><li>\n<strong>逐点收敛直接推极限连续<\/strong>。必须先升级到一致收敛，否则 xⁿ 就是反例。\n<\/li><li>\n<strong>把导数当差商的近似值<\/strong>。导数是极限，不是&quot;很小的 h 的差商&quot;，误差项必须显式控制。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表：《分析 I》<\/h1>\n<h2>定义与公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>上确界<\/td><td>sup A 是最小上界；序完备：非空上有界必有 sup<\/td><\/tr><tr><td>收敛<\/td><td>∀ε&gt;0 ∃N ∀n≥N：‖xₙ − a‖ &lt; ε<\/td><\/tr><tr><td>柯西<\/td><td>∀ε&gt;0 ∃N ∀m,n≥N：‖xₘ − xₙ‖ &lt; ε<\/td><\/tr><tr><td>完备<\/td><td>柯西列必收敛；ℝ、ℂ、Banach 空间完备<\/td><\/tr><tr><td>级数收敛<\/td><td>部分和 sₙ = Σxₖ 收敛；正项级数收敛 ⇔ 部分和有界<\/td><\/tr><tr><td>幂级数半径<\/td><td>1/R = limsup<\/td><td>aₙ<\/td><td>^(1/n)<\/td><\/tr><tr><td>连续<\/td><td>∀ε&gt;0 ∃δ&gt;0：d(x,x₀)&lt;δ ⇒ d(f(x),f(x₀))&lt;ε<\/td><\/tr><tr><td>一致连续<\/td><td>∀ε&gt;0 ∃δ&gt;0 ∀x,y：d(x,y)&lt;δ ⇒ d(f(x),f(y))&lt;ε<\/td><\/tr><tr><td>紧致<\/td><td>开覆盖有有限子覆盖 ⇔ 序列有收敛子列（度量空间）<\/td><\/tr><tr><td>导数<\/td><td>f′(a) = lim (f(x)−f(a))/(x−a)<\/td><\/tr><tr><td>拉格朗日中值<\/td><td>f(b)−f(a) = f′(ξ)(b−a)，ξ ∈ (a,b)<\/td><\/tr><tr><td>泰勒（拉格朗日余项）<\/td><td>Rₙ = f⁽ⁿ⁺¹⁾(ξ)(x−a)ⁿ⁺¹/(n+1)!<\/td><\/tr><tr><td>牛顿迭代<\/td><td>xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ)，单根处二次收敛<\/td><\/tr><tr><td>一致收敛<\/td><td>sup_x ‖fₙ(x)−f(x)‖ → 0<\/td><\/tr><tr><td>M-判别法<\/td><td>‖fₙ‖∞ ≤ Mₙ 且 ΣMₙ &lt; ∞ ⇒ Σfₙ 一致收敛<\/td><\/tr><\/tbody><\/table>\n<h2>常用推理链<\/h2>\n<ol><li>\n上有界 → 上确界 → 单调列收敛 → 极限存在。\n<\/li><li>\n闭区间 → 紧致 → 连续函数取极值 → 罗尔 → 中值定理。\n<\/li><li>\n一致收敛 → sup 误差 → 连续/积分传递；导数另需导数列一致收敛。\n<\/li><li>\n幂级数 → 紧子集一致收敛 → 逐项求导 → 解析。\n<\/ol>\n<h2>反例清单<\/h2>\n<table><thead><tr><th>命题<\/th><th>反例<\/th><\/tr><\/thead><tbody><tr><td>有界必收敛<\/td><td>(−1)ⁿ<\/td><\/tr><tr><td>通项趋 0 则级数收敛<\/td><td>Σ1/n<\/td><\/tr><tr><td>连续必可微<\/td><td>abs(x) 在 0<\/td><\/tr><tr><td>逐点收敛保连续<\/td><td>xⁿ 在 [0,1]<\/td><\/tr><tr><td>一致收敛可求导<\/td><td>sin(nx)/n<\/td><\/tr><tr><td>C∞ 必解析<\/td><td>e^(−1/x²)<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452582422523394/点化学习系统/01-分析I", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：基础", "href": "#/chapter/ch01"}, {"label": "第 2 章：收敛性", "href": "#/chapter/ch02"}, {"label": "第 3 章：连续函数", "href": "#/chapter/ch03"}, {"label": "第 4 章：一元微分学", "href": "#/chapter/ch04"}, {"label": "第 5 章：函数序列", "href": "#/chapter/ch05"}]}, {"label": "概念", "children": [{"label": "上确界与序完备性", "href": "#/concept/c01"}, {"label": "可数与不可数", "href": "#/concept/c02"}, {"label": "柯西列与完备性", "href": "#/concept/c03"}, {"label": "紧致性", "href": "#/concept/c04"}, {"label": "一致收敛", "href": "#/concept/c05"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：基础", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：收敛性", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：连续函数", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：一元微分学", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：函数序列", "href": "#/quiz/ch05"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：8 小时 ｜ <strong>前置<\/strong>：无（只要求会用不等式、会做代数变形）\n<\/ul>\n<blockquote>原书开篇把整章的任务说得很直接：从自然数的皮亚诺公理出发，依次构造整数、有理数、实数，最后是复数；每一步都在解一类&quot;自然出现&quot;的方程。作者还特意声明，这一章可以跳过某些长证明，但&quot;基础&quot;必须认真过一遍。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出皮亚诺五条公理，并解释为什么数学归纳法不是&quot;经验规律&quot;而是公理的第 5 条。\n<\/li><li>\n用&quot;非空上有界子集必有上确界&quot;这条性质说明 ℚ 缺了什么、ℝ 补上了什么。\n<\/li><li>\n判断一个集合是可数还是不可数，并给出双射或对角线论证。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>实数之所以是实数，不是因为它&quot;含有无理数&quot;，而是因为它<strong>序完备<\/strong>：任何非空上有界子集都有上确界。分析学后面所有极限、连续、紧致、积分的存在性，最终都靠这条性质兜底。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么先学逻辑和集合<\/h3>\n<p>分析学的每个定理都要写成&quot;若 A 则 B&quot;的形式。要做到不靠直觉，先得把话说清楚。<\/p>\n<ul><li>\n<strong>陈述<\/strong>：能判断真假的句子。&quot;正在下雨&quot;是陈述；&quot;这句话是假的&quot;不是，因为它无论真假都自相矛盾。\n<\/li><li>\n<strong>量词<\/strong>：∀（对所有）、∃（存在）。这两个符号的否定最容易写错：¬(∀x: E(x)) 等于 ∃x: ¬E(x)，而不是 ∀x: ¬E(x)。&quot;本书每位读者都戴眼镜&quot;的否定是&quot;至少有一位不戴&quot;，不是&quot;没有一位戴&quot;。\n<\/li><li>\n<strong>集合<\/strong>：{x ∈ X ; E(x)} 表示 X 中满足性质 E 的那些元素。这里没有&quot;所有集合的集合&quot;这种危险对象，本书只在已知集合上做子集运算。\n<\/li><li>\n<strong>函数<\/strong>：f : X → Y 是一个规则，给 X 中每个元素指定 Y 中唯一元素。它不等于&quot;公式&quot;，也不要求&quot;能算出来&quot;。\n<\/ul>\n<p><strong>类比<\/strong>：逻辑记号像合同条款。合同里&quot;乙方应在 30 日内……&quot;和&quot;乙方不得晚于 30 日……&quot;是一回事，但&quot;并非所有条款都适用&quot;和&quot;所有条款都不适用&quot;差得很远。写数学证明就是把合同条款逐条对齐。 <strong>类比的边界<\/strong>：合同有歧义可以打官司，数学陈述只有真/假两值，中间没有&quot;部分成立&quot;。<\/p>\n<h3>概念 2：自然数不是&quot;数出来的&quot;，是公理规定的<\/h3>\n<p>皮亚诺的做法是：不定义&quot;自然数是什么&quot;，只规定它满足什么。<\/p>\n<ol><li>\n0 ∈ ℕ。\n<\/li><li>\n每个 n ∈ ℕ 有唯一的后继 ν(n) ∈ ℕ。\n<\/li><li>\nν(n) ≠ 0（0 不是任何数的后继）。\n<\/li><li>\nν 是单射：ν(m) = ν(n) 推出 m = n。\n<\/li><li>\n<strong>归纳公理<\/strong>：若 S ⊆ ℕ 满足 0 ∈ S 且 n ∈ S ⇒ ν(n) ∈ S，则 S = ℕ。\n<\/ol>\n<p>第 5 条是关键。它把&quot;从 0 开始，一个接一个，能到达每个自然数&quot;这件事变成了公理。没有它，你可以构造出&quot;0,1,2,… 再加上一个无穷远点&quot;的怪模型，归纳法就失效。<\/p>\n<p>有了这五条，加法、乘法、序关系都要<strong>定义<\/strong>出来，再<strong>证明<\/strong>交换律、结合律、分配律。书中用递归定义 m + 0 := m、m + ν(n) := ν(m + n)，然后对 n 作归纳证明 m + n = n + m。这不是&quot;显然&quot;，是一步步证出来的。<\/p>\n<p><strong>类比<\/strong>：国际象棋的规则不描述棋子的物理形状，只规定它怎么走。自然数公理就是&quot;数的走法&quot;。 <strong>边界<\/strong>：棋规可以任意改，自然数公理不行——改了就不再是算术，归纳法、递归定义都会崩。<\/p>\n<h3>概念 3：数系扩张的每一步，都在补一类解不出来的方程<\/h3>\n<table><thead><tr><th>从<\/th><th>到<\/th><th>要解出的方程<\/th><th>手法<\/th><\/tr><\/thead><tbody><tr><td>ℕ<\/td><td>ℤ<\/td><td>x + a = b<\/td><td>用有序对 (m, n) 表示 m − n，按&quot;差相同&quot;划等价类<\/td><\/tr><tr><td>ℤ<\/td><td>ℚ<\/td><td>a x = b（a ≠ 0）<\/td><td>用有序对 (p, q) 表示 p/q，按&quot;交叉相乘相等&quot;划等价类<\/td><\/tr><tr><td>ℚ<\/td><td>ℝ<\/td><td>x² = 2<\/td><td>补上序完备性（戴德金分割的第三条性质）<\/td><\/tr><tr><td>ℝ<\/td><td>ℂ<\/td><td>x² + 1 = 0<\/td><td>用有序对 (a, b) 表示 a + i b，规定 i² = −1<\/td><\/tr><\/tbody><\/table>\n<p>注意手法是统一的：<strong>先造一个更大的集合，再按某个等价关系把元素粘起来<\/strong>。整数不是&quot;负号和自然数拼起来&quot;这么随意，它是一个商结构：两个有序对 (m, n) 与 (m′, n′) 被视为同一个整数，当且仅当 m + n′ = m′ + n。<\/p>\n<p><strong>类比<\/strong>：分数 1/2 和 2/4 是同一个数，不是两个数。有理数的构造就是把&quot;写法不同但值相同&quot;的表达式装进同一个袋子。 <strong>边界<\/strong>：这套商构造在 ℚ→ℝ 时失灵——两个有理数列可能&quot;应该收敛到同一个实数&quot;，但极限本身还没造出来。所以 ℝ 的构造要么用分割（只谈集合的上界），要么用柯西列的完备化（先有度量再取商），不能照抄分数那套。<\/p>\n<h3>概念 4：序完备性——ℝ 与 ℚ 的真正分界<\/h3>\n<p><strong>上界<\/strong>：若对每个 a ∈ A 都有 a ≤ s，则 s 是 A 的上界。<strong>上确界<\/strong> sup A 是&quot;最小的上界&quot;。<\/p>\n<p>序完备性：每个非空、上有界的子集都有上确界。<\/p>\n<p>ℚ 不满足。取 A := {x ∈ ℚ ; x &gt; 0 且 x² &lt; 2}。A 非空（1 ∈ A），上有界（

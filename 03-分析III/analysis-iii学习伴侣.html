"term": "斯托克斯定理", "def": "∫_∂M ω = ∫_M dω，统一所有积分公式。", "chapterId": "ch12"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch09", "type": "single", "question": "σ-代数不需要满足下列哪条？", "options": ["包含全集", "对补集封闭", "对可数并封闭", "对任意并封闭"], "answer": 3, "explain": "σ-代数只要求可数并封闭；任意并超出可数可加性的框架，也不需要。"}, {"id": "q02", "chapterId": "ch09", "type": "single", "question": "卡拉泰奥多里条件的作用是？", "options": ["定义外测度", "筛选出可测集", "证明选择公理", "计算体积"], "answer": 1, "explain": "条件 μ*(T) = μ*(T∩A) + μ*(T∩Aᶜ) 对所有 T 成立时称 A 可测，这是从外测度得到测度的筛子。"}, {"id": "q03", "chapterId": "ch09", "type": "single", "question": "康托集的性质是？", "options": ["可数且测度为 0", "不可数且测度为 0", "不可数且测度为正", "可数且测度为正"], "answer": 1, "explain": "康托集与 [0,1] 等势（不可数），但总长度（测度）为 0。元素多少与测度大小是两回事。"}, {"id": "q04", "chapterId": "ch10", "type": "single", "question": "勒贝格积分相对黎曼积分的核心优势是？", "options": ["能算更多初等函数", "不需要测度", "在更弱条件下交换极限与积分", "只适用于连续函数"], "answer": 2, "explain": "控制收敛定理只需逐点收敛 + 可积控制函数，黎曼积分通常要一致收敛。计算能力不是主要差别。"}, {"id": "q05", "chapterId": "ch10", "type": "single", "question": "控制收敛定理中“存在可积的 g 使 |fₙ| ≤ g”能否去掉？", "options": ["能，只要 fₙ 逐点收敛", "不能，nχ_{(0,1/n)} 是反例", "能，只要 fₙ 非负", "能，只要测度有限"], "answer": 1, "explain": "该例逐点收敛到 0，但积分恒为 1；没有可积控制函数，结论失效。"}, {"id": "q06", "chapterId": "ch10", "type": "single", "question": "换元公式中出现的因子是？", "options": ["det Dφ 的绝对值", "det Dφ 的平方", "‖Dφ‖", "φ 的导数之和"], "answer": 0, "explain": "雅可比行列式的绝对值是局部体积放大率；一维时就是 |φ′|。"}, {"id": "q07", "chapterId": "ch11", "type": "single", "question": "关于外微分，正确的说法是？", "options": ["d(dω) = ω", "d(dω) = 0", "d 只在 0-形式上定义", "d 与拉回不可交换"], "answer": 1, "explain": "d² = 0 是外微分的代数性质；恰当形式必闭，但闭不一定恰当。"}, {"id": "q08", "chapterId": "ch11", "type": "single", "question": "极坐标下 dx ∧ dy 等于？", "options": ["dr ∧ dθ", "r dr ∧ dθ", "r² dr ∧ dθ", "dr ∧ dθ / r"], "answer": 1, "explain": "直接计算得 dx ∧ dy = r dr ∧ dθ，因子 r 就是极坐标换元的雅可比行列式。"}, {"id": "q09", "chapterId": "ch11", "type": "single", "question": "黎曼度量给出的体积元是？", "options": ["det(g) dx", "√|det(g)| dx¹∧…∧dxᵐ", "trace(g) dx", "‖g‖ dx"], "answer": 1, "explain": "体积元是 √|det g| 乘以坐标楔积；正定度量可以去掉绝对值。"}, {"id": "q10", "chapterId": "ch12", "type": "single", "question": "流形上体积元的表达式是？", "options": ["dx¹∧…∧dxᵐ", "√|det G| dx¹∧…∧dxᵐ", "det(G) dx", "√(trace G) dx"], "answer": 1, "explain": "体积元 = √|det G| 乘坐标楔积；欧氏度量为 1，球坐标为 R² sin θ。"}, {"id": "q11", "chapterId": "ch12", "type": "single", "question": "斯托克斯定理 ∫_∂M ω = ∫_M dω 中，ω 必须是？", "options": ["任意函数", "0-形式", "m-形式", "(m−1)-形式"], "answer": 3, "explain": "d 把 (m−1)-形式变成 m-形式，才能在 m 维 M 上积分；边界是 (m−1) 维。"}, {"id": "q12", "chapterId": "ch12", "type": "single", "question": "球面 S² 的面积是？", "options": ["2πR²", "4πR²", "4πR³/3", "πR²"], "answer": 1, "explain": "∫₀^{2π}∫₀^{π} R² sin θ dθ dφ = 4πR²。4πR³/3 是球的体积。"}, {"id": "aiii-x1", "chapterId": "__all__", "type": "single", "question": "把测度、积分、流形积分串起来，正确的逻辑顺序是？", "options": ["先定义积分再定义测度", "σ-代数 → 测度 → 可测函数 → 积分 → 流形上的体积元", "流形积分是独立理论，与测度无关", "黎曼积分可以直接推广到流形"], "answer": 1, "explain": "先有可测结构才有测度，才有可测函数与积分；流形上的体积测度是用坐标卡把局部勒贝格测度抬上去的。"}, {"id": "aiii-x2", "chapterId": "__all__", "type": "single", "question": "关于斯托克斯定理与拓扑，正确的说法是？", "options": ["闭形式在任何流形上的积分都为 0", "闭形式的积分可以非零，反映流形的洞", "恰当形式不能积分", "斯托克斯定理只对 1-形式成立"], "answer": 1, "explain": "闭形式在带洞流形上的积分可以非零（如 ∮dz/z = 2πi），这正是德拉姆上同调捕捉的拓扑信息。"}], "flashcards": [{"id": "f01", "chapterId": "ch09", "front": "σ-代数的三条公理？", "back": "含全集；对补集封闭；对可数并封闭。", "tags": ["测度", "σ-代数"]}, {"id": "f02", "chapterId": "ch09", "front": "外测度与测度的差别？", "back": "外测度对所有子集有定义但只次可加；限制在可测集上才成为测度。", "tags": ["测度"]}, {"id": "f03", "chapterId": "ch09", "front": "卡拉泰奥多里条件？", "back": "对所有 T，μ*(T)=μ*(T∩A)+μ*(T∩Aᶜ) 时称 A 可测。", "tags": ["测度", "可测"]}, {"id": "f04", "chapterId": "ch09", "front": "康托集的测度与势？", "back": "测度 0，但不可数。", "tags": ["反例"]}, {"id": "f05", "chapterId": "ch09", "front": "为什么不能给所有子集赋平移不变测度？", "back": "与选择公理冲突：维塔利构造出不可测集。", "tags": ["测度", "选择公理"]}, {"id": "f06", "chapterId": "ch10", "front": "简单函数与可测函数的关系？", "back": "可测函数是简单函数列的几乎处处极限。", "tags": ["积分"]}, {"id": "f07", "chapterId": "ch10", "front": "积分定义的三步？", "back": "简单函数积分 → 非负函数取单调极限 → 一般函数拆正负部。", "tags": ["积分"]}, {"id": "f08", "chapterId": "ch10", "front": "L1 完备化是什么意思？", "back": "先定义简单函数上的积分，再按 L1 范数取完备化，得到博赫纳–勒贝格积分。", "tags": ["积分", "完备"]}, {"id": "f09", "chapterId": "ch10", "front": "控制收敛的条件？", "back": "fₙ→f a.e.，且存在可积 g 使 |fₙ|≤g a.e.。", "tags": ["收敛定理"]}, {"id": "f10", "chapterId": "ch10", "front": "Lp 的元素是什么？", "back": "几乎处处相等的函数等价类，不是单个函数。", "tags": ["Lp"]}, {"id": "f11", "chapterId": "ch11", "front": "k-形式的定义？", "back": "交替 k-线性映射，交换两个自变量变号。", "tags": ["形式"]}, {"id": "f12", "chapterId": "ch11", "front": "楔积的性质？", "back": "α∧β=−β∧α，α∧α=0；dx∧dy 在向量组上取值等于行列式。", "tags": ["形式"]}, {"id": "f13", "chapterId": "ch11", "front": "d²=0 的含义？", "back": "外微分的两次作用为零；恰当形式必闭。", "tags": ["形式"]}, {"id": "f14", "chapterId": "ch11", "front": "浸入与嵌入的差别？", "back": "浸入要求切映射单射；嵌入还要求到像的同胚（不自交）。", "tags": ["流形"]}, {"id": "f15", "chapterId": "ch11", "front": "体积元与度量的关系？", "back": "dV=√|det g| dx¹∧…∧dxᵐ，det g 是格拉姆行列式。", "tags": ["度量"]}, {"id": "f16", "chapterId": "ch12", "front": "流形上如何定义可测集？", "back": "逐坐标卡：φ(A∩U) 是 ℝᵐ 的勒贝格可测集；与坐标卡无关。", "tags": ["流形", "测度"]}, {"id": "f17", "chapterId": "ch12", "front": "斯托克斯定理的内容？", "back": "∫_∂M ω = ∫_M dω，ω 是 (m−1)-形式，M 可定向有边。", "tags": ["斯托克斯"]}, {"id": "f18", "chapterId": "ch12", "front": "斯托克斯的四个特例？", "back": "微积分基本定理、格林公式、高斯散度定理、经典斯托克斯公式。", "tags": ["斯托克斯"]}, {"id": "f19", "chapterId": "ch12", "front": "球面面积怎么算？", "back": "∫₀^{2π}∫₀^{π} R² sin θ dθ dφ = 4πR²。", "tags": ["计算"]}, {"id": "f20", "chapterId": "ch12", "front": "闭形式积分非零说明什么？", "back": "流形有洞；积分值反映同调/拓扑信息。", "tags": ["拓扑"]}], "companion": "analysis-iii学习伴侣.html"}, "pages": {"ch09": {"html": "<h1>第 9 章：测度论基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：12 小时 ｜ <strong>前置<\/strong>：第 2 章（完备性）、第 3 章（拓扑）、第 6 章（Riemann 积分）\n<\/ul>\n<blockquote>原书开宗明义：这一章讨论直线、面积、体积以及更高维空间中集合的测度的一般理论，而该理论以初等几何事实为指导——区间有长度，矩形有长乘宽，长方体有长宽高。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 σ-代数的三条公理，并说明为什么测度的定义域必须是 σ-代数。\n<\/li><li>\n用外测度 + 卡拉泰奥多里条件定义可测集，解释这条条件在防什么。\n<\/li><li>\n说明勒贝格测度为什么不能给 ℝⁿ 的每个子集赋值（不可测集的存在）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>测度是&quot;给集合赋大小&quot;的函数，但它的定义域不能是全部子集，必须是一个对可数并、补集封闭的族（σ-代数）；勒贝格测度的构造路线是&quot;先定义外测度，再用卡拉泰奥多里条件筛出可测集&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要 σ-代数<\/h3>\n<p>要给 ℝ 的子集赋&quot;长度&quot;，最自然的要求是：<\/p>\n<ul><li>\n区间的长度是 b − a；\n<\/li><li>\n不交并的长度可加（可数多个也允许）；\n<\/li><li>\n平移不改变长度。\n<\/ul>\n<p>如果对所有子集都能赋值，就会和&quot;选择公理 + 可数可加&quot;冲突——维塔利构造出的集合，无论赋什么值都会矛盾。所以必须限制定义域。<\/p>\n<p>σ-代数 A ⊆ P(X) 满足：<\/p>\n<ol><li>\nX ∈ A；\n<\/li><li>\nA ∈ A ⇒ Aᶜ ∈ A；\n<\/li><li>\n可数并 ∪Aⱼ ∈ A。\n<\/ol>\n<p>由德摩根律，可数交也封闭。测度 μ : A → [0, ∞] 再满足 μ(∅) = 0 与可数可加性：不交的 Aⱼ 满足 μ(∪Aⱼ) = Σμ(Aⱼ)。<\/p>\n<p><strong>类比<\/strong>：σ-代数是一张&quot;允许测量的清单&quot;。不在清单上的集合，不是&quot;大小为 0&quot;，而是&quot;没有定义&quot;。<strong>边界<\/strong>：清单必须对补集和可数并封闭，否则&quot;两个可测集相减&quot;会跑出清单。<\/p>\n<h3>概念 2：博雷尔 σ-代数<\/h3>\n<p>给定拓扑空间 X，包含所有开集的最小 σ-代数叫博雷尔 σ-代数 B(X)。它包含开集、闭集、可数交并、以及所有通过极限操作得到的集合。<\/p>\n<p>为什么需要它？因为连续函数、极限、开集这些概念都是拓扑的，而&quot;可测&quot;要与它们兼容。勒贝格可测集比博雷尔多：它是博雷尔 σ-代数加上所有零测集的子集（完备化）。<\/p>\n<h3>概念 3：外测度<\/h3>\n<p>外测度 μ* : P(X) → [0, ∞] 对<strong>所有<\/strong>子集都有定义，满足单调性与可数次可加性：<\/p>\n<p>μ<em>(∪Aⱼ) ≤ Σμ<\/em>(Aⱼ)。<\/p>\n<p>ℝⁿ 上的勒贝格外测度定义为<\/p>\n<p>λ*(A) := inf{Σ vol(Qⱼ) : A ⊆ ∪Qⱼ}，<\/p>\n<p>其中 Qⱼ 是开长方体。也就是&quot;用可数多个长方体盖住 A，取总体积的下确界&quot;。<\/p>\n<p>外测度对每个集合都有值，但一般不满足可加性：两个不交集合的外测度之和可能小于并的外测度（因为覆盖可以&quot;跨接&quot;）。<\/p>\n<p><strong>类比<\/strong>：外测度像&quot;用最小的包装纸把东西包起来&quot;，包装纸可以重叠、可以包到空气。它对任何东西都能量，但两个东西分开包和一起包，包装纸用量可能不同。<\/p>\n<h3>概念 4：卡拉泰奥多里可测条件<\/h3>\n<p>A 可测，如果对<strong>每个<\/strong>测试集 T，<\/p>\n<p>μ<em>(T) = μ<\/em>(T ∩ A) + μ*(T ∩ Aᶜ)。<\/p>\n<p>这条条件的直觉是：A 必须像一把&quot;干净刀&quot;，无论怎么切 T，两块的测度之和都等于原来的测度。它排除了那些&quot;边界模糊、切开后总量会变&quot;的集合。<\/p>\n<p>由外测度构造的 μ* 限制在可测集上就是一个测度，记作 μ。这是卡拉泰奥多里给出的构造定理，也是本书第 3、4 节的主线。<\/p>\n<p><strong>类比<\/strong>：A 可测就像一把好刀切蛋糕：不管蛋糕多大、形状多怪，切下去两块的重量之和等于原来那块。刀不利（不可测集），切的过程中会掉渣。<\/p>\n<h3>概念 5：勒贝格测度<\/h3>\n<p>在 ℝⁿ 上，用长方体覆盖定义外测度，再取可测集，得到勒贝格测度 λₙ。它的性质：<\/p>\n<ul><li>\n平移、旋转不变；\n<\/li><li>\n开集的测度可以算，闭集也可以；\n<\/li><li>\n单点、可数集测度为 0；\n<\/li><li>\n康托集测度为 0，但不可数；\n<\/li><li>\n存在不可测集（维塔利，用选择公理把 [0,1] 分成可数多份等测度的类）。\n<\/ul>\n<p><strong>康托集的警示<\/strong>：它和区间等势（不可数），测度却是 0。&quot;大小&quot;和&quot;元素多少&quot;是两套独立的度量。<\/p>\n<p><strong>类比<\/strong>：勒贝格测度像&quot;称重量&quot;。一根细粉笔和一块海绵可以一样重，体积、元素个数都不能决定重量。<\/p>\n<h3>概念 6：豪斯多夫测度与维数（延伸）<\/h3>\n<p>用直径 ≤ δ 的可数覆盖定义 h^s_δ(A)，取 δ → 0 得 s 维豪斯多夫测度。使测度从 ∞ 跳到 0 的临界 s 叫豪斯多夫维数。康托集的维数是 log2/log3 ≈ 0.63，介于点和线之间。这部分在书中作为测度构造的例子出现，提示&quot;维数&quot;本身可以被测度定义。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[集合族 P X] --&gt; B[σ-代数]\n  B --&gt; C[测度空间 X A mu]\n  D[长方体覆盖] --&gt; E[外测度 对所有子集]\n  E --&gt; F[卡拉泰奥多里条件]\n  F --&gt; G[可测集]\n  G --&gt; H[勒贝格测度]\n  H --&gt; I[平移不变 可数可加]\n  H --&gt; J[存在不可测集]\n  B --&gt; K[博雷尔 σ-代数]\n  K --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：上面一条是&quot;公理化路线&quot;（先定 σ-代数与测度），下面一条是&quot;构造路线&quot;（先外测度再筛可测集）。两条在勒贝格测度处汇合，这是本书的叙事结构，也是做测度题的标准路径：先用覆盖算外测度，再验卡拉泰奥多里条件。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：测度像给房间估面积。可以精确量的房间（可测集）满足&quot;怎么切都守恒&quot;；有些房间（不可测集）无论怎么估都会和切割结果矛盾，只能承认&quot;没有面积&quot;。 <strong>失效边界<\/strong>：测度不是万能的——&quot;每个集合都有面积&quot;这个直觉是错的；选择公理下不可测集必然存在。<\/p>\n<p><strong>实例（可验证）<\/strong>：证明单点集测度为 0。 对任意 ε &gt; 0，用长度 ε 的区间盖住 {x}，外测度 ≤ ε。因 ε 任意，外测度 = 0。又 ∅ 可测，单点 = 区间 ∩ 补集之类可测，故测度为 0。 这个论证展示了&quot;外测度 → 下确界 → 任意 ε&quot;的标准套路。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;所有集合都可测&quot;<\/strong> — 实际上维塔利定理给出不可测集，前提是接受选择公理。测度论的公理化就是为了绕开这个矛盾。\n<\/li><li>\n<strong>别以为&quot;测度为 0 就是空集或有限集&quot;<\/strong> — 实际上康托集不可数、测度为 0。\n<\/li><li>\n<strong>别以为外测度就是测度<\/strong> — 实际上外测度只次可加，不满足可加；只有限制在可测集上才成为测度。\n<\/li><li>\n<strong>别以为&quot;可测&quot;是集合自身的性质<\/strong> — 实际上它相对于给定的外测度（也就是给定的测度空间）而言。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nσ-代数不需要满足下列哪条？　A. 包含全集　B. 对补集封闭　C. 对可数并封闭　D. 对任意并封闭\n<p><strong>答案<\/strong>：D。<strong>解析<\/strong>：σ-代数只要求可数并封闭；任意并会超出可数可加性的框架，也不需要。<\/p>\n<\/ol>\n<ol><li>\n卡拉泰奥多里条件的作用是？　A. 定义外测度　B. 筛选出可测集　C. 证明选择公理　D. 计算体积\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：条件 μ<em>(T) = μ<\/em>(T∩A) + μ*(T∩Aᶜ) 对所有 T 成立时，称 A 可测；这是从外测度得到测度的筛子。<\/p>\n<\/ol>\n<ol><li>\n康托集的性质是？　A. 可数且测度为 0　B. 不可数且测度为 0　C. 不可数且测度为正　D. 可数且测度为正\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：康托集与 [0,1] 等势（不可数），但总长度（测度）为 0。这说明&quot;元素多少&quot;与&quot;测度大小&quot;是两回事。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nσ-代数 = 允许测量的集合清单，对补集与可数并封闭。\n<\/li><li>\n外测度对所有子集有定义，但只次可加；可测性用卡拉泰奥多里条件筛。\n<\/li><li>\n勒贝格测度：平移不变、可数可加；不可测集存在，康托集测度为 0。\n<\/ul>", "kind": "chapter", "title": "第 9 章：测度论基础"}, "ch10": {"html": "<h1>第 10 章：积分理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：16 小时 ｜ <strong>前置<\/strong>：第 9 章（测度）、第 6 章（Riemann 积分）、第 2 章（完备性）\n<\/ul>\n<blockquote>原书把构造路线说得很直接：先引入一般测度空间上的积分，用简单函数空间的 L¹-完备化来实现；这样既能处理向量值函数（博赫纳–勒贝格积分），又为收敛定理的证明打好地基。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用简单函数逼近定义 μ-可测函数，说明&quot;几乎处处&quot;在证明中怎么用。\n<\/li><li>\n说出单调收敛定理与控制收敛定理的条件，并用它们交换极限与积分。\n<\/li><li>\n证明 Lp 空间完备，区分&quot;函数&quot;与&quot;等价类&quot;。\n<\/li><li>\n写出富比尼定理、换元公式与傅里叶变换的基本性质。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>勒贝格积分不是&quot;更复杂的面积&quot;，而是&quot;用简单函数在几乎处处意义下逼近，再把 L¹ 补齐成完备空间&quot;；一旦完备，极限与积分就能在很宽的条件下交换，这是它比黎曼积分强的地方。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：可测函数<\/h3>\n<p>设 (X, A, μ) 是测度空间。简单函数是有限个特征函数的线性组合：<\/p>\n<p>f = Σ eⱼ χ_{Aⱼ}，μ(Aⱼ) &lt; ∞。<\/p>\n<p>它只取有限多个值，每个值的原像可测。可测函数是简单函数列的几乎处处极限：存在简单函数 fⱼ，使 fⱼ → f 在 μ-几乎处处意义下成立，即除去一个零测集之外处处收敛。<\/p>\n<p>&quot;几乎处处&quot;不是偷懒，它是勒贝格理论的语法。零测集上的行为不影响积分，也不影响大多数定理。代价是结论都带&quot;a.e.&quot;（almost everywhere，几乎处处）。<\/p>\n<p><strong>类比<\/strong>：可测函数像&quot;允许有污点的扫描件&quot;：只要污点面积为零（有限个像素、可数条线），内容就算清晰可读。 <strong>边界<\/strong>：如果污点是一整片（正测度），就不行；零测集必须真的是&quot;面积为 0&quot;。<\/p>\n<h3>概念 2：积分怎么定义<\/h3>\n<p>三步走：<\/p>\n<ol><li>\n简单函数 f = Σ eⱼ χ_{Aⱼ} 的积分定义为 Σ eⱼ μ(Aⱼ)。\n<\/li><li>\n非负可测函数 f：取简单函数列 0 ≤ fⱼ ↑ f，定义 ∫f := lim ∫fⱼ（这个极限与逼近列的选择无关，由单调收敛定理保证）。\n<\/li><li>\n一般可测函数：拆成正部与负部，f = f⁺ − f⁻，若两部分的积分都有限，则称 f 可积（L¹），定义 ∫f = ∫f⁺ − ∫f⁻。\n<\/ol>\n<p>向量值函数（取值在巴拿赫空间）：用&quot;简单函数空间在 L¹ 范数下的完备化&quot;来定义。这一步用到了第 2 章的完备化思想：先定义简单函数上的积分，再取 L¹ 范数 ‖f‖₁ := ∫‖f‖，完备化后得到的空间就是 L¹(X, μ, E)，积分延拓为连续线性泛函。<\/p>\n<p><strong>类比<\/strong>：先用乐高小块拼出形状（简单函数），再取&quot;误差面积趋于 0&quot;的极限。完备化保证极限不会跑出空间。<\/p>\n<h3>概念 3：三大收敛定理<\/h3>\n<ul><li>\n<strong>单调收敛<\/strong>：0 ≤ fₙ ↑ f a.e.，则 ∫fₙ ↑ ∫f。允许积分值为 ∞。\n<\/li><li>\n<strong>法图引理<\/strong>：∫liminf fₙ ≤ liminf ∫fₙ（非负可测）。它是单调收敛与控制收敛之间的桥梁。\n<\/li><li>\n<strong>控制收敛<\/strong>：fₙ → f a.e.，且存在可积的 g 使 |fₙ| ≤ g a.e.，则 ∫fₙ → ∫f。\n<\/ul>\n<p>控制收敛的条件&quot;存在可积的控制函数&quot;不能省。反例：fₙ = n χ_{(0, 1/n)} 在 (0,1) 上，fₙ → 0 处处，但 ∫fₙ = 1，积分不趋于 0。这里没有可积的控制函数（sup 是 n，越来越大）。<\/p>\n<p><strong>类比<\/strong>：控制函数是一张&quot;封顶预算&quot;。只要所有 fₙ 都在这张预算之下，支出（积分）就能随函数收敛而收敛。没有封顶，某一项可以突然爆掉。<\/p>\n<h3>概念 4：Lp 空间<\/h3>\n<p>对 1 ≤ p &lt; ∞，‖f‖ₚ := (∫‖f‖ᵖ)^{1/p}；p = ∞ 时取本质上确界。<\/p>\n<ul><li>\nLp 是巴拿赫空间（完备）。\n<\/li><li>\np = 2 时是希尔伯特空间，内积 ⟨f, g⟩ = ∫fḡ。\n<\/li><li>\n赫尔德不等式：‖fg‖₁ ≤ ‖f‖ₚ‖g‖_q，1/p + 1/q = 1。\n<\/li><li>\n闵可夫斯基不等式：‖f + g‖ₚ ≤ ‖f‖ₚ + ‖g‖ₚ，给出三角不等式。\n<\/ul>\n<p><strong>等价类问题<\/strong>：Lp 的元素严格来说是&quot;几乎处处相等&quot;的函数等价类，而不是单个函数。书中反复强调这一点：说&quot;f ∈ Lp&quot;时，f 其实是代表元；两个处处不同的函数可以是同一个元素。这不是吹毛求疵，否则 ‖f‖ₚ = 0 却不能推出 f = 0。<\/p>\n<h3>概念 5：与黎曼积分的关系<\/h3>\n<p>在 ℝⁿ 的勒贝格测度下，一维勒贝格积分是&quot;绝对可积的黎曼积分&quot;的推广：若 f 黎曼可积，则它勒贝格可积且积分相同；反过来，勒贝格可积的函数不必黎曼可积（Dirichlet 函数勒贝格积分为 0，黎曼不可积）。<\/p>\n<p>差别在极限定理：黎曼积分要求一致收敛才能交换极限与积分，勒贝格积分只要控制收敛。这是勒贝格理论的核心优势。<\/p>\n<h3>概念 6：富比尼定理<\/h3>\n<p>对 σ-有限的乘积测度空间，<\/p>\n<p>∫_{X×Y} f d(μ⊗ν) = ∫_X (∫_Y f(x,y) dν) dμ = ∫_Y (∫_X f(x,y) dμ) dν，<\/p>\n<p>只要 f 可积（或非负可测）。它把高维积分化归为累次积分。<\/p>\n<p>使用时注意：非负可测可以直接换序；一般可积函数要先验证 ∫∫|f| &lt; ∞，否则可能得出矛盾（比如 f 在某个区域正、某个区域负，两边都无穷）。<\/p>\n<h3>概念 7：卷积与逼近<\/h3>\n<p>(f ∗ g)(x) := ∫ f(x − y)g(y) dy。<\/p>\n<p>性质：卷积平滑（g 光滑则 f ∗ g 光滑）、满足结合律与交换律、傅里叶变换把卷积变成乘积。用光滑磨光核（mollifier）可以证明：Lp 函数可被光滑函数逼近；连续函数可被磨光后一致逼近。这是第 12 章单位分解定理的技术准备。<\/p>\n<h3>概念 8：换元公式<\/h3>\n<p>若 φ : U → V 是 C¹ 微分同胚，则<\/p>\n<p>∫_V f(y) dy = ∫_U f(φ(x)) |det Dφ(x)| dx。<\/p>\n<p>雅可比行列式是&quot;局部体积放大率&quot;。一维时就是 ∫f(φ(x))|φ′(x)|dx。证明思路：先对特征函数验证（两边都化为体积），再用简单函数逼近，最后用单调收敛取极限。<\/p>\n<h3>概念 9：傅里叶变换<\/h3>\n<p>f̂(ξ) := ∫ f(x) e^{−2πi x·ξ} dx。<\/p>\n<p>基本性质：L¹ ∩ L² 上定义良好；普朗歇尔定理给出 ‖f̂‖₂ = ‖f‖₂（酉性）；卷积变乘积：\\widehat{f ∗ g} = f̂ ĝ。它是&quot;把函数按频率分解&quot;，也是偏微分方程求解的主力工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[简单函数] --&gt; B[可测函数 几乎处处极限]\n  B --&gt; C[非负可测 积分]\n  C --&gt; D[可积函数 L1]\n  D --&gt; E[L1 完备化 博赫纳-勒贝格]\n  E --&gt; F[单调收敛 控制收敛 法图]\n  E --&gt; G[Lp 空间 完备]\n  E --&gt; H[富比尼 累次积分]\n  E --&gt; I[换元 雅可比行列式]\n  E --&gt; J[卷积 磨光 逼近]\n  J --&gt; K[傅里叶变换 卷积变乘积]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：所有分支都从&quot;简单函数 → 可测函数 → 积分&quot;这条主干长出。收敛定理是主干的枢纽：没有它，后面的 Lp 完备、富比尼换序都无法证明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：勒贝格积分像&quot;按重量称一堆形状各异的零件&quot;。黎曼积分要先把零件按格子分类（分割定义域），勒贝格积分按&quot;高度层&quot;分类（按函数值分层），所以对形状不敏感，对&quot;高度分布&quot;敏感。 <strong>失效边界<\/strong>：按高度分层要求&quot;每层的原像可测&quot;，这正是可测函数的意义；如果函数太病态（不可测），这套分层就失效。<\/p>\n<p><strong>实例（可验证）<\/strong>：证明 ∫₀¹ x dx = 1/2 在勒贝格意义下也成立。 取简单函数列 φₙ = Σ_{k=1}^{n} ((k−1)/n) χ_{((k−1)/n, k/n)}，则 0 ≤ φₙ ≤ x 且 φₙ ↑ x（在无理点也收敛，因为网格加密时下取整逼近 x）。∫φₙ = Σ((k−1)/n)(1/n) = (n−1)/(2n) → 1/2。由单调收敛，∫x = 1/2。 这个例子说明：勒贝格积分在&quot;好函数&quot;上与黎曼积分一致，差别只出现在极限与病态函数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;几乎处处&quot;是含糊其辞&quot;<\/strong> — 实际上它有精确定义：不成立的集合是零测集。零测集上的修改不改变积分。\n<\/li><li>\n<strong>别以为&quot;控制收敛可以去掉控制函数&quot;<\/strong> — 实际上 nχ_{(0,1/n)} 是标准反例：逐点收敛到 0，积分却恒为 1。\n<\/li><li>\n<strong>别以为&quot;Lp 的元素就是函数&quot;<\/strong> — 实际上元素是几乎处处相等的等价类；否则范数为 0 推不出零元。\n<\/li><li>\n<strong>别以为&quot;富比尼定理可以无条件换序&quot;<\/strong> — 实际上要先验证绝对可积，否则正负无穷会打架。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n勒贝格积分相对黎曼积分的核心优势是？　A. 能算更多初等函数　B. 在更弱条件下交换极限与积分　C. 不需要测度　D. 只适用于连续函数\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：控制收敛定理只需逐点收敛 + 可积控制函数，而黎曼积分通常要一致收敛。计算能力不是主要差别。<\/p>\n<\/ol>\n<ol><li>\n控制收敛定理中，&quot;存在可积的 g 使 |fₙ| ≤ g&quot;这一条能否去掉？　A. 能，只要 fₙ 逐点收敛　B. 不能，nχ_{(0,1/n)} 是反例　C. 能，只要 fₙ 非负　D. 能，只要测度有限\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：该例逐点收敛到 0，但积分恒为 1；没有可积控制函数，结论失效。<\/p>\n<\/ol>\n<ol><li>\n换元公式中出现的因子是？　A. det Dφ 的绝对值　B. det Dφ 的平方　C. ‖Dφ‖　D. φ 的导数之和\n<p><strong>答案<\/strong>：A。<strong>解析<\/strong>：雅可比行列式的绝对值是局部体积放大率；一维时就是 |φ′|。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n可测 = 简单函数的几乎处处极限；积分 = 简单函数积分的极限。\n<\/li><li>\n三大收敛定理是勒贝格理论的发动机，控制函数不能省。\n<\/li><li>\n富比尼、换元、傅里叶是三大应用支柱；Lp 的元素是等价类。\n<\/ul>", "kind": "chapter", "title": "第 10 章：积分理论"}, "ch11": {"html": "<h1>第 11 章：流形与微分形式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：16 小时 ｜ <strong>前置<\/strong>：第 7 章（多变量微分、流形）、第 8 章（线积分、普法夫形式）\n<\/ul>\n<blockquote>原书把这一章定位成线积分的高维类比：第八章学了普法夫形式和线积分，这一章处理&quot;高阶微分形式在 ℝⁿ 的某些子流形上积分&quot;。换句话说，被积对象从 1-形式升级到 k-形式，积分区域从曲线升级到曲面。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用坐标卡定义子流形，区分浸入与嵌入、带边流形。\n<\/li><li>\n写出楔积的反对称性与外微分 d 的定义，判断形式是否闭、是否恰当。\n<\/li><li>\n用拉回把 ℝⁿ 上的形式搬到流形上，说明定向的作用。\n<\/li><li>\n写出黎曼度量的局部表示，用梯度、散度、旋度与霍奇星统一向量分析。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>k-形式是&quot;吃 k 个切向量、吐一个数&quot;的反对称仪器；外微分 d 把 k-形式变成 (k+1)-形式，并让&quot;闭&quot;与&quot;恰当&quot;、局部与整体通过斯托克斯定理连接起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：子流形、浸入、嵌入<\/h3>\n<p>m 维流形 M 是 ℝᵐ̄ 的子集，每点附近有坐标卡 (φ, U)，把 M ∩ U 拉平成 ℝᵐ 的开集。<\/p>\n<p>L ⊆ M 是 ℓ 维子流形：对每个 p ∈ L，存在 M 的坐标卡使 φ(U ∩ L) = φ(U) ∩ (ℝℓ × {0})。也就是&quot;局部看，L 就是 M 坐标里的一个平面&quot;。<\/p>\n<ul><li>\n<strong>浸入<\/strong>：f : M → N 的切映射 Tₚf 在每个 p 处单射（不压扁维度）。\n<\/li><li>\n<strong>嵌入<\/strong>：浸入 + 到像的同胚（不自我相交、不把远处粘近）。\n<\/li><li>\n<strong>带边流形<\/strong>：坐标卡取值在半空间 ℍᵐ = {x : xₘ ≥ 0}，边界是 xₘ = 0 的像。\n<\/ul>\n<p><strong>类比<\/strong>：浸入像把一张纸弯成波浪放进盒子，局部不折叠；嵌入还要求纸不自交、不贴近自己。<strong>边界<\/strong>：浸入可以全局自交（如 8 字形曲线），这时它不是嵌入。<\/p>\n<h3>概念 2：多重线性代数：楔积<\/h3>\n<p>k-形式是交替 k-线性映射：交换两个自变量，符号变号。<\/p>\n<p>ω(v₁, …, vₖ) = −ω(…, vⱼ, …, vᵢ, …)。<\/p>\n<p>楔积：对 1-形式 α、β，α ∧ β(v, w) := α(v)β(w) − α(w)β(v)。它自动反对称，且 α ∧ β = −β ∧ α、α ∧ α = 0。<\/p>\n<p>在坐标基下，dx¹ ∧ … ∧ dxᵏ 作用在向量组上就是&quot;矩阵的行列式&quot;。这解释了一个关键事实：<strong>形式天然适合测量有向体积<\/strong>。<\/p>\n<p><strong>类比<\/strong>：楔积像&quot;带方向的平行四边形面积&quot;。交换两条边，方向翻转，面积变号；两条边重合，面积为零。 <strong>边界<\/strong>：只有在有定向的空间里&quot;变号&quot;才有意义；无定向流形上，形式只能测&quot;无向体积&quot;的绝对值。<\/p>\n<h3>概念 3：外微分 d<\/h3>\n<p>对 k-形式 ω = Σ a_I dx^I，定义<\/p>\n<p>dω := Σ da_I ∧ dx^I，<\/p>\n<p>其中 da_I 是普通微分。三条性质：<\/p>\n<ol><li>\nd(dω) = 0（&quot;边界的边界为空&quot;）。\n<\/li><li>\nd 满足莱布尼茨律：d(ω ∧ η) = dω ∧ η + (−1)^k ω ∧ dη。\n<\/li><li>\n拉回与 d 交换：d(f<em>ω) = f<\/em>(dω)。\n<\/ol>\n<p><strong>闭<\/strong>：dω = 0。<strong>恰当<\/strong>：ω = dη。由 d² = 0，恰当必闭；反之在星形区域上闭必恰当（庞加莱引理），有洞时不成立。<\/p>\n<p>1-形式的情形就是第 8 章的普法夫形式：ω = Σaⱼdxⱼ，dω = Σ(∂aⱼ/∂xₖ)dxₖ ∧ dxⱼ，闭性等价于 ∂aⱼ/∂xₖ = ∂aₖ/∂xⱼ。<\/p>\n<p><strong>类比<\/strong>：d 像&quot;求边界&quot;。一个区域的边界没有边界（闭合曲线），所以 d² = 0。<strong>边界<\/strong>：d² = 0 是代数的，不是几何的&quot;边界无边界&quot;的严格证明；后者要靠斯托克斯定理。<\/p>\n<h3>概念 4：向量场、内积、李导数<\/h3>\n<p>向量场 X 是每点给一个切向量。形式与向量场通过内积 ι_X 配对：ι_X ω 是把 X 塞进第一个变量后得到的 (k−1)-形式。<\/p>\n<p>李导数 L_X ω 描述&quot;沿 X 流动时 ω 的变化率&quot;，嘉当公式：<\/p>\n<p>L_X = d ι_X + ι_X d。<\/p>\n<p>这条公式把&quot;流动的变化&quot;拆成&quot;边界的内部&quot;与&quot;内部的边界&quot;，是微分形式运算的核心恒等式。<\/p>\n<h3>概念 5：黎曼度量<\/h3>\n<p>黎曼度量是每点切空间上的正定内积 g。局部写成矩阵 gⱼₖ = g(∂ⱼ, ∂ₖ)，光滑对称正定。<\/p>\n<p>它给出：<\/p>\n<ul><li>\n长度：‖v‖ = √(g(v,v))；\n<\/li><li>\n角度：cos θ = g(v,w)/(‖v‖‖w‖)；\n<\/li><li>\n体积元：√det(g) dx¹ ∧ … ∧ dxᵐ。\n<\/ul>\n<p>半黎曼（伪黎曼）度量只要求非退化，不要求正定；闵可夫斯基空间的时间分量取负号，是相对论的几何基础。<\/p>\n<p><strong>类比<\/strong>：度量是&quot;每个点自带的一把尺子&quot;。平面上的尺子处处相同，球面上的尺子随位置变，所以球面三角形的内角和大于 π。<\/p>\n<h3>概念 6：梯度、散度、旋度与霍奇星<\/h3>\n<p>在 ℝ³ 的欧氏度量下，三种经典算子可以统一写成：<\/p>\n<ul><li>\ngrad f ↔ df（0-形式变 1-形式）；\n<\/li><li>\ncurl X ↔ *d(X♭)（1-形式变 1-形式）；\n<\/li><li>\ndiv X ↔ <em>d(<\/em>X♭)（1-形式变 0-形式）。\n<\/ul>\n<p>霍奇星 <em> 把 k-形式变成 (m−k)-形式，依赖度量与定向。于是&quot;梯度–旋度–散度&quot;不再是三个孤立公式，而是 d 与 <\/em> 的不同组合。这也是麦克斯韦方程组能用微分形式写成两行的原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[子流形 浸入 嵌入] --&gt; B[切空间]\n  B --&gt; C[k-形式 交替多线性]\n  C --&gt; D[楔积 有向体积]\n  D --&gt; E[外微分 d]\n  E --&gt; F[闭 d omega = 0]\n  E --&gt; G[恰当 omega = d eta]\n  F --&gt; H[庞加莱引理 星形区域]\n  C --&gt; I[拉回 坐标变换]\n  C --&gt; J[黎曼度量 g]\n  J --&gt; K[体积元 根号 det g]\n  J --&gt; L[霍奇星]\n  L --&gt; M[梯度 散度 旋度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左边是几何对象（流形与切空间），中间是代数对象（形式与 d），右边是度量结构（g 与 *）。第 12 章的积分会同时用到三者：在流形上积分 m-形式，被积对象来自中间，体积元来自右边。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：k-形式像&quot;测量仪器&quot;：1-形式测&quot;沿方向的累积&quot;，2-形式测&quot;穿过面的通量&quot;，3-形式测&quot;体内的总量&quot;。d 是把&quot;测边界的仪器&quot;升级成&quot;测内部的仪器&quot;。 <strong>失效边界<\/strong>：仪器必须有定向才能区分正负；在不可定向的流形（莫比乌斯带）上，最高阶形式的积分只能取绝对值。<\/p>\n<p><strong>实例（可验证）<\/strong>：极坐标下的面积形式。 x = r cos θ，y = r sin θ。dx = cos θ dr − r sin θ dθ，dy = sin θ dr + r cos θ dθ。 dx ∧ dy = (cos θ)(r cos θ) dr ∧ dθ − (−r sin θ)(sin θ) dθ ∧ dr = r(cos²θ + sin²θ) dr ∧ dθ = r dr ∧ dθ。 这正是换元公式里雅可比行列式 r 的来源，说明&quot;形式自动带雅可比&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;形式就是无穷小量&quot;<\/strong> — 实际上形式是作用在切向量上的线性函数，dx 不是&quot;很小的 x&quot;，而是&quot;取 x 分量的仪器&quot;。\n<\/li><li>\n<strong>别以为&quot;闭形式一定恰当&quot;<\/strong> — 实际上只在单连通（星形）区域成立；绕洞的形式是反例。\n<\/li><li>\n<strong>别以为&quot;浸入就是嵌入&quot;<\/strong> — 实际上浸入允许全局自交，嵌入还要求到像的同胚。\n<\/li><li>\n<strong>别以为&quot;霍奇星与度量无关&quot;<\/strong> — 实际上 * 依赖度量与定向，换度量结果就变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n关于外微分，正确的说法是？　A. d(dω) = ω　B. d(dω) = 0　C. d 只在 0-形式上定义　D. d 与拉回不可交换\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：d² = 0 是外微分的代数性质；恰当形式必闭，但闭不一定恰当。<\/p>\n<\/ol>\n<ol><li>\n极坐标下 dx ∧ dy 等于？　A. dr ∧ dθ　B. r dr ∧ dθ　C. r² dr ∧ dθ　D. dr ∧ dθ/r\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：直接计算得 dx ∧ dy = r dr ∧ dθ，因子 r 就是极坐标换元的雅可比行列式。<\/p>\n<\/ol>\n<ol><li>\n黎曼度量给出的体积元是？　A. det(g) dx　B. √|det(g)| dx¹∧…∧dxᵐ　C. trace(g) dx　D. ‖g‖ dx\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：体积元是 √|det g| 乘以坐标形式的楔积；正定度量可以去掉绝对值。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nk-形式 = 交替 k-线性仪器；楔积给有向体积，交换自变量变号。\n<\/li><li>\nd² = 0；恰当必闭，闭在星形区域上恰当。\n<\/li><li>\n度规给长度、角度、体积元；霍奇星把 grad/div/curl 统一成 d 与 * 的组合。\n<\/ul>", "kind": "chapter", "title": "第 11 章：流形与微分形式"}, "ch12": {"html": "<h1>第 12 章：流形上的积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：14 小时 ｜ <strong>前置<\/strong>：第 9 章（测度）、第 10 章（积分理论）、第 11 章（微分形式、度量）\n<\/ul>\n<blockquote>原书在这一章开头说：前两章建立了测度与积分，上一章加深了对流形与微分形式的认识，现在准备把积分理论推广到流形上——也就是能在&quot;弯曲空间&quot;上积分。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用坐标卡把 ℝᵐ 的勒贝格测度&quot;抬&quot;到流形上，说明为什么这个定义与坐标无关。\n<\/li><li>\n用体积元 √|det g| dx¹∧…∧dxᵐ 计算曲面面积与流形体积。\n<\/li><li>\n在流形上积分 m-形式，并用斯托克斯定理把闭路/闭面积分换成内部的 dω。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>流形上的积分 = 局部坐标下普通积分 + 体积元修正；斯托克斯定理 ∮_∂M ω = ∫_M dω 把&quot;边界上的积分&quot;与&quot;内部的微分&quot;连成一条等式，是所有积分定理的统一形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：把测度从 ℝᵐ 抬到流形<\/h3>\n<p>流形局部像 ℝᵐ 的开集，所以&quot;可测&quot;可以逐坐标卡定义：A ⊆ M 可测，如果对每个 p ∈ A，存在坐标卡 (φ, U) 使 φ(A ∩ U) 是 ℝᵐ 中的勒贝格可测集。<\/p>\n<p>这个定义要证明与坐标卡选取无关：两套坐标之间的转换是微分同胚，而微分同胚把可测集映成可测集（第 10 章换元公式的推论）。于是得到流形上的 σ-代数 L_M，它包含博雷尔 σ-代数。<\/p>\n<p><strong>类比<\/strong>：给地球仪贴地图。每块小区域用一张平面地图描述，可测性就是&quot;在这张地图上有面积&quot;；换一张地图，面积仍然有定义，因为地图之间的转换是光滑可逆的。<\/p>\n<h3>概念 2：体积测度与体积元<\/h3>\n<p>给定（伪）黎曼度量 g，坐标卡 φ = (x¹, …, xᵐ)，格拉姆矩阵 G = (gⱼₖ)，体积元定义为<\/p>\n<p>dV := √|det G| dx¹ ∧ … ∧ dxᵐ。<\/p>\n<p>对 A ⊆ U，体积<\/p>\n<p>vol(A) := ∫_{φ(A)} √|det G| dx。<\/p>\n<p>引理：这个值与坐标卡的选择无关，因为坐标变换的雅可比行列式正好抵消 √|det G| 的变换因子。这正是第 10 章换元公式的用武之地。<\/p>\n<p>特例：<\/p>\n<ul><li>\nℝᵐ 的欧氏度量：G = I，dV = dx，回到普通体积。\n<\/li><li>\n球面 S²：用球坐标，得 dV = R² sin θ dθ dφ，积分给出 4πR²。\n<\/li><li>\n图像 z = f(x,y)：dV = √(1 + |∇f|²) dx dy，这就是曲面面积公式。\n<\/ul>\n<p><strong>类比<\/strong>：体积元是&quot;每个点自带的缩放因子&quot;。平面地图上的 1 平方厘米，在球面上可能对应不同的实际面积，√det G 就是换算率。<\/p>\n<h3>概念 3：m-形式的积分<\/h3>\n<p>在定向的 m 维流形 M 上，m-形式可以写成 ω = f dV（f 是光滑函数）。定义<\/p>\n<p>∫_M ω := ∫_{φ(U)} f ∘ φ⁻¹ · √|det G| dx。<\/p>\n<p>关键点：<\/p>\n<ol><li>\n只有 m-形式（最高阶）能在 m 维流形上积分；低阶形式要沿子流形积分。\n<\/li><li>\n定向决定符号：换定向，积分变号。\n<\/li><li>\n拉回与换元保证定义与坐标无关。\n<\/ol>\n<p>1-形式沿曲线的积分就是第 8 章的线积分；2-形式沿曲面的积分就是通量；m-形式在 m 维区域上的积分就是&quot;总量&quot;。<\/p>\n<h3>概念 4：斯托克斯定理<\/h3>\n<p>设 M 是带边的定向 m 维流形，ω 是紧支集的 (m−1)-形式，则<\/p>\n<p>∫_∂M ω = ∫_M dω，<\/p>\n<p>其中 ∂M 继承 M 的诱导定向。<\/p>\n<p>这是本章的高潮，也是全书积分理论的统一形式：<\/p>\n<ul><li>\n微积分基本定理：m = 1，∫_a^b f′ dx = f(b) − f(a)。\n<\/li><li>\n格林公式：平面区域，∮ P dx + Q dy = ∫∫(Q_x − P_y) dx dy。\n<\/li><li>\n高斯–奥斯特罗格拉德斯基：通量 = 散度的体积分。\n<\/li><li>\n经典斯托克斯：环量 = 旋度的通量。\n<\/ul>\n<p>证明思路：先用单位分解把 ω 的支集切成小块，每块落在坐标卡内；在坐标卡内把 ω 写成 (m−1)-形式，直接算 dω 的积分，用富比尼定理逐变量积分，边界项只剩两端，望远镜求和。单位分解的存在性来自第 10 章的磨光与卷积。<\/p>\n<p><strong>类比<\/strong>：斯托克斯定理像&quot;记账对账&quot;：边界上流进流出的净额，等于内部每个小格子的净产出之和。内部相邻格子的边界互相抵消，只剩最外圈。 <strong>边界<\/strong>：流形必须有边、可定向、ω 必须紧支集；带奇点（尖点、自交）时要额外处理，书中给出适用于常见奇点的版本。<\/p>\n<h3>概念 5：输运定理与通量<\/h3>\n<p>对随时间变化的区域或流场，雷诺输运定理说：<\/p>\n<p>d/dt ∫_{M_t} f = ∫_{M_t} (∂f/∂t + div(fX))。<\/p>\n<p>用微分形式写，就是李导数与内积的组合。它是流体力学与连续介质力学的基本公式，也是斯托克斯定理的直接应用。<\/p>\n<h3>概念 6：拓扑后果<\/h3>\n<p>斯托克斯定理给出&quot;闭形式在闭流形上的积分&quot;与&quot;洞&quot;的关系：若 ω 闭，则 ∫_M ω 只依赖 M 的同调类。这解释了为什么第 8 章绕洞积分是 2π，以及为什么&quot;闭而不恰当&quot;是拓扑现象而不是分析现象。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[坐标卡] --&gt; B[局部勒贝格测度]\n  B --&gt; C[流形 sigma 代数]\n  D[黎曼度量 g] --&gt; E[体积元 根号 det G]\n  E --&gt; F[体积测度]\n  C --&gt; F\n  F --&gt; G[m-形式积分]\n  G --&gt; H[斯托克斯定理]\n  H --&gt; I[基本定理 格林 高斯 经典斯托克斯]\n  H --&gt; J[输运定理]\n  H --&gt; K[闭形式的拓扑后果]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左支解决&quot;在哪里积分&quot;（测度），右支解决&quot;积什么、怎么缩放&quot;（度量与体积元），两支汇合成 m-形式积分，再由斯托克斯定理与边界连接。所有经典积分公式都是这条链的特例。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：在流形上积分像给一件衣服算布料总量。先把衣服剪成小片（坐标卡 + 单位分解），每片按当地的&quot;松紧程度&quot;（√det G）换算成实际面积，再加起来；斯托克斯定理说，如果你只关心边缘的缝合线，也能推出整件衣服的内应力总量。 <strong>失效边界<\/strong>：衣服不可定向（莫比乌斯带）时，&quot;正反&quot;没法定，只能用绝对值；有破洞时，闭形式的积分会留下洞的贡献。<\/p>\n<p><strong>实例（可验证）<\/strong>：球面面积。 球坐标 x = R sin θ cos φ，y = R sin θ sin φ，z = R cos θ。度量矩阵给出 √det G = R² sin θ。于是 面积 = ∫₀^{2π}∫₀^{π} R² sin θ dθ dφ = 2πR²·2 = 4πR²。 这个计算把&quot;体积元&quot;从一个抽象符号变成了具体的可算量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;流形上的积分只是把 dx 换成 dV&quot;<\/strong> — 实际上体积元依赖度量，√det G 是必须算的因子，漏掉就得到平面面积。\n<\/li><li>\n<strong>别以为&quot;斯托克斯定理只是向量分析的公式&quot;<\/strong> — 实际上它是对任意阶形式的统一陈述，格林、高斯、经典斯托克斯都是特例。\n<\/li><li>\n<strong>别以为&quot;定向无关紧要&quot;<\/strong> — 实际上换定向积分变号；不可定向流形上只能积最高阶形式的绝对值。\n<\/li><li>\n<strong>别以为&quot;闭形式积分总为 0&quot;<\/strong> — 实际上闭形式在带洞流形上的积分可以非零，这正是拓扑信息的来源。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n流形上体积元的表达式是？　A. dx¹∧…∧dxᵐ　B. √|det G| dx¹∧…∧dxᵐ　C. det(G) dx　D. √(trace G) dx\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：体积元 = √|det G| 乘坐标楔积；欧氏度量为 1，球坐标为 R² sin θ。<\/p>\n<\/ol>\n<ol><li>\n斯托克斯定理 ∫_∂M ω = ∫_M dω 中，ω 必须是？　A. 任意函数　B. (m−1)-形式　C. m-形式　D. 0-形式\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：d 把 (m−1)-形式变成 m-形式，才能在 m 维 M 上积分；边界 ∂M 是 (m−1) 维，正好积 (m−1)-形式。<\/p>\n<\/ol>\n<ol><li>\n球面 S² 的面积是？　A. 2πR²　B. 4πR²　C. 4πR³/3　D. πR²\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：∫₀^{2π}∫₀^{π} R² sin θ dθ dφ = 4πR²。4πR³/3 是球的体积，不要混。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n流形积分 = 坐标卡里的普通积分 + 体积元 √|det G|。\n<\/li><li>\n斯托克斯定理统一了基本定理、格林、高斯与经典斯托克斯。\n<\/li><li>\n定向决定符号；闭形式的积分携带洞的拓扑信息。\n<\/ul>", "kind": "chapter", "title": "第 12 章：流形上的积分"}, "c11": {"html": "<h1>σ-代数与测度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 9 章（§1–§2）、第 10 章（§1）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>σ-代数是对补集与可数并封闭的集合族，测度是定义在它上面的可数可加非负函数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它规定了&quot;哪些集合可以被测量&quot;。没有这层限制，测度会与选择公理冲突。概率论、积分理论、流形上的体积，全都以测度空间为地基。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  X[全集 X] --&gt; A[σ-代数 A]\n  A --&gt; C[补集封闭]\n  A --&gt; U[可数并封闭]\n  A --&gt; M[测度 mu 可数可加]\n  M --&gt; Z[零测集]\n  Z --&gt; AE[几乎处处]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>σ-代数三条：X ∈ A；A ∈ A ⇒ Aᶜ ∈ A；Aⱼ ∈ A ⇒ ∪Aⱼ ∈ A。由德摩根律，可数交也封闭。最小的例子是 {∅, X}；最大的例子是 P(X)（但上面不一定有有用的测度）。<\/p>\n<p>测度 μ : A → [0, ∞] 要求 μ(∅) = 0，且对不交序列 μ(∪Aⱼ) = Σμ(Aⱼ)。由可数可加性得到单调性与次可加性：A ⊆ B ⇒ μ(A) ≤ μ(B)；μ(∪Aⱼ) ≤ Σμ(Aⱼ)。<\/p>\n<p>完备化：把每个零测集的子集都加入 σ-代数，并赋予测度 0。得到的测度空间叫完备化。勒贝格测度就是博雷尔测度的完备化。<\/p>\n<p><strong>类比<\/strong>：σ-代数是一张&quot;允许测量的清单&quot;，测度是清单上每一项对应的&quot;重量&quot;。清单必须对&quot;取补集&quot;&quot;可数合并&quot;封闭，否则算着算着就跑到清单外。 <strong>边界<\/strong>：清单不是越大越好——P(X) 上通常定义不出平移不变的可数可加测度。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 σ-代数就是&quot;所有子集&quot;——P(X) 是 σ-代数，但上面不一定有合适测度。\n<\/li><li>\n别以为&quot;测度为 0&quot;等于&quot;空集&quot;——康托集测度为 0 却不可数。\n<\/li><li>\n别以为&quot;可加&quot;可以换成&quot;有限可加&quot;——可数可加是勒贝格理论能做极限的关键。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章 §1<\/td><td>可测空间<\/td><td>σ-代数、博雷尔 σ-代数<\/td><\/tr><tr><td>第 9 章 §2<\/td><td>测度<\/td><td>可数可加、完备化<\/td><\/tr><tr><td>第 10 章 §1<\/td><td>可测函数<\/td><td>几乎处处、简单函数<\/td><\/tr><tr><td>第 12 章 §1<\/td><td>流形测度<\/td><td>局部坐标卡定义 L_M<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：集合、可数性、拓扑\n<\/li><li>\n后续：外测度、勒贝格测度、Lp 空间\n<\/ul>", "kind": "concept", "title": "σ-代数与测度"}, "c12": {"html": "<h1>外测度与可测集<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 9 章（§3–§4）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>外测度是对所有子集都定义的&quot;最小覆盖体积&quot;；可测集是满足卡拉泰奥多里切割条件的集合，外测度限制在它们上面才成为真正的测度。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是勒贝格测度的构造核心。它把&quot;几何覆盖&quot;与&quot;可加性&quot;分开：外测度负责赋初值，卡拉泰奥多里条件负责筛掉&quot;切不干净&quot;的集合。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  C[可数长方体覆盖] --&gt; O[外测度 所有子集]\n  O --&gt; M[单调 次可加]\n  O --&gt; K[卡拉泰奥多里条件]\n  K --&gt; A[可测集]\n  A --&gt; S[限制后成为测度]\n  S --&gt; L[勒贝格测度]\n  O --&gt; N[不可测集 切割不守恒]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>外测度：λ*(A) = inf{Σvol(Qⱼ) : A ⊆ ∪Qⱼ}。<\/p>\n<p>性质：λ<em>(∅) = 0；单调；次可加 λ<\/em>(∪Aⱼ) ≤ Σλ*(Aⱼ)。注意是&quot;次可加&quot;，不是可加——覆盖可以重叠，也可以包进空气。<\/p>\n<p>卡拉泰奥多里条件：A 可测 ⇔ 对每个 T，λ<em>(T) = λ<\/em>(T ∩ A) + λ*(T ∩ Aᶜ)。<\/p>\n<p>直觉：A 把任何测试集 T 切成两块，两块的外测度之和恰好等于整体。这条条件对不可测集失效——维塔利集合会把 T 切成&quot;总量凭空多出来&quot;的两块。<\/p>\n<p>定理：可测集构成 σ-代数，λ* 限制在其上满足可数可加，于是成为测度 λ。<\/p>\n<p><strong>类比<\/strong>：外测度是&quot;用包装纸包东西的最小用量&quot;，可测集是&quot;切割时不掉渣的材料&quot;。只有后者能用来称重。 <strong>边界<\/strong>：外测度不是测度，不能直接对它用可加性；必须先筛可测集。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为外测度满足可加性——它只次可加，反例来自覆盖重叠。\n<\/li><li>\n别以为&quot;外测度为 0&quot;就是可测——零外测度集一定是可测的（这是定理），但&quot;外测度有限&quot;不保证可测。\n<\/li><li>\n别以为卡拉泰奥多里条件是技术性装饰——它是整个构造的筛子，去掉就没有测度。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章 §3<\/td><td>外测度<\/td><td>覆盖定义、次可加<\/td><\/tr><tr><td>第 9 章 §4<\/td><td>可测集<\/td><td>卡拉泰奥多里条件、σ-代数<\/td><\/tr><tr><td>第 9 章 §5<\/td><td>勒贝格测度<\/td><td>限制到可测集得到测度<\/td><\/tr><tr><td>第 10 章 §5<\/td><td>积分<\/td><td>可测性保证简单函数逼近<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：σ-代数、可数覆盖\n<\/li><li>\n后续：勒贝格测度、可测函数、L¹ 空间\n<\/ul>", "kind": "concept", "title": "外测度与可测集"}, "c13": {"html": "<h1>收敛定理（单调、法图、控制）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 10 章（§3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三条定理给出&quot;极限与积分交换&quot;的条件：单调上升可无条件交换；非负情形有法图不等式；一般情形需要可积的控制函数。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是勒贝格积分优于黎曼积分的核心。黎曼积分通常要一致收敛才能交换，勒贝格只要逐点收敛加一个控制。Lp 完备、富比尼换序、换元公式、傅里叶变换的连续性，全都靠它们。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  M[单调上升 f_n ↑ f] --&gt; I[积分极限交换 无条件]\n  F[法图引理 非负] --&gt; I2[不等式 下界]\n  D[控制收敛 存在可积 g] --&gt; I3[积分极限交换]\n  I --&gt; L[Lp 完备]\n  I3 --&gt; FB[富比尼 换序]\n  I3 --&gt; CV[换元公式 极限论证]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>单调收敛：0 ≤ fₙ ↑ f a.e. ⇒ ∫fₙ ↑ ∫f。允许两边都是 ∞。证明用 sup 的定义与简单函数逼近。<\/p>\n<p>法图引理：fₙ ≥ 0 ⇒ ∫liminf fₙ ≤ liminf ∫fₙ。它不需要单调，但只给不等式。作用是给控制收敛提供下界估计。<\/p>\n<p>控制收敛：fₙ → f a.e.，|fₙ| ≤ g a.e.，g 可积 ⇒ ∫fₙ → ∫f。证明对 |fₙ − f| 用法图引理，注意 |fₙ − f| ≤ 2g。<\/p>\n<p>反例说明控制条件不能省：fₙ = nχ_{(0,1/n)}，逐点收敛到 0，∫fₙ = 1。不存在可积的 g 控制所有 fₙ。<\/p>\n<p><strong>类比<\/strong>：控制函数是&quot;预算上限&quot;。预算存在，支出才能随计划收敛；没有上限，某一期可以突然超支到无穷。 <strong>边界<\/strong>：控制函数必须可积，仅仅&quot;逐点有界&quot;不够（上面的反例逐点有界但无统一可积控制）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;逐点收敛就能交换积分&quot;——需要单调或控制。\n<\/li><li>\n别以为&quot;控制函数可以依赖 n&quot;——必须是同一个 g 控制所有 n。\n<\/li><li>\n别以为法图引理是等式——只有 ≤，等号需要额外条件。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章 §2<\/td><td>积分定义<\/td><td>简单函数逼近取极限<\/td><\/tr><tr><td>第 10 章 §3<\/td><td>收敛定理<\/td><td>单调、法图、控制<\/td><\/tr><tr><td>第 10 章 §4<\/td><td>Lp 完备<\/td><td>用控制收敛证柯西列收敛<\/td><\/tr><tr><td>第 10 章 §6<\/td><td>富比尼<\/td><td>换序需要可积性<\/td><\/tr><tr><td>第 10 章 §8<\/td><td>换元<\/td><td>对特征函数取极限<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：可测函数、积分定义\n<\/li><li>\n后续：Lp 空间、富比尼定理、傅里叶变换\n<\/ul>", "kind": "concept", "title": "收敛定理"}, "c14": {"html": "<h1>Lp 空间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 10 章（§4）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Lp 是&quot;p 次方可积&quot;的函数等价类构成的空间，配 ‖f‖ₚ = (∫|f|ᵖ)^{1/p}；它完备，p = 2 时还是希尔伯特空间。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是泛函分析、偏微分方程、概率论的通用舞台。完备性让&quot;取极限&quot;这件事在函数层面合法；赫尔德与闵可夫斯基不等式提供了全部估计工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  S[简单函数] --&gt; L1[L1 完备化]\n  L1 --&gt; LP[Lp 空间]\n  LP --&gt; C[完备 巴拿赫]\n  LP --&gt; H[p=2 希尔伯特]\n  LP --&gt; HLD[赫尔德不等式]\n  LP --&gt; MINK[闵可夫斯基不等式]\n  LP --&gt; EQ[元素是等价类 不是函数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义：‖f‖ₚ = (∫|f|ᵖ dμ)^{1/p}（1 ≤ p &lt; ∞）；p = ∞ 取本质上确界。<\/p>\n<ul><li>\n完备性：柯西列在 Lp 范数下收敛，用控制收敛/法图引理抽出几乎处处收敛的子列，再证范数收敛。\n<\/li><li>\n赫尔德：‖fg‖₁ ≤ ‖f‖ₚ‖g‖_q，1/p + 1/q = 1。它是柯西–施瓦茨的推广。\n<\/li><li>\n闵可夫斯基：‖f + g‖ₚ ≤ ‖f‖ₚ + ‖g‖ₚ，给出三角不等式，所以 Lp 是赋范空间。\n<\/li><li>\n稠密性：简单函数在 Lp 中稠密；p &lt; ∞ 时紧支连续函数也稠密。\n<\/li><li>\n对偶：p 与 q 互为对偶指数，Lq 是 Lp 的对偶空间（p ∈ (1, ∞)）。\n<\/ul>\n<p><strong>等价类<\/strong>：严格说 Lp 的元素是&quot;几乎处处相等&quot;的函数类。若把函数本身当元素，‖f‖ₚ = 0 不能推出 f = 0，三角不等式也会出问题。书中反复强调代表元与等价类的区别，这不是形式主义。<\/p>\n<p><strong>类比<\/strong>：Lp 像&quot;按不同标准衡量的仓库&quot;：L¹ 看总重量，L² 看总能量，L∞ 看最大单件。同一批货物在不同标准下的&quot;大小&quot;不同，但都可以比较、取极限。 <strong>边界<\/strong>：p 不同，空间不同；L² ⊂ L¹ 只在有限测度空间成立，在 ℝ 上不成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Lp 的元素就是函数——是等价类。\n<\/li><li>\n别以为所有 Lp 互相包含——只在有限测度空间里 Lq ⊆ Lp（q &gt; p）。\n<\/li><li>\n别以为 p = ∞ 是&quot;p 趋于无穷的极限&quot;那么简单——它是本质上确界，允许零测集上无界。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章 §2<\/td><td>积分<\/td><td>L1 完备化定义积分<\/td><\/tr><tr><td>第 10 章 §4<\/td><td>Lp<\/td><td>完备、赫尔德、闵可夫斯基<\/td><\/tr><tr><td>第 10 章 §7<\/td><td>卷积<\/td><td>L1 ∗ Lp ⊆ Lp<\/td><\/tr><tr><td>第 10 章 §9<\/td><td>傅里叶<\/td><td>L² 上的酉性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：测度、积分、完备性\n<\/li><li>\n后续：希尔伯特空间、傅里叶变换、索伯列夫空间\n<\/ul>", "kind": "concept", "title": "Lp 空间"}, "c15": {"html": "<h1>微分形式与斯托克斯定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>涉及章节<\/strong>：第 11 章（§2–§6）、第 12 章（§2–§3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>微分形式是反对称的多线性仪器，可以被拉回、被外微分；斯托克斯定理说，边界上的形式积分等于内部 dω 的积分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它统一了所有积分定理，并把&quot;局部微分&quot;与&quot;整体拓扑&quot;联系起来。麦克斯韦方程组、流体力学、辛几何、指标定理，都用这套语言书写。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  F[k-形式 反对称仪器] --&gt; W[楔积 有向体积]\n  F --&gt; D[外微分 d]\n  D --&gt; C[闭 d omega = 0]\n  D --&gt; E[恰当 omega = d eta]\n  F --&gt; P[拉回 f 星]\n  F --&gt; G[度量 g 与霍奇星]\n  G --&gt; V[体积元]\n  V --&gt; INT[m-形式积分]\n  INT --&gt; ST[斯托克斯 边界等于内部]\n  ST --&gt; T[基本定理 格林 高斯 经典斯托克斯]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>k-形式：交替 k-线性映射。楔积构造高阶形式，dx¹∧…∧dxᵏ 在向量组上取值等于行列式，所以形式天然测量有向体积。<\/p>\n<p>外微分：d(Σa_I dx^I) = Σda_I ∧ dx^I。性质 d² = 0；恰当必闭；星形区域上闭必恰当。<\/p>\n<p>拉回：f*ω 把 N 上的形式搬到 M 上，与 d 交换。它保证&quot;在坐标卡里算&quot;是合法的。<\/p>\n<p>积分：m 维定向流形上积 m-形式；低阶形式沿相应维数的子流形积分。<\/p>\n<p>斯托克斯：∫_∂M ω = ∫_M dω。证明用单位分解切小块，在坐标卡内用富比尼逐变量积分，边界项望远镜求和。<\/p>\n<p>四个特例：微积分基本定理（m=1）、格林公式（平面）、高斯散度定理、经典斯托克斯（旋度）。<\/p>\n<p><strong>类比<\/strong>：d 是&quot;取边界&quot;的代数版本，斯托克斯定理说&quot;数边界&quot;与&quot;数内部的小边界&quot;结果相同，因为相邻小块的公共边界互相抵消。 <strong>边界<\/strong>：流形要可定向、有边、ω 紧支集；不可定向时只能取绝对值。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为形式是&quot;无穷小量&quot;——它是作用在切向量上的函数。\n<\/li><li>\n别以为&quot;闭 = 恰当&quot;总成立——需要单连通。\n<\/li><li>\n别以为斯托克斯只是向量分析公式——它是任意阶形式的统一陈述。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 11 章 §2<\/td><td>多重线性代数<\/td><td>楔积、交替形式、霍奇星<\/td><\/tr><tr><td>第 11 章 §3<\/td><td>局部理论<\/td><td>外微分、闭与恰当<\/td><\/tr><tr><td>第 11 章 §4<\/td><td>向量场<\/td><td>内积、李导数、定向<\/td><\/tr><tr><td>第 12 章 §2<\/td><td>形式积分<\/td><td>拉回、体积元<\/td><\/tr><tr><td>第 12 章 §3<\/td><td>斯托克斯<\/td><td>统一四大积分定理<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线积分、雅可比、流形、黎曼度量\n<\/li><li>\n后续：德拉姆上同调、辛几何、规范场论\n<\/ul>", "kind": "concept", "title": "微分形式与斯托克斯定理"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-09'><strong>步骤 09：测度论基础<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：测度论基础<\/a><br>检查点：ch09 自测三题<\/li><li class='path-step' id='path-10'><strong>步骤 10：积分理论<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：积分理论<\/a><br>检查点：ch10 自测三题<\/li><li class='path-step' id='path-11'><strong>步骤 11：流形与微分形式<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：流形与微分形式<\/a><br>检查点：ch11 自测三题<\/li><li class='path-step' id='path-12'><strong>步骤 12：流形上的积分<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：流形上的积分<\/a><br>检查点：ch12 自测三题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='aiii-x1' data-type='single'><p class='quiz-q'><b>Q13.<\/b> 把测度、积分、流形积分串起来，正确的逻辑顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='aiii-x1' value='0'> 先定义积分再定义测度<\/label><label class='quiz-opt'><input type='radio' name='aiii-x1' value='1'> σ-代数 → 测度 → 可测函数 → 积分 → 流形上的体积元<\/label><label class='quiz-opt'><input type='radio' name='aiii-x1' value='2'> 流形积分是独立理论，与测度无关<\/label><label class='quiz-opt'><input type='radio' name='aiii-x1' value='3'> 黎曼积分可以直接推广到流形<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='aiii-x2' data-type='single'><p class='quiz-q'><b>Q14.<\/b> 关于斯托克斯定理与拓扑，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='aiii-x2' value='0'> 闭形式在任何流形上的积分都为 0<\/label><label class='quiz-opt'><input type='radio' name='aiii-x2' value='1'> 闭形式的积分可以非零，反映流形的洞<\/label><label class='quiz-opt'><input type='radio' name='aiii-x2' value='2'> 恰当形式不能积分<\/label><label class='quiz-opt'><input type='radio' name='aiii-x2' value='3'> 斯托克斯定理只对 1-形式成立<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章：测度论基础<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> σ-代数不需要满足下列哪条？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 包含全集<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 对补集封闭<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 对可数并封闭<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 对任意并封闭<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 卡拉泰奥多里条件的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 定义外测度<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 筛选出可测集<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 证明选择公理<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 计算体积<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 康托集的性质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 可数且测度为 0<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 不可数且测度为 0<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 不可数且测度为正<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 可数且测度为正<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章：积分理论<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 勒贝格积分相对黎曼积分的核心优势是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 能算更多初等函数<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 不需要测度<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 在更弱条件下交换极限与积分<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 只适用于连续函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 控制收敛定理中“存在可积的 g 使 |fₙ| ≤ g”能否去掉？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 能，只要 fₙ 逐点收敛<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 不能，nχ_{(0,1/n)} 是反例<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 能，只要 fₙ 非负<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 能，只要测度有限<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 换元公式中出现的因子是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> det Dφ 的绝对值<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> det Dφ 的平方<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> ‖Dφ‖<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> φ 的导数之和<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章：流形与微分形式<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 关于外微分，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> d(dω) = ω<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> d(dω) = 0<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> d 只在 0-形式上定义<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> d 与拉回不可交换<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 极坐标下 dx ∧ dy 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> dr ∧ dθ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> r dr ∧ dθ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> r² dr ∧ dθ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> dr ∧ dθ / r<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 黎曼度量给出的体积元是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> det(g) dx<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> √|det(g)| dx¹∧…∧dxᵐ<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> trace(g) dx<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> ‖g‖ dx<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章：流形上的积分<\/h1><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 流形上体积元的表达式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> dx¹∧…∧dxᵐ<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> √|det G| dx¹∧…∧dxᵐ<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> det(G) dx<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> √(trace G) dx<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 斯托克斯定理 ∫_∂M ω = ∫_M dω 中，ω 必须是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 任意函数<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 0-形式<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> m-形式<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> (m−1)-形式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 球面 S² 的面积是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 2πR²<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 4πR²<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 4πR³/3<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> πR²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='σ-代数'>σ-代数 — 对补集与可数并封闭、含全集的集合族。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='测度'>测度 — σ-代数上的可数可加非负函数。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='博雷尔 σ-代数'>博雷尔 σ-代数 — 包含所有开集的最小 σ-代数。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='外测度'>外测度 — 用可数覆盖的体积下确界定义、对所有子集有定义的函数。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='可测集'>可测集 — 满足卡拉泰奥多里切割条件的集合。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='零测集'>零测集 — 测度为 0 的集合。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='几乎处处'>几乎处处 — 除一个零测集之外处处成立。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='勒贝格测度'>勒贝格测度 — ℝⁿ 上由外测度限制得到的平移不变测度。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='豪斯多夫维数'>豪斯多夫维数 — 使豪斯多夫测度从无穷跳到零的临界维数。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='简单函数'>简单函数 — 有限个特征函数的线性组合，只取有限多个值。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='可测函数'>可测函数 — 简单函数列的几乎处处极限。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='博赫纳–勒贝格积分'>博赫纳–勒贝格积分 — 向量值函数通过 L1 完备化定义的积分。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='单调收敛定理'>单调收敛定理 — 非负递增函数列可无条件交换极限与积分。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='法图引理'>法图引理 — 非负函数列给出 ∫liminf ≤ liminf∫ 的不等式。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='控制收敛定理'>控制收敛定理 — 存在可积控制函数时，逐点收敛可交换极限与积分。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='lp 空间'>Lp 空间 — p 次方可积函数的等价类空间，配 Lp 范数。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='赫尔德不等式'>赫尔德不等式 — ‖fg‖₁ ≤ ‖f‖ₚ‖g‖_q，1/p+1/q=1。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='闵可夫斯基不等式'>闵可夫斯基不等式 — Lp 范数满足三角不等式。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='富比尼定理'>富比尼定理 — 乘积空间上的积分可化为累次积分。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='卷积'>卷积 — (f∗g)(x)=∫f(x−y)g(y)dy，傅里叶变换下变乘积。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='磨光核'>磨光核 — 光滑紧支、积分为 1 的非负函数，用于逼近光滑化。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='傅里叶变换'>傅里叶变换 — f̂(ξ)=∫f(x)e^(−2πix·ξ)dx，L² 上是酉算子。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='子流形'>子流形 — 局部在坐标卡中表现为平面切片的子集。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='浸入'>浸入 — 切映射处处单射的光滑映射。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='嵌入'>嵌入 — 到像为同胚的浸入。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='带边流形'>带边流形 — 坐标卡取值于半空间，边界为 xₘ=0 的像。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='k-形式'>k-形式 — 交替 k-线性映射，可楔积、拉回、外微分。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='外微分'>外微分 — d(Σa_I dx^I)=Σda_I∧dx^I，满足 d²=0。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='闭形式'>闭形式 — dω=0 的形式。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='恰当形式'>恰当形式 — 等于 dη 的形式。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='黎曼度量'>黎曼度量 — 每点切空间上的正定内积场。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='霍奇星'>霍奇星 — 依赖度量与定向、把 k-形式映为 (m−k)-形式的算子。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='体积元'>体积元 — √|det g| dx¹∧…∧dxᵐ，流形上的积分缩放因子。 <span class=glossary-ref>（第 12 章：流形上的积分）<\/span><\/li><li data-term='斯托克斯定理'>斯托克斯定理 — ∫_∂M ω = ∫_M dω，统一所有积分公式。 <span class=glossary-ref>（第 12 章：流形上的积分）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库：《分析 III》<\/h1>\n<h2>框架：覆盖 → 外测度 → 筛可测 → 得测度<\/h2>\n<p>这是卡拉泰奥多里路线的四步。遇到&quot;给某类集合赋大小&quot;的问题，先想清楚覆盖用什么基本块（区间、长方体、球），再验证次可加，再用切割条件筛，最后证明限制后满足可数可加。<\/p>\n<h2>框架：简单函数 → 可测函数 → 积分 → 完备化<\/h2>\n<p>积分的标准脚手架。每一步都问&quot;逼近用什么收敛&quot;：简单函数到可测函数是几乎处处，积分定义是单调极限，L1 完备化是范数收敛。<\/p>\n<h2>框架：局部坐标 + 单位分解<\/h2>\n<p>流形上的全局命题几乎都这样证：用单位分解把整体切成有限块，每块落在坐标卡内，化成 ℝᵐ 的命题，证完再拼回去。斯托克斯定理是标准范例。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要交换极限与积分：先说清是单调、非负还是有控制函数；三者都不满足就找反例。\n<\/li><li>\n要判断形式是否恰当：先算 dω；闭了再看区域有没有洞；星形区域可直接用庞加莱引理。\n<\/li><li>\n要算流形上的积分：先定坐标卡，再算度量矩阵，再取 √det G，最后套普通多重积分。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把外测度当测度用<\/strong>。外测度只次可加，直接相加会出错。\n<\/li><li>\n<strong>忽略等价类<\/strong>。Lp 里&quot;几乎处处相等&quot;的函数是同一元素，范数为 0 不代表函数为零。\n<\/li><li>\n<strong>忘掉定向<\/strong>。流形积分换定向变号；不可定向时只能取绝对值。\n<\/li><li>\n<strong>在带洞区域硬用&quot;闭 ⇒ 恰当&quot;<\/strong>。洞是拓扑障碍，局部条件消不掉。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表：《分析 III》<\/h1>\n<h2>定义与公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>σ-代数<\/td><td>含 X；对补集封闭；对可数并封闭<\/td><\/tr><tr><td>测度<\/td><td>μ(∅)=0；不交列 μ(∪Aⱼ)=Σμ(Aⱼ)<\/td><\/tr><tr><td>外测度<\/td><td>λ*(A)=inf Σvol(Qⱼ)，A⊆∪Qⱼ<\/td><\/tr><tr><td>可测（卡拉泰奥多里）<\/td><td>对所有 T：μ<em>(T)=μ<\/em>(T∩A)+μ*(T∩Aᶜ)<\/td><\/tr><tr><td>可测函数<\/td><td>简单函数列的 a.e. 极限<\/td><\/tr><tr><td>简单函数积分<\/td><td>Σ eⱼ μ(Aⱼ)<\/td><\/tr><tr><td>单调收敛<\/td><td>0≤fₙ↑f ⇒ ∫fₙ↑∫f<\/td><\/tr><tr><td>法图引理<\/td><td>∫liminf fₙ ≤ liminf ∫fₙ<\/td><\/tr><tr><td>控制收敛<\/td><td>fₙ→f a.e.，<\/td><td>fₙ<\/td><td>≤g∈L¹ ⇒ ∫fₙ→∫f<\/td><\/tr><tr><td>Lp 范数<\/td><td>‖f‖ₚ=(∫<\/td><td>f<\/td><td>ᵖ)^(1/p)<\/td><\/tr><tr><td>赫尔德<\/td><td>‖fg‖₁≤‖f‖ₚ‖g‖_q，1/p+1/q=1<\/td><\/tr><tr><td>闵可夫斯基<\/td><td>‖f+g‖ₚ≤‖f‖ₚ+‖g‖ₚ<\/td><\/tr><tr><td>富比尼<\/td><td>∫∫f = ∫(∫f dν)dμ = ∫(∫f dμ)dν（绝对可积）<\/td><\/tr><tr><td>换元<\/td><td>∫_V f dy = ∫_U f(φ(x))<\/td><td>det Dφ<\/td><td>dx<\/td><\/tr><tr><td>卷积<\/td><td>(f∗g)(x)=∫f(x−y)g(y)dy<\/td><\/tr><tr><td>傅里叶变换<\/td><td>f̂(ξ)=∫f(x)e^(−2πix·ξ)dx，‖f̂‖₂=‖f‖₂<\/td><\/tr><tr><td>楔积<\/td><td>α∧β(v,w)=α(v)β(w)−α(w)β(v)<\/td><\/tr><tr><td>外微分<\/td><td>d(Σa_I dx^I)=Σda_I∧dx^I；d²=0<\/td><\/tr><tr><td>体积元<\/td><td>dV=√<\/td><td>det g<\/td><td>dx¹∧…∧dxᵐ<\/td><\/tr><tr><td>斯托克斯<\/td><td>∫_∂M ω = ∫_M dω<\/td><\/tr><tr><td>球面面积<\/td><td>4πR²<\/td><\/tr><tr><td>球体积<\/td><td>4πR³/3<\/td><\/tr><\/tbody><\/table>\n<h2>常用推理链<\/h2>\n<ol><li>\n覆盖 → 外测度 → 卡拉泰奥多里 → 测度 → 可测函数 → 积分。\n<\/li><li>\n简单函数 → 单调收敛 → 一般积分 → L1 完备化 → Lp。\n<\/li><li>\n度量 → 格拉姆矩阵 → 体积元 → m-形式积分 → 斯托克斯。\n<\/li><li>\ndω=0 → 闭；星形区域 → 恰当；有洞 → 积分非零（拓扑）。\n<\/ol>\n<h2>反例清单<\/h2>\n<table><thead><tr><th>命题<\/th><th>反例<\/th><\/tr><\/thead><tbody><tr><td>所有集合可测<\/td><td>维塔利集（需选择公理）<\/td><\/tr><tr><td>外测度可加<\/td><td>一般覆盖重叠<\/td><\/tr><tr><td>测度 0 即有限<\/td><td>康托集<\/td><\/tr><tr><td>逐点收敛可交换积分<\/td><td>nχ_{(0,1/n)}<\/td><\/tr><tr><td>闭形式必恰当<\/td><td>(xdy−ydx)/(x²+y²)<\/td><\/tr><tr><td>连续曲线可求长<\/td><td>t cos²(π/2t)<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452582422523394/点化学习系统/03-分析III", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 9 章：测度论基础", "href": "#/chapter/ch09"}, {"label": "第 10 章：积分理论", "href": "#/chapter/ch10"}, {"label": "第 11 章：流形与微分形式", "href": "#/chapter/ch11"}, {"label": "第 12 章：流形上的积分", "href": "#/chapter/ch12"}]}, {"label": "概念", "children": [{"label": "σ-代数与测度", "href": "#/concept/c11"}, {"label": "外测度与可测集", "href": "#/concept/c12"}, {"label": "收敛定理", "href": "#/concept/c13"}, {"label": "Lp 空间", "href": "#/concept/c14"}, {"label": "微分形式与斯托克斯定理", "href": "#/concept/c15"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 9 章：测度论基础", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：积分理论", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：流形与微分形式", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：流形上的积分", "href": "#/quiz/ch12"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch09": "<h1>第 9 章：测度论基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：12 小时 ｜ <strong>前置<\/strong>：第 2 章（完备性）、第 3 章（拓扑）、第 6 章（Riemann 积分）\n<\/ul>\n<blockquote>原书开宗明义：这一章讨论直线、面积、体积以及更高维空间中集合的测度的一般理论，而该理论以初等几何事实为指导——区间有长度，矩形有长乘宽，长方体有长宽高。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 σ-代数的三条公理，并说明为什么测度的定义域必须是 σ-代数。\n<\/li><li>\n用外测度 + 卡拉泰奥多里条件定义可测集，解释这条条件在防什么。\n<\/li><li>\n说明勒贝格测度为什么不能给 ℝⁿ 的每个子集赋值（不可测集的存在）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>测度是&quot;给集合赋大小&quot;的函数，但它的定义域不能是全部子集，必须是一个对可数并、补集封闭的族（σ-代数）；勒贝格测度的构造路线是&quot;先定义外测度，再用卡拉泰奥多里条件筛出可测集&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要 σ-代数<\/h3>\n<p>要给 ℝ 的子集赋&quot;长度&quot;，最自然的要求是：<\/p>\n<ul><li>\n区间的长度是 b − a；\n<\/li><li>\n不交并的长度可加（可数多个也允许）；\n<\/li><li>\n平移不改变长度。\n<\/ul>\n<p>如果对所有子集都能赋值，就会和&quot;选择公理 + 可数可加&quot;冲突——维塔利构造出的集合，无论赋什么值都会矛盾。所以必须限制定义域。<\/p>\n<p>σ-代数 A ⊆ P(X) 满足：<\/p>\n<ol><li>\nX ∈ A；\n<\/li><li>\nA ∈ A ⇒ Aᶜ ∈ A；\n<\/li><li>\n可数并 ∪Aⱼ ∈ A。\n<\/ol>\n<p>由德摩根律，可数交也封闭。测度 μ : A → [0, ∞] 再满足 μ(∅) = 0 与可数可加性：不交的 Aⱼ 满足 μ(∪Aⱼ) = Σμ(Aⱼ)。<\/p>\n<p><strong>类比<\/strong>：σ-代数是一张&quot;允许测量的清单&quot;。不在清单上的集合，不是&quot;大小为 0&quot;，而是&quot;没有定义&quot;。<strong>边界<\/strong>：清单必须对补集和可数并封闭，否则&quot;两个可测集相减&quot;会跑出清单。<\/p>\n<h3>概念 2：博雷尔 σ-代数<\/h3>\n<p>给定拓扑空间 X，包含所有开集的最小 σ-代数叫博雷尔 σ-代数 B(X)。它包含开集、闭集、可数交并、以及所有通过极限操作得到的集合。<\/p>\n<p>为什么需要它？因为连续函数、极限、开集这些概念都是拓扑的，而&quot;可测&quot;要与它们兼容。勒贝格可测集比博雷尔多：它是博雷尔 σ-代数加上所有零测集的子集（完备化）。<\/p>\n<h3>概念 3：外测度<\/h3>\n<p>外测度 μ* : P(X) → [0, ∞] 对<strong>所有<\/strong>子集都有定义，满足单调性与可数次可加性：<\/p>\n<p>μ<em>(∪Aⱼ) ≤ Σμ<\/em>(Aⱼ)。<\/p>\n<p>ℝⁿ 上的勒贝格外测度定义为<\/p>\n<p>λ*(A) := inf{Σ vol(Qⱼ) : A ⊆ ∪Qⱼ}，<\/p>\n<p>其中 Qⱼ 是开长方体。也就是&quot;用可数多个长方体盖住 A，取总体积的下确界&quot;。<\/p>\n<p>外测度对每个集合都有值，但一般不满足可加性：两个不交集合的外测度之和可能小于并的外测度（因为覆盖可以&quot;跨接&quot;）。<\/p>\n<p><strong>类比<\/strong>：外测度像&quot;用最小的包装纸把东西包起来&quot;，包装纸可以重叠、可以包到空气。它对任何东西都能量，但两个东西分开包和一起包，包装纸用量可能不同。<\/p>\n<h3>概念 4：卡拉泰奥多里可测条件<\/h3>\n<p>A 可测，如果对<strong>每个<\/strong>测试集 T，<\/p>\n<p>μ<em>(T) = μ<\/em>(T ∩ A) + μ*(T ∩ Aᶜ)。<\/p>\n<p>这条条件的直觉是：A 必须像一把&quot;干净刀&quot;，无论怎么切 T，两块的测度之和都等于原来的测度。它排除了那些&quot;边界模糊、切开后总量会变&quot;的集合。<\/p>\n<p>由外测度构造的 μ* 限制在可测集上就是一个测度，记作 μ。这是卡拉泰奥多里给出的构造定理，也是本书第 3、4 节的主线。<\/p>\n<p><strong>类比<\/strong>：A 可测就像一把好刀切蛋糕：不管蛋糕多大、形状多怪，切下去两块的重量之和等于原来那块。刀不利（不可测集），切的过程中会掉渣。<\/p>\n<h3>概念 5：勒贝格测度<\/h3>\n<p>在 ℝⁿ 上，用长方体覆盖定义外测度，再取可测集，得到勒贝格测度 λₙ。它的性质：<\/p>\n<ul><li>\n平移、旋转不变；\n<\/li><li>\n开集的测度可以算，闭集也可以；\n<\/li><li>\n单点、可数集测度为 0；\n<\/li><li>\n康托集测度为 0，但不可数；\n<\/li><li>\n存在不可测集（维塔利，用选择公理把 [0,1] 分成可数多份等测度的类）。\n<\/ul>\n<p><strong>康托集的警示<\/strong>：它和区间等势（不可数），测度却是 0。&quot;大小&quot;和&quot;元素多少&quot;是两套独立的度量。<\/p>\n<p><strong>类比<\/strong>：勒贝格测度像&quot;称重量&quot;。一根细粉笔和一块海绵可以一样重，体积、元素个数都不能决定重量。<\/p>\n<h3>概念 6：豪斯多夫测度与维数（延伸）<\/h3>\n<p>用直径 ≤ δ 的可数覆盖定义 h^s_δ(A)，取 δ → 0 得 s 维豪斯多夫测度。使测度从 ∞ 跳到 0 的临界 s 叫豪斯多夫维数。康托集的维数是 log2/log3 ≈ 0.63，介于点和线之间。这部分在书中作为测度构造的例子出现，提示&quot;维数&quot;本身可以被测度定义。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[集合族 P X] --&gt; B[σ-代数]\n  B --&gt; C[测度空间 X A mu]\n  D[长方体覆盖] --&gt; E[外测度 对所有子集]\n  E --&gt; F[卡拉泰奥多里条件]\n  F --&gt; G[可测集]\n  G --&gt; H[勒贝格测度]\n  H --&gt; I[平移不变 可数可加]\n  H --&gt; J[存在不可测集]\n  B --&gt; K[博雷尔 σ-代数]\n  K --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：上面一条是&quot;公理化路线&quot;（先定 σ-代数与测度），下面一条是&quot;构造路线&quot;（先外测度再筛可测集）。两条在勒贝格测度处汇合，这是本书的叙事结构，也是做测度题的标准路径：先用覆盖算外测度，再验卡拉泰奥多里条件。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：测度像给房间估面积。可以精确量的房间（可测集）满足&quot;怎么切都守恒&quot;；有些房间（不可测集）无论怎么估都会和切割结果矛盾，只能承认&quot;没有面积&quot;。 <strong>失效边界<\/strong>：测度不是万能的——&quot;每个集合都有面积&quot;这个直觉是错的；选择公理下不可测集必然存在。<\/p>\n<p><strong>实例（可验证）<\/strong>：证明单点集测度为 0。 对任意 ε &gt; 0，用长度 ε 的区间盖住 {x}，外测度 ≤ ε。因 ε 任意，外测度 = 0。又 ∅ 可测，单点 = 区间 ∩ 补集之类可测，故测度为 0。 这个论证展示了&quot;外测度 → 下确界 → 任意 ε&quot;的标准套路。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;所有集合都可测&quot;<\/strong> — 实际上维塔利定理给出不可测集，前提是接受选择公理。测度论的公理化就是为了绕开这个矛盾。\n<\/li><li>\n<strong>别以为&quot;测度为 0 就是空集或有限集&quot;<\/strong> — 实际上康托集不可数、测度为 0。\n<\/li><li>\n<strong>别以为外测度就是测度<\/strong> — 实际上外测度只次可加，不满足可加；只有限制在可测集上才成为测度。\n<\/li><li>\n<strong>别以为&quot;可测&quot;是集合自身的性质<\/strong> — 实际上它相对于给定的外测度（也就是给定的测度空间）而言。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nσ-代数不需要满足下列哪条？　A. 包含全集　B. 对补集封闭　C. 对可数并封闭　D. 对任意并封闭\n<p><strong>答案<\/strong>：D。<strong>解析<\/strong>：σ-代数只要求可数并封闭；任意并会超出可数可加性的框架，也不需要。<\/p>\n<\/ol>\n<ol><li>\n卡拉泰奥多里条件的作用是？　A. 定义外测度　B. 筛选出可测集　C. 证明选择公理　D. 计算体积\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：条件 μ<em>(T) = μ<\/em>(T∩A) + μ*(T∩Aᶜ) 对所有 T 成立时，称 A 可测；这是从外测度得到测度的筛子。<\/p>\n<\/ol>\n<ol><li>\n康托集的性质是？　A. 可数且测度为 0　B. 不可数且测度为 0　C. 不可数且测度为正　D. 可数且测度为正\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：康托集与 [0,1] 等势（不可数），但总长度（测度）为 0。这说明&quot;元素多少&quot;与&quot;测度大小&quot;是两回事。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nσ-代数 = 允许测量的集合清单，对补集与可数并封闭。\n<\/li><li>\n外测度对所有子集有定义，但只次可加；可测性用卡拉泰奥多里条件筛。\n<\/li><li>\n勒贝格测度：平移不变、可数可加；不可测集存在，康托集测度为 0。\n<\/ul>", "ch10": "<h1>第 10 章：积分理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：16 小时 ｜ <strong>前置<\/strong>：第 9 章（测度）、第 6 章（Riemann 积分）、第 2 章（完备性）\n<\/ul>\n<blockquote>原书把构造路线说得很直接：先引入一般测度空间上的积分，用简单函数空间的 L¹-完备化来实现；这样既能处理向量值函数（博赫纳–勒贝格积分），又为收敛定理的证明打好地基。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用简单函数逼近定义 μ-可测函数，说明&quot;几乎处处&quot;在证明中怎么用。\n<\/li><li>\n说出单调收敛定理与控制收敛定理的条件，并用它们交换极限与积分。\n<\/li><li>\n证明 Lp 空间完备，区分&quot;函数&quot;与&quot;等价类&quot;。\n<\/li><li>\n写出富比尼定理、换元公式与傅里叶变换的基本性质。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>勒贝格积分不是&quot;更复杂的面积&quot;，而是&quot;用简单函数在几乎处处意义下逼近，再把 L¹ 补齐成完备空间&quot;；一旦完备，极限与积分就能在很宽的条件下交换，这是它比黎曼积分强的地方。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：可测函数<\/h3>\n<p>设 (X, A, μ) 是测度空间。简单函数是有限个特征函数的线性组合：<\/p>\n<p>f = Σ eⱼ χ_{Aⱼ}，μ(Aⱼ) &lt; ∞。<\/p>\n<p>它只取有限多个值，每个值的原像可测。可测函数是简单函数列的几乎处处极限：存在简单函数 fⱼ，使 fⱼ → f 在 μ-几乎处处意义下成立，即除去一个零测集之外处处收敛。<\/p>\n<p>&quot;几乎处处&quot;不是偷懒，它是勒贝格理论的语法。零测集上的行为不影响积分，也不影响大多数定理。代价是结论都带&quot;a.e.&quot;（almost everywhere，几乎处处）。<\/p>\n<p><strong>类比<\/strong>：可测函数像&quot;允许有污点的扫描件&quot;：只要污点面积为零（有限个像素、可数条线），内容就算清晰可读。 <strong>边界<\/strong>：如果污点是一整片（正测度），就不行；零测集必须真的是&quot;面积为 0&quot;。<\/p>\n<h3>概念 2：积分怎么定义<\/h3>\n<p>三步走：<\/p>\n<ol><li>\n简单函数 f = Σ eⱼ χ_{Aⱼ} 的积分定义为 Σ eⱼ μ(Aⱼ)。\n<\/li><li>\n非负可测函数 f：取简单函数列 0 ≤ fⱼ ↑ f，定义 ∫f := lim ∫fⱼ（这个极限与逼近列的选择无关，由单调收敛定理保证）。\n<\/li><li>\n一般可测函数：拆成正部与负部，f = f⁺ − f⁻，若两部分的积分都有限，则称 f 可积（L¹），定义 ∫f = ∫f⁺ − ∫f⁻。\n<\/ol>\n<p>向量值函数（取值在巴拿赫空间）：用&quot;简单函数空间在 L¹ 范数下的完备化&quot;来定义。这一步用到了第 2 章的完备化思想：先定义简单函数上的积分，再取 L¹ 范数 ‖f‖₁ := ∫‖f‖，完备化后得到的空间就是 L¹(X, μ, E)，积分延拓为连续线性泛函。<\/p>\n<p><strong>类比<\/strong>：先用乐高小块拼出形状（简单函数），再取&quot;误差面积趋于 0&quot;的极限。完备化保证极限不会跑出空间。<\/p>\n<h3>概念 3：三大收敛定理<\/h3>\n<ul><li>\n<strong>单调收敛<\/strong>：0 ≤ fₙ ↑ f a.e.，则 ∫fₙ ↑ ∫f。允许积分值为 ∞。\n<\/li><li>\n<strong>法图引理<\/strong>：∫liminf fₙ ≤ liminf ∫fₙ（非负可测）。它是单调收敛与控制收敛之间的桥梁。\n<\/li><li>\n<strong>控制收敛<\/strong>：fₙ → f a.e.，且存在可积的 g 使 |fₙ| ≤ g a.e.，则 ∫fₙ → ∫f。\n<\/ul>\n<p>控制收敛的条件&quot;存在可积的控制函数&quot;不能省。反例：fₙ = n χ_{(0, 1/n)} 在 (0,1) 上，fₙ → 0 处处，但 ∫fₙ = 1，积分不趋于 0。这里没有可积的控制函数（sup 是 n，越来越大）。<\/p>\n<p><strong>类比<\/strong>：控制函数是一张&quot;封顶预算&quot;。只要所有 fₙ 都在这张预算之下，支出（积分）就能随函数收敛而收敛。没有封顶，某一项可以突然爆掉。<\/p>\n<h3>概念 4：Lp 空间<\/h3>\n<p>对 1 ≤ p &lt; ∞，‖f‖ₚ := (∫‖f‖ᵖ)^{1/p}；p = ∞ 时取本质上确界。<\/p>\n<ul><li>\nLp 是巴拿赫空间（完备）。\n<\/li><li>\np = 2 时是希尔伯特空间，内积 ⟨f, g⟩ = ∫fḡ。\n<\/li><li>\n赫尔德不等式：‖fg‖₁ ≤ ‖f‖ₚ‖g‖_q，1/p + 1/q = 1。\n<\/li><li>\n闵可夫斯基不等式：‖f + g‖ₚ ≤ ‖f‖ₚ + ‖g‖ₚ，给出三角不等式。\n<\/ul>\n<p><strong>等价类问题<\/strong>：Lp 的元素严格来说是&quot;几乎处处相等&quot;的函数等价类，而不是单个函数。书中反复强调这一点：说&quot;f ∈ Lp&quot;时，f 其实是代表元；两个处处不同的函数可以是同一个元素。这不是吹毛求疵，否则 ‖f‖ₚ = 0 却不能推出 f = 0。<\/p>\n<h3>概念 5：与黎曼积分的关系<\/h3>\n<p>在 ℝⁿ 的勒贝格测度下，一维勒贝格积分是&quot;绝对可积的黎曼积分&quot;的推广：若 f 黎曼可积，则它勒贝格可积且积分相同；反过来，勒贝格可积的函数不必黎曼可积（Dirichlet 函数勒贝格积分为 0，黎曼不可积）。<\/p>\n<p>差别在极限定理：黎曼积分要求一致收敛才能交换极限与积分，勒贝格积分只要控制收敛。这是勒贝格理论的核心优势。<\/p>\n<h3>概念 6：富比尼定理<\/h3>\n<p>对 σ-有限的乘积测度空间，<\/p>\n<p>∫_{X×Y} f d(μ⊗ν) = ∫_X (∫_Y f(x,y) dν) dμ = ∫_Y (∫_X f(x,y) dμ) dν，<\/p>\n<p>只要 f 可积（或非负可测）。它把高维积分化归为累次积分。<\/p>\n<p>使用时注意：非负可测可以直接换序；一般可积函数要先验证 ∫∫|f| &lt; ∞，否则可能得出矛盾（比如 f 在某个区域正、某个区域负，两边都无穷）。<\/p>\n<h3>概念 7：卷积与逼近<\/h3>\n<p>(f ∗ g)(x) := ∫ f(x − y)g(y) dy。<\/p>\n<p>性质：卷积平滑（g 光滑则 f ∗ g 光滑）、满足结合律与交换律、傅里叶变换把卷积变成乘积。用光滑磨光核（mollifier）可以证明：Lp 函数可被光滑函数逼近；连续函数可被磨光后一致逼近。这是第 12 章单位分解定理的技术准备。<\/p>\n<h3>概念 8：换元公式<\/h3>\n<p>若 φ : U → V 是 C¹ 微分同胚，则<\/p>\n<p>∫_V f(y) dy = ∫_U f(φ(x)) |det Dφ(x)| dx。<\/p>\n<p>雅可比行列式是&quot;局部体积放大率&quot;。一维时就是 ∫f(φ(x))|φ′(x)|dx。证明思路：先对特征函数验证（两边都化为体积），再用简单函数逼近，最后用单调收敛取极限。<\/p>\n<h3>概念 9：傅里叶变换<\/h3>\n<p>f̂(ξ) := ∫ f(x) e^{−2πi x·ξ} dx。<\/p>\n<p>基本性质：L¹ ∩ L² 上定义良好；普朗歇尔定理给出 ‖f̂‖₂ = ‖f‖₂（酉性）；卷积变乘积：\\widehat{f ∗ g} = f̂ ĝ。它是&quot;把函数按频率分解&quot;，也是偏微分方程求解的主力工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[简单函数] --&gt; B[可测函数 几乎处处极限]\n  B --&gt; C[非负可测 积分]\n  C --&gt; D[可积函数 L1]\n  D --&gt; E[L1 完备化 博赫纳-勒贝格]\n  E --&gt; F[单调收敛 控制收敛 法图]\n  E --&gt; G[Lp 空间 完备]\n  E --&gt; H[富比尼 累次积分]\n  E --&gt; I[换元 雅可比行列式]\n  E --&gt; J[卷积 磨光 逼近]\n  J --&gt; K[傅里叶变换 卷积变乘积]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：所有分支都从&quot;简单函数 → 可测函数 → 积分&quot;这条主干长出。收敛定理是主干的枢纽：没有它，后面的 Lp 完备、富比尼换序都无法证明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：勒贝格积分像&quot;按重量称一堆形状各异的零件&quot;。黎曼积分要先把零件按格子分类（分割定义域），勒贝格积分按&quot;高度层&quot;分类（按函数值分层），所以对形状不敏感，对&quot;高度分布&quot;敏感。 <strong>失效边界<\/strong>：按高度分层要求&quot;每层的原像可测&quot;，这正是可测函数的意义；如果函数太病态（不可测），这套分层就失效。<\/p>\n<p><strong>实例（可验证）<\/strong>：证明 ∫₀¹ x dx = 1/2 在勒贝格意义下也成立。 取简单函数列 φₙ = Σ_{k=1}^{n} ((k−1)/n) χ_{((k−1)/n, k/n)}，则 0 ≤ φₙ ≤ x 且 φₙ ↑ x（在无理点也收敛，因为网格加密时下取整逼近 x）。∫φₙ = Σ((k−1)/n)(1/n) = (n−1)/(2n) → 1/2。由单调收敛，∫x = 1/2。 这个例子说明：勒贝格积分在&quot;好函数&quot;上与黎曼积分一致，差别只出现在极限与病态函数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;几乎处处&quot;是含糊其辞&quot;<\/strong> — 实际上它有精确定义：不成立的集合是零测集。零测集上的修改不改变积分。\n<\/li><li>\n<strong>别以为&quot;控制收敛可以去掉控制函数&quot;<\/strong> — 实际上 nχ_{(0,1/n)} 是标准反例：逐点收敛到 0，积分却恒为 1。\n<\/li><li>\n<strong>别以为&quot;Lp 的元素就是函数&quot;<\/strong> — 实际上元素是几乎处处相等的等价类；否则范数为 0 推不出零元。\n<\/li><li>\n<strong>别以为&quot;富比尼定理可以无条件换序&quot;<\/strong> — 实际上要先验证绝对可积，否则正负无穷会打架。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n勒贝格积分相对黎曼积分的核心优势是？　A. 能算更多初等函数　B. 在更弱条件下交换极限与积分　C. 不需要测度　D. 只适用于连续函数\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：控制收敛定理只需逐点收敛 + 可积控制函数，而黎曼积分通常要一致收敛。计算能力不是主要差别。<\/p>\n<\/ol>\n<ol><li>\n控制收敛定理中，&quot;存在可积的 g 使 |fₙ| ≤ g&quot;这一条能否去掉？　A. 能，只要 fₙ 逐点收敛　B. 不能，nχ_{(0,1/n)} 是反例　C. 能，只要 fₙ 非负　D. 能，只要测度有限\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：该例逐点收敛到 0，但积分恒为 1；没有可积控制函数，结论失效。<\/p>\n<\/ol>\n<ol><li>\n换元公式中出现的因子是？　A. det Dφ 的绝对值　B. det Dφ 的平方　C. ‖Dφ‖　D. φ 的导数之和\n<p><strong>答案<\/strong>：A。<strong>解析<\/strong>：雅可比行列式的绝对值是局部体积放大率；一维时就是 |φ′|。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n可测 = 简单函数的几乎处处极限；积分 = 简单函数积分的极限。\n<\/li><li>\n三大收敛定理是勒贝格理论的发动机，控制函数不能省。\n<\/li><li>\n富比尼、换元、傅里叶是三大应用支柱；Lp 的元素是等价类。\n<\/ul>", "ch11": "<h1>第 11 章：流形与微分形式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：16 小时 ｜ <strong>前置<\/strong>：第 7 章（多变量微分、流形）、第 8 章（线积分、普法夫形式）\n<\/ul>\n<blockquote>原书把这一章定位成线积分的高维类比：第八章学了普法夫形式和线积分，这一章处理&quot;高阶微分形式在 ℝⁿ 的某些子流形上积分&quot;。换句话说，被积对象从 1-形式升级到 k-形式，积分区域从曲线升级到曲面。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用坐标卡定义子流形，区分浸入与嵌入、带边流形。\n<\/li><li>\n写出楔积的反对称性与外微分 d 的定义，判断形式是否闭、是否恰当。\n<\/li><li>\n用拉回把 ℝⁿ 上的形式搬到流形上，说明定向的作用。\n<\/li><li>\n写出黎曼度量的局部表示，用梯度、散度、旋度与霍奇星统一向量分析。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>k-形式是&quot;吃 k 个切向量、吐一个数&quot;的反对称仪器；外微分 d 把 k-形式变成 (k+1)-形式，并让&quot;闭&quot;与&quot;恰当&quot;、局部与整体通过斯托克斯定理连接起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：子流形、浸入、嵌入<\/h3>\n<p>m 维流形 M 是 ℝᵐ̄ 的子集，每点附近有坐标卡 (φ, U)，把 M ∩ U 拉平成 ℝᵐ 的开集。<\/p>\n<p>L ⊆ M 是 ℓ 维子流形：对每个 p ∈ L，存在 M 的坐标卡使 φ(U ∩ L) = φ(U) ∩ (ℝℓ × {0})。也就是&quot;局部看，L 就是 M 坐标里的一个平面&quot;。<\/p>\n<ul><li>\n<strong>浸入<\/strong>：f : M → N 的切映射 Tₚf 在每个 p 处单射（不压扁维度）。\n<\/li><li>\n<strong>嵌入<\/strong>：浸入 + 到像的同胚（不自我相交、不把远处粘近）。\n<\/li><li>\n<strong>带边流形<\/strong>：坐标卡取值在半空间 ℍᵐ = {x : xₘ ≥ 0}，边界是 xₘ = 0 的像。\n<\/ul>\n<p><strong>类比<\/strong>：浸入像把一张纸弯成波浪放进盒子，局部不折叠；嵌入还要求纸不自交、不贴近自己。<strong>边界<\/strong>：浸入可以全局自交（如 8 字形曲线），这时它不是嵌入。<\/p>\n<h3>概念 2：多重线性代数：楔积<\/h3>\n<p>k-形式是交替 k-线性映射：交换两个自变量，符号变号。<\/p>\n<p>ω(v₁, …, vₖ) = −ω(…, vⱼ, …, vᵢ, …)。<\/p>\n<p>楔积：对 1-形式 α、β，α ∧ β(v, w) := α(v)β(w) − α(w)β(v)。它自动反对称，且 α ∧ β = −β ∧ α、α ∧ α = 0。<\/p>\n<p>在坐标基下，dx¹ ∧ … ∧ dxᵏ 作用在向量组上就是&quot;矩阵的行列式&quot;。这解释了一个关键事实：<strong>形式天然适合测量有向体积<\/strong>。<\/p>\n<p><strong>类比<\/strong>：楔积像&quot;带方向的平行四边形面积&quot;。交换两条边，方向翻转，面积变号；两条边重合，面积为零。 <strong>边界<\/strong>：只有在有定向的空间里&quot;变号&quot;才有意义；无定向流形上，形式只能测&quot;无向体积&quot;的绝对值。<\/p>\n<h3>概念 3：外微分 d<\/h3>\n<p>对 k-形式 ω = Σ a_I dx^I，定义<\/p>\n<p>dω := Σ da_I ∧ dx^I，<\/p>\n<p>其中 da_I 是普通微分。三条性质：<\/p>\n<ol><li>\nd(dω) = 0（&quot;边界的边界为空&quot;）。\n<\/li><li>\nd 满足莱布尼茨律：d(ω ∧ η) = dω ∧ η + (−1)^k ω ∧ dη。\n<\/li><li>\n拉回与 d 交换：d(f<em>ω) = f<\/em>(dω)。\n<\/ol>\n<p><strong>闭<\/strong>：dω = 0。<strong>恰当<\/strong>：ω = dη。由 d² = 0，恰当必闭；反之在星形区域上闭必恰当（庞加莱引理），有洞时不成立。<\/p>\n<p>1-形式的情形就是第 8 章的普法夫形式：ω = Σaⱼdxⱼ，dω = Σ(∂aⱼ/∂xₖ)dxₖ ∧ dxⱼ，闭性等价于 ∂aⱼ/∂xₖ = ∂aₖ/∂xⱼ。<\/p>\n<p><strong>类比<\/strong>：d 像&quot;求边界&quot;。一个区域的边界没有边界（闭合曲线），所以 d² = 0。<strong>边界<\/strong>：d² = 0 是代数的，不是几何的&quot;边界无边界&quot;的严格证明；后者要靠斯托克斯定理。<\/p>\n<h3>概念 4：向量场、内积、李导数<\/h3>\n<p>向量场 X 是每点给一个切向量。形式与向量场通过内积 ι_X 配对：ι_X ω 是把 X 塞进第一个变量后得到的 (k−1)-形式。<\/p>\n<p>李导数 L_X ω 描述&quot;沿 X 流动时 ω 的变化率&quot;，嘉当公式：<\/p>\n<p>L_X = d ι_X + ι_X d。<\/p>\n<p>这条公式把&quot;流动的变化&quot;拆成&quot;边界的内部&quot;与&quot;内部的边界&quot;，是微分形式运算的核心恒等式。<\/p>\n<h3>概念 5：黎曼度量<\/h3>\n<p>黎曼度量是每点切空间上的正定内积 g。局部写成矩阵 gⱼₖ = g(∂ⱼ, ∂ₖ)，光滑对称正定。<\/p>\n<p>它给出：<\/p>\n<ul><li>\n长度：‖v‖ = √(g(v,v))；\n<\/li><li>\n角度：cos θ = g(v,w)/(‖v‖‖w‖)；\n<\/li><li>\n体积元：√det(g) dx¹ ∧ … ∧ dxᵐ。\n<\/ul>\n<p>半黎曼（伪黎曼）度量只要求非退化，不要求正定；闵可夫斯基空间的时间分量取负号，是相对论的几何基础。<\/p>\n<p><strong>类比<\/strong>：度量是&quot;每个点自带的一把尺子&quot;。平面上的尺子处处相同，球面上的尺子随位置变，所以球面三角形的内角和大于 π。<\/p>\n<h3>概念 6：梯度、散度、旋度与霍奇星<\/h3>\n<p>在 ℝ³ 的欧氏度量下，三种经典算子可以统一写成：<\/p>\n<ul><li>\ngrad f ↔ df（0-形式变 1-形式）；\n<\/li><li>\ncurl X ↔ *d(X♭)（1-形式变 1-形式）；\n<\/li><li>\ndiv X ↔ <em>d(<\/em>X♭)（1-形式变 0-形式）。\n<\/ul>\n<p>霍奇星 <em> 把 k-形式变成 (m−k)-形式，依赖度量与定向。于是&quot;梯度–旋度–散度&quot;不再是三个孤立公式，而是 d 与 <\/em> 的不同组合。这也是麦克斯韦方程组能用微分形式写成两行的原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[子流形 浸入 嵌入] --&gt; B[切空间]\n  B --&gt; C[k-形式 交替多线性]\n  C --&gt; D[楔积 有向体积]\n  D --&gt; E[外微分 d]\n  E --&gt; F[闭 d omega = 0]\n  E --&gt; G[恰当 omega = d eta]\n  F --&gt; H[庞加莱引理 星形区域]\n  C --&gt; I[拉回 坐标变换]\n  C --&gt; J[黎曼度量 g]\n  J --&gt; K[体积元 根号 det g]\n  J --&gt; L[霍奇星]\n  L --&gt; M[梯度 散度 旋度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左边是几何对象（流形与切空间），中间是代数对象（形式与 d），右边是度量结构（g 与 *）。第 12 章的积分会同时用到三者：在流形上积分 m-形式，被积对象来自中间，体积元来自右边。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：k-形式像&quot;测量仪器&quot;：1-形式测&quot;沿方向的累积&quot;，2-形式测&quot;穿过面的通量&quot;，3-形式测&quot;体内的总量&quot;。d 是把&quot;测边界的仪器&quot;升级成&quot;测内部的仪器&quot;。 <strong>失效边界<\/strong>：仪器必须有定向才能区分正负；在不可定向的流形（莫比乌斯带）上，最高阶形式的积分只能取绝对值。<\/p>\n<p><strong>实例（可验证）<\/strong>：极坐标下的面积形式。 x = r cos θ，y = r sin θ。dx = cos θ dr − r sin θ dθ，dy = sin θ dr + r cos θ dθ。 dx ∧ dy = (cos θ)(r cos θ) dr ∧ dθ − (−r sin θ)(sin θ) dθ ∧ dr = r(cos²θ + sin²θ) dr ∧ dθ = r dr ∧ dθ。 这正是换元公式里雅可比行列式 r 的来源，说明&quot;形式自动带雅可比&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;形式就是无穷小量&quot;<\/strong> — 实际上形式是作用在切向量上的线性函数，dx 不是&quot;很小的 x&quot;，而是&quot;取 x 分量的仪器&quot;。\n<\/li><li>\n<strong>别以为&quot;闭形式一定恰当&quot;<\/strong> — 实际上只在单连通（星形）区域成立；绕洞的形式是反例。\n<\/li><li>\n<strong>别以为&quot;浸入就是嵌入&quot;<\/strong> — 实际上浸入允许全局自交，嵌入还要求到像的同胚。\n<\/li><li>\n<strong>别以为&quot;霍奇星与度量无关&quot;<\/strong> — 实际上 * 依赖度量与定向，换度量结果就变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n关于外微分，正确的说法是？　A. d(dω) = ω　B. d(dω) = 0　C. d 只在 0-形式上定义　D. d 与拉回不可交换\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：d² = 0 是外微分的代数性质；恰当形式必闭，但闭不一定恰当。<\/p>\n<\/ol>\n<ol><li>\n极坐标下 dx ∧ dy 等于？　A. dr ∧ dθ　B. r dr ∧ dθ　C. r² dr ∧ dθ　D. dr ∧ dθ/r\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：直接计算得 dx ∧ dy = r dr ∧ dθ，因子 r 就是极坐标换元的雅可比行列式。<\/p>\n<\/ol>\n<ol><li>\n黎曼度量给出的体积元是？　A. det(g) dx　B. √|det(g)| dx¹∧…∧dxᵐ　C. trace(g) dx　D. ‖g‖ dx\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：体积元是 √|det g| 乘以坐标形式的楔积；正定度量可以去掉绝对值。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nk-形式 = 交替 k-线性仪器；楔积给有向体积，交换自变量变号。\n<\/li><li>\nd² = 0；恰当必闭，闭在星形区域上恰当。\n<\/li><li>\n度规给长度、角度、体积元；霍奇星把 grad/div/curl 统一成 d 与 * 的组合。\n<\/ul>", "ch12": "<h1>第 12 章：流形上的积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：14 小时 ｜ <strong>前置<\/strong>：第 9 章（测度）、第 10 章（积分理论）、第 11 章（微分形式、度量）\n<\/ul>\n<blockquote>原书在这一章开头说：前两章建立了测度与积分，上一章加深了对流形与微分形式的认识，现在准备把积分理论推广到流形上——也就是能在&quot;弯曲空间&quot;上积分。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用坐标卡把 ℝᵐ 的勒贝格测度&quot;抬&quot;到流形上，说明为什么这个定义与坐标无关。\n<\/li><li>\n用体积元 √|det g| dx¹∧…∧dxᵐ 计算曲面面积与流形体积。\n<\/li><li>\n在流形上积分 m-形式，并用斯托克斯定理把闭路/闭面积分换成内部的 dω。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>流形上的积分 = 局部坐标下普通积分 + 体积元修正；斯托克斯定理 ∮_∂M ω = ∫_M dω 把&quot;边界上的积分&quot;与&quot;内部的微分&quot;连成一条等式，是所有积分定理的统一形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：把测度从 ℝᵐ 抬到流形<\/h3>\n<p>流形局部像 ℝᵐ 的开集，所以&quot;可测&quot;可以逐坐标卡定义：A ⊆ M 可测，如果对每个 p ∈ A，存在坐标卡 (φ, U) 使 φ(A ∩ U) 是 ℝᵐ 中的勒贝格可测集。<\/p>\n<p>这个定义要证明与坐标卡选取无关：两套坐标之间的转换是微分同胚，而微分同胚把可测集映成可测集（第 10 章换元公式的推论）。于是得到流形上的 σ-代数 L_M，它包含博雷尔 σ-代数。<\/p>\n<p><strong>类比<\/strong>：给地球仪贴地图。每块小区域用一张平面地图描述，可测性就是&quot;在这张地图上有面积&quot;；换一张地图，面积仍然有定义，因为地图之间的转换是光滑可逆的。<\/p>\n<h3>概念 2：体积测度与体积元<\/h3>\n<p>给定（伪）黎曼度量 g，坐标卡 φ = (x¹, …, xᵐ)，格拉姆矩阵 G = (gⱼₖ)，体积元定义为<\/p>\n<p>dV := √|det G| dx¹ ∧ … ∧ dxᵐ。<\/p>\n<p>对 A ⊆ U，体积<\/p>\n<p>vol(A) := ∫_{φ(A)} √|det G| dx。<\/p>\n<p>引理：这个值与坐标卡的选择无关，因为坐标变换的雅可比行列式正好抵消 √|det G| 的变换因子。这正是第 10 章换元公式的用武之地。<\/p>\n<p>特例：<\/p>\n<ul><li>\nℝᵐ 的欧氏度量：G = I，dV = dx，回到普通体积。\n<\/li><li>\n球面 S²：用球坐标，得 dV = R² sin θ dθ dφ，积分给出 4πR²。\n<\/li><li>\n图像 z = f(x,y)：dV = √(1 + |∇f|²) dx dy，这就是曲面面积公式。\n<\/ul>\n<p><strong>类比<\/strong>：体积元是&quot;每个点自带的缩放因子&quot;。平面地图上的 1 平方厘米，在球面上可能对应不同的实际面积，√det G 就是换算率。<\/p>\n<h3>概念 3：m-形式的积分<\/h3>\n<p>在定向的 m 维流形 M 上，m-形式可以写成 ω = f dV（f 是光滑函数）。定义<\/p>\n<p>∫_M ω := ∫_{φ(U)} f ∘ φ⁻¹ · √|det G| dx。<\/p>\n<p>关键点：<\/p>\n<ol><li>\n只有 m-形式（最高阶）能在 m 维流形上积分；低阶形式要沿子流形积分。\n<\/li><li>\n定向决定符号：换定向，积分变号。\n<\/li><li>\n拉回与换元保证定义与坐标无关。\n<\/ol>\n<p>1-形式沿曲线的积分就是第 8 章的线积分；2-形式沿曲面的积分就是通量；m-形式在 m 维区域上的积分就是&quot;总量&quot;。<\/p>\n<h3>概念 4：斯托克斯定理<\/h3>\n<p>设 M 是带边的定向 m 维流形，ω 是紧支集的 (m−1)-形式，则<\/p>\n<p>∫_∂M ω = ∫_M dω，<\/p>\n<p>其中 ∂M 继承 M 的诱导定向。<\/p>\n<p>这是本章的高潮，也是全书积分理论的统一形式：<\/p>\n<ul><li>\n微积分基本定理：m = 1，∫_a^b f′ dx = f(b) − f(a)。\n<\/li><li>\n格林公式：平面区域，∮ P dx + Q dy = ∫∫(Q_x − P_y) dx dy。\n<\/li><li>\n高斯–奥斯特罗格拉德斯基：通量 = 散度的体积分。\n<\/li><li>\n经典斯托克斯：环量 = 旋度的通量。\n<\/ul>\n<p>证明思路：先用单位分解把 ω 的支集切成小块，每块落在坐标卡内；在坐标卡内把 ω 写成 (m−1)-形式，直接算 dω 的积分，用富比尼定理逐变量积分，边界项只剩两端，望远镜求和。单位分解的存在性来自第 10 章的磨光与卷积。<\/p>\n<p><strong>类比<\/strong>：斯托克斯定理像&quot;记账对账&quot;：边界上流进流出的净额，等于内部每个小格子的净产出之和。内部相邻格子的边界互相抵消，只剩最外圈。 <strong>边界<\/strong>：流形必须有边、可定向、ω 必须紧支集；带奇点（尖点、自交）时要额外处理，书中给出适用于常见奇点的版本。<\/p>\n<h3>概念 5：输运定理与通量<\/h3>\n<p>对随时间变化的区域或流场，雷诺输运定理说：<\/p>\n<p>d/dt ∫_{M_t} f = ∫_{M_t} (∂f/∂t + div(fX))。<\/p>\n<p>用微分形式写，就是李导数与内积的组合。它是流体力学与连续介质力学的基本公式，也是斯托克斯定理的直接应用。<\/p>\n<h3>概念 6：拓扑后果<\/h3>\n<p>斯托克斯定理给出&quot;闭形式在闭流形上的积分&quot;与&quot;洞&quot;的关系：若 ω 闭，则 ∫_M ω 只依赖 M 的同调类。这解释了为什么第 8 章绕洞积分是 2π，以及为什么&quot;闭而不恰当&quot;是拓扑现象而不是分析现象。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[坐标卡] --&gt; B[局部勒贝格测度]\n  B --&gt; C[流形 sigma 代数]\n  D[黎曼度量 g] --&gt; E[体积元 根号 det G]\n  E --&gt; F[体积测度]\n  C --&gt; F\n  F --&gt; G[m-形式积分]\n  G --&gt; H[斯托克斯定理]\n  H --&gt; I[基本定理 格林 高斯 经典斯托克斯]\n  H --&gt; J[输运定理]\n  H --&gt; K[闭形式的拓扑后果]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左支解决&quot;在哪里积分&quot;（测度），右支解决&quot;积什么、怎么缩放&quot;（度量与体积元），两支汇合成 m-形式积分，再由斯托克斯定理与边界连接。所有经典积分公式都是这条链的特例。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：在流形上积分像给一件衣服算布料总量。先把衣服剪成小片（坐标卡 + 单位分解），每片按当地的&quot;松紧程度&quot;（√det G）换算成实际面积，再加起来；斯托克斯定理说，如果你只关心边缘的缝合线，也能推出整件衣服的内应力总量。 <strong>失效边界<\/strong>：衣服不可定向（莫比乌斯带）时，&quot;正反&quot;没法定，只能用绝对值；有破洞时，闭形式的积分会留下洞的贡献。<\/p>\n<p><strong>实例（可验证）<\/strong>：球面面积。 球坐标 x = R sin θ cos φ，y = R sin θ sin φ，z = R cos θ。度量矩阵给出 √det G = R² sin θ。于是 面积 = ∫₀^{2π}∫₀^{π} R² sin θ dθ dφ = 2πR²·2 = 4πR²。 这个计算把&quot;体积元&quot;从一个抽象符号变成了具体的可算量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;流形上的积分只是把 dx 换成 dV&quot;<\/strong> — 实际上体积元依赖度量，√det G 是必须算的因子，漏掉就得到平面面积。\n<\/li><li>\n<strong>别以为&quot;斯托克斯定理只是向量分析的公式&quot;<\/strong> — 实际上它是对任意阶形式的统一陈述，格林、高斯、经典斯托克斯都是特例。\n<\/li><li>\n<strong>别以为&quot;定向无关紧要&quot;<\/strong> — 实际上换定向积分变号；不可定向流形上只能积最高阶形式的绝对值。\n<\/li><li>\n<strong>别以为&quot;闭形式积分总为 0&quot;<\/strong> — 实际上闭形式在带洞流形上的积分可以非零，这正是拓扑信息的来源。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n流形上体积元的表达式是？　A. dx¹∧…∧dxᵐ　B. √|det G| dx¹∧…∧dxᵐ　C. det(G) dx　D. √(trace G) dx\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：体积元 = √|det G| 乘坐标楔积；欧氏度量为 1，球坐标为 R² sin θ。<\/p>\n<\/ol>\n<ol><li>\n斯托克斯定理 ∫_∂M ω = ∫_M dω 中，ω 必须是？　A. 任意函数　B. (m−1)-形式　C. m-形式　D. 0-形式\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：d 把 (m−1)-形式变成 m-形式，才能在 m 维 M 上积分；边界 ∂M 是 (m−1) 维，正好积 (m−1)-形式。<\/p>\n<\/ol>\n<ol><li>\n球面 S² 的面积是？　A. 2πR²　B. 4πR²　C. 4πR³/3　D. πR²\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：∫₀^{2π}∫₀^{π} R² sin θ dθ dφ = 4πR²。4πR³/3 是球的体积，不要混。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n流形积分 = 坐标卡里的普通积分 + 体积元 √|det G|。\n<\/li><li>\n斯托克斯定理统一了基本定理、格林、高斯与经典斯托克斯。\n<\/li><li>\n定向决定符号；闭形式的积分携带洞的拓扑信息。\n<\/ul>", "c11": "<h1>σ-代数与测度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 9 章（§1–§2）、第 10 章（§1）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>σ-代数是对补集与可数并封闭的集合族，测度是定义在它上面的可数可加非负函数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它规定了&quot;哪些集合可以被测量&quot;。没有这层限制，测度会与选择公理冲突。概率论、积分理论、流形上的体积，全都以测度空间为地基。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  X[全集 X] --&gt; A[σ-代数 A]\n  A --&gt; C[补集封闭]\n  A --&gt; U[可数并封闭]\n  A --&gt; M[测度 mu 可数可加]\n  M --&gt; Z[零测集]\n  Z --&gt; AE[几乎处处]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>σ-代数三条：X ∈ A；A ∈ A ⇒ Aᶜ ∈ A；Aⱼ ∈ A ⇒ ∪Aⱼ ∈ A。由德摩根律，可数交也封闭。最小的例子是 {∅, X}；最大的例子是 P(X)（但上面不一定有有用的测度）。<\/p>\n<p>测度 μ : A → [0, ∞] 要求 μ(∅) = 0，且对不交序列 μ(∪Aⱼ) = Σμ(Aⱼ)。由可数可加性得到单调性与次可加性：A ⊆ B ⇒ μ(A) ≤ μ(B)；μ(∪Aⱼ) ≤ Σμ(Aⱼ)。<\/p>\n<p>完备化：把每个零测集的子集都加入 σ-代数，并赋予测度 0。得到的测度空间叫完备化。勒贝格测度就是博雷尔测度的完备化。<\/p>\n<p><strong>类比<\/strong>：σ-代数是一张&quot;允许测量的清单&quot;，测度是清单上每一项对应的&quot;重量&quot;。清单必须对&quot;取补集&quot;&quot;可数合并&quot;封闭，否则算着算着就跑到清单外。 <strong>边界<\/strong>：清单不是越大越好——P(X) 上通常定义不出平移不变的可数可加测度。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 σ-代数就是&quot;所有子集&quot;——P(X) 是 σ-代数，但上面不一定有合适测度。\n<\/li><li>\n别以为&quot;测度为 0&quot;等于&quot;空集&quot;——康托集测度为 0 却不可数。\n<\/li><li>\n别以为&quot;可加&quot;可以换成&quot;有限可加&quot;——可数可加是勒贝格理论能做极限的关键。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章 §1<\/td><td>可测空间<\/td><td>σ-代数、博雷尔 σ-代数<\/td><\/tr><tr><td>第 9 章 §2<\/td><td>测度<\/td><td>可数可加、完备化<\/td><\/tr><tr><td>第 10 章 §1<\/td><td>可测函数<\/td><td>几乎处处、简单函数<\/td><\/tr><tr><td>第 12 章 §1<\/td><td>流形测度<\/td><td>局部坐标卡定义 L_M<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：集合、可数性、拓扑\n<\/li><li>\n后续：外测度、勒贝格测度、Lp 空间\n<\/ul>", "c12": "<h1>外测度与可测集<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 9 章（§3–§4）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>外测度是对所有子集都定义的&quot;最小覆盖体积&quot;；可测集是满足卡拉泰奥多里切割条件的集合，外测度限制在它们上面才成为真正的测度。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是勒贝格测度的构造核心。它把&quot;几何覆盖&quot;与&quot;可加性&quot;分开：外测度负责赋初值，卡拉泰奥多里条件负责筛掉&quot;切不干净&quot;的集合。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  C[可数长方体覆盖] --&gt; O[外测度 所有子集]\n  O --&gt; M[单调 次可加]\n  O --&gt; K[卡拉泰奥多里条件]\n  K --&gt; A[可测集]\n  A --&gt; S[限制后成为测度]\n  S --&gt; L[勒贝格测度]\n  O --&gt; N[不可测集 切割不守恒]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>外测度：λ*(A) = inf{Σvol(Qⱼ) : A ⊆ ∪Qⱼ}。<\/p>\n<p>性质：λ<em>(∅) = 0；单调；次可加 λ<\/em>(∪Aⱼ) ≤ Σλ*(Aⱼ)。注意是&quot;次可加&quot;，不是可加——覆盖可以重叠，也可以包进空气。<\/p>\n<p>卡拉泰奥多里条件：A 可测 ⇔ 对每个 T，λ<em>(T) = λ<\/em>(T ∩ A) + λ*(T ∩ Aᶜ)。<\/p>\n<p>直觉：A 把任何测试集 T 切成两块，两块的外测度之和恰好等于整体。这条条件对不可测集失效——维塔利集合会把 T 切成&quot;总量凭空多出来&quot;的两块。<\/p>\n<p>定理：可测集构成 σ-代数，λ* 限制在其上满足可数可加，于是成为测度 λ。<\/p>\n<p><strong>类比<\/strong>：外测度是&quot;用包装纸包东西的最小用量&quot;，可测集是&quot;切割时不掉渣的材料&quot;。只有后者能用来称重。 <strong>边界<\/strong>：外测度不是测度，不能直接对它用可加性；必须先筛可测集。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为外测度满足可加性——它只次可加，反例来自覆盖重叠。\n<\/li><li>\n别以为&quot;外测度为 0&quot;就是可测——零外测度集一定是可测的（这是定理），但&quot;外测度有限&quot;不保证可测。\n<\/li><li>\n别以为卡拉泰奥多里条件是技术性装饰——它是整个构造的筛子，去掉就没有测度。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章 §3<\/td><td>外测度<\/td><td>覆盖定义、次可加<\/td><\/tr><tr><td>第 9 章 §4<\/td><td>可测集<\/td><td>卡拉泰奥多里条件、σ-代数<\/td><\/tr><tr><td>第 9 章 §5<\/td><td>勒贝格测度<\/td><td>限制到可测集得到测度<\/td><\/tr><tr><td>第 10 章 §5<\/td><td>积分<\/td><td>可测性保证简单函数逼近<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：σ-代数、可数覆盖\n<\/li><li>\n后续：勒贝格测度、可测函数、L¹ 空间\n<\/ul>", "c13": "<h1>收敛定理（单调、法图、控制）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 10 章（§3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三条定理给出&quot;极限与积分交换&quot;的条件：单调上升可无条件交换；非负情形有法图不等式；一般情形需要可积的控制函数。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是勒贝格积分优于黎曼积分的核心。黎曼积分通常要一致收敛才能交换，勒贝格只要逐点收敛加一个控制。Lp 完备、富比尼换序、换元公式、傅里叶变换的连续性，全都靠它们。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  M[单调上升 f_n ↑ f] --&gt; I[积分极限交换 无条件]\n  F[法图引理 非负] --&gt; I2[不等式 下界]\n  D[控制收敛 存在可积 g] --&gt; I3[积分极限交换]\n  I --&gt; L[Lp 完备]\n  I3 --&gt; FB[富比尼 换序]\n  I3 --&gt; CV[换元公式 极限论证]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>单调收敛：0 ≤ fₙ ↑ f a.e. ⇒ ∫fₙ ↑ ∫f。允许两边都是 ∞。证明用 sup 的定义与简单函数逼近。<\/p>\n<p>法图引理：fₙ ≥ 0 ⇒ ∫liminf fₙ ≤ liminf ∫fₙ。它不需要单调，但只给不等式。作用是给控制收敛提供下界估计。<\/p>\n<p>控制收敛：fₙ → f a.e.，|fₙ| ≤ g a.e.，g 可积 ⇒ ∫fₙ → ∫f。证明对 |fₙ − f| 用法图引理，注意 |fₙ − f| ≤ 2g

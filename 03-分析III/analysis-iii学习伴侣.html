。<\/p>\n<p>反例说明控制条件不能省：fₙ = nχ_{(0,1/n)}，逐点收敛到 0，∫fₙ = 1。不存在可积的 g 控制所有 fₙ。<\/p>\n<p><strong>类比<\/strong>：控制函数是&quot;预算上限&quot;。预算存在，支出才能随计划收敛；没有上限，某一期可以突然超支到无穷。 <strong>边界<\/strong>：控制函数必须可积，仅仅&quot;逐点有界&quot;不够（上面的反例逐点有界但无统一可积控制）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;逐点收敛就能交换积分&quot;——需要单调或控制。\n<\/li><li>\n别以为&quot;控制函数可以依赖 n&quot;——必须是同一个 g 控制所有 n。\n<\/li><li>\n别以为法图引理是等式——只有 ≤，等号需要额外条件。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章 §2<\/td><td>积分定义<\/td><td>简单函数逼近取极限<\/td><\/tr><tr><td>第 10 章 §3<\/td><td>收敛定理<\/td><td>单调、法图、控制<\/td><\/tr><tr><td>第 10 章 §4<\/td><td>Lp 完备<\/td><td>用控制收敛证柯西列收敛<\/td><\/tr><tr><td>第 10 章 §6<\/td><td>富比尼<\/td><td>换序需要可积性<\/td><\/tr><tr><td>第 10 章 §8<\/td><td>换元<\/td><td>对特征函数取极限<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：可测函数、积分定义\n<\/li><li>\n后续：Lp 空间、富比尼定理、傅里叶变换\n<\/ul>", "c14": "<h1>Lp 空间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 10 章（§4）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Lp 是&quot;p 次方可积&quot;的函数等价类构成的空间，配 ‖f‖ₚ = (∫|f|ᵖ)^{1/p}；它完备，p = 2 时还是希尔伯特空间。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是泛函分析、偏微分方程、概率论的通用舞台。完备性让&quot;取极限&quot;这件事在函数层面合法；赫尔德与闵可夫斯基不等式提供了全部估计工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  S[简单函数] --&gt; L1[L1 完备化]\n  L1 --&gt; LP[Lp 空间]\n  LP --&gt; C[完备 巴拿赫]\n  LP --&gt; H[p=2 希尔伯特]\n  LP --&gt; HLD[赫尔德不等式]\n  LP --&gt; MINK[闵可夫斯基不等式]\n  LP --&gt; EQ[元素是等价类 不是函数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义：‖f‖ₚ = (∫|f|ᵖ dμ)^{1/p}（1 ≤ p &lt; ∞）；p = ∞ 取本质上确界。<\/p>\n<ul><li>\n完备性：柯西列在 Lp 范数下收敛，用控制收敛/法图引理抽出几乎处处收敛的子列，再证范数收敛。\n<\/li><li>\n赫尔德：‖fg‖₁ ≤ ‖f‖ₚ‖g‖_q，1/p + 1/q = 1。它是柯西–施瓦茨的推广。\n<\/li><li>\n闵可夫斯基：‖f + g‖ₚ ≤ ‖f‖ₚ + ‖g‖ₚ，给出三角不等式，所以 Lp 是赋范空间。\n<\/li><li>\n稠密性：简单函数在 Lp 中稠密；p &lt; ∞ 时紧支连续函数也稠密。\n<\/li><li>\n对偶：p 与 q 互为对偶指数，Lq 是 Lp 的对偶空间（p ∈ (1, ∞)）。\n<\/ul>\n<p><strong>等价类<\/strong>：严格说 Lp 的元素是&quot;几乎处处相等&quot;的函数类。若把函数本身当元素，‖f‖ₚ = 0 不能推出 f = 0，三角不等式也会出问题。书中反复强调代表元与等价类的区别，这不是形式主义。<\/p>\n<p><strong>类比<\/strong>：Lp 像&quot;按不同标准衡量的仓库&quot;：L¹ 看总重量，L² 看总能量，L∞ 看最大单件。同一批货物在不同标准下的&quot;大小&quot;不同，但都可以比较、取极限。 <strong>边界<\/strong>：p 不同，空间不同；L² ⊂ L¹ 只在有限测度空间成立，在 ℝ 上不成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Lp 的元素就是函数——是等价类。\n<\/li><li>\n别以为所有 Lp 互相包含——只在有限测度空间里 Lq ⊆ Lp（q &gt; p）。\n<\/li><li>\n别以为 p = ∞ 是&quot;p 趋于无穷的极限&quot;那么简单——它是本质上确界，允许零测集上无界。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章 §2<\/td><td>积分<\/td><td>L1 完备化定义积分<\/td><\/tr><tr><td>第 10 章 §4<\/td><td>Lp<\/td><td>完备、赫尔德、闵可夫斯基<\/td><\/tr><tr><td>第 10 章 §7<\/td><td>卷积<\/td><td>L1 ∗ Lp ⊆ Lp<\/td><\/tr><tr><td>第 10 章 §9<\/td><td>傅里叶<\/td><td>L² 上的酉性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：测度、积分、完备性\n<\/li><li>\n后续：希尔伯特空间、傅里叶变换、索伯列夫空间\n<\/ul>", "c15": "<h1>微分形式与斯托克斯定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>涉及章节<\/strong>：第 11 章（§2–§6）、第 12 章（§2–§3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>微分形式是反对称的多线性仪器，可以被拉回、被外微分；斯托克斯定理说，边界上的形式积分等于内部 dω 的积分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它统一了所有积分定理，并把&quot;局部微分&quot;与&quot;整体拓扑&quot;联系起来。麦克斯韦方程组、流体力学、辛几何、指标定理，都用这套语言书写。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  F[k-形式 反对称仪器] --&gt; W[楔积 有向体积]\n  F --&gt; D[外微分 d]\n  D --&gt; C[闭 d omega = 0]\n  D --&gt; E[恰当 omega = d eta]\n  F --&gt; P[拉回 f 星]\n  F --&gt; G[度量 g 与霍奇星]\n  G --&gt; V[体积元]\n  V --&gt; INT[m-形式积分]\n  INT --&gt; ST[斯托克斯 边界等于内部]\n  ST --&gt; T[基本定理 格林 高斯 经典斯托克斯]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>k-形式：交替 k-线性映射。楔积构造高阶形式，dx¹∧…∧dxᵏ 在向量组上取值等于行列式，所以形式天然测量有向体积。<\/p>\n<p>外微分：d(Σa_I dx^I) = Σda_I ∧ dx^I。性质 d² = 0；恰当必闭；星形区域上闭必恰当。<\/p>\n<p>拉回：f*ω 把 N 上的形式搬到 M 上，与 d 交换。它保证&quot;在坐标卡里算&quot;是合法的。<\/p>\n<p>积分：m 维定向流形上积 m-形式；低阶形式沿相应维数的子流形积分。<\/p>\n<p>斯托克斯：∫_∂M ω = ∫_M dω。证明用单位分解切小块，在坐标卡内用富比尼逐变量积分，边界项望远镜求和。<\/p>\n<p>四个特例：微积分基本定理（m=1）、格林公式（平面）、高斯散度定理、经典斯托克斯（旋度）。<\/p>\n<p><strong>类比<\/strong>：d 是&quot;取边界&quot;的代数版本，斯托克斯定理说&quot;数边界&quot;与&quot;数内部的小边界&quot;结果相同，因为相邻小块的公共边界互相抵消。 <strong>边界<\/strong>：流形要可定向、有边、ω 紧支集；不可定向时只能取绝对值。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为形式是&quot;无穷小量&quot;——它是作用在切向量上的函数。\n<\/li><li>\n别以为&quot;闭 = 恰当&quot;总成立——需要单连通。\n<\/li><li>\n别以为斯托克斯只是向量分析公式——它是任意阶形式的统一陈述。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 11 章 §2<\/td><td>多重线性代数<\/td><td>楔积、交替形式、霍奇星<\/td><\/tr><tr><td>第 11 章 §3<\/td><td>局部理论<\/td><td>外微分、闭与恰当<\/td><\/tr><tr><td>第 11 章 §4<\/td><td>向量场<\/td><td>内积、李导数、定向<\/td><\/tr><tr><td>第 12 章 §2<\/td><td>形式积分<\/td><td>拉回、体积元<\/td><\/tr><tr><td>第 12 章 §3<\/td><td>斯托克斯<\/td><td>统一四大积分定理<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线积分、雅可比、流形、黎曼度量\n<\/li><li>\n后续：德拉姆上同调、辛几何、规范场论\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-09'><strong>步骤 09：测度论基础<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：测度论基础<\/a><br>检查点：ch09 自测三题<\/li><li class='path-step' id='path-10'><strong>步骤 10：积分理论<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：积分理论<\/a><br>检查点：ch10 自测三题<\/li><li class='path-step' id='path-11'><strong>步骤 11：流形与微分形式<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：流形与微分形式<\/a><br>检查点：ch11 自测三题<\/li><li class='path-step' id='path-12'><strong>步骤 12：流形上的积分<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：流形上的积分<\/a><br>检查点：ch12 自测三题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='aiii-x1' data-type='single'><p class='quiz-q'><b>Q13.<\/b> 把测度、积分、流形积分串起来，正确的逻辑顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='aiii-x1' value='0'> 先定义积分再定义测度<\/label><label class='quiz-opt'><input type='radio' name='aiii-x1' value='1'> σ-代数 → 测度 → 可测函数 → 积分 → 流形上的体积元<\/label><label class='quiz-opt'><input type='radio' name='aiii-x1' value='2'> 流形积分是独立理论，与测度无关<\/label><label class='quiz-opt'><input type='radio' name='aiii-x1' value='3'> 黎曼积分可以直接推广到流形<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='aiii-x2' data-type='single'><p class='quiz-q'><b>Q14.<\/b> 关于斯托克斯定理与拓扑，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='aiii-x2' value='0'> 闭形式在任何流形上的积分都为 0<\/label><label class='quiz-opt'><input type='radio' name='aiii-x2' value='1'> 闭形式的积分可以非零，反映流形的洞<\/label><label class='quiz-opt'><input type='radio' name='aiii-x2' value='2'> 恰当形式不能积分<\/label><label class='quiz-opt'><input type='radio' name='aiii-x2' value='3'> 斯托克斯定理只对 1-形式成立<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch09__": "<h1>测验：第 9 章：测度论基础<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> σ-代数不需要满足下列哪条？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 包含全集<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 对补集封闭<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 对可数并封闭<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 对任意并封闭<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 卡拉泰奥多里条件的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 定义外测度<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 筛选出可测集<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 证明选择公理<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 计算体积<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 康托集的性质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 可数且测度为 0<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 不可数且测度为 0<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 不可数且测度为正<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 可数且测度为正<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：积分理论<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 勒贝格积分相对黎曼积分的核心优势是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 能算更多初等函数<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 不需要测度<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 在更弱条件下交换极限与积分<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 只适用于连续函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 控制收敛定理中“存在可积的 g 使 |fₙ| ≤ g”能否去掉？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 能，只要 fₙ 逐点收敛<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 不能，nχ_{(0,1/n)} 是反例<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 能，只要 fₙ 非负<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 能，只要测度有限<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 换元公式中出现的因子是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> det Dφ 的绝对值<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> det Dφ 的平方<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> ‖Dφ‖<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> φ 的导数之和<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：流形与微分形式<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 关于外微分，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> d(dω) = ω<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> d(dω) = 0<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> d 只在 0-形式上定义<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> d 与拉回不可交换<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 极坐标下 dx ∧ dy 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> dr ∧ dθ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> r dr ∧ dθ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> r² dr ∧ dθ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> dr ∧ dθ / r<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 黎曼度量给出的体积元是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> det(g) dx<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> √|det(g)| dx¹∧…∧dxᵐ<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> trace(g) dx<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> ‖g‖ dx<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：流形上的积分<\/h1><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 流形上体积元的表达式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> dx¹∧…∧dxᵐ<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> √|det G| dx¹∧…∧dxᵐ<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> det(G) dx<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> √(trace G) dx<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 斯托克斯定理 ∫_∂M ω = ∫_M dω 中，ω 必须是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 任意函数<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 0-形式<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> m-形式<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> (m−1)-形式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 球面 S² 的面积是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 2πR²<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 4πR²<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 4πR³/3<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> πR²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='σ-代数'>σ-代数 — 对补集与可数并封闭、含全集的集合族。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='测度'>测度 — σ-代数上的可数可加非负函数。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='博雷尔 σ-代数'>博雷尔 σ-代数 — 包含所有开集的最小 σ-代数。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='外测度'>外测度 — 用可数覆盖的体积下确界定义、对所有子集有定义的函数。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='可测集'>可测集 — 满足卡拉泰奥多里切割条件的集合。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='零测集'>零测集 — 测度为 0 的集合。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='几乎处处'>几乎处处 — 除一个零测集之外处处成立。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='勒贝格测度'>勒贝格测度 — ℝⁿ 上由外测度限制得到的平移不变测度。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='豪斯多夫维数'>豪斯多夫维数 — 使豪斯多夫测度从无穷跳到零的临界维数。 <span class=glossary-ref>（第 9 章：测度论基础）<\/span><\/li><li data-term='简单函数'>简单函数 — 有限个特征函数的线性组合，只取有限多个值。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='可测函数'>可测函数 — 简单函数列的几乎处处极限。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='博赫纳–勒贝格积分'>博赫纳–勒贝格积分 — 向量值函数通过 L1 完备化定义的积分。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='单调收敛定理'>单调收敛定理 — 非负递增函数列可无条件交换极限与积分。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='法图引理'>法图引理 — 非负函数列给出 ∫liminf ≤ liminf∫ 的不等式。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='控制收敛定理'>控制收敛定理 — 存在可积控制函数时，逐点收敛可交换极限与积分。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='lp 空间'>Lp 空间 — p 次方可积函数的等价类空间，配 Lp 范数。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='赫尔德不等式'>赫尔德不等式 — ‖fg‖₁ ≤ ‖f‖ₚ‖g‖_q，1/p+1/q=1。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='闵可夫斯基不等式'>闵可夫斯基不等式 — Lp 范数满足三角不等式。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='富比尼定理'>富比尼定理 — 乘积空间上的积分可化为累次积分。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='卷积'>卷积 — (f∗g)(x)=∫f(x−y)g(y)dy，傅里叶变换下变乘积。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='磨光核'>磨光核 — 光滑紧支、积分为 1 的非负函数，用于逼近光滑化。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='傅里叶变换'>傅里叶变换 — f̂(ξ)=∫f(x)e^(−2πix·ξ)dx，L² 上是酉算子。 <span class=glossary-ref>（第 10 章：积分理论）<\/span><\/li><li data-term='子流形'>子流形 — 局部在坐标卡中表现为平面切片的子集。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='浸入'>浸入 — 切映射处处单射的光滑映射。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='嵌入'>嵌入 — 到像为同胚的浸入。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='带边流形'>带边流形 — 坐标卡取值于半空间，边界为 xₘ=0 的像。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='k-形式'>k-形式 — 交替 k-线性映射，可楔积、拉回、外微分。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='外微分'>外微分 — d(Σa_I dx^I)=Σda_I∧dx^I，满足 d²=0。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='闭形式'>闭形式 — dω=0 的形式。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='恰当形式'>恰当形式 — 等于 dη 的形式。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='黎曼度量'>黎曼度量 — 每点切空间上的正定内积场。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='霍奇星'>霍奇星 — 依赖度量与定向、把 k-形式映为 (m−k)-形式的算子。 <span class=glossary-ref>（第 11 章：流形与微分形式）<\/span><\/li><li data-term='体积元'>体积元 — √|det g| dx¹∧…∧dxᵐ，流形上的积分缩放因子。 <span class=glossary-ref>（第 12 章：流形上的积分）<\/span><\/li><li data-term='斯托克斯定理'>斯托克斯定理 — ∫_∂M ω = ∫_M dω，统一所有积分公式。 <span class=glossary-ref>（第 12 章：流形上的积分）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库：《分析 III》<\/h1>\n<h2>框架：覆盖 → 外测度 → 筛可测 → 得测度<\/h2>\n<p>这是卡拉泰奥多里路线的四步。遇到&quot;给某类集合赋大小&quot;的问题，先想清楚覆盖用什么基本块（区间、长方体、球），再验证次可加，再用切割条件筛，最后证明限制后满足可数可加。<\/p>\n<h2>框架：简单函数 → 可测函数 → 积分 → 完备化<\/h2>\n<p>积分的标准脚手架。每一步都问&quot;逼近用什么收敛&quot;：简单函数到可测函数是几乎处处，积分定义是单调极限，L1 完备化是范数收敛。<\/p>\n<h2>框架：局部坐标 + 单位分解<\/h2>\n<p>流形上的全局命题几乎都这样证：用单位分解把整体切成有限块，每块落在坐标卡内，化成 ℝᵐ 的命题，证完再拼回去。斯托克斯定理是标准范例。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要交换极限与积分：先说清是单调、非负还是有控制函数；三者都不满足就找反例。\n<\/li><li>\n要判断形式是否恰当：先算 dω；闭了再看区域有没有洞；星形区域可直接用庞加莱引理。\n<\/li><li>\n要算流形上的积分：先定坐标卡，再算度量矩阵，再取 √det G，最后套普通多重积分。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把外测度当测度用<\/strong>。外测度只次可加，直接相加会出错。\n<\/li><li>\n<strong>忽略等价类<\/strong>。Lp 里&quot;几乎处处相等&quot;的函数是同一元素，范数为 0 不代表函数为零。\n<\/li><li>\n<strong>忘掉定向<\/strong>。流形积分换定向变号；不可定向时只能取绝对值。\n<\/li><li>\n<strong>在带洞区域硬用&quot;闭 ⇒ 恰当&quot;<\/strong>。洞是拓扑障碍，局部条件消不掉。\n<\/ul>", "__cheatsheet__": "<h1>速查表：《分析 III》<\/h1>\n<h2>定义与公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>σ-代数<\/td><td>含 X；对补集封闭；对可数并封闭<\/td><\/tr><tr><td>测度<\/td><td>μ(∅)=0；不交列 μ(∪Aⱼ)=Σμ(Aⱼ)<\/td><\/tr><tr><td>外测度<\/td><td>λ*(A)=inf Σvol(Qⱼ)，A⊆∪Qⱼ<\/td><\/tr><tr><td>可测（卡拉泰奥多里）<\/td><td>对所有 T：μ<em>(T)=μ<\/em>(T∩A)+μ*(T∩Aᶜ)<\/td><\/tr><tr><td>可测函数<\/td><td>简单函数列的 a.e. 极限<\/td><\/tr><tr><td>简单函数积分<\/td><td>Σ eⱼ μ(Aⱼ)<\/td><\/tr><tr><td>单调收敛<\/td><td>0≤fₙ↑f ⇒ ∫fₙ↑∫f<\/td><\/tr><tr><td>法图引理<\/td><td>∫liminf fₙ ≤ liminf ∫fₙ<\/td><\/tr><tr><td>控制收敛<\/td><td>fₙ→f a.e.，<\/td><td>fₙ<\/td><td>≤g∈L¹ ⇒ ∫fₙ→∫f<\/td><\/tr><tr><td>Lp 范数<\/td><td>‖f‖ₚ=(∫<\/td><td>f<\/td><td>ᵖ)^(1/p)<\/td><\/tr><tr><td>赫尔德<\/td><td>‖fg‖₁≤‖f‖ₚ‖g‖_q，1/p+1/q=1<\/td><\/tr><tr><td>闵可夫斯基<\/td><td>‖f+g‖ₚ≤‖f‖ₚ+‖g‖ₚ<\/td><\/tr><tr><td>富比尼<\/td><td>∫∫f = ∫(∫f dν)dμ = ∫(∫f dμ)dν（绝对可积）<\/td><\/tr><tr><td>换元<\/td><td>∫_V f dy = ∫_U f(φ(x))<\/td><td>det Dφ<\/td><td>dx<\/td><\/tr><tr><td>卷积<\/td><td>(f∗g)(x)=∫f(x−y)g(y)dy<\/td><\/tr><tr><td>傅里叶变换<\/td><td>f̂(ξ)=∫f(x)e^(−2πix·ξ)dx，‖f̂‖₂=‖f‖₂<\/td><\/tr><tr><td>楔积<\/td><td>α∧β(v,w)=α(v)β(w)−α(w)β(v)<\/td><\/tr><tr><td>外微分<\/td><td>d(Σa_I dx^I)=Σda_I∧dx^I；d²=0<\/td><\/tr><tr><td>体积元<\/td><td>dV=√<\/td><td>det g<\/td><td>dx¹∧…∧dxᵐ<\/td><\/tr><tr><td>斯托克斯<\/td><td>∫_∂M ω = ∫_M dω<\/td><\/tr><tr><td>球面面积<\/td><td>4πR²<\/td><\/tr><tr><td>球体积<\/td><td>4πR³/3<\/td><\/tr><\/tbody><\/table>\n<h2>常用推理链<\/h2>\n<ol><li>\n覆盖 → 外测度 → 卡拉泰奥多里 → 测度 → 可测函数 → 积分。\n<\/li><li>\n简单函数 → 单调收敛 → 一般积分 → L1 完备化 → Lp。\n<\/li><li>\n度量 → 格拉姆矩阵 → 体积元 → m-形式积分 → 斯托克斯。\n<\/li><li>\ndω=0 → 闭；星形区域 → 恰当；有洞 → 积分非零（拓扑）。\n<\/ol>\n<h2>反例清单<\/h2>\n<table><thead><tr><th>命题<\/th><th>反例<\/th><\/tr><\/thead><tbody><tr><td>所有集合可测<\/td><td>维塔利集（需选择公理）<\/td><\/tr><tr><td>外测度可加<\/td><td>一般覆盖重叠<\/td><\/tr><tr><td>测度 0 即有限<\/td><td>康托集<\/td><\/tr><tr><td>逐点收敛可交换积分<\/td><td>nχ_{(0,1/n)}<\/td><\/tr><tr><td>闭形式必恰当<\/td><td>(xdy−ydx)/(x²+y²)<\/td><\/tr><tr><td>连续曲线可求长<\/td><td>t cos²(π/2t)<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分析 II</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%232563eb%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 fill=%22white%22 text-anchor=%22middle%22%3E%E5%88%86%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>

    <h1>分析 II</h1>
    <div class="sub">从积分到流形：逼近与线性化的进阶</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>

  <main class="main">

    <div id="view" class="page"></div>
  </main>
</div>

const DATA = {"manifest": {"slug": "analysis-ii", "title": "分析 II", "subtitle": "从积分到流形：逼近与线性化的进阶", "book": {"title": "分析 II（Analysis II）", "author": "Herbert Amann / Joachim Escher", "source": ["分析 II (Herbert Amann  Joachim Escher) (z-library.sk, 1lib.sk, z-lib.sk).pdf"]}, "audience": "已读完《分析 I》或具备同等基础", "goal": "掌握一元积分、多变量微分、线积分与复分析入门", "learningPath": [{"step": "06", "title": "积分与基本定理", "chapterIds": ["ch06"], "checkpoint": "ch06 自测三题"}, {"step": "07", "title": "多变量微分", "chapterIds": ["ch07"], "checkpoint": "ch07 自测三题"}, {"step": "08", "title": "线积分与全纯", "chapterIds": ["ch08"], "checkpoint": "ch08 自测三题"}], "chapters": [{"id": "ch06", "title": "第 6 章：一元函数的积分", "file": "chapters/ch06-integration.md", "difficulty": 3}, {"id": "ch07", "title": "第 7 章：多变量微分学", "file": "chapters/ch07-multivariable.md", "difficulty": 3}, {"id": "ch08", "title": "第 8 章：线积分", "file": "chapters/ch08-line-integrals.md", "difficulty": 3}], "concepts": [{"id": "c06", "title": "黎曼积分", "file": "concepts/riemann-integral.md", "chapterIds": ["ch06"]}, {"id": "c07", "title": "弗雷歇微分与雅可比矩阵", "file": "concepts/frechet-derivative.md", "chapterIds": ["ch07"]}, {"id": "c08", "title": "逆映射定理与隐函数定理", "file": "concepts/inverse-implicit.md", "chapterIds": ["ch07"]}, {"id": "c09", "title": "线积分与势函数", "file": "concepts/line-integral.md", "chapterIds": ["ch08"]}, {"id": "c10", "title": "全纯函数", "file": "concepts/holomorphic.md", "chapterIds": ["ch08"]}], "glossary": [{"term": "阶梯函数", "def": "在分割的每个开区间上取常数值的函数。", "chapterId": "ch06"}, {"term": "跳跃连续", "def": "每点处左右单侧极限都存在（可不等于函数值）。", "chapterId": "ch06"}, {"term": "分段连续", "def": "只有有限个跳跃点的跳跃连续函数。", "chapterId": "ch06"}, {"term": "柯西–黎曼积分", "def": "本书对一元函数积分的称呼，由阶梯函数积分延拓得到。", "chapterId": "ch06"}, {"term": "微积分基本定理", "def": "变上限积分求导得被积函数；反之积分等于原函数端点差。", "chapterId": "ch06"}, {"term": "反常积分", "def": "区间无界或被积函数无界时，用极限定义的积分。", "chapterId": "ch06"}, {"term": "绝对收敛", "def": "被积函数绝对值可积；绝对收敛必收敛。", "chapterId": "ch06"}, {"term": "傅里叶系数", "def": "用三角函数内积投影得到的系数 aₖ、bₖ。", "chapterId": "ch06"}, {"term": "伽马函数", "def": "Γ(z)=∫t^(z−1)e^(−t)dt，满足 Γ(n+1)=n!。", "chapterId": "ch06"}, {"term": "算子范数", "def": "线性映射的最大放大倍数，‖A‖=sup‖Ax‖/‖x‖。", "chapterId": "ch07"}, {"term": "弗雷歇导数", "def": "使 f(a+h)=f(a)+Ah+o(‖h‖) 的唯一线性映射 A。", "chapterId": "ch07"}, {"term": "雅可比矩阵", "def": "导数在标准基下的矩阵，元素为偏导数。", "chapterId": "ch07"}, {"term": "链式法则", "def": "复合函数导数等于两个线性映射的复合（矩阵相乘）。", "chapterId": "ch07"}, {"term": "黑塞矩阵", "def": "二阶偏导组成的对称矩阵，表示二阶导数。", "chapterId": "ch07"}, {"term": "逆映射定理", "def": "导数可逆时函数局部可逆，逆映射 C¹ 且导数为原导数的逆。", "chapterId": "ch07"}, {"term": "隐函数定理", "def": "F(a,b)=0 且对 y 的偏导可逆时，可局部解出 y=φ(x)。", "chapterId": "ch07"}, {"term": "拉格朗日乘子", "def": "约束极值中使 ∇f=λ∇g 的比例因子。", "chapterId": "ch07"}, {"term": "全变差", "def": "所有分割折线长度的上确界。", "chapterId": "ch08"}, {"term": "可求长", "def": "全变差有限的曲线。", "chapterId": "ch08"}, {"term": "普法夫形式", "def": "形如 Σaⱼdxⱼ 的 1-形式。", "chapterId": "ch08"}, {"term": "恰当形式", "def": "等于某个函数微分的 1-形式。", "chapterId": "ch08"}, {"term": "势函数", "def": "满足 df=ω 的函数 f。", "chapterId": "ch08"}, {"term": "全纯函数", "def": "复可微的函数，等价于满足柯西–黎曼方程。", "chapterId": "ch08"}, {"term": "亚纯函数", "def": "除孤立极点外全纯的函数。", "chapterId": "ch08"}, {"term": "留数", "def": "洛朗展开中 (z−a)⁻¹ 的系数。", "chapterId": "ch08"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch06", "type": "single", "question": "下列关于跳跃连续函数的说法，正确的是？", "options": ["必须连续", "每点左右极限存在，可以不等于函数值", "只能有有限个间断点", "必须有界变差"], "answer": 1, "explain": "跳跃连续只要求单侧极限存在；分段连续才是“有限个跳跃点”的更强要求。跳跃连续函数在紧区间上自动有界。"}, {"id": "q02", "chapterId": "ch06", "type": "single", "question": "∫_1^∞ 1/x^p 收敛的条件是？", "options": ["p > 0", "p > 1", "p < 1", "对所有 p 都收敛"], "answer": 1, "explain": "p > 1 时原函数 x^(1−p)/(1−p) 在无穷远处趋于 0；p ≤ 1 时发散。对照 ∫_0^1 1/x^p 的条件是 p < 1。"}, {"id": "q03", "chapterId": "ch06", "type": "single", "question": "Γ(5) 等于？", "options": ["5!", "4!", "5", "24/5"], "answer": 1, "explain": "Γ(n+1) = n!，所以 Γ(5) = 4! = 24。注意指标偏移一格。"}, {"id": "q04", "chapterId": "ch07", "type": "single", "question": "设 f(x, y) = xy/(x² + y²)（原点补 0），则 f 在原点？", "options": ["可微", "两个偏导存在但不连续", "不可微且偏导不存在", "连续但偏导不存在"], "answer": 1, "explain": "沿坐标轴 f 恒为 0，两个偏导都是 0；沿 y = x 极限为 1/2，不连续，故不可微。"}, {"id": "q05", "chapterId": "ch07", "type": "single", "question": "隐函数定理中，保证能解出 y = φ(x) 的关键条件是？", "options": ["F(a,b) = 0", "F 连续", "∂F/∂y(a,b) 可逆", "∂F/∂x(a,b) 可逆"], "answer": 2, "explain": "要对 y 求解，必须让 y 方向的导数可逆，才能用压缩映射把 y 反解出来。"}, {"id": "q06", "chapterId": "ch07", "type": "single", "question": "约束极值中，若 ∇g(a) ≠ 0，极值点满足？", "options": ["∇f(a) = 0", "∇f(a) = λ∇g(a)", "∇g(a) = λ∇f(a)", "f(a) = g(a)"], "answer": 1, "explain": "等值面与约束面在极值点相切，法向量平行，故梯度成比例，比例因子就是乘子 λ。"}, {"id": "q07", "chapterId": "ch08", "type": "single", "question": "关于全变差，正确的说法是？", "options": ["连续曲线的全变差总有限", "全变差是折线长度的上确界", "全变差等于端点距离", "全变差只对直线有限"], "answer": 1, "explain": "定义就是 sup 折线长度。连续曲线可以不可求长，端点距离只是下界。"}, {"id": "q08", "chapterId": "ch08", "type": "single", "question": "ω = (x dy − y dx)/(x² + y²) 在 ℝ² 去掉原点后？", "options": ["恰当", "闭但不恰当", "既不闭也不恰当", "恒为 0"], "answer": 1, "explain": "混合偏导相等故闭；但绕单位圆积分 2π ≠ 0，所以不存在单值势函数。"}, {"id": "q09", "chapterId": "ch08", "type": "single", "question": "∮_{|z|=1} dz/z 的值是？", "options": ["0", "2πi", "πi", "1"], "answer": 1, "explain": "1/z 在 0 处留数为 1，由留数定理积分等于 2πi·1。"}, {"id": "aii-x1", "chapterId": "__all__", "type": "single", "question": "微积分基本定理 ∫_α^β f = F(β) − F(α) 成立，需要的核心条件是？", "options": ["f 有界", "f 连续（或可积）且 F′ = f", "f 单调", "F 有界"], "answer": 1, "explain": "需要 f 可积，且 F 是可微函数、F′ = f。仅有界不够（Dirichlet 函数不可积）；单调也不是必要条件。"}, {"id": "aii-x2", "chapterId": "__all__", "type": "single", "question": "把「线积分只依赖端点」与「微分学」联系起来，正确的说法是？", "options": ["任何 1-形式都路径无关", "恰当形式的线积分等于势函数在端点的差", "闭形式一定恰当", "路径无关只对直线成立"], "answer": 1, "explain": "ω = df 时 ∫_γ ω = f(终点) − f(起点)，这是牛顿–莱布尼茨公式的曲线版。闭形式只在单连通区域上恰当。"}], "flashcards": [{"id": "f01", "chapterId": "ch06", "front": "积分为什么先用阶梯函数定义？", "back": "阶梯函数的积分是有限和，无极限；再用一致逼近延拓到跳跃连续函数，保证唯一性。", "tags": ["积分", "构造"]}, {"id": "f02", "chapterId": "ch06", "front": "可积的实用判据？", "back": "对每个 ε > 0 存在阶梯函数 φ 使 sup|f − φ| < ε。", "tags": ["积分"]}, {"id": "f03", "chapterId": "ch06", "front": "微积分基本定理的两半各说什么？", "back": "变上限积分求导得 f；反过来 ∫f = F(β) − F(α)。", "tags": ["基本定理"]}, {"id": "f04", "chapterId": "ch06", "front": "∫ sin x / x 收敛吗？绝对收敛吗？", "back": "收敛（条件收敛），绝对值积分发散。", "tags": ["反常积分"]}, {"id": "f05", "chapterId": "ch06", "front": "Γ 函数与阶乘的关系？", "back": "Γ(n+1) = n!，由 Γ(z+1) = zΓ(z) 与 Γ(1)=1 推出。", "tags": ["伽马函数"]}, {"id": "f06", "chapterId": "ch07", "front": "多变量导数的定义？", "back": "存在线性映射 A 使 f(a+h)=f(a)+Ah+r(h)，‖r(h)‖/‖h‖→0。", "tags": ["微分"]}, {"id": "f07", "chapterId": "ch07", "front": "偏导存在为什么不足以保证可微？", "back": "偏导只管坐标轴方向；可微要求所有方向的误差统一为 o(‖h‖)。xy/(x²+y²) 是反例。", "tags": ["微分", "反例"]}, {"id": "f08", "chapterId": "ch07", "front": "算子范数是什么？", "back": "‖A‖ = sup{‖Ax‖ : ‖x‖ ≤ 1}，是线性映射的最大放大倍数。", "tags": ["算子"]}, {"id": "f09", "chapterId": "ch07", "front": "逆映射定理的条件？", "back": "f 是 C¹ 且 f′(a) 是拓扑同构（可逆且逆连续）。", "tags": ["逆映射"]}, {"id": "f10", "chapterId": "ch07", "front": "拉格朗日乘子的几何解释？", "back": "目标函数等值面与约束面在极值点相切，梯度平行。", "tags": ["极值"]}, {"id": "f11", "chapterId": "ch08", "front": "弧长怎么定义？", "back": "分割折线长度的上确界，即全变差；C¹ 时等于 ∫‖γ′‖。", "tags": ["弧长"]}, {"id": "f12", "chapterId": "ch08", "front": "连续曲线一定可求长吗？", "back": "不一定。t cos²(π/2t) 是连续但全变差无穷的例子。", "tags": ["弧长"]}, {"id": "f13", "chapterId": "ch08", "front": "恰当形式的积分性质？", "back": "∫_γ ω = f(终点) − f(起点)，与路径无关。", "tags": ["线积分"]}, {"id": "f14", "chapterId": "ch08", "front": "闭形式何时恰当？", "back": "单连通区域上闭 ⇒ 恰当；有洞时不成立，(xdy−ydx)/(x²+y²) 是反例。", "tags": ["线积分"]}, {"id": "f15", "chapterId": "ch08", "front": "柯西–黎曼方程？", "back": "u_x = v_y，u_y = −v_x；等价于复可微。", "tags": ["全纯"]}], "companion": "analysis-ii学习伴侣.html"}, "pages": {"ch06": {"html": "<h1>第 6 章：一元函数的积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：12 小时 ｜ <strong>前置<\/strong>：第 3 章（连续、紧致）、第 4 章（微分）、第 5 章（一致收敛）\n<\/ul>\n<blockquote>原书开头把积分的来历说得很朴素：积分是为了求面积发明的，基本策略是把图形切成矩形再相加。但&quot;给定图形可以用无数种方式近似为矩形，它们是否都导致相同结果，绝非不言自明&quot;——这句话就是整章要解决的问题。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用阶梯函数的一致逼近定义积分，并说明为什么函数类要选&quot;跳跃连续&quot;。\n<\/li><li>\n用微积分基本定理计算积分，用换元与分部积分处理复合与乘积。\n<\/li><li>\n判断反常积分收敛，区分绝对收敛与条件收敛。\n<\/li><li>\n写出傅里叶系数并说明逐点收敛的条件，用 Γ 函数把阶乘延拓到实数。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>积分不是&quot;面积&quot;这个几何词的定义，而是&quot;用阶梯函数一致逼近，再取极限&quot;这套操作的产物；微积分基本定理则说明这套操作与求导互逆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么先研究阶梯函数<\/h3>\n<p>阶梯函数：存在区间的一个分割 α = α₀ &lt; α₁ &lt; … &lt; αₙ = β，使 f 在每个开区间 (αⱼ₋₁, αⱼ) 上是常数。它的积分可以直接定义成&quot;高 × 宽&quot;的和：<\/p>\n<p>∫ f := Σ cⱼ (αⱼ − αⱼ₋₁)。<\/p>\n<p>这个定义没有任何极限，纯粹是有限和。接下来的问题是：哪些函数能被阶梯函数<strong>一致<\/strong>逼近？<\/p>\n<p>答案是<strong>跳跃连续函数<\/strong>：在每点 x 处，左右单侧极限 f(x−0)、f(x+0) 都存在（可以不等于 f(x)）。连续函数当然满足；分段连续函数（有限个跳跃点）也满足。这类函数构成向量空间 S(I, E)，并且在 sup 范数下，阶梯函数在其中稠密。<\/p>\n<p>为什么必须一致逼近？如果只在每点分别逼近，逼近函数列的积分可能不收敛到同一个值。一致逼近才能保证&quot;逼近的积分&quot;是一个柯西列，从而有唯一极限。<\/p>\n<p><strong>类比<\/strong>：用方块拼出一幅画。允许每块方块的颜色随位置变（逐点逼近），拼出来的总面积可能随拼法剧烈变化；要求所有方块的误差都不超过一个统一上限（一致逼近），总面积才稳定。<\/p>\n<h3>概念 2：积分作为延拓<\/h3>\n<p>阶梯函数上的积分是一个线性映射，且满足两条基本估计：<\/p>\n<ul><li>\n|∫f| ≤ ‖f‖∞ (β − α)；\n<\/li><li>\n阶梯函数空间在跳跃连续函数空间中稠密。\n<\/ul>\n<p>于是用&quot;连续延拓定理&quot;：一致连续（或利普希茨）映射在稠密子空间上的值可以唯一延拓到闭包。积分就这样从阶梯函数延拓到跳跃连续函数，记作 Cauchy–Riemann 积分。<\/p>\n<p>由此得到可积性的实用判据：f 可积 ⇔ 存在阶梯函数列 φₙ 使 ‖f − φₙ‖∞ → 0。这也解释了为什么&quot;可积&quot;比&quot;连续&quot;宽：函数可以有有限个跳跃点，只要跳跃幅度有限。<\/p>\n<p><strong>类比<\/strong>：先在整数点上定义一个函数，再要求它&quot;变化不太剧烈&quot;，就能唯一地插值到所有实数点。积分就是这样一个被插值出来的量。<\/p>\n<h3>概念 3：微积分基本定理<\/h3>\n<p>设 f : [α, β] → E 连续，F(x) := ∫_α^x f。则 F 可微且 F′ = f。反过来，若 F 可微且 F′ = f，则 ∫_α^β f = F(β) − F(α)。<\/p>\n<p>证明前半段只用估计：<\/p>\n<p>‖(F(x + h) − F(x))/h − f(x)‖ = ‖(1/h)∫_x^{x+h} (f(t) − f(x)) dt‖ ≤ sup_{|t−x|≤h} ‖f(t) − f(x)‖，<\/p>\n<p>由连续性趋于 0。后半段对 F − 原函数 用中值定理，导数为 0 故为常数。<\/p>\n<p>这条定理把&quot;求积分&quot;从&quot;算极限&quot;变成&quot;找原函数&quot;，是整章计算能力的来源。<\/p>\n<p><strong>类比<\/strong>：积分是&quot;把每天的收入累加&quot;，导数是&quot;当天收入&quot;。基本定理说累加函数的日增量就是当天收入。<\/p>\n<h3>概念 4：换元与分部<\/h3>\n<ul><li>\n换元：∫_a^b f(φ(t)) φ′(t) dt = ∫_{φ(a)}^{φ(b)} f(u) du。条件是 φ 连续可微、f 连续。\n<\/li><li>\n分部：∫ u′v = uv − ∫ uv′。它是乘积求导法则的积分版。\n<\/ul>\n<p>例：∫₀¹ x/(1+x²) dx。令 u = 1 + x²，du = 2x dx，得 (1/2)∫₁² du/u = (1/2)log 2。 例：∫ x e^x dx = x e^x − ∫ e^x dx = (x − 1)e^x + C。<\/p>\n<h3>概念 5：反常积分<\/h3>\n<p>两类：区间无界（∫_a^∞），或被积函数在端点无界（∫₀¹ 1/√x）。<\/p>\n<p>定义都是&quot;取极限&quot;：∫_a^∞ f := lim_{b→∞} ∫_a^b f，只要极限存在且有限。<\/p>\n<p>判据：<\/p>\n<ul><li>\n比较判别：0 ≤ f ≤ g，∫g 收敛 ⇒ ∫f 收敛。\n<\/li><li>\np-判别：∫_1^∞ 1/x^p 收敛 ⇔ p &gt; 1；∫_0^1 1/x^p 收敛 ⇔ p &lt; 1。\n<\/li><li>\n<strong>绝对收敛 ⇒ 收敛<\/strong>（在完备空间中用柯西准则），但反之不成立：∫_1^∞ sin x / x 收敛，绝对值积分发散。\n<\/ul>\n<p><strong>类比<\/strong>：反常积分像&quot;无限长的账单分期付款&quot;，只要每期金额下降得足够快，总额有限。<strong>边界<\/strong>：条件收敛的账单总额有限，但如果你按不同顺序重排收支，结果会变。<\/p>\n<h3>概念 6：和与积分、Euler–Maclaurin、Stirling<\/h3>\n<p>积分与求和通过阶梯逼近互相控制：<\/p>\n<p>|Σ_{k=m}^{n} f(k) − ∫_m^n f| ≤ 变差项。<\/p>\n<p>Euler–Maclaurin 公式把它展开成&quot;积分 + 端点修正 + 导数修正&quot;，用来近似求和。取 f(x) = log x 就得到 Stirling 公式：<\/p>\n<p>log n! = (n + 1/2)log n − n + (1/2)log 2π + O(1/n)。<\/p>\n<p>这不是&quot;经验公式&quot;，是由求和与积分之差逐阶展开推出来的。<\/p>\n<h3>概念 7：傅里叶级数<\/h3>\n<p>对周期 2π 的函数，定义系数<\/p>\n<p>aₖ = (1/π)∫_{−π}^{π} f(x) cos(kx) dx，bₖ = (1/π)∫_{−π}^{π} f(x) sin(kx) dx，<\/p>\n<p>部分和 Sₙ = a₀/2 + Σ(aₖ cos kx + bₖ sin kx)。<\/p>\n<p>收敛性需要条件：分段连续 + 有界变差（狄利克雷条件）保证逐点收敛到 (f(x+0) + f(x−0))/2；连续性与导数平方可积能给出更强的一致收敛。只连续不足以保证逐点收敛（有反例），这说明傅里叶级数比幂级数&quot;娇气&quot;。<\/p>\n<h3>概念 8：Γ 函数<\/h3>\n<p>Γ(z) := ∫_0^∞ t^{z−1} e^{−t} dt，在 Re z &gt; 0 收敛。<\/p>\n<p>分部积分给出 Γ(z + 1) = z Γ(z)，且 Γ(1) = 1，所以 Γ(n + 1) = n!。这把阶乘从整数延拓到复数，是&quot;用积分定义新函数&quot;的范例。Γ 在正实轴上是凸函数（对数凸），这来自它的积分表示与 Hölder 不等式。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[阶梯函数 有限和] --&gt; B[一致逼近]\n  B --&gt; C[跳跃连续函数]\n  C --&gt; D[Cauchy-Riemann 积分]\n  D --&gt; E[微积分基本定理]\n  E --&gt; F[换元 分部 计算]\n  D --&gt; G[反常积分]\n  D --&gt; H[和与积分 Euler-Maclaurin]\n  D --&gt; I[傅里叶级数]\n  D --&gt; J[伽马函数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：整章只有一个源头（阶梯函数的有限和），三条箭头分别通向计算（基本定理、换元分部）、收敛性（反常积分、傅里叶）、特殊函数（Γ）。理解&quot;逼近 → 延拓&quot;这条主线，后面的技巧才有归属。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：积分像用乐高积木拼曲面。阶梯函数是最小块的积木，一致逼近是&quot;每块的高度误差都不超过一个统一上限&quot;，基本定理是&quot;知道每块积木的边界高度差，就能算出总体积&quot;。 <strong>失效边界<\/strong>：积木只能拼出&quot;高度有限、跳跃有限&quot;的形状；遇到无穷高（1/√x 在 0）或无穷宽（∫_1^∞），必须另做极限处理。<\/p>\n<p><strong>实例（可验证）<\/strong>：计算 ∫₀^{π/2} sin²x dx。 用恒等式 sin²x = (1 − cos 2x)/2，得 ∫ = (1/2)[x − (sin 2x)/2]₀^{π/2} = π/4。 检验：数值上 sin² 在 [0, π/2] 的平均值应为 1/2，区间长 π/2，乘积 π/4，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;积分就是面积&quot;<\/strong> — 实际上面积是几何直觉，积分的定义是逼近的极限。对变号函数、向量值函数，&quot;面积&quot;讲不通，但积分照样有定义。\n<\/li><li>\n<strong>别以为&quot;可积函数必须连续&quot;<\/strong> — 实际上跳跃连续即可，甚至 Riemann 可积函数类还更宽（有界 + 间断点测度为零）。\n<\/li><li>\n<strong>别以为&quot;反常积分收敛就是绝对收敛&quot;<\/strong> — 实际上 ∫ sin x/x 条件收敛，绝对值积分发散。\n<\/li><li>\n<strong>别以为&quot;傅里叶级数一定收敛到函数本身&quot;<\/strong> — 实际上只连续不够；间断点处收敛到左右极限的平均值。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列关于跳跃连续函数的说法，正确的是？　A. 必须连续　B. 每点左右极限存在，可以不等于函数值　C. 只能有有限个间断点　D. 必须有界变差\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：跳跃连续只要求单侧极限存在；分段连续才是&quot;有限个跳跃点&quot;的更强要求。跳跃连续函数在紧区间上自动有界。<\/p>\n<\/ol>\n<ol><li>\n∫_1^∞ 1/x^p 收敛的条件是？　A. p &gt; 0　B. p &gt; 1　C. p &lt; 1　D. 对所有 p 都收敛\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：p &gt; 1 时原函数 x^{1−p}/(1−p) 在无穷远处趋于 0；p ≤ 1 时发散。对照 ∫_0^1 1/x^p 的条件是 p &lt; 1，两者方向相反。<\/p>\n<\/ol>\n<ol><li>\nΓ(5) 等于？　A. 5!　B. 4!　C. 5　D. 24/5\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：Γ(n+1) = n!，所以 Γ(5) = 4! = 24。注意指标偏移一格，这是最容易记错的地方。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n积分 = 阶梯函数一致逼近的极限；一致是关键。\n<\/li><li>\n基本定理：积分与微分互逆，计算靠找原函数。\n<\/li><li>\n反常积分看衰减速度；条件收敛不能重排。\n<\/ul>", "kind": "chapter", "title": "第 6 章：一元函数的积分"}, "ch07": {"html": "<h1>第 7 章：多变量微分学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：14 小时 ｜ <strong>前置<\/strong>：第 4 章（一元微分）、第 6 章（积分）、第 3 章（紧致）\n<\/ul>\n<blockquote>原书把整章的思路压缩成一句话：多变量情形的微分依赖于仿射函数局部逼近的思想。非平凡的部分就是其中的线性映射，所以第 1 节先研究赋范空间之间的连续线性映射。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用算子范数判断线性映射连续，并说明有限维为什么&quot;所有范数等价&quot;。\n<\/li><li>\n写出弗雷歇导数的定义，区分&quot;偏导存在&quot;与&quot;可微&quot;。\n<\/li><li>\n用链式法则求复合函数的雅可比矩阵。\n<\/li><li>\n陈述逆映射定理与隐函数定理的条件，并用拉格朗日乘子解约束极值。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>多变量导数不是数，是一个线性映射：f(a + h) = f(a) + A h + r(h)，其中 ‖r(h)‖/‖h‖ → 0。A 就是导数，在标准基下写成雅可比矩阵。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：连续线性映射与算子范数<\/h3>\n<p>线性映射 A : E → F 连续 ⇔ 存在 C 使 ‖Ax‖ ≤ C‖x‖。等价的量是算子范数<\/p>\n<p>‖A‖ := sup{‖Ax‖ : ‖x‖ ≤ 1}。<\/p>\n<p>它把&quot;最大放大倍数&quot;变成一个数。由此得到 L(E, F) 是一个赋范空间；若 F 完备，则 L(E, F) 完备。这是第 1 节的主要定理，证明用柯西列逐点收敛 + 一致有界。<\/p>\n<p>有限维空间里，所有范数等价：存在常数 c, C 使 c‖x‖₁ ≤ ‖x‖₂ ≤ C‖x‖₁。所以&quot;在哪个范数下连续&quot;这个问题在有限维没有意义，在无限维才有意义（例如多项式空间上 sup 范数与 L² 范数不等价）。<\/p>\n<p><strong>类比<\/strong>：算子范数是放大器的最大增益。连续就是&quot;增益有限&quot;，不连续就是&quot;存在输入使输出爆掉&quot;。<\/p>\n<h3>概念 2：弗雷歇导数<\/h3>\n<p>f : X ⊆ E → F 在 a 处可微：存在 A ∈ L(E, F)，使得<\/p>\n<p>f(a + h) = f(a) + A h + r(h)，且 ‖r(h)‖/‖h‖ → 0（h → 0）。<\/p>\n<p>A 记作 f′(a) 或 Df(a)。三个要点：<\/p>\n<ol><li>\nA 必须是<strong>线性<\/strong>的，&quot;局部最佳仿射逼近&quot;的线性部分。\n<\/li><li>\n误差是 o(‖h‖)，即比一阶更快趋零。\n<\/li><li>\n可微 ⇒ 连续，但反之不成立。\n<\/ol>\n<p>在 ℝⁿ → ℝᵐ 中，A 的矩阵就是雅可比矩阵 J = (∂fᵢ/∂xⱼ)。但要注意顺序：先有线性映射，矩阵只是它在标准基下的表示。<\/p>\n<p><strong>类比<\/strong>：把 f 想成一台多输入多输出的机器，导数是一张&quot;局部传动比表&quot;：输入微小变动 h，输出近似按 A h 变化。<\/p>\n<h3>概念 3：偏导存在不等于可微<\/h3>\n<p>经典反例：<\/p>\n<p>f(x, y) = xy/(x² + y²)（(x,y) ≠ (0,0)），f(0,0) = 0。<\/p>\n<p>在原点，两个偏导都存在且等于 0（沿坐标轴函数恒为 0）。但沿直线 y = x，f(x,x) = 1/2，不趋于 0，所以 f 在原点不连续，当然不可微。<\/p>\n<p>正确的关系是：<\/p>\n<ul><li>\n可微 ⇒ 偏导存在，且 A 的矩阵由偏导组成；\n<\/li><li>\n偏导存在 + 偏导连续 ⇒ 可微（C¹ 条件）。\n<\/ul>\n<p>这条&quot;连续&quot;条件是充分条件，不是必要。做题时先查偏导是否连续，是最省事的判据。<\/p>\n<h3>概念 4：链式法则与高阶导数<\/h3>\n<p>若 g 在 a 可微、f 在 g(a) 可微，则 (f∘g)′(a) = f′(g(a)) ∘ g′(a)。写成矩阵就是雅可比相乘。<\/p>\n<p>高阶导数：D²f(a) 是一个双线性映射 E × E → F，在有限维用 Hessian 矩阵表示。<strong>对称性<\/strong>：若 D²f 存在且连续，则 D²f(a)(h, k) = D²f(a)(k, h)（施瓦茨定理）。这条对称性在泰勒公式、极值判别、变分法中反复使用。<\/p>\n<p>多变量泰勒公式：<\/p>\n<p>f(a + h) = f(a) + Df(a)h + (1/2)D²f(a)(h, h) + o(‖h‖²)。<\/p>\n<h3>概念 5：逆映射定理<\/h3>\n<p>设 f : U → F 是 C¹，f′(a) 是拓扑同构（可逆且逆连续），则 f 在 a 附近是局部微分同胚：存在邻域 V，使 f|V 有 C¹ 逆，且 (f⁻¹)′(f(a)) = (f′(a))⁻¹。<\/p>\n<p>条件是&quot;导数可逆&quot;，不是&quot;函数单射&quot;。一维时就是 f′(a) ≠ 0；多维时要雅可比行列式非零。证明用压缩映射原理：把 f(x) = y 改写成 x = x − A⁻¹(f(x) − y)，A = f′(a)，验证这是压缩。<\/p>\n<p><strong>类比<\/strong>：一张能被局部拉平的地图。只要该点的&quot;拉伸率&quot;不为零（雅可比可逆），附近就能一一对应地翻回去。<\/p>\n<h3>概念 6：隐函数定理<\/h3>\n<p>方程 F(x, y) = 0 在 (a, b) 附近能否解出 y = φ(x)？<\/p>\n<p>条件：F(a, b) = 0，F 是 C¹，且 ∂F/∂y(a, b) 可逆。结论：存在 a 的邻域与唯一的 C¹ 函数 φ，使 φ(a) = b 且 F(x, φ(x)) = 0，并且<\/p>\n<p>φ′(x) = −(∂F/∂y)⁻¹ (∂F/∂x)。<\/p>\n<p>一维例子：x² + y² = 1 在 (0,1) 附近，∂F/∂y = 2y = 2 ≠ 0，可解出 y = √(1 − x²)；在 (1,0) 处 ∂F/∂y = 0，解不出单值函数（上下两支相交）。<\/p>\n<h3>概念 7：约束极值与拉格朗日乘子<\/h3>\n<p>求 f(x) 在约束 g(x) = 0 下的极值。若 ∇g(a) ≠ 0，则极值点满足<\/p>\n<p>∇f(a) = λ ∇g(a)。<\/p>\n<p>几何解释：f 的等值面与约束面在极值点相切，两个法向量平行。λ 是乘子，也解释为&quot;约束放松一点，目标能改善多少&quot;的影子价格。<\/p>\n<p>条件是必要的，不是充分的：还要比较各候选点的函数值，并检查边界。<\/p>\n<h3>概念 8：流形、切空间、法向量<\/h3>\n<p>m 维流形 M ⊆ ℝⁿ：每点附近有坐标卡，把 M 局部拉平成 ℝᵐ。切空间 TₚM 是所有过 p 的曲线速度向量张成的空间，维数 m。法空间是它的正交补，维数 n − m。<\/p>\n<p>隐函数定理给出流形的局部描述：若 F : ℝⁿ → ℝᵏ 的导数满秩，则 F⁻¹(0) 是 n − k 维流形，切空间是 ker DF(p)。这为第 11 章的微分形式铺路。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[连续线性映射 算子范数] --&gt; B[弗雷歇导数]\n  B --&gt; C[雅可比矩阵 偏导]\n  B --&gt; D[链式法则]\n  B --&gt; E[高阶导数 对称性]\n  E --&gt; F[多变量泰勒]\n  B --&gt; G[逆映射定理]\n  B --&gt; H[隐函数定理]\n  H --&gt; I[流形与切空间]\n  G --&gt; J[压缩映射]\n  H --&gt; K[拉格朗日乘子]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：所有结论都从&quot;导数是线性映射&quot;出发。逆映射、隐函数是同一件事的两种说法（一个解 x，一个解 y），流形是隐函数定理的几何版本，乘子是它在约束极值上的应用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：多变量函数像一台调音台，多个旋钮（输入）影响多个输出。导数是一张&quot;每个旋钮动一点，各输出变多少&quot;的表；雅可比矩阵就是这张表。隐函数定理说：只要某个旋钮对某个输出的影响不为零，就能反过来用输出定旋钮。 <strong>失效边界<\/strong>：表是线性的近似，旋钮动得太大就不准；隐函数定理要求&quot;影响不为零&quot;，在临界点会失效（圆的左右两端）。<\/p>\n<p><strong>实例（可验证）<\/strong>：f(x, y) = x² + y² 在 (1, 2) 处的导数。 ∂f/∂x = 2x = 2，∂f/∂y = 2y = 4，所以 Df(1,2) = (2, 4)，作为线性映射 (h, k) ↦ 2h + 4k。 验证：f(1+h, 2+k) − f(1,2) = 2h + 4k + h² + k²，余项 h² + k² = o(√(h²+k²))，符合定义。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;偏导数存在就可微&quot;<\/strong> — 实际上 xy/(x²+y²) 在原点两个偏导都为 0，却不连续。可微要求一个统一的线性逼近，不是两个方向各自逼近。\n<\/li><li>\n<strong>别以为&quot;雅可比矩阵就是导数&quot;<\/strong> — 实际上导数是线性映射，雅可比只是它在标准基下的矩阵；换基就换矩阵，映射不变。\n<\/li><li>\n<strong>别以为&quot;隐函数定理的条件可以省&quot;<\/strong> — 实际上 ∂F/∂y 可逆是关键。x² + y² = 1 在 (1,0) 处失效，正因为该偏导为 0。\n<\/li><li>\n<strong>别以为&quot;拉格朗日乘子给的就是最小值&quot;<\/strong> — 实际上它只给候选点，乘子法是必要条件，还要比较与检查边界。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n设 f(x, y) = xy/(x² + y²)（原点补 0），则 f 在原点？　A. 可微　B. 两个偏导存在但不连续　C. 不可微且偏导不存在　D. 连续但偏导不存在\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：沿坐标轴 f 恒为 0，两个偏导都是 0；沿 y = x 极限为 1/2，不连续，故不可微。<\/p>\n<\/ol>\n<ol><li>\n隐函数定理中，保证能解出 y = φ(x) 的关键条件是？　A. F(a,b) = 0　B. F 连续　C. ∂F/∂y(a,b) 可逆　D. ∂F/∂x(a,b) 可逆\n<p><strong>答案<\/strong>：C。<strong>解析<\/strong>：要对 y 求解，必须让 y 方向的导数可逆，才能用压缩映射把 y 反解出来。A 是前提，B 是正则性，D 不是关键。<\/p>\n<\/ol>\n<ol><li>\n约束极值中，若 ∇g(a) ≠ 0，极值点满足？　A. ∇f(a) = 0　B. ∇f(a) = λ∇g(a)　C. ∇g(a) = λ∇f(a)　D. f(a) = g(a)\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：等值面与约束面在极值点相切，法向量平行，故梯度成比例，比例因子就是乘子 λ。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n导数是线性映射，雅可比是它在标准基下的矩阵。\n<\/li><li>\n偏导存在 + 偏导连续 ⇒ 可微；只有偏导存在不够。\n<\/li><li>\n逆映射与隐函数定理的条件都是&quot;该点的导数可逆&quot;，几何上是&quot;没被压扁&quot;。\n<\/ul>", "kind": "chapter", "title": "第 7 章：多变量微分学"}, "ch08": {"html": "<h1>第 8 章：线积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：12 小时 ｜ <strong>前置<\/strong>：第 6 章（积分）、第 7 章（多变量微分）\n<\/ul>\n<blockquote>原书对弧长的处理很实在：把连续路径 γ 的&quot;全变差&quot;直接定义为它的长度；只要变差有限，路径就称为可求长的。长度不是先验概念，是一族折线长度的上确界。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用分割的折线长度定义全变差，判断路径是否可求长，并写出弧长公式。\n<\/li><li>\n解释普法夫形式与恰当形式，判断一个 1-形式是否恰当。\n<\/li><li>\n计算线积分，判断积分是否与路径无关，并求出势函数。\n<\/li><li>\n说明全纯函数的柯西–黎曼方程，以及亚纯函数的极点与留数。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>线积分把 1-形式沿曲线&quot;累加&quot;；当形式恰当（等于某个函数的微分）时，累加结果只取决于端点，这条性质把微积分基本定理推广到了曲线上。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：曲线的长度 = 折线长度的上确界<\/h3>\n<p>设 γ : [a, b] → E 连续，分割 Z = (t₀, …, tₙ)。折线长度<\/p>\n<p>L_Z(γ) := Σ ‖γ(tⱼ) − γ(tⱼ₋₁)‖。<\/p>\n<p>全变差 Var(γ, [a,b]) := sup_Z L_Z(γ)。若有限，称 γ 可求长，并把这个值定义为弧长 L(γ)。<\/p>\n<p>两条基本事实：<\/p>\n<ul><li>\n变差可加：Var(γ, [a,b]) = Var(γ, [a,c]) + Var(γ, [c,b])。\n<\/li><li>\n利普希茨路径可求长，且 L(γ) ≤ λ(b − a)，λ 是利普希茨常数。\n<\/ul>\n<p>反面例子：γ(t) = t cos²(π/2t)（t &gt; 0），γ(0) = 0。取合适分割，折线长度是调和级数的部分和，趋于无穷，所以这个连续路径不可求长。这说明&quot;连续&quot;远不足以保证有限长度。<\/p>\n<p>若 γ 是 C¹，则 L(γ) = ∫_a^b ‖γ′(t)‖ dt。这是把折线长度的上确界算成积分。<\/p>\n<p><strong>类比<\/strong>：路径是走过的轨迹，全变差是计步器读数。无论你怎么细分采样点，读数的上确界就是真实路程；来回踱步的路径读数会很大。<\/p>\n<h3>概念 2：普法夫形式<\/h3>\n<p>在 ℝⁿ 的开集上，1-形式（普法夫形式）写成<\/p>\n<p>ω = Σ aⱼ(x) dxⱼ，<\/p>\n<p>其中 aⱼ 是光滑函数。它不是&quot;无穷小量&quot;，而是一个把切向量喂进去就输出数值的规则：给定一点和方向 v，输出 Σ aⱼ(x) vⱼ。<\/p>\n<p>ω <strong>恰当<\/strong>，如果存在函数 f 使 ω = df，即 aⱼ = ∂f/∂xⱼ。此时 f 叫势函数。<\/p>\n<p>判断恰当性的一维必要条件是<strong>闭性<\/strong>：∂aⱼ/∂xₖ = ∂aₖ/∂xⱼ（混合偏导相等）。在单连通区域上，闭 ⇒ 恰当（庞加莱引理）；有洞的区域不成立，经典例子是<\/p>\n<p>ω = (x dy − y dx)/(x² + y²)，<\/p>\n<p>它在 ℝ² 去掉原点后闭但不恰当，因为绕原点一圈积分是 2π 而不是 0。<\/p>\n<p><strong>类比<\/strong>：恰当形式像&quot;保守力场&quot;：重力、静电力做功只与起点终点有关。闭而不恰当像绕着一个洞转圈，每转一圈都&quot;捡到&quot;一点能量。<\/p>\n<h3>概念 3：线积分的定义与计算<\/h3>\n<p>沿 C¹ 曲线 γ : [a,b] → ℝⁿ 积分：<\/p>\n<p>∫_γ ω := ∫_a^b Σ aⱼ(γ(t)) γⱼ′(t) dt。<\/p>\n<p>它是普通定积分的复合：把形式在曲线上的取值对参数积分。结果与参数化无关（只差方向符号）：换参数 s = φ(t) 时，链式法则把 γ′dt 换成 γ′ds，积分值不变。<\/p>\n<p>基本定理的推广：若 ω = df，则 ∫_γ ω = f(γ(b)) − f(γ(a))。路径无关性由此而来。<\/p>\n<p>计算实例：ω = x dy − y dx，γ 为单位圆 t ↦ (cos t, sin t)，t ∈ [0, 2π]。 ∫_γ ω = ∫₀^{2π} (cos t · cos t − sin t · (−sin t)) dt = ∫₀^{2π} 1 dt = 2π。 这个值等于圆面积，也等于绕原点一圈的&quot;角增量&quot;，说明 ω 不是恰当的。<\/p>\n<h3>概念 4：全纯函数<\/h3>\n<p>f : U ⊆ ℂ → ℂ 全纯：在每点复可微，即<\/p>\n<p>f′(z) = lim_{h→0} (f(z + h) − f(z))/h<\/p>\n<p>存在（h 沿复平面任意方向）。这比实可微强得多：它要求两个实偏导满足柯西–黎曼方程<\/p>\n<p>∂u/∂x = ∂v/∂y，∂u/∂y = −∂v/∂x（f = u + iv）。<\/p>\n<p>等价说法：f 的微分 f′(z) dz 是 ℂ 值 1-形式，且满足某种闭性；全纯函数的实部与虚部都是调和函数。<\/p>\n<p>关键结论：<\/p>\n<ul><li>\n全纯 ⇒ 解析：每点附近可展开成幂级数。\n<\/li><li>\n柯西积分定理：在单连通区域内全纯的函数，沿任意闭曲线的积分为 0。\n<\/li><li>\n柯西积分公式：f(a) = (1/2πi) ∮ f(z)/(z − a) dz。\n<\/li><li>\n刘维尔定理：有界的整函数必为常数。\n<\/ul>\n<p><strong>类比<\/strong>：实可微像&quot;从东西南北四个方向看都平滑&quot;，全纯像&quot;从所有方向看都平滑且旋转角度一致&quot;。后者约束更强，所以全纯函数有刚性：一点的信息决定一片区域。<\/p>\n<h3>概念 5：亚纯函数与留数<\/h3>\n<p>亚纯：在区域内除孤立极点外全纯。<\/p>\n<p>若 f 在 a 处有 m 阶极点，则 f(z) = c_{−m}/(z−a)ᵐ + … + c_{−1}/(z−a) + 全纯部分。c_{−1} 叫留数 Res(f, a)。<\/p>\n<p>留数定理：∮_γ f dz = 2πi Σ Res(f, aₖ)（aₖ 在 γ 内部）。<\/p>\n<p>计算实例：∮_{|z|=1} dz/z = 2πi，因为留数为 1。这个例子说明&quot;闭形式在洞里积分不为 0&quot;，与普法夫形式的洞是同一件事。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[曲线 gamma] --&gt; B[折线长度]\n  B --&gt; C[全变差 上确界]\n  C --&gt; D[弧长 可求长]\n  A --&gt; E[普法夫形式 omega]\n  E --&gt; F[恰当 omega = df]\n  F --&gt; G[线积分只依赖端点]\n  E --&gt; H[闭而不恰当 有洞]\n  H --&gt; I[绕洞积分非零]\n  G --&gt; J[全纯函数 柯西积分定理]\n  J --&gt; K[亚纯函数 留数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左支是几何（长度），右支是微分形式（积分）。两支在&quot;绕洞积分非零&quot;处汇合：这正是柯西积分定理与留数定理的几何来源。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：线积分像沿路线记录&quot;每走一步，计费器按当前位置的单价跳多少&quot;。若单价来自某个&quot;高度函数&quot;（恰当形式），总费用只与起点终点有关；若单价绕着一个柱子打转（闭而不恰当），绕一圈就多收一笔。 <strong>失效边界<\/strong>：只有区域没有洞时，&quot;闭 ⇒ 恰当&quot;才成立；有洞时绕洞一圈的积分是拓扑量，不能靠局部条件消掉。<\/p>\n<p><strong>实例（可验证）<\/strong>：验证 ω = y dx + x dy 恰当，并求势函数。 ∂(y)/∂y = 1，∂(x)/∂x = 1，满足闭性；在 ℝ²（单连通）上恰当。取 f(x,y) = xy，则 df = y dx + x dy。沿任意曲线从 (0,0) 到 (1,2)，积分都是 2，与路径无关。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;连续曲线一定有长度&quot;<\/strong> — 实际上存在连续但不可求长的路径（t cos²(π/2t)）。\n<\/li><li>\n<strong>别以为&quot;闭形式一定恰当&quot;<\/strong> — 实际上只在单连通区域成立；(x dy − y dx)/(x²+y²) 是标准反例。\n<\/li><li>\n<strong>别以为&quot;线积分只依赖端点&quot;总是成立<\/strong> — 实际上只有恰当形式才路径无关；否则绕一圈的积分可能非零。\n<\/li><li>\n<strong>别以为&quot;实可微就是全纯&quot;<\/strong> — 实际上全纯还要求柯西–黎曼方程，条件强得多。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n关于全变差，正确的说法是？　A. 连续曲线的全变差总有限　B. 全变差是折线长度的上确界　C. 全变差等于端点距离　D. 全变差只对直线有限\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：定义就是 sup 折线长度。连续曲线可以不可求长（t cos²(π/2t)），端点距离只是下界。<\/p>\n<\/ol>\n<ol><li>\nω = (x dy − y dx)/(x² + y²) 在 ℝ² 去掉原点后？　A. 恰当　B. 闭但不恰当　C. 既不闭也不恰当　D. 恒为 0\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：混合偏导相等故闭；但绕单位圆积分 2π ≠ 0，所以不存在单值势函数，不恰当。<\/p>\n<\/ol>\n<ol><li>\n∮_{|z|=1} dz/z 的值是？　A. 0　B. 2πi　C. πi　D. 1\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：1/z 在 0 处留数为 1，由留数定理积分等于 2πi·1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n弧长 = 折线长度的上确界；利普希茨是充分条件，连续不够。\n<\/li><li>\n恰当 ⇔ 有势函数；单连通区域上闭 ⇒ 恰当。\n<\/li><li>\n全纯 = 复可微 = 柯西–黎曼；留数定理把闭路积分变成极点处的系数。\n<\/ul>", "kind": "chapter", "title": "第 8 章：线积分"}, "c06": {"html": "<h1>黎曼积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 6 章（§1–§5）、第 10 章（§5）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把一个函数用阶梯函数一致逼近，取这些阶梯函数积分值的极限，这个极限就是黎曼积分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;面积&quot;从几何直觉变成可证明的对象，并且给出可积的判据。第 10 章的勒贝格积分是它的推广：把&quot;阶梯函数&quot;换成&quot;简单函数&quot;，把&quot;一致逼近&quot;换成&quot;几乎处处逼近&quot;，从而能处理更病态的函数与极限交换。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[阶梯函数 有限和] --&gt; B[sup 范数稠密]\n  B --&gt; C[跳跃连续函数]\n  C --&gt; D[积分存在且唯一]\n  D --&gt; E[微积分基本定理]\n  E --&gt; F[换元 分部 计算]\n  D --&gt; G[反常积分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>阶梯函数 f = Σ cⱼ χ_(αⱼ₋₁, αⱼ) 的积分定义为 Σ cⱼ(αⱼ − αⱼ₋₁)。<\/p>\n<p>关键估计：|∫f| ≤ ‖f‖∞(β − α)。这条估计说明积分映射是利普希茨的，因此可以把定义从阶梯函数唯一延拓到其一致闭包——即跳跃连续函数。跳跃连续指每点左右极限存在；连续函数、分段连续函数都属此类。<\/p>\n<p>可积的实用判据：对每个 ε &gt; 0，存在阶梯函数 φ，使 sup|f − φ| &lt; ε。<\/p>\n<p>可积函数不必连续：符号函数在 [−1,1] 上跳跃连续，积分存在。但 Dirichlet 函数（有理点取 1、无理点取 0）不黎曼可积，因为它与任何阶梯函数的 sup 距离都是 1。<\/p>\n<p>勒贝格积分的思想差别：不要求&quot;处处逼近&quot;，只要求&quot;除了一个零测集之外逼近&quot;。代价是要先建测度论（第 9 章）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为积分就是面积——对变号函数面积要带符号，对向量值函数没有面积可言。\n<\/li><li>\n别以为连续是必要的——跳跃连续即可，黎曼可积类还更宽。\n<\/li><li>\n别以为&quot;几乎处处连续&quot;就黎曼可积——有界 + 间断点集测度为零才是黎曼可积的完整刻画（勒贝格判据）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章 §1<\/td><td>阶梯函数<\/td><td>有限和的定义<\/td><\/tr><tr><td>第 6 章 §3<\/td><td>柯西–黎曼积分<\/td><td>延拓与唯一性<\/td><\/tr><tr><td>第 6 章 §4<\/td><td>性质<\/td><td>线性、单调、估计<\/td><\/tr><tr><td>第 10 章 §5<\/td><td>勒贝格积分<\/td><td>黎曼积分是绝对可积情形的推广<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：一致收敛、连续、紧致\n<\/li><li>\n后续：反常积分、L¹ 空间、勒贝格积分\n<\/ul>", "kind": "concept", "title": "黎曼积分"}, "c07": {"html": "<h1>弗雷歇微分与雅可比矩阵<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 7 章（§2–§5）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>多变量函数在一点的导数是一个线性映射 A，使得 f(a + h) = f(a) + Ah + o(‖h‖)；雅可比矩阵是 A 在标准基下的表示。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是所有多变量结论的入口：链式法则、逆映射、隐函数、流形、变分法，全部建立在&quot;导数 = 线性映射&quot;之上。把导数当成一堆偏导数的表格，会导致&quot;偏导存在就可微&quot;这类错误。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  D[导数 A 线性映射] --&gt; J[雅可比矩阵 标准基表示]\n  D --&gt; R[余项 o 范数 h]\n  R --&gt; C[可微必连续]\n  J --&gt; P[偏导存在 不够]\n  P --&gt; Q[偏导连续 充分]\n  D --&gt; CH[链式法则 矩阵相乘]\n  D --&gt; H[高阶导数 双线性映射]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义：存在 A ∈ L(E, F)，使<\/p>\n<p>lim_{h→0} ‖f(a+h) − f(a) − Ah‖ / ‖h‖ = 0。<\/p>\n<p>唯一性：若有两个这样的 A，相减得 ‖(A₁ − A₂)h‖/‖h‖ → 0，由线性性只能 A₁ = A₂。<\/p>\n<p>与偏导的关系：若可微，则 ∂fᵢ/∂xⱼ = A 的矩阵元。反之不成立——偏导只描述沿坐标轴的行为，可微要求所有方向的误差统一为 o(‖h‖)。<\/p>\n<p>反例 f(x,y) = xy/(x²+y²)：沿坐标轴恒为 0，故两个偏导为 0；沿 y = x 值为 1/2，不连续。A 不可能存在。<\/p>\n<p>充分条件：若所有偏导在 a 的邻域存在且在 a 连续（C¹），则可微。证明用&quot;沿坐标轴逐段走&quot;把 f(a+h) − f(a) 写成偏导的积分，再用连续性控制。<\/p>\n<p>链式法则：(f∘g)′(a) = f′(g(a))g′(a)，矩阵形式就是雅可比相乘。注意顺序不能反。<\/p>\n<p>高阶导数：D²f(a) 是双线性映射，矩阵为 Hessian。C² 时对称（施瓦茨定理），这给泰勒公式的二阶项提供了良好定义。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为偏导存在就可微——需要统一的线性逼近。\n<\/li><li>\n别以为雅可比矩阵就是导数——换基会换矩阵，映射本身不变。\n<\/li><li>\n别以为&quot;各方向方向导数都存在&quot;就够——方向导数存在也不保证可微，反例需要更精细的构造。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章 §1<\/td><td>连续线性映射<\/td><td>算子范数、L(E,F) 完备<\/td><\/tr><tr><td>第 7 章 §2<\/td><td>可微性<\/td><td>弗雷歇导数定义<\/td><\/tr><tr><td>第 7 章 §3<\/td><td>微分法则<\/td><td>链式、乘积、商<\/td><\/tr><tr><td>第 7 章 §5<\/td><td>高阶导数<\/td><td>对称性、泰勒<\/td><\/tr><tr><td>第 12 章 §1<\/td><td>体积测度<\/td><td>雅可比行列式进入换元公式<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：一元导数、算子范数\n<\/li><li>\n后续：逆映射定理、隐函数定理、微分形式\n<\/ul>", "kind": "concept", "title": "弗雷歇微分与雅可比矩阵"}, "c08": {"html": "<h1>逆映射定理与隐函数定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 7 章（§7–§9）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若 f 在 a 处的导数是可逆线性映射，则 f 在 a 附近可逆且逆映射光滑；隐函数定理是它在&quot;解方程&quot;问题上的变形。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们是把非线性问题局部线性化的许可证。数值求解、流形定义、约束优化、微分方程解的存在性，都要先验证&quot;该点导数可逆&quot;这个条件。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[导数 A 可逆] --&gt; B[逆映射定理]\n  A --&gt; C[隐函数定理]\n  B --&gt; D[局部微分同胚]\n  B --&gt; E[逆的导数 A 逆]\n  C --&gt; F[解出 y = phi x]\n  F --&gt; G[流形 F 逆零]\n  C --&gt; H[拉格朗日乘子]\n  B --&gt; I[压缩映射证明]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p><strong>逆映射定理<\/strong>：f : U → F 是 C¹，f′(a) 是拓扑同构，则存在 a 的邻域 V 与 f(a) 的邻域 W，使 f|V : V → W 是双射且逆映射 C¹，并且<\/p>\n<p>(f⁻¹)′(f(a)) = (f′(a))⁻¹。<\/p>\n<p>证明骨架：把 f(x) = y 改写为 x = T(x)，T(x) = x − A⁻¹(f(x) − y)，A = f′(a)。在 a 附近 T 是压缩（因为 T′ = I − A⁻¹f′(x)，在 a 处为 0，连续性与可逆性保证范数 &lt; 1），由压缩映射原理得唯一不动点，再用参数连续性得 C¹。<\/p>\n<p><strong>隐函数定理<\/strong>：F : U × V → G 是 C¹，F(a, b) = 0，∂F/∂y(a, b) 可逆，则存在唯一的 C¹ 函数 φ，φ(a) = b，F(x, φ(x)) = 0，且<\/p>\n<p>φ′(x) = −(∂F/∂y)⁻¹ ∂F/∂x。<\/p>\n<p>两者本质相同：把 F(x, y) = 0 看成 f(y) = 0 的参数化版本，对 y 用逆映射定理。<\/p>\n<p><strong>流形<\/strong>：若 DF(p) 满秩，则 F⁻¹(0) 在 p 附近是 n − k 维流形，切空间为 ker DF(p)。这把&quot;方程的解集&quot;变成了有切空间的几何对象。<\/p>\n<p><strong>约束极值<\/strong>：在 g(x) = 0 上求 f 的极值，若 ∇g ≠ 0，则 ∇f = λ∇g。几何上是两个等值面在极值点相切。λ 是约束的影子价格。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;导数可逆&quot;可以换成&quot;函数单射&quot;——单射不保证局部可逆（如 x ↦ x³ 在 0 处单射但导数为 0）。\n<\/li><li>\n别以为隐函数定理给的是全局解——只在 a 的某个邻域内成立。\n<\/li><li>\n别以为条件只是技术性的——在 ∂F/∂y = 0 处，解可能分裂成多支（圆的左右端点）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章 §7<\/td><td>逆映射<\/td><td>局部微分同胚、逆的导数<\/td><\/tr><tr><td>第 7 章 §8<\/td><td>隐函数<\/td><td>解出 y = φ(x)、导数公式<\/td><\/tr><tr><td>第 7 章 §9<\/td><td>流形<\/td><td>隐式定义的子流形与切空间<\/td><\/tr><tr><td>第 11 章 §1<\/td><td>子流形<\/td><td>浸入、嵌入、带边流形<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：弗雷歇导数、压缩映射原理\n<\/li><li>\n后续：子流形、拉格朗日乘子、微分形式\n<\/ul>", "kind": "concept", "title": "逆映射定理与隐函数定理"}, "c09": {"html": "<h1>线积分与势函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 8 章（§1–§4）、第 11 章（§3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线积分是把 1-形式沿曲线累加；若该形式等于某个函数的微分（恰当形式），累加结果只依赖起点与终点，那个函数就是势函数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把微积分基本定理推广到曲线上，也是&quot;保守力场&quot;的数学版本。第 11 章的微分形式、第 12 章的斯托克斯定理，都是它向高维的推广。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[1-形式 omega] --&gt; B[沿曲线积分]\n  B --&gt; C[依赖路径]\n  A --&gt; D[恰当 omega = df]\n  D --&gt; E[只依赖端点]\n  E --&gt; F[势函数 f]\n  A --&gt; G[闭但不恰当]\n  G --&gt; H[绕洞积分非零]\n  H --&gt; I[留数 拓扑障碍]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义：ω = Σ aⱼ dxⱼ 沿 C¹ 曲线 γ 的积分为 ∫_a^b Σ aⱼ(γ(t))γⱼ′(t) dt。<\/p>\n<p>三个层次：<\/p>\n<ol><li>\n<strong>计算<\/strong>：把形式在曲线上的取值对参数积分，换参数不变（方向反转变号）。\n<\/li><li>\n<strong>恰当性<\/strong>：若 ω = df，则 ∫_γ ω = f(γ(b)) − f(γ(a))。于一维就是牛顿–莱布尼茨公式。\n<\/li><li>\n<strong>判据<\/strong>：∂aⱼ/∂xₖ = ∂aₖ/∂xⱼ（闭性）是必要条件；在单连通区域上也是充分的（庞加莱引理）。\n<\/ol>\n<p>反例：ω = (x dy − y dx)/(x² + y²) 在 ℝ² ∖ {0} 上闭，但绕单位圆积分为 2π ≠ 0，故不恰当。这个 2π 是拓扑量，正是复分析里留数定理的来源。<\/p>\n<p>势函数的求法：沿坐标轴分段积分，或解梯度方程组 ∂f/∂xⱼ = aⱼ，再用闭性保证可积。<\/p>\n<p><strong>类比<\/strong>：恰当形式像&quot;海拔差&quot;，只与起点终点有关；闭而不恰当像&quot;绕塔转圈&quot;，每转一圈都累积一个固定角度。 <strong>边界<\/strong>：只有区域单连通时&quot;闭 ⇒ 恰当&quot;；有洞时拓扑障碍无法靠局部条件消除。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为线积分总与路径无关——只有恰当形式才如此。\n<\/li><li>\n别以为&quot;闭形式&quot;就是&quot;恰当形式&quot;——有洞区域是反例。\n<\/li><li>\n别以为势函数一定存在且唯一——差一个常数仍成立，有洞时可能多值（角度函数）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章 §1<\/td><td>曲线与长度<\/td><td>全变差、可求长、弧长公式<\/td><\/tr><tr><td>第 8 章 §3<\/td><td>普法夫形式<\/td><td>恰当形式、势函数<\/td><\/tr><tr><td>第 8 章 §4<\/td><td>线积分<\/td><td>定义、路径无关、基本定理<\/td><\/tr><tr><td>第 11 章 §3<\/td><td>微分形式的局部理论<\/td><td>外微分、闭与恰当<\/td><\/tr><tr><td>第 12 章 §3<\/td><td>斯托克斯定理<\/td><td>高维推广<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：黎曼积分、偏导数\n<\/li><li>\n后续：全纯函数、微分形式、斯托克斯定理\n<\/ul>", "kind": "concept", "title": "线积分与势函数"}, "c10": {"html": "<h1>全纯函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 8 章（§5–§6）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>复平面上在每点复可微的函数，等价于实部与虚部满足柯西–黎曼方程，并且局部可以展开成幂级数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是复分析的入口，也是本卷最&quot;刚性&quot;的对象：一点的全部导数决定整个连通区域。柯西积分定理与留数定理把复杂的闭路积分变成极点上几个系数的和，这种效率在实分析里没有对应物。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[复可微] --&gt; B[柯西-黎曼方程]\n  B --&gt; C[实部虚部调和]\n  A --&gt; D[解析 局部幂级数]\n  D --&gt; E[柯西积分公式]\n  E --&gt; F[刘维尔定理 有界整函数为常数]\n  E --&gt; G[留数定理]\n  G --&gt; H[闭路积分 = 2 pi i 留数和]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>复可微：极限 lim_{h→0}(f(z+h) − f(z))/h 存在，h 可从任意方向趋于 0。这比实可微强得多：把 h 分别取实数方向和虚数方向，得到两个偏导关系<\/p>\n<p>u_x = v_y，u_y = −v_x。<\/p>\n<p>这就是柯西–黎曼方程。它保证 f 的微分是&quot;复线性&quot;的，而不是一般的实线性映射。<\/p>\n<p>主要结论：<\/p>\n<ul><li>\n全纯 ⇒ 解析：在每点附近 f(z) = Σ cₙ(z − a)ⁿ，收敛半径由奇点位置决定。\n<\/li><li>\n柯西积分定理：单连通区域内全纯函数沿闭曲线积分为 0。\n<\/li><li>\n柯西积分公式：f(a) = (1/2πi)∮ f(z)/(z − a) dz，由此可得各阶导数公式。\n<\/li><li>\n刘维尔：有界整函数是常数，于是代数学基本定理可以用它证明。\n<\/li><li>\n留数定理：∮ f dz = 2πiΣ Res(f, aₖ)。\n<\/ul>\n<p><strong>类比<\/strong>：全纯函数像一块没有内应力的玻璃，局部形状决定整体；实可微函数像橡皮泥，可以任意揉捏。 <strong>边界<\/strong>：全纯只在一个开区域内讨论；边界上的奇点（如 1/z 在 0）正是留数信息的来源。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;实部虚部都可微&quot;就是全纯——还必须满足柯西–黎曼方程。\n<\/li><li>\n别以为全纯函数的积分总能算成 0——区域有洞时闭路积分可以非零（∮dz/z = 2πi）。\n<\/li><li>\n别以为解析展开只在一点成立——收敛圆内成立，圆外要换展开点。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章 §5<\/td><td>全纯函数<\/td><td>柯西–黎曼、柯西积分定理<\/td><\/tr><tr><td>第 8 章 §6<\/td><td>亚纯函数<\/td><td>极点、留数、留数定理<\/td><\/tr><tr><td>第 10 章 §9<\/td><td>傅里叶变换<\/td><td>解析方法与傅里叶变换的联系<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线积分、普法夫形式、幂级数\n<\/li><li>\n后续：留数定理、傅里叶变换、解析延拓\n<\/ul>", "kind": "concept", "title": "全纯函数"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-06'><strong>步骤 06：积分与基本定理<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：一元函数的积分<\/a><br>检查点：ch06 自测三题<\/li><li class='path-step' id='path-07'><strong>步骤 07：多变量微分<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：多变量微分学<\/a><br>检查点：ch07 自测三题<\/li><li class='path-step' id='path-08'><strong>步骤 08：线积分与全纯<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：线积分<\/a><br>检查点：ch08 自测三题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='aii-x1' data-type='single'><p class='quiz-q'><b>Q10.<\/b> 微积分基本定理 ∫_α^β f = F(β) − F(α) 成立，需要的核心条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='aii-x1' value='0'> f 有界<\/label><label class='quiz-opt'><input type='radio' name='aii-x1' value='1'> f 连续（或可积）且 F′ = f<\/label><label class='quiz-opt'><input type='radio' name='aii-x1' value='2'> f 单调<\/label><label class='quiz-opt'><input type='radio' name='aii-x1' value='3'> F 有界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='aii-x2' data-type='single'><p class='quiz-q'><b>Q11.<\/b> 把「线积分只依赖端点」与「微分学」联系起来，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='aii-x2' value='0'> 任何 1-形式都路径无关<\/label><label class='quiz-opt'><input type='radio' name='aii-x2' value='1'> 恰当形式的线积分等于势函数在端点的差<\/label><label class='quiz-opt'><input type='radio' name='aii-x2' value='2'> 闭形式一定恰当<\/label><label class='quiz-opt'><input type='radio' name='aii-x2' value='3'> 路径无关只对直线成立<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：一元函数的积分<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列关于跳跃连续函数的说法，正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 必须连续<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 每点左右极限存在，可以不等于函数值<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 只能有有限个间断点<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 必须有界变差<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ∫_1^∞ 1/x^p 收敛的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> p &gt; 0<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> p &gt; 1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> p &lt; 1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 对所有 p 都收敛<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Γ(5) 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 5!<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 4!<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 5<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 24/5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章：多变量微分学<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 设 f(x, y) = xy/(x² + y²)（原点补 0），则 f 在原点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 可微<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 两个偏导存在但不连续<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 不可微且偏导不存在<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 连续但偏导不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 隐函数定理中，保证能解出 y = φ(x) 的关键条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> F(a,b) = 0<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> F 连续<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> ∂F/∂y(a,b) 可逆<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> ∂F/∂x(a,b) 可逆<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 约束极值中，若 ∇g(a) ≠ 0，极值点满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> ∇f(a) = 0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> ∇f(a) = λ∇g(a)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> ∇g(a) = λ∇f(a)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> f(a) = g(a)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch08__": {"html": "<h1>测验：第 8 章：线积分<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 关于全变差，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 连续曲线的全变差总有限<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 全变差是折线长度的上确界<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 全变差等于端点距离<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 全变差只对直线有限<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ω = (x dy − y dx)/(x² + y²) 在 ℝ² 去掉原点后？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 恰当<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 闭但不恰当<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 既不闭也不恰当<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 恒为 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> ∮_{|z|=1} dz/z 的值是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 2πi<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> πi<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='阶梯函数'>阶梯函数 — 在分割的每个开区间上取常数值的函数。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='跳跃连续'>跳跃连续 — 每点处左右单侧极限都存在（可不等于函数值）。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='分段连续'>分段连续 — 只有有限个跳跃点的跳跃连续函数。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='柯西–黎曼积分'>柯西–黎曼积分 — 本书对一元函数积分的称呼，由阶梯函数积分延拓得到。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='微积分基本定理'>微积分基本定理 — 变上限积分求导得被积函数；反之积分等于原函数端点差。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='反常积分'>反常积分 — 区间无界或被积函数无界时，用极限定义的积分。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='绝对收敛'>绝对收敛 — 被积函数绝对值可积；绝对收敛必收敛。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='傅里叶系数'>傅里叶系数 — 用三角函数内积投影得到的系数 aₖ、bₖ。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='伽马函数'>伽马函数 — Γ(z)=∫t^(z−1)e^(−t)dt，满足 Γ(n+1)=n!。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='算子范数'>算子范数 — 线性映射的最大放大倍数，‖A‖=sup‖Ax‖/‖x‖。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='弗雷歇导数'>弗雷歇导数 — 使 f(a+h)=f(a)+Ah+o(‖h‖) 的唯一线性映射 A。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 导数在标准基下的矩阵，元素为偏导数。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='链式法则'>链式法则 — 复合函数导数等于两个线性映射的复合（矩阵相乘）。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='黑塞矩阵'>黑塞矩阵 — 二阶偏导组成的对称矩阵，表示二阶导数。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='逆映射定理'>逆映射定理 — 导数可逆时函数局部可逆，逆映射 C¹ 且导数为原导数的逆。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='隐函数定理'>隐函数定理 — F(a,b)=0 且对 y 的偏导可逆时，可局部解出 y=φ(x)。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='拉格朗日乘子'>拉格朗日乘子 — 约束极值中使 ∇f=λ∇g 的比例因子。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='全变差'>全变差 — 所有分割折线长度的上确界。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='可求长'>可求长 — 全变差有限的曲线。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='普法夫形式'>普法夫形式 — 形如 Σaⱼdxⱼ 的 1-形式。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='恰当形式'>恰当形式 — 等于某个函数微分的 1-形式。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='势函数'>势函数 — 满足 df=ω 的函数 f。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='全纯函数'>全纯函数 — 复可微的函数，等价于满足柯西–黎曼方程。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='亚纯函数'>亚纯函数 — 除孤立极点外全纯的函数。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='留数'>留数 — 洛朗展开中 (z−a)⁻¹ 的系数。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库：《分析 II》<\/h1>\n<h2>框架：逼近 → 延拓 → 性质<\/h2>\n<p>积分、线积分、微分形式都走同一条路：先在简单对象（阶梯函数、折线、常系数形式）上定义量，证明它在 sup 范数或一致收敛下连续，再延拓到闭包，最后证明延拓后的对象保持线性与基本估计。遇到新定义，先问&quot;简单对象是什么、逼近用什么范数、延拓凭什么唯一&quot;。<\/p>\n<h2>框架：把非线性问题局部线性化<\/h2>\n<p>多变量的所有存在性定理都是这个套路：取 A = f′(a)，把方程改写成 x = x − A⁻¹(F(x))，验证压缩，得到不动点。逆映射、隐函数、流形、微分方程解的存在性都是同一模板的不同外衣。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n判断偏导能否替代导数：先看偏导是否连续（C¹）；连续则可用，不连续要找反例。\n<\/li><li>\n判断反常积分：先找比较对象 x^{-p}，再看区间方向决定 p 的不等式方向。\n<\/li><li>\n判断路径无关：先算 ∂aⱼ/∂xₖ 是否相等；相等再看区域是否有洞。\n<\/li><li>\n判断全纯：先写 u、v 验柯西–黎曼；满足再谈积分。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把雅可比矩阵当成&quot;导数本身&quot;<\/strong>。换基就换矩阵，导数是映射。\n<\/li><li>\n<strong>用偏导存在冒充可微<\/strong>。xy/(x²+y²) 是常备反例。\n<\/li><li>\n<strong>在临界点硬用隐函数定理<\/strong>。∂F/∂y = 0 时解可能分裂，必须换坐标或改用其他方法。\n<\/li><li>\n<strong>把条件收敛的积分随意重排<\/strong>。收敛不等于绝对收敛，重排会改变结果。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表：《分析 II》<\/h1>\n<h2>定义与公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>阶梯函数积分<\/td><td>Σ cⱼ(αⱼ − αⱼ₋₁)<\/td><\/tr><tr><td>积分估计<\/td><td>｜∫f｜ ≤ ‖f‖∞(β − α)<\/td><\/tr><tr><td>基本定理<\/td><td>(∫_α^x f)′ = f；∫_α^β f = F(β) − F(α)<\/td><\/tr><tr><td>换元<\/td><td>∫f(φ(t))φ′(t)dt = ∫f(u)du<\/td><\/tr><tr><td>分部<\/td><td>∫u′v = uv − ∫uv′<\/td><\/tr><tr><td>p-积分<\/td><td>∫_1^∞ x^{−p} 收敛 ⇔ p&gt;1；∫_0^1 x^{−p} 收敛 ⇔ p&lt;1<\/td><\/tr><tr><td>算子范数<\/td><td>‖A‖ = sup_{‖x‖≤1}‖Ax‖<\/td><\/tr><tr><td>可微<\/td><td>f(a+h)=f(a)+Ah+r(h)，‖r(h)‖/‖h‖→0<\/td><\/tr><tr><td>雅可比<\/td><td>Jᵢⱼ = ∂fᵢ/∂xⱼ<\/td><\/tr><tr><td>链式<\/td><td>(f∘g)′ = f′(g(a))g′(a)<\/td><\/tr><tr><td>泰勒二阶<\/td><td>f(a+h)=f(a)+Df(a)h+½D²f(a)(h,h)+o(‖h‖²)<\/td><\/tr><tr><td>逆映射<\/td><td>(f⁻¹)′(f(a)) = f′(a)⁻¹<\/td><\/tr><tr><td>隐函数<\/td><td>φ′ = −(∂F/∂y)⁻¹∂F/∂x<\/td><\/tr><tr><td>乘子法<\/td><td>∇f = λ∇g，g=0<\/td><\/tr><tr><td>全变差<\/td><td>Var(γ) = sup_Z Σ‖γ(tⱼ)−γ(tⱼ₋₁)‖<\/td><\/tr><tr><td>弧长<\/td><td>C¹ 时 L(γ)=∫‖γ′(t)‖dt<\/td><\/tr><tr><td>线积分<\/td><td>∫_γ ω = ∫_a^b Σaⱼ(γ(t))γⱼ′(t)dt<\/td><\/tr><tr><td>恰当<\/td><td>ω=df ⇒ ∫_γ ω = f(终点)−f(起点)<\/td><\/tr><tr><td>柯西–黎曼<\/td><td>u_x=v_y，u_y=−v_x<\/td><\/tr><tr><td>留数<\/td><td>∮f dz = 2πiΣRes(f,aₖ)<\/td><\/tr><\/tbody><\/table>\n<h2>常用推理链<\/h2>\n<ol><li>\n阶梯函数 → 一致逼近 → 积分 → 基本定理 → 计算。\n<\/li><li>\n偏导连续 → 可微 → 雅可比 → 链式 → 逆映射/隐函数。\n<\/li><li>\n1-形式 → 闭性检验 → 单连通 → 势函数 → 路径无关。\n<\/li><li>\n复可微 → 柯西–黎曼 → 解析 → 柯西定理 → 留数。\n<\/ol>\n<h2>反例清单<\/h2>\n<table><thead><tr><th>命题<\/th><th>反例<\/th><\/tr><\/thead><tbody><tr><td>连续曲线可求长<\/td><td>t cos²(π/2t)<\/td><\/tr><tr><td>偏导存在则可微<\/td><td>xy/(x²+y²)<\/td><\/tr><tr><td>闭形式必恰当<\/td><td>(xdy−ydx)/(x²+y²)<\/td><\/tr><tr><td>条件收敛可重排<\/td><td>∫sin x/x<\/td><\/tr><tr><td>实可微即全纯<\/td><td>f(z)=zbar(z)<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452582422523394/点化学习系统/02-分析II", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 6 章：一元函数的积分", "href": "#/chapter/ch06"}, {"label": "第 7 章：多变量微分学", "href": "#/chapter/ch07"}, {"label": "第 8 章：线积分", "href": "#/chapter/ch08"}]}, {"label": "概念", "children": [{"label": "黎曼积分", "href": "#/concept/c06"}, {"label": "弗雷歇微分与雅可比矩阵", "href": "#/concept/c07"}, {"label": "逆映射定理与隐函数定理", "href": "#/concept/c08"}, {"label": "线积分与势函数", "href": "#/concept/c09"}, {"label": "全纯函数", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 6 章：一元函数的积分", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：多变量微分学", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：线积分", "href": "#/quiz/ch08"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch06": "<h1>第 6 章：一元函数的积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：12 小时 ｜ <strong>前置<\/strong>：第 3 章（连续、紧致）、第 4 章（微分）、第 5 章（一致收敛）\n<\/ul>\n<blockquote>原书开头把积分的来历说得很朴素：积分是为了求面积发明的，基本策略是把图形切成矩形再相加。但&quot;给定图形可以用无数种方式近似为矩形，它们是否都导致相同结果，绝非不言自明&quot;——这句话就是整章要解决的问题。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用阶梯函数的一致逼近定义积分，并说明为什么函数类要选&quot;跳跃连续&quot;。\n<\/li><li>\n用微积分基本定理计算积分，用换元与分部积分处理复合与乘积。\n<\/li><li>\n判断反常积分收敛，区分绝对收敛与条件收敛。\n<\/li><li>\n写出傅里叶系数并说明逐点收敛的条件，用 Γ 函数把阶乘延拓到实数。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>积分不是&quot;面积&quot;这个几何词的定义，而是&quot;用阶梯函数一致逼近，再取极限&quot;这套操作的产物；微积分基本定理则说明这套操作与求导互逆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么先研究阶梯函数<\/h3>\n<p>阶梯函数：存在区间的一个分割 α = α₀ &lt; α₁ &lt; … &lt; αₙ = β，使 f 在每个开区间 (αⱼ₋₁, αⱼ) 上是常数。它的积分可以直接定义成&quot;高 × 宽&quot;的和：<\/p>\n<p>∫ f := Σ cⱼ (αⱼ − αⱼ₋₁)。<\/p>\n<p>这个定义没有任何极限，纯粹是有限和。接下来的问题是：哪些函数能被阶梯函数<strong>一致<\/strong>逼近？<\/p>\n<p>答案是<strong>跳跃连续函数<\/strong>：在每点 x 处，左右单侧极限 f(x−0)、f(x+0) 都存在（可以不等于 f(x)）。连续函数当然满足；分段连续函数（有限个跳跃点）也满足。这类函数构成向量空间 S(I, E)，并且在 sup 范数下，阶梯函数在其中稠密。<\/p>\n<p>为什么必须一致逼近？如果只在每点分别逼近，逼近函数列的积分可能不收敛到同一个值。一致逼近才能保证&quot;逼近的积分&quot;是一个柯西列，从而有唯一极限。<\/p>\n<p><strong>类比<\/strong>：用方块拼出一幅画。允许每块方块的颜色随位置变（逐点逼近），拼出来的总面积可能随拼法剧烈变化；要求所有方块的误差都不超过一个统一上限（一致逼近），总面积才稳定。<\/p>\n<h3>概念 2：积分作为延拓<\/h3>\n<p>阶梯函数上的积分是一个线性映射，且满足两条基本估计：<\/p>\n<ul><li>\n|∫f| ≤ ‖f‖∞ (β − α)；\n<\/li><li>\n阶梯函数空间在跳跃连续函数空间中稠密。\n<\/ul>\n<p>于是用&quot;连续延拓定理&quot;：一致连续（或利普希茨）映射在稠密子空间上的值可以唯一延拓到闭包。积分就这样从阶梯函数延拓到跳跃连续函数，记作 Cauchy–Riemann 积分。<\/p>\n<p>由此得到可积性的实用判据：f 可积 ⇔ 存在阶梯函数列 φₙ 使 ‖f − φₙ‖∞ → 0。这也解释了为什么&quot;可积&quot;比&quot;连续&quot;宽：函数可以有有限个跳跃点，只要跳跃幅度有限。<\/p>\n<p><strong>类比<\/strong>：先在整数点上定义一个函数，再要求它&quot;变化不太剧烈&quot;，就能唯一地插值到所有实数点。积分就是这样一个被插值出来的量。<\/p>\n<h3>概念 3：微积分基本定理<\/h3>\n<p>设 f : [α, β] → E 连续，F(x) := ∫_α^x f。则 F 可微且 F′ = f。反过来，若 F 可微且 F′ = f，则 ∫_α^β f = F(β) − F(α)。<\/p>\n<p>证明前半段只用估计：<\/p>\n<p>‖(F(x + h) − F(x))/h − f(x)‖ = ‖(1/h)∫_x^{x+h} (f(t) − f(x)) dt‖ ≤ sup_{|t−x|≤h} ‖f(t) − f(x)‖，<\/p>\n<p>由连续性趋于 0。后半段对 F − 原函数 用中值定理，导数为 0 故为常数。<\/p>\n<p>这条定理把&quot;求积分&quot;从&quot;算极限&quot;变成&quot;找原函数&quot;，是整章计算能力的来源。<\/p>\n<p><strong>类比<\/strong>：积分是&quot;把每天的收入累加&quot;，导数是&quot;当天收入&quot;。基本定理说累加函数的日增量就是当天收入。<\/p>\n<h3>概念 4：换元与分部<\/h3>\n<ul><li>\n换元：∫_a^b f(φ(t)) φ′(t) dt = ∫_{φ(a)}^{φ(b)} f(u) du。条件是 φ 连续可微、f 连续。\n<\/li><li>\n分部：∫ u′v = uv − ∫ uv′。它是乘积求导法则的积分版。\n<\/ul>\n<p>例：∫₀¹ x/(1+x²) dx。令 u = 1 + x²，du = 2x dx，得 (1/2)∫₁² du/u = (1/2)log 2。 例：∫ x e^x dx = x e^x − ∫ e^x dx = (x − 1)e^x + C。<\/p>\n<h3>概念 5：反常积分<\/h3>\n<p>两类：区间无界（∫_a^∞），或被积函数在端点无界（∫₀¹ 1/√x）。<\/p>\n<p>定义都是&quot;取极限&quot;：∫_a^∞ f := lim_{b→∞} ∫_a^b f，只要极限存在且有限。<\/p>\n<p>判据：<\/p>\n<ul><li>\n比较判别：0 ≤ f ≤ g，∫g 收敛 ⇒ ∫f 收敛。\n<\/li><li>\np-判别：∫_1^∞ 1/x^p 收敛 ⇔ p &gt; 1；∫_0^1 1/x^p 收敛 ⇔ p &lt; 1。\n<\/li><li>\n<strong>绝对收敛 ⇒ 收敛<\/strong>（在完备空间中用柯西准则），但反之不成立：∫_1^∞ sin x / x 收敛，绝对值积分发散。\n<\/ul>\n<p><strong>类比<\/strong>：反常积分像&quot;无限长的账单分期付款&quot;，只要每期金额下降得足够快，总额有限。<strong>边界<\/strong>：条件收敛的账单总额有限，但如果你按不同顺序重排收支，结果会变。<\/p>\n<h3>概念 6：和与积分、Euler–Maclaurin、Stirling<\/h3>\n<p>积分与求和通过阶梯逼近互相控制：<\/p>\n<p>|Σ_{k=m}^{n} f(k) − ∫_m^n f| ≤ 变差项。<\/p>\n<p>Euler–Maclaurin 公式把它展开成&quot;积分 + 端点修正 + 导数修正&quot;，用来近似求和。取 f(x) = log x 就得到 Stirling 公式：<\/p>\n<p>log n! = (n + 1/2)log n − n + (1/2)log 2π + O(1/n)。<\/p>\n<p>这不是&quot;经验公式&quot;，是由求和与积分之差逐阶展开推出来的。<\/p>\n<h3>概念 7：傅里叶级数<\/h3>\n<p>对周期 2π 的函数，定义系数<\/p>\n<p>aₖ = (1/π)∫_{−π}^{π} f(x) cos(kx) dx，bₖ = (1/π)∫_{−π}^{π} f(x) sin(kx) dx，<\/p>\n<p>部分和 Sₙ = a₀/2 + Σ(aₖ cos kx + bₖ sin kx)。<\/p>\n<p>收敛性需要条件：分段连续 + 有界变差（狄利克雷条件）保证逐点收敛到 (f(x+0) + f(x−0))/2；连续性与导数平方可积能给出更强的一致收敛。只连续不足以保证逐点收敛（有反例），这说明傅里叶级数比幂级数&quot;娇气&quot;。<\/p>\n<h3>概念 8：Γ 函数<\/h3>\n<p>Γ(z) := ∫_0^∞ t^{z−1} e^{−t} dt，在 Re z &gt; 0 收敛。<\/p>\n<p>分部积分给出 Γ(z + 1) = z Γ(z)，且 Γ(1) = 1，所以 Γ(n + 1) = n!。这把阶乘从整数延拓到复数，是&quot;用积分定义新函数&quot;的范例。Γ 在正实轴上是凸函数（对数凸），这来自它的积分表示与 Hölder 不等式。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[阶梯函数 有限和] --&gt; B[一致逼近]\n  B --&gt; C[跳跃连续函数]\n  C --&gt; D[Cauchy-Riemann 积分]\n  D --&gt; E[微积分基本定理]\n  E --&gt; F[换元 分部 计算]\n  D --&gt; G[反常积分]\n  D --&gt; H[和与积分 Euler-Maclaurin]\n  D --&gt; I[傅里叶级数]\n  D --&gt; J[伽马函数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：整章只有一个源头（阶梯函数的有限和），三条箭头分别通向计算（基本定理、换元分部）、收敛性（反常积分、傅里叶）、特殊函数（Γ）。理解&quot;逼近 → 延拓&quot;这条主线，后面的技巧才有归属。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：积分像用乐高积木拼曲面。阶梯函数是最小块的积木，一致逼近是&quot;每块的高度误差都不超过一个统一上限&quot;，基本定理是&quot;知道每块积木的边界高度差，就能算出总体积&quot;。 <strong>失效边界<\/strong>：积木只能拼出&quot;高度有限、跳跃有限&quot;的形状；遇到无穷高（1/√x 在 0）或无穷宽（∫_1^∞），必须另做极限处理。<\/p>\n<p><strong>实例（可验证）<\/strong>：计算 ∫₀^{π/2} sin²x dx。 用恒等式 sin²x = (1 − cos 2x)/2，得 ∫ = (1/2)[x − (sin 2x)/2]₀^{π/2} = π/4。 检验：数值上 sin² 在 [0, π/2] 的平均值应为 1/2，区间长 π/2，乘积 π/4，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;积分就是面积&quot;<\/strong> — 实际上面积是几何直觉，积分的定义是逼近的极限。对变号函数、向量值函数，&quot;面积&quot;讲不通，但积分照样有定义。\n<\/li><li>\n<strong>别以为&quot;可积函数必须连续&quot;<\/strong> — 实际上跳跃连续即可，甚至 Riemann 可积函数类还更宽（有界 + 间断点测度为零）。\n<\/li><li>\n<strong>别以为&quot;反常积分收敛就是绝对收敛&quot;<\/strong> — 实际上 ∫ sin x/x 条件收敛，绝对值积分发散。\n<\/li><li>\n<strong>别以为&quot;傅里叶级数一定收敛到函数本身&quot;<\/strong> — 实际上只连续不够；间断点处收敛到左右极限的平均值。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列关于跳跃连续函数的说法，正确的是？　A. 必须连续　B. 每点左右极限存在，可以不等于函数值　C. 只能有有限个间断点　D. 必须有界变差\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：跳跃连续只要求单侧极限存在；分段连续才是&quot;有限个跳跃点&quot;的更强要求。跳跃连续函数在紧区间上自动有界。<\/p>\n<\/ol>\n<ol><li>\n∫_1^∞ 1/x^p 收敛的条件是？　A. p &gt; 0　B. p &gt; 1　C. p &lt; 1　D. 对所有 p 都收敛\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：p &gt; 1 时原函数 x^{1−p}/(1−p) 在无穷远处趋于 0；p ≤ 1 时发散。对照 ∫_0^1 1/x^p 的条件是 p &lt; 1，两者方向相反。<\/p>\n<\/ol>\n<ol><li>\nΓ(5) 等于？　A. 5!　B. 4!　C. 5　D. 24/5\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：Γ(n+1) = n!，所以 Γ(5) = 4! = 24。注意指标偏移一格，这是最容易记错的地方。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n积分 = 阶梯函数一致逼近的极限；一致是关键。\n<\/li><li>\n基本定理：积分与微分互逆，计算靠找原函数。\n<\/li><li>\n反常积分看衰减速度；条件收敛不能重排。\n<\/ul>", "ch07": "<h1>第 7 章：多变量微分学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：14 小时 ｜ <strong>前置<\/strong>：第 4 章（一元微分）、第 6 章（积分）、第 3 章（紧致）\n<\/ul>\n<blockquote>原书把整章的思路压缩成一句话：多变量情形的微分依赖于仿射函数局部逼近的思想。非平凡的部分就是其中的线性映射，所以第 1 节先研究赋范空间之间的连续线性映射。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用算子范数判断线性映射连续，并说明有限维为什么&quot;所有范数等价&quot;。\n<\/li><li>\n写出弗雷歇导数的定义，区分&quot;偏导存在&quot;与&quot;可微&quot;。\n<\/li><li>\n用链式法则求复合函数的雅可比矩阵。\n<\/li><li>\n陈述逆映射定理与隐函数定理的条件，并用拉格朗日乘子解约束极值。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>多变量导数不是数，是一个线性映射：f(a + h) = f(a) + A h + r(h)，其中 ‖r(h)‖/‖h‖ → 0。A 就是导数，在标准基下写成雅可比矩阵。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：连续线性映射与算子范数<\/h3>\n<p>线性映射 A : E → F 连续 ⇔ 存在 C 使 ‖Ax‖ ≤ C‖x‖。等价的量是算子范数<\/p>\n<p>‖A‖ := sup{‖Ax‖ : ‖x‖ ≤ 1}。<\/p>\n<p>它把&quot;最大放大倍数&quot;变成一个数。由此得到 L(E, F) 是一个赋范空间；若 F 完备，则 L(E, F) 完备。这是第 1 节的主要定理，证明用柯西列逐点收敛 + 一致有界。<\/p>\n<p>有限维空间里，所有范数等价：存在常数 c, C 使 c‖x‖₁ ≤ ‖x‖₂ ≤ C‖x‖₁。所以&quot;在哪个范数下连续&quot;这个问题在有限维没有意义，在无限维才有意义（例如多项式空间上 sup 范数与 L² 范数不等价）。<\/p>\n<p><strong>类比<\/strong>：算子范数是放大器的最大增益。连续就是&quot;增益有限&quot;，不连续就是&quot;存在输入使输出爆掉&quot;。<\/p>\n<h3>概念 2：弗雷歇导数<\/h3>\n<p>f : X ⊆ E → F 在 a 处可微：存在 A ∈ L(E, F)，使得<\/p>\n<p>f(a + h) = f(a) + A h + r(h)，且 ‖r(h)‖/‖h‖ → 0（h → 0）。<\/p>\n<p>A 记作 f′(a) 或 Df(a)。三个要点：<\/p>\n<ol><li>\nA 必须是<strong>线性<\/strong>的，&quot;局部最佳仿射逼近&quot;的线性部分。\n<\/li><li>\n误差是 o(‖h‖)，即比一阶更快趋零。\n<\/li><li>\n可微 ⇒ 连续，但反之不成立。\n<\/ol>\n<p>在 ℝⁿ → ℝᵐ 中，A 的矩阵就是雅可比矩阵 J = (∂fᵢ/∂xⱼ)。但要注意顺序：先有线性映射，矩阵只是它在标准基下的表示。<\/p>\n<p><strong>类比<\/strong>：把 f 想成一台多输入多输出的机器，导数是一张&quot;局部传动比表&quot;：输入微小变动 h，输出近似按 A h 变化。<\/p>\n<h3>概念 3：偏导存在不等于可微<\/h3>\n<p>经典反例：<\/p>\n<p>f(x, y) = xy/(x² + y²)（(x,y) ≠ (0,0)），f(0,0) = 0。<\/p>\n<p>在原点，两个偏导都存在且等于 0（沿坐标轴函数恒为 0）。但沿直线 y = x，f(x,x) = 1/2，不趋于 0，所以 f 在原点不连续，当然不可微。<\/p>\n<p>正确的关系是：<\/p>\n<ul><li>\n可微 ⇒ 偏导存在，且 A 的矩阵由偏导组成；\n<\/li><li>\n偏导存在 + 偏导连续 ⇒ 可微（C¹ 条件）。\n<\/ul>\n<p>这条&quot;连续&quot;条件是充分条件，不是必要。做题时先查偏导是否连续，是最省事的判据。<\/p>\n<h3>概念 4：链式法则与高阶导数<\/h3>\n<p>若 g 在 a 可微、f 在 g(a) 可微，则 (f∘g)′(a) = f′(g(a)) ∘ g′(a)。写成矩阵就是雅可比相乘。<\/p>\n<p>高阶导数：D²f(a) 是一个双线性映射 E × E → F，在有限维用 Hessian 矩阵表示。<strong>对称性<\/strong>：若 D²f 存在且连续，则 D²f(a)(h, k) = D²f(a)(k, h)（施瓦茨定理）。这条对称性在泰勒公式、极值判别、变分法中反复使用。<\/p>\n<p>多变量泰勒公式：<\/p>\n<p>f(a + h) = f(a) + Df(a)h + (1/2)D²f(a)(h, h) + o(‖h‖²)。<\/p>\n<h3>概念 5：逆映射定理<\/h3>\n<p>设 f : U → F 是 C¹，f′(a) 是拓扑同构（可逆且逆连续），则 f 在 a 附近是局部微分同胚：存在邻域 V，使 f|V 有 C¹ 逆，且 (f⁻¹)′(f(a)) = (f′(a))⁻¹。<\/p>\n<p>条件是&quot;导数可逆&quot;，不是&quot;函数单射&quot;。一维时就是 f′(a) ≠ 0；多维时要雅可比行列式非零。证明用压缩映射原理：把 f(x) = y 改写成 x = x − A⁻¹(f(x) − y)，A = f′(a)，验证这是压缩。<\/p>\n<p><strong>类比<\/strong>：一张能被局部拉平的地图。只要该点的&quot;拉伸率&quot;不为零（雅可比可逆），附近就能一一对应地翻回去。<\/p>\n<h3>概念 6：隐函数定理<\/h3>\n<p>方程 F(x, y) = 0 在 (a, b) 附近能否解出 y = φ(x)？<\/p>\n<p>条件：F(a, b) = 0，F 是 C¹，且 ∂F/∂y(a, b) 可逆。结论：存在 a 的邻域与唯一的 C¹ 函数 φ，使 φ(a) = b 且 F(x, φ(x)) = 0，并且<\/p>\n<p>φ′(x) = −(∂F/∂y)⁻¹ (∂F/∂x)。<\/p>\n<p>一维例子：x² + y² = 1 在 (0,1) 附近，∂F/∂y = 2y = 2 ≠ 0，可解出 y = √(1 − x²)；在 (1,0) 处 ∂F/∂y = 0，解不出单值函数（上下两支相交）。<\/p>\n<h3>概念 7：约束极值与拉格朗日乘子<\/h3>\n<p>求 f(x) 在约束 g(x) = 0 下的极值。若 ∇g(a) ≠ 0，则极值点满足<\/p>\n<p>∇f(a) = λ ∇g(a)。<\/p>\n<p>几何解释：f 的等值面与约束面在极值点相切，两个法向量平行。λ 是乘子，也解释为&quot;约束放松一点，目标能改善多少&quot;的影子价格。<\/p>\n<p>条件是必要的，不是充分的：还要比较各候选点的函数值，并检查边界。<\/p>\n<h3>概念 8：流形、切空间、法向量<\/h3>\n<p>m 维流形 M ⊆ ℝⁿ：每点附近有坐标卡，把 M 局部拉平成 ℝᵐ。切空间 TₚM 是所有过 p 的曲线速度向量张成的空间，维数 m。法空间是它的正交补，维数 n − m。<\/p>\n<p>隐函数定理给出流形的局部描述：若 F : ℝⁿ → ℝᵏ 的导数满秩，则 F⁻¹(0) 是 n − k 维流形，切空间是 ker DF(p)。这为第 11 章的微分形式铺路。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[连续线性映射 算子范数] --&gt; B[弗雷歇导数]\n  B --&gt; C[雅可比矩阵 偏导]\n  B --&gt; D[链式法则]\n  B --&gt; E[高阶导数 对称性]\n  E --&gt; F[多变量泰勒]\n  B --&gt; G[逆映射定理]\n  B --&gt; H[隐函数定理]\n  H --&gt; I[流形与切空间]\n  G --&gt; J[压缩映射]\n  H --&gt; K[拉格朗日乘子]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：所有结论都从&quot;导数是线性映射&quot;出发。逆映射、隐函数是同一件事的两种说法（一个解 x，一个解 y），流形是隐函数定理的几何版本，乘子是它在约束极值上的应用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：多变量函数像一台调音台，多个旋钮（输入）影响多个输出。导数是一张&quot;每个旋钮动一点，各输出变多少&quot;的表；雅可比矩阵就是这张表。隐函数定理说：只要某个旋钮对某个输出的影响不为零，就能反过来用输出定旋钮。 <strong>失效边界<\/strong>：表是线性的近似，旋钮动得太大就不准；隐函数定理要求&quot;影响不为零&quot;，在临界点会失效（圆的左右两端）。<\/p>\n<p><strong>实例（可验证）<\/strong>：f(x, y) = x² + y² 在 (1, 2) 处的导数。 ∂f/∂x = 2x = 2，∂f/∂y = 2y = 4，所以 Df(1,2) = (2, 4)，作为线性映射 (h, k) ↦ 2h + 4k。 验证：f(1+h, 2+k) − f(1,2) = 2h + 4k + h² + k²，余项 h² + k² = o(√(h²+k²))，符合定义。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;偏导数存在就可微&quot;<\/strong> — 实际上 xy/(x²+y²) 在原点两个偏导都为 0，却不连续。可微要求一个统一的线性逼近，不是两个方向各自逼近。\n<\/li><li>\n<strong>别以为&quot;雅可比矩阵就是导数&quot;<\/strong> — 实际上导数是线性映射，雅可比只是它在标准基下的矩阵；换基就换矩阵，映射不变。\n<\/li><li>\n<strong>别以为&quot;隐函数定理的条件可以省&quot;<\/strong> — 实际上 ∂F/∂y 可逆是关键。x² + y² = 1 在 (1,0) 处失效，正因为该偏导为 0。\n<\/li><li>\n<strong>别以为&quot;拉格朗日乘子给的就是最小值&quot;<\/strong> — 实际上它只给候选点，乘子法是必要条件，还要比较与检查边界。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n设 f(x, y) = xy/(x² + y²)（原点补 0），则 f 在原点？　A. 可微　B. 两个偏导存在但不连续　C. 不可微且偏导不存在　D. 连续但偏导不存在\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：沿坐标轴 f 恒为 0，两个偏导都是 0；沿 y = x 极限为 1/2，不连续，故不可微。<\/p>\n<\/ol>\n<ol><li>\n隐函数定理中，保证能解出 y = φ(x) 的关键条件是？　A. F(a,b) = 0　B. F 连续　C. ∂F/∂y(a,b) 可逆　D. ∂F/∂x(a,b) 可逆\n<p><strong>答案<\/strong>：C。<strong>解析<\/strong>：要对 y 求解，必须让 y 方向的导数可逆，才能用压缩映射把 y 反解出来。A 是前提，B 是正则性，D 不是关键。<\/p>\n<\/ol>\n<ol><li>\n约束极值中，若 ∇g(a) ≠ 0，极值点满足？　A. ∇f(a) = 0　B. ∇f(a) = λ∇g(a)　C. ∇g(a) = λ∇f(a)　D. f(a) = g(a)\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：等值面与约束面在极值点相切，法向量平行，故梯度成比例，比例因子就是乘子 λ。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n导数是线性映射，雅可比是它在标准基下的矩阵。\n<\/li><li>\n偏导存在 + 偏导连续 ⇒ 可微；只有偏导存在不够。\n<\/li><li>\n逆映射与隐函数定理的条件都是&quot;该点的导数可逆&quot;，几何上是&quot;没被压扁&quot;。\n<\/ul>", "ch08": "<h1>第 8 章：线积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：12 小时 ｜ <strong>前置<\/strong>：第 6 章（积分）、第 7 章（多变量微分）\n<\/ul>\n<blockquote>原书对弧长的处理很实在：把连续路径 γ 的&quot;全变差&quot;直接定义为它的长度；只要变差有限，路径就称为可求长的。长度不是先验概念，是一族折线长度的上确界。<\/blockquote>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用分割的折线长度定义全变差，判断路径是否可求长，并写出弧长公式。\n<\/li><li>\n解释普法夫形式与恰当形式，判断一个 1-形式是否恰当。\n<\/li><li>\n计算线积分，判断积分是否与路径无关，并求出势函数。\n<\/li><li>\n说明全纯函数的柯西–黎曼方程，以及亚纯函数的极点与留数。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>线积分把 1-形式沿曲线&quot;累加&quot;；当形式恰当（等于某个函数的微分）时，累加结果只取决于端点，这条性质把微积分基本定理推广到了曲线上。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：曲线的长度 = 折线长度的上确界<\/h3>\n<p>设 γ : [a, b] → E 连续，分割 Z = (t₀, …, tₙ)。折线长度<\/p>\n<p>L_Z(γ) := Σ ‖γ(tⱼ) − γ(tⱼ₋₁)‖。<\/p>\n<p>全变差 Var(γ, [a,b]) := sup_Z L_Z(γ)。若有限，称 γ 可求长，并把这个值定义为弧长 L(γ)。<\/p>\n<p>两条基本事实：<\/p>\n<ul><li>\n变差可加：Var(γ, [a,b]) = Var(γ, [a,c]) + Var(γ, [c,b])。\n<\/li><li>\n利普希茨路径可求长，且 L(γ) ≤ λ(b − a)，λ 是利普希茨常数。\n<\/ul>\n<p>反面例子：γ(t) = t cos²(π/2t)（t &gt; 0），γ(0) = 0。取合适分割，折线长度是调和级数的部分和，趋于无穷，所以这个连续路径不可求长。这说明&quot;连续&quot;远不足以保证有限长度。<\/p>\n<p>若 γ 是 C¹，则 L(γ) = ∫_a^b ‖γ′(t)‖ dt。这是把折线长度的上确界算成积分。<\/p>\n<p><strong>类比<\/strong>：路径是走过的轨迹，全变差是计步器读数。无论你怎么细分采样点，读数的上确界就是真实路程；来回踱步的路径读数会很大。<\/p>\n<h3>概念 2：普法夫形式<\/h3>\n<p>在 ℝⁿ 的开集上，1-形式（普法夫形式）写成<\/p>\n<p>ω = Σ aⱼ(x) dxⱼ，<\/p>\n<p>其中 aⱼ 是光滑函数。它不是&quot;无穷小量&quot;，而是一个把切向量喂进去就输出数值的规则：给定一点和方向 v，输出 Σ aⱼ(x) vⱼ。<\/p>\n<p>ω <strong>恰当<\/strong>，如果存在函数 f 使 ω = df，即 aⱼ = ∂f/∂xⱼ。此时 f 叫势函数。<\/p>\n<p>判断恰当性的一维必要条件是<strong>闭性<\/strong>：∂aⱼ/∂xₖ = ∂aₖ/∂xⱼ（混合偏导相等）。在单连通区域上，闭 ⇒ 恰当（庞加莱引理）；有洞的区域不成立，经典例子是<\/p>\n<p>ω = (x dy − y dx)/(x² + y²)，<\/p>\n<p>它在 ℝ² 去掉原点后闭但不恰当，因为绕原点一圈积分是 2π 而不是 0。<\/p>\n<p><strong>类比<\/strong>：恰当形式像&quot;保守力场&quot;：重力、静电力做功只与起点终点有关。闭而不恰当像绕着一个洞转圈，每转一圈都&quot;捡到&quot;一点能量。<\/p>\n<h3>概念 3：线积分的定义与计算<\/h3>\n<p>沿 C¹ 曲线 γ : [a,b] → ℝⁿ 积分：<\/p>\n<p>∫_γ ω := ∫_a^b Σ aⱼ(γ(t)) γⱼ′(t) dt。<\/p>\n<p>它是普通定积分的复合：把形式在曲线上的取值对参数积分。结果与参数化无关（只差方向符号）：换参数 s = φ(t) 时，链式法则把 γ′dt 换成 γ′ds，积分值不变。<\/p>\n<p>基本定理的推广：若 ω = df，则 ∫_γ ω = f(γ(b)) − f(γ(a))。路径无关性由此而来。<\/p>\n<p>计算实例：ω = x dy − y dx，γ 为单位圆 t ↦ (cos t, sin t)，t ∈ [0, 2π]。 ∫_γ ω = ∫₀^{2π} (cos t · cos t − sin t · (−sin t)) dt = ∫₀^{2π} 1 dt = 2π。 这个值等于圆面积，也等于绕原点一圈的&quot;角增量&quot;，说明 ω 不是恰当的。<\/p>\n<h3>概念 4：全纯函数<\/h3>\n<p>f : U ⊆ ℂ → ℂ 全纯：在每点复可微，即<\/p>\n<p>f′(z) = lim_{h→0} (f(z + h) − f(z))/h<\/p>\n<p>存在（h 沿复平面任意方向）。这比实可微强得多：它要求两个实偏导满足柯西–黎曼方程<\/p>\n<p>∂u/∂x = ∂v/∂y，∂u/∂y = −∂v/∂x（f = u + iv）。<\/p>\n<p>等价说法：f 的微分 f′(z) dz 是 ℂ 值 1-形式，且满足某种闭性；全纯函数的实部与虚部都是调和函数。<\/p>\n<p>关键结论：<\/p>\n<ul><li>\n全纯 ⇒ 解析：每点附近可展开成幂级数。\n<\/li><li>\n柯西积分定理：在单连通区域内全纯的函数，沿任意闭曲线的积分为 0。\n<\/li><li>\n柯西积分公式：f(a) = (1/2πi) ∮ f(z)/(z − a) dz。\n<\/li><li>\n刘维尔定理：有界的整函数必为常数。\n<\/ul>\n<p><strong>类比<\/strong>：实可微像&quot;从东西南北四个方向看都平滑&quot;，全纯像&quot;从所有方向看都平滑且旋转角度一致&quot;。后者约束更强，所以全纯函数有刚性：一点的信息决定一片区域。<\/p>\n<h3>概念 5：亚纯函数与留数<\/h3>\n<p>亚纯：在区域内除孤立极点外全纯。<\/p>\n<p>若 f 在 a 处有 m 阶极点，则 f(z) = c_{−m}/(z−a)ᵐ + … + c_{−1}/(z−a) + 全纯部分。c_{−1} 叫留数 Res(f, a)。<\/p>\n<p>留数定理：∮_γ f dz = 2πi Σ Res(f, aₖ)（aₖ 在 γ 内部）。<\/p>\n<p>计算实例：∮_{|z|=1} dz/z = 2πi，因为留数为 1。这个例子说明&quot;闭形式在洞里积分不为 0&quot;，与普法夫形式的洞是同一件事。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[曲线 gamma] --&gt; B[折线长度]\n  B --&gt; C[全变差 上确界]\n  C --&gt; D[弧长 可求长]\n  A --&gt; E[普法夫形式 omega]\n  E --&gt; F[恰当 omega = df]\n  F --&gt; G[线积分只依赖端点]\n  E --&gt; H[闭而不恰当 有洞]\n  H --&gt; I[绕洞积分非零]\n  G --&gt; J[全纯函数 柯西积分定理]\n  J --&gt; K[亚纯函数 留数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左支是几何（长度），右支是微分形式（积分）。两支在&quot;绕洞积分非零&quot;处汇合：这正是柯西积分定理与留数定理的几何来源。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：线积分像沿路线记录&quot;每走一步，计费器按当前位置的单价跳多少&quot;。若单价来自某个&quot;高度函数&quot;（恰当形式），总费用只与起点终点有关；若单价绕着一个柱子打转（闭而不恰当），绕一圈就多收一笔。 <strong>失效边界<\/strong>：只有区域没有洞时，&quot;闭 ⇒ 恰当&quot;才成立；有洞时绕洞一圈的积分是拓扑量，不能靠局部条件消掉。<\/p>\n<p><strong>实例（可验证）<\/strong>：验证 ω = y dx + x dy 恰当，并求势函数。 ∂(y)/∂y = 1，∂(x)/∂x = 1，满足闭性；在 ℝ²（单连通）上恰当。取 f(x,y) = xy，则 df = y dx + x dy。沿任意曲线从 (0,0) 到 (1,2)，积分都是 2，与路径无关。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;连续曲线一定有长度&quot;<\/strong> — 实际上存在连续但不可求长的路径（t cos²(π/2t)）。\n<\/li><li>\n<strong>别以为&quot;闭形式一定恰当&quot;<\/strong> — 实际上只在单连通区域成立；(x dy − y dx)/(x²+y²) 是标准反例。\n<\/li><li>\n<strong>别以为&quot;线积分只依赖端点&quot;总是成立<\/strong> — 实际上只有恰当形式才路径无关；否则绕一圈的积分可能非零。\n<\/li><li>\n<strong>别以为&quot;实可微就是全纯&quot;<\/strong> — 实际上全纯还要求柯西–黎曼方程，条件强得多。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n关于全变差，正确的说法是？　A. 连续曲线的全变差总有限　B. 全变差是折线长度的上确界　C. 全变差等于端点距离　D. 全变差只对直线有限\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：定义就是 sup 折线长度。连续曲线可以不可求长（t cos²(π/2t)），端点距离只是下界。<\/p>\n<\/ol>\n<ol><li>\nω = (x dy − y dx)/(x² + y²) 在 ℝ² 去掉原点后？　A. 恰当　B. 闭但不恰当　C. 既不闭也不恰当　D. 恒为 0\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：混合偏导相等故闭；但绕单位圆积分 2π ≠ 0，所以不存在单值势函数，不恰当。<\/p>\n<\/ol>\n<ol><li>\n∮_{|z|=1} dz/z 的值是？　A. 0　B. 2πi　C. πi　D. 1\n<p><strong>答案<\/strong>：B。<strong>解析<\/strong>：1/z 在 0 处留数为 1，由留数定理积分等于 2πi·1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n弧长 = 折线长度的上确界；利普希茨是充分条件，连续不够。\n<\/li><li>\n恰当 ⇔ 有势函数；单连通区域上闭 ⇒ 恰当。\n<\/li><li>\n全纯 = 复可微 = 柯西–黎曼；留数定理把闭路积分变成极点处的系数。\n<\/ul>", "c06": "<h1>黎曼积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 6 章（§1–§5）、第 10 章（§5）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把一个函数用阶梯函数一致逼近，取这些阶梯函数积分值的极限，这个极限就是黎曼积分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;面积&quot;从几何直觉变成可证明的对象，并且给出可积的判据。第 10 章的勒贝格积分是它的推广：把&quot;阶梯函数&quot;换成&quot;简单函数&quot;，把&quot;一致逼近&quot;换成&quot;几乎处处逼近&quot;，从而能处理更病态的函数与极限交换。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[阶梯函数 有限和] --&gt; B[sup 范数稠密]\n  B --&gt; C[跳跃连续函数]\n  C --&gt; D[积分存在且唯一]\n  D --&gt; E[微积分基本定理]\n  E --&gt; F[换元 分部 计算]\n  D --&gt; G[反常积分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>阶梯函数 f = Σ cⱼ χ_(αⱼ₋₁, αⱼ) 的积分定义为 Σ cⱼ(αⱼ − αⱼ₋₁)。<\/p>\n<p>关键估计：|∫f| ≤ ‖f‖∞(β − α)。这条估计说明积分映射是利普希茨的，因此可以把定义从阶梯函数唯一延拓到其一致闭包——即跳跃连续函数。跳跃连续指每点左右极限存在；连续函数、分段连续函数都属此类。<\/p>\n<p>可积的实用判据：对每个 ε &gt; 0，存在阶梯函数 φ，使 sup|f − φ| &lt; ε。<\/p>\n<p>可积函数不必连续：符号函数在 [−1,1] 上跳跃连续，积分存在。但 Dirichlet 函数（有理点取 1、无理点取 0）不黎曼可积，因为它与任何阶梯函数的 sup 距离都是 1。<\/p>\n<p>勒贝格积分的思想差别：不要求&quot;处处逼近&quot;，只要求&quot;除了一个零测集之外逼近&quot;。代价是要先建测度论（第 9 章）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为积分就是面积——对变号函数面积要带符号，对向量值函数没有面积可言。\n<\/li><li>\n别以为连续是必要的——跳跃连续即可，黎曼可积类还更宽。\n<\/li><li>\n别以为&quot;几乎处处连续&quot;就黎曼可积——有界 + 间断点集测度为零才是黎曼可积的完整刻画（勒贝格判据）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章 §1<\/td><td>阶梯函数<\/td><td>有限和的定义<\/td><\/tr><tr><td>第 6 章 §3<\/td><td>柯西–黎曼积分<\/td><td>延拓与唯一性<\/td><\/tr><tr><td>第 6 章 §4<\/td><td>性质<\/td><td>线性、单调、估计<\/td><\/tr><tr><td>第 10 章 §5<\/td><td>勒贝格积分<\/td><td>黎曼积分是绝对可积情形的推广<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：一致收敛、连续、紧致\n<\/li><li>\n后续：反常积分、L¹ 空间、勒贝格积分\n<\/ul>", "c07": "<h1>弗雷歇微分与雅可比矩阵<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 7 章（§2–§5）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>多变量函数在一点的导数是一个线性映射 A，使得 f(a + h) = f(a) + Ah + o(‖h‖)；雅可比矩阵是 A 在标准基下的表示。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是所有多变量结论的入口：链式法则、逆映射、隐函数、流形、变分法，全部建立在&quot;导数 = 线性映射&quot;之上。把导数当成一堆偏导数的表格，会导致&quot;偏导存在就可微&quot;这类错误。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  D[导数 A 线性映射] --&gt; J[雅可比矩阵 标准基表示]\n  D --&gt; R[余项 o 范数 h]\n  R --&gt; C[可微必连续]\n  J --&gt; P[偏导存在 不够]\n  P --&gt; Q[偏导连续 充分]\n  D --&gt; CH[链式法则 矩阵相乘]\n  D --&gt; H[高阶导数 双线性映射]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义：存在 A ∈ L(E, F)，使<\/p>\n<p>lim_{h→0} ‖f(a+h) − f(a) − Ah‖ / ‖h‖ = 0。<\/p>\n<p>唯一性：若有两个这样的 A，相减得 ‖(A₁ − A₂)h‖/‖h‖ → 0，由线性性只能 A₁ = A₂。<\/p>\n<p>与偏导的关系：若可微，则 ∂fᵢ/∂xⱼ = A 的矩阵元。反之不成立——偏导只描述沿坐标轴的行为，可微要求所有方向的误差统一为 o(‖h‖)。<\/p>\n<p>反例 f(x,y) = xy/(x²+y²)：沿坐标轴恒为 0，故两个偏导为 0；沿 y = x 值为 1/2，不连续。A 不可能存在。<\/p>\n<p>充分条件：若所有偏导在 a 的邻域存在且在 a 连续（C¹），则可微。证明用&quot;沿坐标轴逐段走&quot;把 f(a+h) − f(a) 写成偏导的积分，再用连续性控制。<\/p>\n<p>链式法则：(f∘g)′(a) = f′(g(a))g′(a)，矩阵形式就是雅可比相乘。注意顺序不能反。<\/p>\n<p>高阶导数：D²f(a) 是双线性映射，矩阵为 Hessian。C² 时对称（施瓦茨定理），这给泰勒公式的二阶项提供了良好定义。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为偏导存在就可微——需要统一的线性逼近。\n<\/li><li>\n别以为雅可比矩阵就是导数——换基会换矩阵，映射本身不变。\n<\/li><li>\n别以为&quot;各方向方向导数都存在&quot;就够——方向导数存在也不保证可微，反例需要更精细的构造。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章 §1<\/td><td>连续线性映射<\/td><td>算子范数、L(E,F) 完备<\/td><\/tr><tr><td>第 7 章 §2<\/td><td>可微性<\/td><td>弗雷歇导数定义<\/td><\/tr><tr><td>第 7 章 §3<\/td><td>微分法则<\/td><td>链式、乘积、商<\/td><\/tr><tr><td>第 7 章 §5<\/td><td>高阶导数<\/td><td>对称性、泰勒<\/td><\/tr><tr><td>第 12 章 §1<\/td><td>体积测度<\/td><td>雅可比行列式进入换元公式<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：一元导数、算子范数\n<\/li><li>\n后续：逆映射定理、隐函数定理、微分形式\n<\/ul>", "c08": "<h1>逆映射定理与隐函数定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 7 章（§7–§9）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若 f 在 a 处的导数是可逆线性映射，则 f 在 a 附近可逆且逆映射光滑；隐函数定理是它在&quot;解方程&quot;问题上的变形。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们是把非线性问题局部线性化的许可证。数值求解、流形定义、约束优化、微分方程解的存在性，都要先验证&quot;该点导数可逆&quot;这个条件。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[导数 A 可逆] --&gt; B[逆映射定理]\n  A --&gt; C[隐函数定理]\n  B --&gt; D[局部微分同胚]\n  B --&gt; E[逆的导数 A 逆]\n  C --&gt; F[解出 y = phi x]\n  F --&gt; G[流形 F 逆零]\n  C --&gt; H[拉格朗日乘子]\n  B --&gt; I[压缩映射证明]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p><strong>逆映射定理<\/strong>：f : U → F 是 C¹，f′(a) 是拓扑同构，则存在 a 的邻域 V 与 f(a) 的邻域 W，使 f|V : V → W 是双射且逆映射 C¹，并且<\/p>\n<p>(f⁻¹)′(f(a)) = (f′(a))⁻¹。<\/p>\n<p>证明骨架：把 f(x) = y 改写为 x = T(x)，T(x) = x − A⁻¹(f(x) − y)，A = f′(a)。在 a 附近 T 是压缩（因为 T′ = I − A⁻¹f′(x)，在 a 处为 0，连续性与可逆性保证范数 &lt; 1），由压缩映射原理得唯一不动点，再用参数连续性得 C¹。<\/p>\n<p><strong>隐函数定理<\/strong>：F : U × V → G 是 C¹，F(a, b) = 0，∂F/∂y(a, b) 可逆，则存在唯一的 C¹ 函数 φ，φ(a) = b，F(x, φ(x)) = 0，且<\/p>\n<p>φ′(x) = −(∂F/∂y)⁻¹ ∂F/∂x。<\/p>\n<p>两者本质相同：把 F(x, y) = 0 看成 f(y) = 0 的参数化版本，对 y 用逆映射定理。<\/p>\n<p><strong>流形<\/strong>：若 DF(p) 满秩，则 F⁻¹(0) 在 p 附近是 n − k 维流形，切空间为 ker DF(p)。这把&quot;方程的解集&quot;变成了有切空间的几何对象。<\/p>\n<p><strong>约束极值<\/strong>：在 g(x) = 0 上求 f 的极值，若 ∇g ≠ 0，则 ∇f = λ∇g。几何上是两个等值面在极值点相切。λ 是约束的影子价格。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;导数可逆&quot;可以换成&quot;函数单射&quot;——单射不保证局部可逆（如 x ↦ x³ 在 0 处单射但导数为 0）。\n<\/li><li>\n别以为隐函数定理给的是全局解——只在 a 的某个邻域内成立。\n<\/li><li>\n别以为条件只是技术性的——在 ∂F/∂y = 0 处，解可能分裂成多支（圆的左右端点）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章 §7<\/td><td>逆映射<\/td><td>局部微分同胚、逆的导数<\/td><\/tr><tr><td>第 7 章 §8<\/td><td>隐函数<\/td><td>解出 y = φ(x)、导数公式<\/td><\/tr><tr><td>第 7 章 §9<\/td><td>流形<\/td><td>隐式定义的子流形与切空间<\/td><\/tr><tr><td>第 11 章 §1<\/td><td>子流形<\/td><td>浸入、嵌入、带边流形<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：弗雷歇导数、压缩映射原理\n<\/li><li>\n后续：子流形、拉格朗日乘子、微分形式\n<\/ul>", "c09": "<h1>线积分与势函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 8 章（§1–§4）、第 11 章（§3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线积分是把 1-形式沿曲线累加；若该形式等于某个函数的微分（恰当形式），累加结果只依赖起点与终点，那个函数就是势函数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把微积分基本定理推广到曲线上，也是&quot;保守力场&quot;的数学版本。第 11 章的微分形式、第 12 章的斯托克斯定理，都是它向高维的推广。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[1-形式 omega] --&gt; B[沿曲线积分]\n  B --&gt; C[依赖路径]\n  A --&gt; D[恰当 omega = df]\n  D --&gt; E[只依赖端点]\n  E --&gt; F[势函数 f]\n  A --&gt; G[闭但不恰当]\n  G --&gt; H[绕洞积分非零]\n  H --&gt; I[留数 拓扑障碍]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义：ω = Σ aⱼ dxⱼ 沿 C¹ 曲线 γ 的积分为 ∫_a^b Σ aⱼ(γ(t))γⱼ′(t) dt。<\/p>\n<p>三个层次：<\/p>\n<ol><li>\n<strong>计算<\/strong>：把形式在曲线上的取值对参数积分，换参数不变（方向反转变号）。\n<\/li><li>\n<strong>恰当性<\/strong>：若 ω = df，则 ∫_γ ω = f(γ(b)) − f(γ(a))。于一维就是牛顿–莱布尼茨公式。\n<\/li><li>\n<strong>判据

<\/strong>：∂aⱼ/∂xₖ = ∂aₖ/∂xⱼ（闭性）是必要条件；在单连通区域上也是充分的（庞加莱引理）。\n<\/ol>\n<p>反例：ω = (x dy − y dx)/(x² + y²) 在 ℝ² ∖ {0} 上闭，但绕单位圆积分为 2π ≠ 0，故不恰当。这个 2π 是拓扑量，正是复分析里留数定理的来源。<\/p>\n<p>势函数的求法：沿坐标轴分段积分，或解梯度方程组 ∂f/∂xⱼ = aⱼ，再用闭性保证可积。<\/p>\n<p><strong>类比<\/strong>：恰当形式像&quot;海拔差&quot;，只与起点终点有关；闭而不恰当像&quot;绕塔转圈&quot;，每转一圈都累积一个固定角度。 <strong>边界<\/strong>：只有区域单连通时&quot;闭 ⇒ 恰当&quot;；有洞时拓扑障碍无法靠局部条件消除。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为线积分总与路径无关——只有恰当形式才如此。\n<\/li><li>\n别以为&quot;闭形式&quot;就是&quot;恰当形式&quot;——有洞区域是反例。\n<\/li><li>\n别以为势函数一定存在且唯一——差一个常数仍成立，有洞时可能多值（角度函数）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章 §1<\/td><td>曲线与长度<\/td><td>全变差、可求长、弧长公式<\/td><\/tr><tr><td>第 8 章 §3<\/td><td>普法夫形式<\/td><td>恰当形式、势函数<\/td><\/tr><tr><td>第 8 章 §4<\/td><td>线积分<\/td><td>定义、路径无关、基本定理<\/td><\/tr><tr><td>第 11 章 §3<\/td><td>微分形式的局部理论<\/td><td>外微分、闭与恰当<\/td><\/tr><tr><td>第 12 章 §3<\/td><td>斯托克斯定理<\/td><td>高维推广<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：黎曼积分、偏导数\n<\/li><li>\n后续：全纯函数、微分形式、斯托克斯定理\n<\/ul>", "c10": "<h1>全纯函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 8 章（§5–§6）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>复平面上在每点复可微的函数，等价于实部与虚部满足柯西–黎曼方程，并且局部可以展开成幂级数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是复分析的入口，也是本卷最&quot;刚性&quot;的对象：一点的全部导数决定整个连通区域。柯西积分定理与留数定理把复杂的闭路积分变成极点上几个系数的和，这种效率在实分析里没有对应物。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[复可微] --&gt; B[柯西-黎曼方程]\n  B --&gt; C[实部虚部调和]\n  A --&gt; D[解析 局部幂级数]\n  D --&gt; E[柯西积分公式]\n  E --&gt; F[刘维尔定理 有界整函数为常数]\n  E --&gt; G[留数定理]\n  G --&gt; H[闭路积分 = 2 pi i 留数和]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>复可微：极限 lim_{h→0}(f(z+h) − f(z))/h 存在，h 可从任意方向趋于 0。这比实可微强得多：把 h 分别取实数方向和虚数方向，得到两个偏导关系<\/p>\n<p>u_x = v_y，u_y = −v_x。<\/p>\n<p>这就是柯西–黎曼方程。它保证 f 的微分是&quot;复线性&quot;的，而不是一般的实线性映射。<\/p>\n<p>主要结论：<\/p>\n<ul><li>\n全纯 ⇒ 解析：在每点附近 f(z) = Σ cₙ(z − a)ⁿ，收敛半径由奇点位置决定。\n<\/li><li>\n柯西积分定理：单连通区域内全纯函数沿闭曲线积分为 0。\n<\/li><li>\n柯西积分公式：f(a) = (1/2πi)∮ f(z)/(z − a) dz，由此可得各阶导数公式。\n<\/li><li>\n刘维尔：有界整函数是常数，于是代数学基本定理可以用它证明。\n<\/li><li>\n留数定理：∮ f dz = 2πiΣ Res(f, aₖ)。\n<\/ul>\n<p><strong>类比<\/strong>：全纯函数像一块没有内应力的玻璃，局部形状决定整体；实可微函数像橡皮泥，可以任意揉捏。 <strong>边界<\/strong>：全纯只在一个开区域内讨论；边界上的奇点（如 1/z 在 0）正是留数信息的来源。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;实部虚部都可微&quot;就是全纯——还必须满足柯西–黎曼方程。\n<\/li><li>\n别以为全纯函数的积分总能算成 0——区域有洞时闭路积分可以非零（∮dz/z = 2πi）。\n<\/li><li>\n别以为解析展开只在一点成立——收敛圆内成立，圆外要换展开点。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章 §5<\/td><td>全纯函数<\/td><td>柯西–黎曼、柯西积分定理<\/td><\/tr><tr><td>第 8 章 §6<\/td><td>亚纯函数<\/td><td>极点、留数、留数定理<\/td><\/tr><tr><td>第 10 章 §9<\/td><td>傅里叶变换<\/td><td>解析方法与傅里叶变换的联系<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线积分、普法夫形式、幂级数\n<\/li><li>\n后续：留数定理、傅里叶变换、解析延拓\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-06'><strong>步骤 06：积分与基本定理<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：一元函数的积分<\/a><br>检查点：ch06 自测三题<\/li><li class='path-step' id='path-07'><strong>步骤 07：多变量微分<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：多变量微分学<\/a><br>检查点：ch07 自测三题<\/li><li class='path-step' id='path-08'><strong>步骤 08：线积分与全纯<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：线积分<\/a><br>检查点：ch08 自测三题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='aii-x1' data-type='single'><p class='quiz-q'><b>Q10.<\/b> 微积分基本定理 ∫_α^β f = F(β) − F(α) 成立，需要的核心条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='aii-x1' value='0'> f 有界<\/label><label class='quiz-opt'><input type='radio' name='aii-x1' value='1'> f 连续（或可积）且 F′ = f<\/label><label class='quiz-opt'><input type='radio' name='aii-x1' value='2'> f 单调<\/label><label class='quiz-opt'><input type='radio' name='aii-x1' value='3'> F 有界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='aii-x2' data-type='single'><p class='quiz-q'><b>Q11.<\/b> 把「线积分只依赖端点」与「微分学」联系起来，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='aii-x2' value='0'> 任何 1-形式都路径无关<\/label><label class='quiz-opt'><input type='radio' name='aii-x2' value='1'> 恰当形式的线积分等于势函数在端点的差<\/label><label class='quiz-opt'><input type='radio' name='aii-x2' value='2'> 闭形式一定恰当<\/label><label class='quiz-opt'><input type='radio' name='aii-x2' value='3'> 路径无关只对直线成立<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch06__": "<h1>测验：第 6 章：一元函数的积分<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列关于跳跃连续函数的说法，正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 必须连续<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 每点左右极限存在，可以不等于函数值<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 只能有有限个间断点<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 必须有界变差<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ∫_1^∞ 1/x^p 收敛的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> p &gt; 0<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> p &gt; 1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> p &lt; 1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 对所有 p 都收敛<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Γ(5) 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 5!<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 4!<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 5<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 24/5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：多变量微分学<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 设 f(x, y) = xy/(x² + y²)（原点补 0），则 f 在原点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 可微<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 两个偏导存在但不连续<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 不可微且偏导不存在<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 连续但偏导不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 隐函数定理中，保证能解出 y = φ(x) 的关键条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> F(a,b) = 0<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> F 连续<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> ∂F/∂y(a,b) 可逆<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> ∂F/∂x(a,b) 可逆<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 约束极值中，若 ∇g(a) ≠ 0，极值点满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> ∇f(a) = 0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> ∇f(a) = λ∇g(a)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> ∇g(a) = λ∇f(a)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> f(a) = g(a)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：线积分<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 关于全变差，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 连续曲线的全变差总有限<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 全变差是折线长度的上确界<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 全变差等于端点距离<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 全变差只对直线有限<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ω = (x dy − y dx)/(x² + y²) 在 ℝ² 去掉原点后？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 恰当<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 闭但不恰当<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 既不闭也不恰当<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 恒为 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> ∮_{|z|=1} dz/z 的值是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 2πi<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> πi<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='阶梯函数'>阶梯函数 — 在分割的每个开区间上取常数值的函数。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='跳跃连续'>跳跃连续 — 每点处左右单侧极限都存在（可不等于函数值）。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='分段连续'>分段连续 — 只有有限个跳跃点的跳跃连续函数。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='柯西–黎曼积分'>柯西–黎曼积分 — 本书对一元函数积分的称呼，由阶梯函数积分延拓得到。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='微积分基本定理'>微积分基本定理 — 变上限积分求导得被积函数；反之积分等于原函数端点差。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='反常积分'>反常积分 — 区间无界或被积函数无界时，用极限定义的积分。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='绝对收敛'>绝对收敛 — 被积函数绝对值可积；绝对收敛必收敛。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='傅里叶系数'>傅里叶系数 — 用三角函数内积投影得到的系数 aₖ、bₖ。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='伽马函数'>伽马函数 — Γ(z)=∫t^(z−1)e^(−t)dt，满足 Γ(n+1)=n!。 <span class=glossary-ref>（第 6 章：一元函数的积分）<\/span><\/li><li data-term='算子范数'>算子范数 — 线性映射的最大放大倍数，‖A‖=sup‖Ax‖/‖x‖。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='弗雷歇导数'>弗雷歇导数 — 使 f(a+h)=f(a)+Ah+o(‖h‖) 的唯一线性映射 A。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 导数在标准基下的矩阵，元素为偏导数。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='链式法则'>链式法则 — 复合函数导数等于两个线性映射的复合（矩阵相乘）。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='黑塞矩阵'>黑塞矩阵 — 二阶偏导组成的对称矩阵，表示二阶导数。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='逆映射定理'>逆映射定理 — 导数可逆时函数局部可逆，逆映射 C¹ 且导数为原导数的逆。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='隐函数定理'>隐函数定理 — F(a,b)=0 且对 y 的偏导可逆时，可局部解出 y=φ(x)。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='拉格朗日乘子'>拉格朗日乘子 — 约束极值中使 ∇f=λ∇g 的比例因子。 <span class=glossary-ref>（第 7 章：多变量微分学）<\/span><\/li><li data-term='全变差'>全变差 — 所有分割折线长度的上确界。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='可求长'>可求长 — 全变差有限的曲线。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='普法夫形式'>普法夫形式 — 形如 Σaⱼdxⱼ 的 1-形式。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='恰当形式'>恰当形式 — 等于某个函数微分的 1-形式。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='势函数'>势函数 — 满足 df=ω 的函数 f。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='全纯函数'>全纯函数 — 复可微的函数，等价于满足柯西–黎曼方程。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='亚纯函数'>亚纯函数 — 除孤立极点外全纯的函数。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><li data-term='留数'>留数 — 洛朗展开中 (z−a)⁻¹ 的系数。 <span class=glossary-ref>（第 8 章：线积分）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库：《分析 II》<\/h1>\n<h2>框架：逼近 → 延拓 → 性质<\/h2>\n<p>积分、线积分、微分形式都走同一条路：先在简单对象（阶梯函数、折线、常系数形式）上定义量，证明它在 sup 范数或一致收敛下连续，再延拓到闭包，最后证明延拓后的对象保持线性与基本估计。遇到新定义，先问&quot;简单对象是什么、逼近用什么范数、延拓凭什么唯一&quot;。<\/p>\n<h2>框架：把非线性问题局部线性化<\/h2>\n<p>多变量的所有存在性定理都是这个套路：取 A = f′(a)，把方程改写成 x = x − A⁻¹(F(x))，验证压缩，得到不动点。逆映射、隐函数、流形、微分方程解的存在性都是同一模板的不同外衣。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n判断偏导能否替代导数：先看偏导是否连续（C¹）；连续则可用，不连续要找反例。\n<\/li><li>\n判断反常积分：先找比较对象 x^{-p}，再看区间方向决定 p 的不等式方向。\n<\/li><li>\n判断路径无关：先算 ∂aⱼ/∂xₖ 是否相等；相等再看区域是否有洞。\n<\/li><li>\n判断全纯：先写 u、v 验柯西–黎曼；满足再谈积分。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把雅可比矩阵当成&quot;导数本身&quot;<\/strong>。换基就换矩阵，导数是映射。\n<\/li><li>\n<strong>用偏导存在冒充可微<\/strong>。xy/(x²+y²) 是常备反例。\n<\/li><li>\n<strong>在临界点硬用隐函数定理<\/strong>。∂F/∂y = 0 时解可能分裂，必须换坐标或改用其他方法。\n<\/li><li>\n<strong>把条件收敛的积分随意重排<\/strong>。收敛不等于绝对收敛，重排会改变结果。\n<\/ul>", "__cheatsheet__": "<h1>速查表：《分析 II》<\/h1>\n<h2>定义与公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>阶梯函数积分<\/td><td>Σ cⱼ(αⱼ − αⱼ₋₁)<\/td><\/tr><tr><td>积分估计<\/td><td>｜∫f｜ ≤ ‖f‖∞(β − α)<\/td><\/tr><tr><td>基本定理<\/td><td>(∫_α^x f)′ = f；∫_α^β f = F(β) − F(α)<\/td><\/tr><tr><td>换元<\/td><td>∫f(φ(t))φ′(t)dt = ∫f(u)du<\/td><\/tr><tr><td>分部<\/td><td>∫u′v = uv − ∫uv′<\/td><\/tr><tr><td>p-积分<\/td><td>∫_1^∞ x^{−p} 收敛 ⇔ p&gt;1；∫_0^1 x^{−p} 收敛 ⇔ p&lt;1<\/td><\/tr><tr><td>算子范数<\/td><td>‖A‖ = sup_{‖x‖≤1}‖Ax‖<\/td><\/tr><tr><td>可微<\/td><td>f(a+h)=f(a)+Ah+r(h)，‖r(h)‖/‖h‖→0<\/td><\/tr><tr><td>雅可比<\/td><td>Jᵢⱼ = ∂fᵢ/∂xⱼ<\/td><\/tr><tr><td>链式<\/td><td>(f∘g)′ = f′(g(a))g′(a)<\/td><\/tr><tr><td>泰勒二阶<\/td><td>f(a+h)=f(a)+Df(a)h+½D²f(a)(h,h)+o(‖h‖²)<\/td><\/tr><tr><td>逆映射<\/td><td>(f⁻¹)′(f(a)) = f′(a)⁻¹<\/td><\/tr><tr><td>隐函数<\/td><td>φ′ = −(∂F/∂y)⁻¹∂F/∂x<\/td><\/tr><tr><td>乘子法<\/td><td>∇f = λ∇g，g=0<\/td><\/tr><tr><td>全变差<\/td><td>Var(γ) = sup_Z Σ‖γ(tⱼ)−γ(tⱼ₋₁)‖<\/td><\/tr><tr><td>弧长<\/td><td>C¹ 时 L(γ)=∫‖γ′(t)‖dt<\/td><\/tr><tr><td>线积分<\/td><td>∫_γ ω = ∫_a^b Σaⱼ(γ(t))γⱼ′(t)dt<\/td><\/tr><tr><td>恰当<\/td><td>ω=df ⇒ ∫_γ ω = f(终点)−f(起点)<\/td><\/tr><tr><td>柯西–黎曼<\/td><td>u_x=v_y，u_y=−v_x<\/td><\/tr><tr><td>留数<\/td><td>∮f dz = 2πiΣRes(f,aₖ)<\/td><\/tr><\/tbody><\/table>\n<h2>常用推理链<\/h2>\n<ol><li>\n阶梯函数 → 一致逼近 → 积分 → 基本定理 → 计算。\n<\/li><li>\n偏导连续 → 可微 → 雅可比 → 链式 → 逆映射/隐函数。\n<\/li><li>\n1-形式 → 闭性检验 → 单连通 → 势函数 → 路径无关。\n<\/li><li>\n复可微 → 柯西–黎曼 → 解析 → 柯西定理 → 留数。\n<\/ol>\n<h2>反例清单<\/h2>\n<table><thead><tr><th>命题<\/th><th>反例<\/th><\/tr><\/thead><tbody><tr><td>连续曲线可求长<\/td><td>t cos²(π/2t)<\/td><\/tr><tr><td>偏导存在则可微<\/td><td>xy/(x²+y²)<\/td><\/tr><tr><td>闭形式必恰当<\/td><td>(xdy−ydx)/(x²+y²)<\/td><\/tr><tr><td>条件收敛可重排<\/td><td>∫sin x/x<\/td><\/tr><tr><td>实可微即全纯<\/td><td>f(z)=zbar(z)<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
